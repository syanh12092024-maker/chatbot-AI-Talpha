#   · 19 ca `test/l0-m1-di-tru.test.js` — cả tệp là phép di trú, tự chứa sandbox riêng
#
# ⚠️ N5 · N11 (`l0-m2-noi-dung`) KHÔNG hoãn được, dù chúng cũng chỉ thiếu `ai-enabled.json`.
#   Thử rồi và PHẢI TRẢ LẠI: tệp đó là một CHUỖI CÓ TRẠNG THÁI — N5 là ca ÁP bản v2, còn
#   N7 («LÙI là cùng một hàm») cần có v2 mới lùi được. Cho N5 hoãn thì N7 đang xanh hoá đỏ.
#   Đo được: lượt 34796256969 · fail 23 → 3, nhưng một trong ba là N7 do chính phép hoãn đẻ ra.
#   📌 ÁN LỆ: hoãn một ca trong chuỗi có trạng thái là gãy mắt sau. Hoãn chỉ an toàn với tệp
#      tự chứa (dựng sandbox riêng, không ca nào ăn trạng thái của ca trước) — như di-tru.
#
# ✅ N1a/N4 — MỔ XONG 14/09/2026, là LỖI THƯỚC, không phải lỗi mã.
#   Câu hỏi của dân số a («do you deliver to Abu Dhabi and how long does shipping take»)
#   KHỚP `fast-lane.js:65 ASK_SHIP` ở cả hai vế «deliver» và «how long». Lượt bị làn 0đ
#   `tpl_ship` trả lời và handler THOÁT ở `handler-v3.js:474` — TRƯỚC lời gọi model đầu
#   tiên. Kịch bản model không ai đụng, tool `send_product_image` không chạy,
#   `state.pendingImages` rỗng ⇒ guiAnh=0 ⇒ so_ai thiếu loại `image` ⇒ N4 đỏ theo.
#   Tức sản phẩm chạy ĐÚNG (tiết kiệm được một lượt model), chỉ ca kiểm đo nhầm chỗ:
#   nó tưởng đang đo nhánh model trong khi nhánh đó CHƯA TỪNG CHẠY — đúng cảnh
#   «nhánh không chạy không tính là đạt» mà chính bộ ca này đi bịt.
#   ĐÃ SỬA: đổi câu hỏi sang «is the strap leather or silicone» (đo 14/09: sạch cả hai
#   lớp 0đ) + thêm ca N1a′ canh chính lựa chọn đó, cả hai chiều.
#   ⚠️ Ca đỏ này có từ 4261900 — từ lúc mới đẻ, KHÔNG phải hồi quy.
#
# ✅ N5/N11 — ĐÓNG 14/09/2026. Chúng đọc `ai-enabled.json` ở GỐC REPO, tức đo trạng thái
#   của MÁY chứ không đo mã (tệp gitignore ⇒ CI không có ⇒ `nguon` rơi về `cot_csdl`).
#   Nay bộ ca TỰ DỰNG nguồn của mình trong thư mục tạm, như N18/N19/N20 vẫn làm.
#   KHÔNG cấp tệp mẫu ở CI: làm thế là dựng lại đúng chỗ phụ thuộc vừa gỡ.
#
# ═══ SỐ ĐO 14/09/2026 (lượt 34800176998) ═════════════════════════════════════════
#   npm test    : 1665 ca · 1644 xanh · 0 ĐỎ · 21 hoãn minh bạch
#   cổng nghiệm thu: XANH=10 · ĐỎ=15 — lần ĐẦU TIÊN 25 cổng được đo trên CI.
#   CẢ 15 cổng đỏ đều đỏ vì MÔI TRƯỜNG, không cổng nào đỏ vì mã:
#     · 10 cổng (l1-m1·l1-m2·l1-m3·l2-m1·l2-m2·l2-m3·l3-m1..l3-m4) gõ cứng
#       `CONTAINER="talpha-pg"`. CI chạy Postgres bằng service container của GitHub,
#       không có tên ấy ⇒ rc=2 «KHÔNG ĐO ĐƯỢC» (khác hẳn rc=1 «trượt») — cổng từ chối
#       giả xanh, đúng luật. Phải dạy cổng nhận CSDL qua `DATABASE_URL_V3`.
#     · va-r1 · va-r2 gọi `node --env-file=.env` ⇒ `.env: not found` ⇒ LOI-NODE.
#     · b-y4 · g2-a4 · l0-m1 cần tệp dữ liệu THẬT (`pages.json` · `ai-enabled.json`
#       · `conv-state.json`) — cùng gốc với 21 ca hoãn minh bạch.
#
# ═══ CÁCH NHẬN NUÔI ══════════════════════════════════════════════════════════════
#   1. ✅ Chạy được trên Postgres: `npm run migrate && npm test`
#   2. ✅ Chạy tay workflow này một lượt, đọc số
#   3. ✅ `npm test` xanh trọn trên CI
#   4. ⬜ Gỡ ba nút môi trường của 15 cổng (xem bảng trên) → cổng xanh trọn →
#         đổi `on:` thành push/pull_request + ghi §10 sổ
#   ⛔ Tới khi xong bước 4, CẤM nói «CI xanh» trống không: phải nói RÕ là `npm test`
#      xanh, còn cổng nghiệm thu thì 10/25.
#
# `npm run di-tru` KHÔNG chạy được ở đây: nó cần dữ liệu thật vốn bị gitignore và chỉ có
# trên máy dev/VPS. Đó là giới hạn THẬT của cổng này, không phải lỗi.

name: bộ ca (chạy tay)

on:
  workflow_dispatch:

jobs:
  bo-ca:
    name: npm test trên Postgres 16
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aicloser
          POSTGRES_PASSWORD: aicloser_dev
          POSTGRES_DB: aicloser_v3
        ports: ['5433:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL_V3: postgres://aicloser:aicloser_dev@localhost:5433/aicloser_v3
      PANCAKE_READONLY: '1'          # luật 1 §0a — runner không bao giờ gửi tin cho khách

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lược đồ
        run: npm run migrate

      - name: Bộ ca
        run: npm test

      # ⚠️ `set +e` BẮT BUỘC: GitHub chạy bước bằng `bash -e`, nên `bash "$f"; rc=$?` làm
      # CẢ VÒNG LẶP chết ngay ở cổng đỏ ĐẦU TIÊN — không đếm được cổng nào, không in được
      # lý do nào, chỉ còn «exit code 1» trơ. Đo 14/09/2026: đúng cảnh đó đã xảy ra một lượt.
      # Và giữ lại ĐẦU RA của cổng đỏ: một con `rc` không nói được vì sao nó đỏ.
      - name: Cổng nghiệm thu (rc TÁCH DÒNG từng cổng)
        run: |
          set +e
          soDo=0; soXanh=0; dsDo=""
          for f in ops/bin/nghiem-thu/*.sh; do
            case "$f" in */_*.sh) continue;; esac   # `_*.sh` là tệp trợ giúp, không phải cổng
            ten=$(basename "$f")
            ra=$(bash "$f" 2>&1); rc=$?
            if [ $rc -eq 0 ]; then
              soXanh=$((soXanh+1)); echo "🟢 $ten"
            else
              soDo=$((soDo+1)); dsDo="$dsDo $ten"
              echo "🔴 $ten rc=$rc"
              printf '%s\n' "$ra" | tail -n 12 | sed 's/^/        /'
            fi
          done
          echo "═══ CỔNG NGHIỆM THU · XANH=$soXanh · ĐỎ=$soDo ═══"
          [ $soDo -eq 0 ] || echo "đỏ:$dsDo"
          [ $soDo -eq 0 ]
