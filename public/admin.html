<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Closer — Dashboard</title>
<style>
  :root{
    --bg:#f5f7f9; --panel:#fff; --ink:#101828; --muted:#667085; --line:#e4e9ee;
    --pri:#0e7c86; --priDark:#0b646d; --priSoft:#e6f4f5;
    --ok:#16a34a; --okSoft:#e8f7ee; --bad:#dc2626; --badSoft:#fdecec; --warn:#b45309; --warnSoft:#fdf3e3;
    --side:#0b2125; --sideMut:#7fa3a8; --sideAct:#12333a; --sideLine:#173840;
    --sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
    --shHov:0 6px 20px rgba(16,24,40,.09);
    --r:12px;
  }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font-family:-apple-system,"SF Pro Text",Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px;-webkit-font-smoothing:antialiased}
  .app{display:flex;height:100vh;overflow:hidden}

  /* ============ SIDEBAR ============ */
  .side{width:230px;background:var(--side);color:#fff;display:flex;flex-direction:column;flex-shrink:0}
  .brand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px;border-bottom:1px solid var(--sideLine)}
  .brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#12a0ac,var(--pri));display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 3px 12px rgba(14,124,134,.5)}
  .brandtxt{display:flex;flex-direction:column;line-height:1.15}
  .brandtxt .bname{font-weight:700;font-size:15.5px;letter-spacing:.2px}
  .brandtxt .bsub{font-size:11px;color:var(--sideMut);font-weight:500;margin-top:2px}
  .nav{display:flex;flex-direction:column;gap:2px;padding:8px 10px;overflow:auto}
  .navlabel{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#517a81;padding:14px 12px 5px}
  .nav a{position:relative;display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:var(--sideMut);cursor:pointer;font-weight:500;font-size:13.5px;transition:.12s}
  .nav a svg{width:17px;height:17px;flex-shrink:0}
  .nav a:hover{background:var(--sideAct);color:#e8f1f2}
  .nav a.active{background:var(--sideAct);color:#fff;font-weight:600}
  .nav a.active::before{content:'';position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:#14b3c0}
  .nav a.ext .extarrow{margin-left:auto;width:13px;height:13px;opacity:.45}
  .nav a.ext:hover .extarrow{opacity:1}
  .nsbadge{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
  .sidestat{margin-top:auto;display:flex;align-items:center;gap:8px;padding:13px 16px;font-size:12px;color:var(--sideMut);border-top:1px solid var(--sideLine)}
  .side .foot{padding:0 16px 14px;font-size:10.5px;color:#4a6d74}

  /* ============ TOPBAR + CONTENT ============ */
  .wrap{flex:1;display:flex;flex-direction:column;min-width:0}
  .top{height:58px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 22px;flex-shrink:0}
  .top h1{font-size:16px;margin:0;font-weight:650}
  .top .sp{flex:1}
  .stat{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);background:#f7f9fa;border:1px solid var(--line);padding:5px 11px;border-radius:20px;font-weight:500}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--okSoft)}
  .dot.bad{background:var(--bad);box-shadow:0 0 0 3px var(--badSoft)}
  .iconbtn{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);transition:.12s}
  .iconbtn:hover{background:#f5f6f7;color:var(--ink)}
  .content{flex:1;overflow:auto;padding:24px 26px}
  h2{font-size:17px;margin:0 0 4px;font-weight:650} .sub{color:var(--muted);font-size:12.5px;margin:0 0 18px}
  .vhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .vhead h2{margin:0}

  /* ============ CARDS / KPI ============ */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:14px;margin-bottom:22px}
  .mc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
  .mc .ic{width:34px;height:34px;border-radius:9px;background:var(--priSoft);color:var(--pri);display:flex;align-items:center;justify-content:center;margin-bottom:11px}
  .mc .ic svg{width:17px;height:17px}
  .mc .l{font-size:12px;color:var(--muted);font-weight:500} .mc .v{font-size:26px;font-weight:700;margin-top:3px;line-height:1.1;letter-spacing:-.3px}
  .mc .d{font-size:11.5px;color:var(--muted);margin-top:5px}

  /* ============ TABLE ============ */
  .tablecard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line)}
  th{background:#fafbfc;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  tbody tr:hover{background:#fafcfc} tr:last-child td{border-bottom:none}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 10px;border-radius:20px;font-weight:600;white-space:nowrap}
  .pill.ok{background:var(--okSoft);color:var(--ok)} .pill.bad{background:var(--badSoft);color:var(--bad)} .pill.warn{background:var(--warnSoft);color:var(--warn)} .pill.mut{background:#eef1f3;color:var(--muted)}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:6px;font-weight:500;transition:.12s}
  .btn:hover{background:#f5f6f7;border-color:#d5dce2} .btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)} .btn.pri:hover{background:var(--priDark)} .btn.sm{padding:5px 10px;font-size:12.5px} .btn svg{width:14px;height:14px}
  a.btn{text-decoration:none}
  .pill.info{background:#e7f0fd;color:#2b6cb0}
  /* hàng chờ sale: viền trái + nền theo mức ưu tiên (0 khẩn, 1 cần người, 2 đơn chốt) */
  tr.nsr td{padding:13px 14px}
  tr.nsr-0 td:first-child{box-shadow:inset 3px 0 0 var(--bad)}  tr.nsr-0{background:#fff6f6} tr.nsr-0:hover{background:#fdeeee}
  tr.nsr-1 td:first-child{box-shadow:inset 3px 0 0 var(--warn)} tr.nsr-1{background:#fffdf6} tr.nsr-1:hover{background:#fdf7e9}
  tr.nsr-2 td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
  .nsreason{color:var(--muted);font-size:12px;margin-top:3px;font-style:italic;max-width:430px;line-height:1.4}
  .newpill{display:inline-flex;align-items:center;background:var(--bad);color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.5px;padding:2px 7px;border-radius:9px;margin-bottom:4px}
  /* segmented control chọn khung giờ */
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
  .seg button{border:none;background:transparent;padding:7px 13px;font-size:12.5px;cursor:pointer;color:var(--muted);font-weight:500;border-right:1px solid var(--line)}
  .seg button:last-child{border-right:none}
  .seg button:hover{background:#f5f6f7} .seg button.act{background:var(--pri);color:#fff;font-weight:600}
  /* chip bộ lọc loại việc: icon + nhãn + số đếm */
  .kchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:12.5px;cursor:pointer;color:var(--ink);font-weight:500;transition:.12s}
  .kchip:hover{background:#f5f6f7}
  .kchip .n{background:#eef1f3;color:var(--muted);font-size:11px;font-weight:700;min-width:20px;height:18px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
  .kchip.act{background:var(--side);border-color:var(--side);color:#fff}
  .kchip.act .n{background:rgba(255,255,255,.22);color:#fff}
  input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:13.5px;font-family:inherit;outline:none;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--priSoft)}
  .row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .search{position:relative;max-width:280px} .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)} .search input{padding-left:33px;width:100%}
  /* thanh tìm kiếm to, rõ (bảng Tổng quan) */
  .search.big{max-width:440px;flex:1;min-width:240px}
  .search.big svg{width:17px;height:17px;left:13px}
  .search.big input{padding:11px 13px 11px 39px;font-size:14px;border-radius:10px;border-width:1.5px}
  /* công tắc bật/tắt AI */
  .toggle{width:40px;height:23px;border-radius:13px;background:#cbd5db;position:relative;transition:.15s;cursor:pointer;flex-shrink:0;display:inline-block;vertical-align:middle}
  .toggle.on{background:var(--ok)} .toggle::after{content:'';position:absolute;width:19px;height:19px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)} .toggle.on::after{left:18px}
  .muted{color:var(--muted)} .mono{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--muted)}
  .empty{padding:46px 20px;text-align:center;color:var(--muted)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;font-size:12.5px;cursor:pointer;color:var(--muted);font-weight:500;transition:.12s}
  .chip:hover{background:#f5f6f7} .chip.act{background:var(--pri);color:#fff;border-color:var(--pri)}
  .drange{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .drange-cx{display:inline-flex;align-items:center;gap:6px;padding-left:8px;margin-left:2px;border-left:1px solid var(--line)}
  .drange input[type=date]{padding:5px 8px;font-size:12.5px}

  .av{width:34px;height:34px;border-radius:50%;background:var(--priSoft);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}

  /* ============ CONVERSATIONS ============ */
  .convo{display:grid;grid-template-columns:300px 1fr 290px;gap:14px;height:calc(100vh - 210px)}
  @media(max-width:1200px){.convo{grid-template-columns:300px 1fr}.cinfo{display:none}}
  @media(max-width:880px){.convo{grid-template-columns:1fr;height:auto}}
  /* cột phải: thông tin khách + đơn hàng */
  .cinfo{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:auto;padding:14px}
  .cinfo h4{margin:0 0 8px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .cinfo .sec{padding:12px 0;border-top:1px solid var(--line)} .cinfo .sec:first-child{border-top:none;padding-top:0}
  .cirow{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;margin:5px 0}
  .cirow .k{color:var(--muted);flex-shrink:0} .cirow .v{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}
  .ocard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;background:#fafbfc}
  .ocard .oid{font-weight:700;font-size:13px}
  /* mốc ngày + giờ tin + bản dịch */
  .dsep{align-self:center;background:#eef1f4;color:var(--muted);font-size:11px;font-weight:600;padding:3px 12px;border-radius:12px;margin:6px 0}
  .btime{display:block;font-size:10px;opacity:.55;margin-top:3px;text-align:right}
  .vitrans{display:block;font-size:12px;color:#c2410c;margin-top:5px;border-top:1px dashed rgba(0,0,0,.15);padding-top:4px;font-style:italic}
  .bub.ai .vitrans,.bub.agent .vitrans{color:#ffe3c9;border-top-color:rgba(255,255,255,.35)}
  .list{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:auto}
  .ci{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
  .ci:hover{background:#fafcfc} .ci.sel{background:var(--priSoft)}
  .ci .t{font-weight:600;font-size:13px;display:flex;justify-content:space-between;gap:6px} .ci .s{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);display:flex;flex-direction:column;overflow:hidden}
  .phd{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .tr{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:16px}
  .bub{max-width:78%;padding:9px 13px;border-radius:15px;font-size:13.5px;white-space:pre-wrap;line-height:1.45}
  .bub.customer{align-self:flex-start;background:#eef1f4;border-bottom-left-radius:5px}
  .bub.ai{align-self:flex-end;background:var(--pri);color:#fff;border-bottom-right-radius:5px}
  .bub.agent{align-self:flex-end;background:#2563eb;color:#fff;border-bottom-right-radius:5px}
  .bub.system{align-self:center;background:var(--warnSoft);color:var(--warn);font-size:12px}
  .composer{padding:12px;border-top:1px solid var(--line);display:flex;gap:9px}

  /* ============ KB EDITOR ============ */
  .kbbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin:6px 0 16px;position:sticky;top:0;z-index:8;background:var(--bg);padding:6px 0}
  .kbeditor{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:2px 20px 16px}
  .cfgsec{padding:16px 0 4px;border-left:3px solid var(--pri);padding-left:14px;margin-top:8px}
  .kbsec{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:14px 0 2px;border-top:1px solid var(--line);margin-top:14px}
  .pcard{padding:16px 0;border-top:1px dashed var(--line)}
  .pcard:first-of-type{border-top:none;padding-top:8px}
  .pcard .fh{display:flex;gap:12px;align-items:flex-end;margin-bottom:14px}
  .fld{display:flex;flex-direction:column;gap:5px;min-width:0}
  .fld>label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
  .fld input,.fld textarea,.fld select{width:100%}
  .pcard textarea{resize:vertical;min-height:46px;line-height:1.45}
  .imgbox2{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
  .imglist{display:flex;flex-wrap:wrap;gap:10px}
  .imtile{width:92px;position:relative}
  .imtile .imthumb{width:92px;height:92px;border-radius:10px;border:1px solid var(--line);background:#f7f9fa center/cover no-repeat;cursor:pointer}
  .imtile .imlabel{width:92px;margin-top:5px;padding:4px 6px;font-size:11px;text-align:center}
  .imtile .imx{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:none;background:var(--bad);color:#fff;cursor:pointer;font-size:12px;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .imadd .imthumb{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:12px;gap:3px;border-style:dashed}
  .imadd .imthumb:hover{background:var(--priSoft);color:var(--pri);border-color:var(--pri)}
  .imtile select.imlabel{width:92px;font-size:11px;padding:4px 4px;border-radius:7px;cursor:pointer}
  .pricebox{margin:4px 0 14px;padding:14px 16px;background:#fafbfc;border:1px solid var(--line);border-radius:10px}
  .pricebox>.pblabel{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:11px}
  .tierrow{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:13.5px;flex-wrap:wrap}
  .tierrow input{padding:7px 9px}
  .tierrow .tl{flex:1;min-width:150px} .tierrow .tp{width:110px}
  .tierx{width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;color:var(--muted);flex-shrink:0}
  .tierx:hover{background:var(--badSoft);color:var(--bad);border-color:var(--badSoft)}
  .phead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;cursor:pointer}
  .ptitle{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pacts{display:flex;gap:6px;flex-shrink:0}
  .actbtn{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;color:var(--muted);font-size:14px;display:flex;align-items:center;justify-content:center}
  .actbtn:hover{background:#f5f6f7;color:var(--ink)} .actbtn.del:hover{background:var(--badSoft);color:var(--bad);border-color:var(--badSoft)}
  .pcard.collapsed .pbody{display:none}
  .caret{transition:.15s;display:inline-block;color:var(--muted)} .pcard.collapsed .caret{transform:rotate(-90deg)}
  .combo-drop{position:absolute;top:100%;left:0;right:0;z-index:30;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(16,24,40,.14);max-height:340px;overflow:auto;margin-top:5px;display:none}
  .ci2{padding:9px 13px;cursor:pointer;font-size:13.5px;border-bottom:1px solid #f1f4f6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ci2:hover{background:var(--priSoft)} .ci2:last-child{border-bottom:none}

  /* toast */
  #toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:50}
  .tt{background:#10262b;color:#fff;padding:11px 16px;border-radius:10px;font-size:13.5px;box-shadow:0 6px 24px rgba(0,0,0,.18);display:flex;align-items:center;gap:8px;animation:in .2s}
  .tt.ok{background:#0e7c86} .tt.bad{background:#dc2626}
  @keyframes in{from{opacity:0;transform:translateY(8px)}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <span class="logo">🤖</span>
      <div class="brandtxt"><span class="bname">AI Closer</span><span class="bsub">Sales AI · Messenger</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidestat"><span class="dot" id="sidedot"></span><span id="sidestattxt">đang kết nối…</span></div>
    <div class="foot">v0.3 · Pilot PH/ME</div>
  </aside>
  <div class="wrap">
    <header class="top">
      <h1 id="ttl">Bảng điều khiển</h1>
      <div class="sp"></div>
      <div class="stat" id="serr" style="display:none;background:var(--badSoft);border-color:#f2c4c4;color:var(--bad);font-weight:700" title="Page bị lỗi gửi tin — đang tạm ngừng để tránh Meta phạt nặng thêm"></div>
      <div class="stat"><span class="dot" id="sdot"></span><span id="sstat">server</span></div>
      <div class="stat" id="stok">— nguồn</div>
      <div class="stat" id="spage">— page</div>
      <div class="iconbtn" title="Làm mới" onclick="render()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg></div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>
<div id="toast"></div>
<script>
const API='/admin/api';
const j=(u,o)=>fetch(API+u,o).then(r=>r.json());
const post=(u,b)=>j(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});
const del=u=>j(u,{method:'DELETE'});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=t=>{if(!t)return'';const d=(Date.now()-t)/1000;if(d<60)return Math.round(d)+'s';if(d<3600)return Math.round(d/60)+'m';return Math.round(d/3600)+'h';};
const ini=s=>(String(s||'?').trim()[0]||'?').toUpperCase();
function toast(m,type='ok'){const e=document.createElement('div');e.className='tt '+type;e.textContent=m;document.getElementById('toast').appendChild(e);setTimeout(()=>e.remove(),2600);}
const IC={

function agoVi(ts){if(!ts)return 'chưa có';const s=Math.floor((Date.now()-ts)/1000);
  if(s<60)return s+' giây trước';if(s<3600)return Math.floor(s/60)+' phút trước';
  if(s<86400)return Math.floor(s/3600)+' giờ trước';return Math.floor(s/86400)+' ngày trước';}

/* ============ 1. CẦN SALE XỬ LÝ ============
   Nguồn: Sổ AI (ai-messages.jsonl) — sự kiện 'order' (AI chốt đơn) & 'handoff' (cần người).
   Ưu tiên hiển thị: CẦN NGƯỜI trước (khách đang đợi), rồi mới tới đơn đã chốt. */
let NS={hours:48,filter:'all',list:[]};
const NS_RANGES=[[24,'24 giờ'],[48,'48 giờ'],[168,'7 ngày']];
// 5 CỬA dẫn vào hàng chờ (nguyên tắc #13). prio: 0 khẩn (đỏ) · 1 cần người (vàng) · 2 đơn đã chốt (xanh).
// (Cửa "Ngôn ngữ lạ" đã bỏ — AI tự trả lời bằng đúng ngôn ngữ của khách, không chuyển người nữa.)
const NS_KINDS={
  complaint:{label:'Khiếu nại',      icon:'😡', pill:'bad',  prio:0},
  error:    {label:'Lỗi kỹ thuật',   icon:'⚙️', pill:'bad',  prio:0},
  ai:       {label:'AI chuyển người',icon:'🙋', pill:'warn', prio:1},
  max_turns:{label:'Hết lượt AI',    icon:'⏳', pill:'warn', prio:1},
  no_kb:    {label:'Thiếu kịch bản', icon:'📄', pill:'mut',  prio:1},
  order:    {label:'Đã chốt đơn',    icon:'🛒', pill:'ok',   prio:2},
};
// Nhận diện loại việc: ưu tiên kind server gắn; dữ liệu cũ chưa có kind → đoán theo lý do.
// Sự kiện "ngôn ngữ lạ" cũ (còn trong cửa sổ 48h) gộp về nhóm "AI chuyển người".
function nsKind(r){
  if(r.type==='order')return'order';
  if(r.kind&&NS_KINDS[r.kind])return r.kind;
  const s=r.reason||'';
  if(/khiếu nại/i.test(s))return'complaint';
  if(/trả lời đủ/i.test(s))return'max_turns';
  if(/kịch bản|KB/i.test(s))return'no_kb';
  return'ai';
}
function rNeedSale(){

     <div><h2>🔔 Hàng chờ cho sale</h2><p class="sub" style="margin:4px 0 0" id="nsMeta">Việc khẩn nổi lên đầu · tự làm mới 15 giây</p></div>

       <button class="iconbtn" onclick="fillNeedSale()" title="Làm mới ngay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg></button>

window.setNsHours=h=>{NS.hours=h;document.querySelectorAll('.seg [data-h]').forEach(b=>b.classList.toggle('act',+b.dataset.h===h));fillNeedSale();};

async function fillNeedSale(){
  if(!document.getElementById('nsbody'))return;
  // Badge trên menu luôn đếm theo 48h (pollBadge); bảng thì theo khoảng đang chọn.
  const d=NS.hours===48?await pollBadge():await j('/need-sale?hours='+NS.hours).catch(()=>({list:[]}));
  NS.list=(d.list||[]).map(r=>({...r,_k:nsKind(r)}));
  drawNeedSale();
}
function drawNeedSale(){
  const el=document.getElementById('nsbody'); if(!el)return;
  const list=NS.list;
  // Đếm theo từng cửa; chip chỉ hiện cửa CÓ việc (đỡ rối) + luôn có "Tất cả".
  const cnt={}; list.forEach(r=>cnt[r._k]=(cnt[r._k]||0)+1);
  if(NS.filter!=='all'&&!cnt[NS.filter])NS.filter='all'; // bộ lọc đang chọn hết việc → về Tất cả
  const chips=[`<button class="kchip ${NS.filter==='all'?'act':''}" onclick="setNsFilter('all')">Tất cả <span class="n">${list.length}</span></button>`]
    .concat(Object.entries(NS_KINDS).filter(([k])=>cnt[k]).map(([k,v])=>
      `<button class="kchip ${NS.filter===k?'act':''}" onclick="setNsFilter('${k}')">${v.icon} ${v.label} <span class="n">${cnt[k]}</span></button>`));
  const sum=document.getElementById('nsSum'); if(sum)sum.innerHTML=chips.join('');
  const meta=document.getElementById('nsMeta');
  if(meta){const kh=(cnt.complaint||0), cn=list.filter(r=>NS_KINDS[r._k].prio===1).length;
    meta.textContent=`${list.length} việc trong ${NS.hours<168?NS.hours+' giờ':'7 ngày'} qua`+(kh?` · ⚠ ${kh} khiếu nại`:'')+(cn?` · ${cn} cần người`:'')+' · tự làm mới 15s';}
  let rows=NS.filter==='all'?[...list]:list.filter(r=>r._k===NS.filter);
  if(!rows.length){ el.innerHTML=`<div class="tablecard"><div class="empty">Chưa có việc nào trong ${NS.hours<168?NS.hours+' giờ':'7 ngày'} qua. AI đang tự xử lý ✅</div></div>`; return; }
  rows.sort((a,b)=>NS_KINDS[a._k].prio-NS_KINDS[b._k].prio||b.t-a.t); // khẩn trước, trong nhóm thì mới nhất trước
  const NEW_MS=2*3600*1000;
  el.innerHTML=`<div class="tablecard"><table><thead><tr><th style="width:148px">Loại việc</th><th>Khách</th><th style="width:168px">SĐT</th><th style="width:150px">Page</th><th style="width:92px;text-align:right">Lúc</th><th style="width:104px"></th></tr></thead><tbody>${
    rows.map(r=>{const K=NS_KINDS[r._k];return `<tr class="nsr nsr-${K.prio}">
      <td><span class="pill ${K.pill}">${K.icon} ${K.label}</span></td>
      <td><div style="display:flex;gap:10px;align-items:flex-start"><div class="av" style="background:${K.prio===2?'var(--okSoft)':K.prio===0?'var(--badSoft)':'var(--warnSoft)'};color:${K.prio===2?'var(--ok)':K.prio===0?'var(--bad)':'var(--warn)'}">${ini(r.name)}</div>
        <div style="min-width:0"><b style="font-size:13.5px">${esc(r.name||'(chưa rõ tên)')}</b>${r.city||r.qty?`<span class="muted" style="font-size:12px"> · 📍 ${esc(r.city||'?')}${r.qty?' · SL '+r.qty:''}</span>`:''}
        ${r.reason?`<div class="nsreason">"${esc(r.reason)}"</div>`:''}</div></div></td>
      <td>${r.phone?`<span style="display:inline-flex;align-items:center;gap:6px"><b class="mono" style="font-size:13px;color:var(--ink)">${esc(r.phone)}</b><button class="btn sm" style="padding:3px 7px" title="Copy SĐT" onclick="copyPhone('${esc(r.phone)}')">⧉</button></span>`:'<span class="muted">—</span>'}</td>
      <td style="font-size:12.5px">${esc(r.pageName||'')}</td>
      <td style="text-align:right">${(Date.now()-r.t)<NEW_MS?'<span class="newpill">MỚI</span><br>':''}<span class="muted" style="font-size:12px">${agoVi(r.t)}</span></td>
      <td style="text-align:right"><a class="btn sm pri" href="${esc(r.link)}" target="_blank">Mở chat ↗</a></td>
    </tr>`;}).join('')}</tbody></table></div>`;
}

const RANGE_PRESETS=[['today','Hôm nay'],['7','7 ngày'],['30','30 ngày'],['all','Tất cả']];
function rangeQ(){return RANGE.from?`?from=${RANGE.from}&to=${RANGE.to}`:'';}

const _ymd=d=>d.toISOString().slice(0,10);
window.setRange=k=>{const t=new Date();
  if(k==='all')RANGE={key:'all',from:null,to:null};
  else if(k==='today')RANGE={key:'today',from:_ymd(t),to:_ymd(t)};
  else{const f=new Date();f.setDate(f.getDate()-(+k-1));RANGE={key:k,from:_ymd(f),to:_ymd(t)};}
  document.querySelectorAll('#drange .chip').forEach(b=>b.classList.toggle('act',b.dataset.r===k));
  const cst=document.getElementById('drangeCustom');if(cst)cst.style.display='none';
  fillStatsBody();};
window.applyCustomRange=()=>{const f=document.getElementById('rfrom').value,to=document.getElementById('rto').value;
  if(!f||!to){toast('Chọn cả 2 ngày','bad');return;}RANGE={key:'custom',from:f,to:to};
  document.querySelectorAll('#drange .chip').forEach(b=>b.classList.toggle('act',b.id==='rangeCustomBtn'));fillStatsBody();};

/* /orders (đơn thật Pancake POS) rất chậm (~30-40s trên VPS) → KHÔNG bắt cả trang đợi:
   hiện ngay số liệu nhanh (cột đơn tạm "…"), đơn về sau tự điền. Cache 60s + chặn gọi chồng. */
let _ordCache={key:null,data:null,at:0,inflight:false};
async function refreshOrders(){
  const key=rangeQ();
  if(_ordCache.inflight)return;
  if(_ordCache.key===key&&_ordCache.data&&Date.now()-_ordCache.at<60000)return; // còn tươi
  _ordCache.inflight=true;
  try{const d=await j('/orders'+key);_ordCache={key,data:d,at:Date.now(),inflight:false};
    if(document.getElementById('kpicards'))fillStatsBody(); // đơn đã về → vẽ lại
  }finally{_ordCache.inflight=false;}
}
async function fillStatsBody(){const el=document.getElementById('kpicards');if(!el)return;
  const [o,s,pages,tc]=await Promise.all([j('/overview').catch(()=>({pages:0,source:''})),j('/stats'+rangeQ()).catch(()=>({pages:[]})),j('/pages').catch(()=>[]),j('/token-cost'+rangeQ()).catch(()=>null)]);
  const ord=(_ordCache.key===rangeQ()&&_ordCache.data)?_ordCache.data:{enabled:false,pages:{}};
  refreshOrders(); // nạp đơn ở nền nếu cache cũ / đổi khoảng ngày
  SEND_ERRS=o.sendErrors||SEND_ERRS;
  const seb=document.getElementById('senderrbox');if(seb)seb.innerHTML=sendErrBanner();
  // Gộp: danh sách TẤT CẢ page (quản lý) + số liệu (stats) + ĐƠN THẬT (Pancake POS).
  const sm={};(s.pages||[]).forEach(p=>sm[p.id]=p);
  const tcm={};(tc&&tc.pages||[]).forEach(p=>tcm[String(p.id)]=p); // chi phí token đo được theo page
  const merged=pages.map(p=>{const st=sm[p.id]||{};const r=(ord.pages||{})[p.id];const c=tcm[String(p.id)];
    const leads=st.leads||0;
    return {...p,replies:st.replies||0,leads,orders:st.orders||0,
      aiOrders:r?r.aiOrders:(ord.enabled?0:null),
      cost:c?c.usd:null,costTok:c?(c.tin+c.cread):0,costMeasured:c?c.measured:0,
      costReplies:c?c.replies:0,costOrders:c?c.orders:0,vndPerReply:c?c.vndPerReply:null,vndPerOrder:c?c.vndPerOrder:null,
      closeRate:(r&&leads>0)?Math.round(r.aiOrders/leads*100):0};});
  // Page có số liệu nhưng không còn trong danh sách (đổi token...) vẫn hiện ra.
  (s.pages||[]).forEach(p=>{if(!merged.some(m=>String(m.id)===String(p.id))){const r=(ord.pages||{})[p.id];
    merged.push({...p,aiOrders:r?r.aiOrders:(ord.enabled?0:null),closeRate:(r&&p.leads>0)?Math.round(r.aiOrders/p.leads*100):0});}});
  merged.sort((a,b)=>(b.replies-a.replies)||(b.leads-a.leads)||String(a.name||'').localeCompare(String(b.name||'')));
  window._ov=merged;
  const aiOrdTot=ord.enabled?(ord.aiOrders||0):null;
  const totLeads=s.leads||0;
  const cards=[
    ['pages','Pages kết nối',o.pages,'nguồn '+(o.source==='pancake'?'Pancake':'FB')],
    ['msgs','Khách AI tư vấn',totLeads,rangeLabel()],
    ['stats','Tin AI trả lời',s.replies||0,rangeLabel()],
    ['kb','Đơn từ khách AI',aiOrdTot!=null?aiOrdTot:'…','khách AI có đặt đơn'],
    ['overview','Tỉ lệ chốt',(aiOrdTot!=null&&totLeads>0?Math.round(aiOrdTot/totLeads*100):0)+'%',(aiOrdTot!=null?aiOrdTot:'…')+' đơn / '+totLeads+' khách'],
    ['stats','Chi phí AI (đo)',tc?'$'+tc.usd.toFixed(2):'—',tc?('≈'+tc.vnd.toLocaleString('vi-VN')+'đ · đo trên '+tc.measured.toLocaleString('vi-VN')+' tin'):'ghi token từ 06/08'],
    ['stats','Chi phí / 1 tin AI',tc&&tc.vndPerReply!=null?tc.vndPerReply.toLocaleString('vi-VN')+'đ':'—',tc&&tc.usdPerReply!=null?('$'+tc.usdPerReply.toFixed(5)+' · '+tc.measured.toLocaleString('vi-VN')+' tin có số đo'):'chưa có tin nào đo được'],
    ['kb','Chi phí / 1 đơn AI chốt',tc&&tc.vndPerOrder!=null?tc.vndPerOrder.toLocaleString('vi-VN')+'đ':'—',tc&&tc.usdPerOrder!=null?('$'+tc.usdPerOrder.toFixed(2)+' · '+tc.repliesPerOrder+' tin/đơn · '+tc.orders+' đơn AI chốt'):'chưa có đơn nào trong khoảng'],
  ];
  el.innerHTML=cards.map(c=>`<div class="mc"><div class="ic">${svg(IC[c[0]])}</div><div class="l">${c[1]}</div><div class="v">${c[2]}</div><div class="d">${c[3]}</div></div>`).join('');
  const on=merged.filter(p=>p.aiEnabled).length,kbn=merged.filter(p=>p.hasKb).length;
  setEl('ovsub',`(${rangeLabel()}) · ${merged.length} page · ${on} bật AI · ${kbn} có kịch bản`);
  drawOvRows();
}
function ovFiltered(){

    if(q)return [p.name,p.id,p.market,p.category,p.marketer].some(x=>String(x||'').toLowerCase().includes(q));

  });

  let out='',lastDay='';
  trs.forEach((m,idx)=>{

    if(t){const d=new Date(t);const day=d.toLocaleDateString('vi-VN');
      if(day!==lastDay){lastDay=day;out+=`<div class="dsep">${day}</div>`;}
      out+=`<div class="bub ${m.who}">${esc(m.text)}${vi&&vi[idx]?`<span class="vitrans">🇻🇳 ${esc(vi[idx])}</span>`:''}<span class="btime">${d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})}</span></div>`;
    } else out+=`<div class="bub ${m.who}">${esc(m.text)}${vi&&vi[idx]?`<span class="vitrans">🇻🇳 ${esc(vi[idx])}</span>`:''}</div>`;
  });
  return out||'<div class="empty">Chưa có tin.</div>';
}

// Bảng gói giá: lấy từ r.tiers (mới) hoặc suy từ price1/combo2/combo3 (dữ liệu cũ).
// NHÃN PHẢI TIẾNG ANH — Fast Lane in thẳng nhãn này cho khách (sửa 11/08/2026).
function tiersOf(r){
  if(Array.isArray(r.tiers)&&r.tiers.length)return r.tiers.filter(t=>+t.price>0).map(t=>({label:t.label!=null?t.label:(t.qty?`Buy ${t.qty}`:''),price:+t.price}));
  const out=[];[['Buy 1',r.price1],['Combo 2',r.combo2],['Combo 3',r.combo3]].forEach(([l,v])=>{if(+v>0)out.push({label:l,price:+v});});
  return out.length?out:[{label:'',price:''}];
}
function tierRow(t){t=t||{};return `<div class="tierrow"><input class="tl" value="${esc(t.label||'')}" placeholder="Mô tả gói — TIẾNG ANH, khách đọc trực tiếp: Buy 1 Get 2 FREE (3 pcs)..."><span>—</span><input class="tp" type="number" min="0" value="${t.price??''}" placeholder="giá"><button class="tierx" title="Xoá gói" onclick="this.closest('.tierrow').remove()">✕</button></div>`;}

     <div class="pricebox">

function readCard(card){const o={};card.querySelectorAll('[data-k]').forEach(i=>o[i.dataset.k]=i.value);

window.importScript=()=>{const inp=document.createElement('input');inp.type='file';inp.accept='.xlsx,.xls';

    toast('Đang phân tích kịch bản Pancake...');

    if(document.getElementById('cfgGreeting')){document.getElementById('cfgGreeting').value=d.greeting||'';document.getElementById('cfgSales').value=d.salesPrompt||'';}

    list.insertAdjacentHTML('beforeend',kbCard(d.product));

  };
  inp.click();};
window.addKbImg=(btn)=>{const inp=document.createElement('input');inp.type='file';inp.accept='image/*';

    const card=btn.closest('.pcard');

window.saveKB=async()=>{const pid=document.getElementById('kbpage').value;

/* ============ 5. CÀI ĐẶT / TOKEN — token Pancake (đa tài khoản) + token Meta ============ */
function tokExpPill(t){
  if(!t.exp)return '<span class="pill mut">không rõ hạn</span>';
  if(t.expired)return '<span class="pill bad">ĐÃ HẾT HẠN</span>';
  const d=Math.ceil((t.exp-Date.now())/86400000);
  const cls=d>14?'ok':d>5?'warn':'bad';
  return `<span class="pill ${cls}">còn ${d} ngày · ${new Date(t.exp).toLocaleDateString('vi-VN')}</span>`;
}

window.addPkTok=async()=>{
  const inp=document.getElementById('pktok');const t=inp.value.trim();
  if(!t){toast('Dán token vào đã nhé','bad');return;}
  toast('Đang kiểm tra token với Pancake…');
  const r=await post('/pancake-tokens',{token:t});
  if(r.error){toast('❌ '+r.error,'bad');return;}
  toast(`✓ Đã thêm token "${r.name}" — thấy ${r.pages} page, hạn ${new Date(r.exp).toLocaleDateString('vi-VN')}`);
  inp.value='';rTokens();topStatus();
};
window.rmPkTok=async(i,name)=>{
  if(!confirm(`Xóa token Pancake của "${name}"?`))return;
  const r=await del('/pancake-tokens/'+i);
  if(r.error){toast('❌ '+r.error,'bad');return;}
  toast('Đã xóa token '+name);rTokens();
};
window.addTk=async()=>{const label=document.getElementById('tlabel').value.trim();const token=document.getElementById('ttoken').value.trim();if(!token){toast('Thiếu token','bad');return;}document.getElementById('tkmsg').textContent='đang nạp...';const r=await post('/tokens',{label,token});toast('✓ Nạp '+r.pages+' page');topStatus();rTokens();};
window.rmToken=async id=>{if(!confirm('Xóa token này?'))return;await del('/tokens/'+id);toast('Đã xóa token');topStatus();rTokens();};
window.reloadTk=async()=>{const m=document.getElementById('tkmsg');if(m)m.textContent='đang nạp...';toast('Đang nạp lại...');const r=await post('/tokens/reload');toast('✓ '+r.pages+' page');topStatus();rTokens();};

/* ============ BOOT ============ */
topStatus();setInterval(topStatus,12000);
pollBadge();setInterval(pollBadge,30000);
render();
</script>
</body>
