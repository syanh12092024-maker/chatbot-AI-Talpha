<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cẩm nang AI Closer</title>
  <script src="userguide/data.js"></script>
  <style>
    /* Bảng màu tài liệu: trắng–đen như docs/Word/Notion, xanh dương CHỈ để highlight (link + mục đang chọn).
       Một chế độ sáng duy nhất — không dark mode (tài liệu hướng dẫn cần rõ ràng, nhất quán). */
    :root {
      --ink: #1a1a1a; --ink-soft: #3d3d3d; --ink-faint: #8a8a8a;
      --paper: #ffffff; --panel: #fbfbfa; --line: #e5e5e3; --line-soft: #f0f0ee;
      --accent: #2563eb; --accent-soft: #eff4ff; --accent-ink: #1d4ed8;
      --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); line-height: 1.65; }
    .layout { display: grid; grid-template-columns: 17rem 1fr; min-height: 100vh; }
    /* sidebar */
    aside { background: var(--panel); border-right: 1px solid var(--line); padding: 1.5rem 1rem; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
    aside .brand { font-weight: 700; font-size: 1rem; margin: 0 0 .25rem; color: var(--ink); }
    aside .meta { font-size: .76rem; color: var(--ink-faint); margin: 0 0 1rem; }
    aside .search { width: 100%; padding: .5rem .7rem; border: 1px solid var(--line); border-radius: 7px; font-size: .85rem; margin-bottom: 1rem; }
    nav .grp { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); font-weight: 600; margin: 1.1rem 0 .35rem; }
    nav a { display: block; padding: .32rem .6rem; border-radius: 6px; color: var(--ink-soft); text-decoration: none; font-size: .88rem; }
    nav a:hover { background: var(--line-soft); color: var(--ink); }
    nav a.active { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; box-shadow: inset 2px 0 0 var(--accent); }
    nav a.hidden { display: none; }
    .roles { display: flex; flex-wrap: wrap; gap: .3rem; margin: 0 0 .6rem; }
    .roles button { font: inherit; font-size: .76rem; padding: .22rem .6rem; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); color: var(--ink-soft); cursor: pointer; }
    .roles button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
    nav .grp.hidden { display: none; }
    .who { display: inline-block; font-size: .74rem; color: var(--ink-faint); border: 1px solid var(--line); border-radius: 999px; padding: .08rem .55rem; margin: 0 0 .9rem; }
    .pager { display: flex; justify-content: space-between; gap: 1rem; margin: 3rem 0 0; padding-top: 1.2rem; border-top: 1px solid var(--line); font-size: .88rem; }
    .pager a { color: var(--accent); text-decoration: none; max-width: 48%; }
    .pager a:hover { text-decoration: underline; }
    /* content */
    main { padding: 3rem clamp(1.2rem, 5vw, 4rem); max-width: 56rem; }
    .doc { display: none; }
    .doc.active { display: block; }
    .doc h1 { font-size: clamp(1.6rem, 3.5vw, 2.2rem); line-height: 1.15; letter-spacing: -.02em; margin: 0 0 1rem; text-wrap: balance; }
    .doc h2 { font-size: 1.3rem; margin: 2rem 0 .6rem; letter-spacing: -.01em; }
    .doc h3 { font-size: 1.05rem; margin: 1.5rem 0 .5rem; }
    .doc blockquote { border-left: 3px solid var(--line); background: var(--panel); margin: 1rem 0; padding: .8rem 1.1rem; border-radius: 0 6px 6px 0; color: var(--ink-soft); }
    .doc p, .doc li { color: var(--ink-soft); }
    .doc strong { color: var(--ink); }
    .doc code { font-family: var(--mono); font-size: .86em; background: var(--line-soft); padding: .06em .3em; border-radius: 4px; color: var(--ink); }
    .doc pre { background: #f6f6f4; color: #1a1a1a; border: 1px solid var(--line); padding: 1.1rem 1.3rem; border-radius: 8px; overflow-x: auto; font-family: var(--mono); font-size: .82rem; line-height: 1.55; }
    .doc pre code { background: none; color: inherit; padding: 0; }
    .doc img { max-width: 100%; border: 1px solid var(--line); border-radius: 8px; margin: .8rem 0; }
    .doc img[src$=".png"]:not([src*="/"]), .doc img[alt^="{"] { /* placeholder hint */ }
    .doc .ph { display: block; border: 2px dashed var(--line); border-radius: 8px; padding: 1.6rem; text-align: center; color: var(--ink-faint); font-size: .85rem; margin: .8rem 0; background: var(--panel); }
    .doc ul.sub, .tablewrap.sub { margin-left: 1.6rem; }
    .tablewrap { overflow-x: auto; margin: 1rem 0; border: 1px solid var(--line); border-radius: 9px; }
    .doc table { border-collapse: collapse; width: 100%; font-size: .88rem; min-width: 30rem; }
    .doc th, .doc td { text-align: left; padding: .6rem .85rem; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
    .doc th { background: var(--panel); font-weight: 600; font-size: .76rem; letter-spacing: .03em; text-transform: uppercase; color: var(--ink); }
    .doc tr:last-child td { border-bottom: none; }
    .doc a { color: var(--accent); }
    .badge { display: inline-block; font-size: .68rem; letter-spacing: .05em; text-transform: uppercase; padding: .15rem .5rem; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; vertical-align: middle; }
    .empty { color: var(--ink-faint); font-style: italic; padding: 3rem 0; }
    @media (max-width: 48rem) {
      .layout { grid-template-columns: 1fr; }
      aside { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--line); }
      main { padding: 2rem 1.2rem; }
    }
    /* In / xuất PDF: ẩn nav, hiện MỌI trang (không chỉ trang active). */
    @media print {
      aside { display: none; }
      .layout { display: block; }
      main { max-width: none; padding: 0; }
      .doc { display: block !important; page-break-after: always; }
      .doc pre { white-space: pre-wrap; }
      :root { --paper: #fff; --panel: #fff; --ink: #000; --ink-soft: #222; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside>
      <p class="brand" id="brand">User Guide</p>
      <p class="meta" id="meta"></p>
      <div class="roles" id="roles" role="group" aria-label="Lọc theo vai"></div>
      <input type="search" class="search" id="search" placeholder="Tìm trang…" aria-label="Tìm trang">
      <nav id="nav"></nav>
    </aside>
    <main id="main"></main>
  </div>

  <script>
    // Data từ data.js: window.GUIDE = { product, updated, sections: [{slug, title, group, diataxis, md}] }
    const GUIDE = window.GUIDE;
    if (!GUIDE || !Array.isArray(GUIDE.sections)) {
      document.getElementById('main').innerHTML =
        '<div style="padding:40px;color:#b5751f"><h2>⚠️ Không load được file data</h2><p>Chạy lại <code>/userguide</code> để regen file <code>*-userguide-data.js</code> cạnh file HTML này (và kiểm tra <code>&lt;script src&gt;</code> trỏ đúng tên).</p></div>';
      throw new Error('GUIDE data missing');
    }

    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

    // ── Minimal markdown → HTML (đủ cho prose cẩm nang: heading, bold, code, list, table, quote, link, img, pre) ──
    function md2html(src) {
      const lines = src.replace(/\r\n/g, '\n').split('\n');
      let out = [], i = 0;
      const inline = t => esc(t)
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/__([^_]+)__/g, '<strong>$1</strong>')
        .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>')
        .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (m,a,u) =>
          // Placeholder CHỈ khi URL/alt còn token template chưa resolve ({slug}, {{feature}}) hoặc
          // ghi rõ "placeholder". Ảnh thật (đã chụp, tên file cụ thể) → render <img>.
          /[{}]/.test(u) || /placeholder/i.test(u) || a.startsWith('{')
            ? `<span class="ph">🖼 ${a || u} <em>(ảnh sẽ bổ sung)</em></span>`
            : `<img src="${u}" alt="${a}">`)
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
      while (i < lines.length) {
        const ln = lines[i];
        if (/^```/.test(ln)) { let buf=[]; i++; while(i<lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`); continue; }
        if (/^#{1,3}\s/.test(ln)) { const lv=ln.match(/^#+/)[0].length; out.push(`<h${lv}>${inline(ln.replace(/^#+\s/,''))}</h${lv}>`); i++; continue; }
        if (/^>\s?/.test(ln)) { let buf=[]; while(i<lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/,'')); out.push(`<blockquote>${inline(buf.join(' '))}</blockquote>`); continue; }
        if (/^\s*\|.*\|\s*$/.test(ln) && i+1<lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])) {
          const sub = /^\s{2,}/.test(ln) ? ' sub' : '';
          const head = ln.trim().split('|').slice(1,-1).map(c=>`<th>${inline(c.trim())}</th>`).join('');
          i += 2; let rows=[];
          while(i<lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push('<tr>'+lines[i].trim().split('|').slice(1,-1).map(c=>`<td>${inline(c.trim())}</td>`).join('')+'</tr>'); i++; }
          out.push(`<div class="tablewrap${sub}"><table><thead><tr>${head}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`); continue;
        }
        // List item + lazy continuation: sau mỗi item, nuốt dòng THỤT LỀ (≥2 space/tab) nối vào <li> qua <br>
        // để marker "→ Kết quả:" giữa các bước KHÔNG làm gãy list + reset số về 1.
        if (/^\s*[-*]\s/.test(ln)) {
          const subUl = /^\s{2,}/.test(ln) ? ' class="sub"' : '';
          let buf=[];
          while(i<lines.length && /^\s*[-*]\s/.test(lines[i])) {
            let item=inline(lines[i++].replace(/^\s*[-*]\s/,''));
            while(i<lines.length && /^(\s{2,}|\t)\S/.test(lines[i]) && !/^\s*([-*]|\d+\.)\s/.test(lines[i])) item+=`<br>${inline(lines[i++].trim())}`;
            buf.push(`<li>${item}</li>`);
          }
          out.push(`<ul${subUl}>${buf.join('')}</ul>`); continue;
        }
        if (/^\s*\d+\.\s/.test(ln)) {
          const batDau = parseInt(ln.trim(), 10) || 1;
          let buf=[];
          while(i<lines.length && /^\s*\d+\.\s/.test(lines[i])) {
            let item=inline(lines[i++].replace(/^\s*\d+\.\s/,''));
            while(i<lines.length && /^(\s{2,}|\t)\S/.test(lines[i]) && !/^\s*([-*]|\d+\.)\s/.test(lines[i])) item+=`<br>${inline(lines[i++].trim())}`;
            buf.push(`<li>${item}</li>`);
          }
          out.push(`<ol${batDau>1?` start="${batDau}"`:''}>${buf.join('')}</ol>`); continue;
        }
        if (ln.trim()==='') { i++; continue; }
        let buf=[]; while(i<lines.length && lines[i].trim()!=='' && !/^(#{1,3}\s|>|\s*\||\s*[-*]\s|\s*\d+\.\s|```)/.test(lines[i])) buf.push(lines[i++]);
        out.push(`<p>${inline(buf.join(' '))}</p>`);
      }
      return out.join('\n');
    }

    document.getElementById('brand').textContent = GUIDE.product || 'User Guide';
    document.getElementById('meta').textContent = `Cập nhật: ${GUIDE.updated || '—'} • ${GUIDE.sections.length} trang`;

    // Build nav grouped
    const nav = document.getElementById('nav'), mainEl = document.getElementById('main');
    const groups = {};
    GUIDE.sections.forEach(s => { (groups[s.group||'Nội dung'] = groups[s.group||'Nội dung']||[]).push(s); });
    Object.entries(groups).forEach(([g, secs]) => {
      const gd = document.createElement('div'); gd.className='grp'; gd.textContent=g; gd.dataset.grp=g; nav.appendChild(gd);
      secs.forEach(s => {
        const a = document.createElement('a'); a.href='#'+s.slug; a.dataset.slug=s.slug;
        a.textContent = s.title; a.dataset.vai = s.vai || '';
        a.onclick = e => { e.preventDefault(); show(s.slug); };
        nav.appendChild(a);
      });
    });

    // Render docs
    GUIDE.sections.forEach((s, k) => {
      const d = document.createElement('article'); d.className='doc'; d.id='doc-'+s.slug;
      const prev = GUIDE.sections[k-1], next = GUIDE.sections[k+1];
      d.innerHTML = (s.vai ? `<span class="who">Dành cho: ${esc(s.vai)}</span>` : '')
        + md2html(s.md || '*(trang trống)*')
        + `<div class="pager">${prev ? `<a href="#${prev.slug}" data-go="${prev.slug}">← ${esc(prev.title)}</a>` : '<span></span>'}`
        + `${next ? `<a href="#${next.slug}" data-go="${next.slug}">${esc(next.title)} →</a>` : ''}</div>`;
      mainEl.appendChild(d);
    });
    mainEl.addEventListener('click', e => { const a = e.target.closest('a[data-go]'); if (a) { e.preventDefault(); show(a.dataset.go); } });

    function show(slug) {
      document.querySelectorAll('.doc').forEach(d => d.classList.toggle('active', d.id==='doc-'+slug));
      document.querySelectorAll('nav a').forEach(a => a.classList.toggle('active', a.dataset.slug===slug));
      if (history.replaceState) history.replaceState(null,'','#'+slug);
      window.scrollTo(0,0);
    }

    // Cross-link giữa các trang là link .md (vd ./huong-dan/x.md). Các trang KHÔNG phải file riêng —
    // chúng là section trong SPA này. Map basename(.md) → slug, rồi chặn click để chuyển section nội bộ
    // thay vì mở file (file .md nằm trong bundle, không render được khi click). Fallback: khớp theo title.
    const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '');
    const fileToSlug = {};
    GUIDE.sections.forEach(s => {
      if (s.file) fileToSlug[norm(s.file.replace(/\.md$/,'').split('/').pop())] = s.slug;
      fileToSlug[norm(s.title)] = s.slug;   // fallback khớp theo tiêu đề
    });
    function slugForHref(href) {
      const base = href.split('#')[0].split('/').pop().replace(/\.md$/, '');
      return fileToSlug[norm(base)] || null;
    }
    document.addEventListener('click', e => {
      const a = e.target.closest('a');
      if (!a) return;
      const href = a.getAttribute('href') || '';
      if (!/\.md(\#|$)/.test(href)) return;   // chỉ chặn link .md nội bộ
      e.preventDefault();
      // Ưu tiên khớp theo tên file; fallback theo chữ hiển thị (title).
      const slug = slugForHref(href) || fileToSlug[norm(a.textContent)] || null;
      if (slug) show(slug);
      else console.warn('userguide: không map được cross-link ->', href, '|', a.textContent);
    });

    const VAI = ['Tất cả', 'Sale', 'Marketer', 'Quản trị'];
    let vaiChon = 'Tất cả';
    try { const v = localStorage.getItem('ug-vai'); if (VAI.includes(v)) vaiChon = v; } catch (_) {}
    const rolesEl = document.getElementById('roles');
    VAI.forEach(v => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = v;
      b.onclick = () => { vaiChon = v; try { localStorage.setItem('ug-vai', v); } catch (_) {} loc(); };
      rolesEl.appendChild(b);
    });
    function hopVai(s) {
      if (vaiChon === 'Tất cả') return true;
      const v = (s.vai || '').toLowerCase();
      return v.includes('mọi vai') || v.includes(vaiChon.toLowerCase());
    }
    function loc() {
      const q = document.getElementById('search').value.toLowerCase().trim();
      rolesEl.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.textContent === vaiChon)));
      const conGrp = {};
      GUIDE.sections.forEach(s => {
        const hay = `${s.title} ${s.group} ${s.md}`.toLowerCase();
        const hit = (!q || hay.includes(q)) && hopVai(s);
        const a = nav.querySelector(`a[data-slug="${s.slug}"]`);
        if (a) a.classList.toggle('hidden', !hit);
        if (hit) conGrp[s.group || 'Nội dung'] = true;
      });
      nav.querySelectorAll('.grp').forEach(g => g.classList.toggle('hidden', !conGrp[g.dataset.grp]));
    }
    document.getElementById('search').addEventListener('input', loc);
    loc();

    const initial = (location.hash||'').replace('#','');
    show(GUIDE.sections.some(s=>s.slug===initial) ? initial : GUIDE.sections[0].slug);
  </script>
</body>
</html>
