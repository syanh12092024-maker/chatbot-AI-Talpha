# PANCAKE_READONLY="1" sạch (không space/CR), V3_PANCAKE_GUI/V3_WA_GUI/V3_NAP_DEV đều undefined.
# Đã KIỂM và KÍN:
#  · Cửa Messenger/WhatsApp: guard fail-closed đúng chiều (=== '1' VÀ !== '1'), đọc env TƯƠI mỗi
#    lượt, đặt TRƯỚC lệnh gửi; giá trị lạ ('true'/' 1'/số) → ĐÓNG (không mở nhầm). guiTinMau: guard
#    ④ vẫn đứng trước adapter; adapter thật ném LoiChuaCoEndpoint; BANG_MAU_TIN rỗng (deny-by-default).
#  · nap.js nguonDangMo() = false ở dev (đo chạy) ⇒ hàng đợi v3 đóng; xepTin là đường ghi bảng DUY
#    NHẤT; KHÔNG ai import queue/worker/handler-v3 ngoài chúng ⇒ đường v3 không tự khởi động ở dev.
#  · Bộ test cửa tiêm spy qua deps (kể cả ca đối chứng dương); bộ nhạc trưởng mock 5 đường + bẫy
#    globalThis.fetch; cổng l2-m1.sh TỰ thêm --experimental-test-module-mocks (báo trượt nếu thiếu).
