  - "BOM ⇒ cả JS và Python đều hỏng parse (v3 loi_tep, ai_sale trả lời mọi page ⇒ không đúp). Khoá trùng ⇒ JS/Python cùng giữ bản cuối, cùng vị trí."
  - "Bật/tắt nhanh + song song cùng page (80 lượt) khi không có người ghi lạ ⇒ 0 vi phạm bất biến, 0 lỗi 409 (batLai + khoá dòng→tệp đúng)."
  - "Log trên prod: khối «BỎ QUA … KHÔNG thuộc shop» in 1 dòng tên + 1 dòng chú (mã :13875-13878), bộ quét bỏ đúng 2 dòng; dòng 🏷 nằm trong đường trả lời (:579-604). Mô phỏng bộ quét trên 20 MB cuối của 9 log: dương tính giả chỉ thuộc log cũ (22–23/09)."
  - "Lỗ «BỎ QUA bước lọc» (_pages_cua_shop None): lần cuối xảy ra 18/09 (trước khi có bản lưu ≤24 giờ ngày 19/09)."
