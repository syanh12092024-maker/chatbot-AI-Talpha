vong_2:
  head: "12da650 (thước fd97c66 · vá 0f18207)"
  ket_luan: DAT
  cach_chay: >
    Chạy lại NGUYÊN các ca phá vòng 1 (refute-gl10.test.mjs) trên HEAD mới: F1 F3 F5 F6 giờ đỏ đúng chỗ khẳng định lỗi, tức đã vá.
    F1 và F2 chạy lại đúng kịch bản cũ ở chế độ QUAN SÁT (refute-gl10-v2.test.mjs), không thêm kịch bản mới.
  F1:
    ket_qua: DONG
    bang_chung: >
      Cùng kịch bản (setPage, V3_DIEN_TAP=1, V3_PANCAKE_GUI=0): 200, aiSale={trangThai:'dien_tap', choDen:null}. Tệp KHÔNG có _v3[D].
      Bản chép 3 hàm ai_sale: ai_sale VẪN trông D. Dòng page: bot_ai_bat=true, trạng thái dien_tap, ly_do «Diễn tập — KHÔNG ghi khoá
      ai_sale: ai_sale vẫn trả lời khách như trước…». Nhãn màn nói đúng điều đó. Worker có V3_DIEN_TAP=1 ⇒ nạp D (chạy thử được, không
      gửi). Worker không diễn tập ⇒ 0 lần nạp D, nên bỏ diễn tập mà quên gạt lại thì không thành hai bot. Bậc ② mo-van chạy lại được.
  F2: { ket_qua: da_va, bang_chung: "Cùng ca SIGKILL: sau một vòng nạp, trạng thái chuyển xoa_hong (moCoi=1), nhãn đỏ «Khoá ai_sale CHƯA xoá…» + nút Thử xoá lại. Worker không tự xoá tệp." }
  F3: { ket_qua: da_va, bang_chung: "Cùng ca _ghi_gan stale: sau motLuot, trạng thái = 'xoa_hong' (ca cũ đỏ ở khẳng định '' — đúng ý vá)." }
  F4: { ket_qua: da_va, bang_chung: "Nhãn da_nhuong không còn xanh khi chưa đo được máy chạy bot. Khi vượt trần, diễn tập, van đóng, thiếu biến hoặc worker không chạy ⇒ nhãn đỏ nêu lý do + lối ra «tắt page để ai_sale trả lời lại» (kho-page.js viSaoV3Im). Khoá vẫn ở lại theo thiết kế; câu đường lùi trong mo-van là việc của tổng." }
  F5: { ket_qua: da_va, bang_chung: "dsPageDeNap đã bỏ LIMIT 500: page xếp sau hạng 500 được nạp 2 lần trong cùng ca (ca cũ đỏ ở khẳng định 0)." }
  F6: { ket_qua: da_va, bang_chung: "Lý do chờ = «KHÔNG canh được log — V3_AI_SALE_LOG có nhưng 0 tệp log khớp; chỉ chờ theo giờ», worker cảnh báo MỘT lần (logMu)." }
