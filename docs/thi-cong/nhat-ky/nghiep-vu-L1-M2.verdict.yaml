cau:
  - so: 1
    dap: KHONG
    bang_chung: >-
      Không có màn, không có nút. Đầu ra là một thư viện (`src/channels/messenger/`) + một file
      bàn giao cho L2 trỏ vào. Người tiêu thụ là phiếu L2-M1, không phải mkter/sale/chủ dự án.
      Giống L0-M1 và L1-M1: KHÔNG ở đây đúng bản chất phiếu cửa, không tự nó thành TRẢ-VỀ —
      câu 8 gánh phần biện minh. Cái khiến phiếu bị trả về nằm ở câu 3 và 7.
  - so: 3
    dap: CO
    bang_chung: >-
      CÓ mâu thuẫn, 2 chỗ. (a) Sổ §0a luật 1 dựng ra để chặn đúng một tai nạn: «thiếu là máy dev
      gửi tin cho khách thật, trùng với VPS đang chạy». Guard của phiếu viết là
      `PANCAKE_READONLY === '1'` → ném lỗi ⇒ **biến VẮNG thì không ném, tin đi ra** — nó chặn ca
      «có biến và =1» chứ không chặn ca «thiếu», tức đúng ca luật 1 nói tới. Và phiếu L1-M1 vừa
      được duyệt ở ngay bên cạnh viết ngược lại cho cùng lớp rủi ro: «`V3_POS_GHI` mặc định
      VẮNG/`0` = fail-CLOSED». Cùng một dây chuyền, hai cửa ghi-ra-ngoài, hai chiều hỏng khác nhau.
      (b) 01 §8 luật cứng «điều kiện team… tự chèn theo người đang đăng nhập. Quên một chỗ là team
      này nhìn thấy khách của team kia» — đường `ctxHeThong` của phiếu không bị buộc phải mang
      team nào, mà đó lại là đường DUY NHẤT có lưu lượng thật. Xem N1 · N3.
  - so: 7
    dap: CO
    bang_chung: >-
      CÓ làm hẹp, nạn nhân là L2 và L4. ②#1 chốt «Bọc tối thiểu… đọc hội thoại · đọc tin · gửi
