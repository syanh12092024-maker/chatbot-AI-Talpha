findings:
  - ma: N1
    muc: CHAN
    mo_ta: >-
      Cửa an toàn (b) khoá vào BẢNG MÃ TRẠNG THÁI POS, mà bảng đó chưa tồn tại và ④ không có phép
      đo nào cho nó — cửa chỉ bảo đảm «cặp nằm trong danh sách của tôi», không bảo đảm danh sách đúng.
    bang_chung: >-
      ②#2b khai cửa bằng TÊN («vd Chờ xác nhận→Chờ in»); ②#3 thừa nhận mã phải đi tìm («KHÔNG bịa —
      đọc từ response API thật… ghi bảng mã→nhãn vào nhật ký + luoc-do-v1.md») và tự nêu neo «Số
      4,5,6,7,8 = hủy/hoàn (TONG-QUAN §7.5) là neo đối chiếu». Nhưng ④ có 7 phép, KHÔNG phép nào
      chạm bảng mã — ④#5 chỉ đo ba cửa, ④#3 có «đối chiếu MẮT với dashboard POS» nhưng là cho danh
      mục sản phẩm, không cho mã trạng thái. Đo trên cây: chuỗi «Chờ in» xuất hiện 8 lần trong
      `docs/` nhưng **mã số của nó không có ở bất kỳ đâu**; mã duy nhất biết chắc là `0` = Mới/Chờ
      xác nhận (`src/pancake-orders.js:173`) và `4,5,6,7,8` = hoàn/hủy (:13).
    kich_ban_hong: >-
      Thợ đọc một response, thấy `status_name` của vài đơn, suy «Chờ in» = 3, khai whitelist {0→3}.
      Nếu 3 thật ra là «Đang chuyển» hay «Đã giao», thì mọi đơn khách xác nhận qua WhatsApp bị đánh
      dấu đã giao trong khi hàng còn trong kho: không ai đóng gói, và báo cáo đọc ra đã giao. Cửa (a)
      cho qua (V3_POS_GHI=1 là chủ ý), cửa (b) cho qua (cặp có trong danh sách), cửa (c) ghi sổ
      đúng một dòng «thành công». Ba cửa xanh, đơn thật hỏng. ④#5c — phép duy nhất có thể bắt — đã
      tự khai «CHƯA CHẠY, chờ diễn tập VPS».
    sua_the_nao: >-
      Thêm một phép vào ④ trước mọi phép ghi: IN bảng mã→nhãn đọc từ API thật (mã · `status_name` ·
      số đơn đang ở mã đó) và chấm bằng KNOWN-ANSWER có sẵn — tập mã hoàn/hủy đọc ra phải trùng
      đúng `{4,5,6,7,8}` của §7.5 và mã «Mới/Chờ xác nhận» phải là `0` như `pancake-orders.js:173`;
      lệch một phần tử ⇒ DỪNG, cách đọc sai. Whitelist cửa (b) khai bằng MÃ + nhãn kèm nhau, và
      phải nằm trong `luoc-do-v1.md` trước khi `V3_POS_GHI` được bật lần đầu.

  - ma: N2
    muc: CHAN
    mo_ta: >-
      Cửa (b) là whitelist CẶP TĨNH, không có vế đọc lại trạng thái LIVE ngay trước khi ghi — vế
      «từ» lấy trên ảnh chụp cũ, nên ghi đè được thao tác tay của sale.
    bang_chung: >-
      Chữ ký `ghiNguocTrangThai(ctx, {donId, sang})` chỉ nhận đích, không nhận «từ» và không có
      bước đọc lại. Nguồn duy nhất của «từ» là `don_hang.trang_thai_pos` — một bản chụp do `docDon`
      ghi lúc quét (②#2). Mà §7.4 nói rõ người vẫn đang đụng chính những đơn đó song song: «⚠️ Sale
      vẫn phải gọi xác nhận **trước khi chuyển trạng thái đơn**». Bảy shop thật trong
      `pancake-shops.json` đều là shop đang chạy (Saudi·UAE·Kuwait·Bahrain·Oman·Qatar·Taiwan).
    kich_ban_hong: >-
      08:00 `docDon` quét, đơn X = «Chờ xác nhận». 08:20 sale gọi khách, khách đòi đổi size, sale
      chuyển tay sang «Chờ xử lý»/hủy trên POS. 08:25 khách nhắn «ok» vào luồng WhatsApp, hệ gọi
      `ghiNguocTrangThai(X, 'Chờ in')`. Cửa (b) tra cặp (Chờ xác nhận→Chờ in) — có trong bảng, cho
      qua, vì nó tra trên trạng thái CŨ. Đơn đã hủy/đang sửa bị đẩy sang Chờ in và đi đóng gói.
      Không cửa nào kêu, cửa (c) ghi một dòng «thành công».
    sua_the_nao: >-
      Đổi thành compare-and-set: hàm nhận `tu` bắt buộc; ngay trước khi ghi phải ĐỌC LẠI trạng thái
      live của đơn từ POS; `live !== tu` ⇒ ném lỗi và ghi `nhat_ky` lý do «trạng thái đã đổi bên
      ngoài», KHÔNG ghi đè. Thêm phép ④5d đo đúng ca này (dựng lệch rồi gọi, khẳng định api 0 lượt).
      Ghi thêm vế shop: `donId` phải giải ra shop bằng chính dòng `don_hang`/`ket_noi_pos` của ctx,
      cấm nhận shop từ tham số ngoài — 7 shop dùng chung không gian mã đơn.

  - ma: N3
    muc: CHAN
    mo_ta: >-
      Phiếu đứng ngay ở phép ④#2 vì `V3_KHOA_MA_HOA` chưa có trong `.env`, mà ① lại trích hai dòng
      nợ §9 KHÁC — hai dòng không chặn gì — và bỏ đúng dòng nợ đang chặn.
    bang_chung: >-
      ②#1 bắt `ket_noi_pos.api_key` «lưu MÃ HOÁ cùng cơ chế `db/khoa.js` của L0-M1». Đo trên cây:
      `db/khoa.js:17-20` đọc `env.V3_KHOA_MA_HOA` và **ném lỗi** khi thiếu; `grep -c V3_KHOA_MA_HOA
      .env` = **0**. luoc-do-v1 §4.5 đã cảnh báo nguyên văn «⚠️ Biến này **chưa có trong `.env`** —
      việc NGƯỜI, đã ghi §9 sổ», và §9 sổ có đúng dòng đó. ① của phiếu chỉ trích «Sổ §9 hai dòng nợ
      liên quan: `posApiKey` bị che · `kb-overrides.products` chưa nạp» — cả hai đều KHÔNG chặn
      (dòng đầu là lời dặn đọc đúng tệp, dòng sau ⑦ đã tự loại khỏi phạm vi). Sổ §3 ghi Phụ thuộc
      của L1-M1 = «R0», không có mã H nào.
    kich_ban_hong: >-
      Thợ chạy `npm run di-tru` cho `ket-noi-pos.js` → `db/khoa.js` ném «Thiếu V3_KHOA_MA_HOA» →
      `ket_noi_pos` 0 dòng → ④#2 («count = số market trong pancake-shops.json», thật là **7**)
      không thể xanh → không có shop → ④#3 `docDanhMuc` và ④#4 `docDon` cũng không có đầu vào.
      Toàn phiếu treo ở phép thứ hai vì một biến môi trường mà tổng đã biết là thiếu từ L0-M1.
    sua_the_nao: >-
      Mở **H9** ở §8 sổ («đặt `V3_KHOA_MA_HOA` 32 byte vào `.env` máy dev + VPS») và ghi nó vào cột
      Phụ thuộc của L1-M1 ở §3 (đúng khuôn «H9 + R0» như L1-M3 đang làm với H1); sửa ① của phiếu
      trích đúng dòng nợ này thay vì hai dòng không chặn. Nếu người quyết muốn chạy trước khi có
      khoá thì phải khai rõ nhánh tạm và ④#2 ghi «CHƯA CHẠY» thật thà, không được để phép xanh giả.

  - ma: N4
    muc: NEN
    mo_ta: >-
      Cửa (c) ghi nhật ký MỘT dòng SAU khi có kết quả ⇒ ca nguy hiểm nhất (lệnh đã ra tới POS,
      phản hồi mất) là ca duy nhất không để lại dòng nào.
    bang_chung: >-
      ②#2c: «Mọi lượt gọi (kể cả bị chặn) ghi 1 dòng `nhat_ky` (tác nhân + đơn + từ→sang + **kết
      quả**)». `nhat_ky` CHỈ-INSERT (luoc-do-v1 §2) nên không có đường bổ sung sau. Client cũ đặt
      timeout 20 s (`src/pancake-orders.js:22,30`). Dự án đã có sẵn án lệ đúng cho ca này ở §7.3:
      «⚠️ Lỗi mạng ở nguồn ② KHÔNG được coi là "sạch" → trả `unknown`, cửa vẫn đóng».
    kich_ban_hong: >-
      PUT đi, POS áp trạng thái, mạng rớt trước khi phản hồi về. Hàm ném lỗi, dòng nhật ký không
      bao giờ được ghi. Đơn thật đã sang «Chờ in» mà hệ tin là chưa — lượt sau retry lần nữa, hoặc
      người mở sổ ra không thấy gì và kết luận cửa POS chưa từng chạy.
    sua_the_nao: >-
      Hai dòng, không phải một: dòng ĐỊNH LÀM ghi TRƯỚC khi gọi (tác nhân · đơn · từ→sang ·
      `dinh_lam`), dòng KẾT QUẢ ghi sau (`thanh_cong` | `bi_chan` | `khong_ro`). Timeout/đứt mạng
      ⇒ bắt buộc là `khong_ro`, cấm nuốt thành lỗi thường. Thêm phép ④5e: giả lập timeout, khẳng
      định `nhat_ky` có ĐỦ hai dòng và dòng sau mang `khong_ro`.

  - ma: N5
    muc: NEN
    mo_ta: >-
      `db/schema.sql` không nằm trong pathspec ③, nhưng hợp đồng luoc-do-v1 §0 bắt phải sinh lại sau
