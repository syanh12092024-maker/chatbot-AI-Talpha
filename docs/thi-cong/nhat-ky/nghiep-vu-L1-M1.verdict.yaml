      chạy `node db/migrate.js schema`. Ca `S11` đỏ nếu hai bên trôi khỏi nhau.» ③ của phiếu liệt kê
      từng tệp (`002_*.up.sql`, `002_*.down.sql`, `db/di-tru/*`, `src/pos/`…) và **không có**
      `db/schema.sql` — khác L0-M1 vốn cho cả thư mục `db/`. ③ tự khai «Ngoài danh sách = ngoài phạm
      vi → ghi §9, cấm sửa».
    kich_ban_hong: >-
      Nhánh (i) thợ không regen: `schema.sql` thiếu `ket_noi_pos`, ca S11 đỏ ở GATE R1 (④#7 của
      phiếu này cố ý không chạy bộ cũ nên nó lọt tới tận gate). Nhánh (ii) thợ regen: `_chan1.sh`
      phép ④ kết «NGOÀI PHẠM VI» cho một tệp thợ buộc phải đụng.
    sua_the_nao: Thêm đúng một dòng `db/schema.sql` vào ③.

