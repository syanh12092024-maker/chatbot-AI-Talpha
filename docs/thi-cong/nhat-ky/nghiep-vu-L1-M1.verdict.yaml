    sua_the_nao: >-
      ④#3/#4 in ra ctx đang dùng và ghi một dòng «đường này CHƯA tới được người dùng thật — chờ H7»;
      hoặc H7 chốt một market cho một team nghiệp vụ để có ít nhất một đường thật đo được.

ghi_chu_cho_tong: >-
  Trả lời thẳng câu tổng hỏi. (1) BA CỬA AN TOÀN chặn được ba lỗi PHẠM TRÙ — ghi khi chưa được
  phép (a) · chuyển sang trạng thái không nằm trong danh sách (b) · làm mà không có sổ (c) — và
  cửa (b) chọn đúng hình dạng whitelist thay vì blacklist, có câu «⛔ KHÔNG BAO GIỜ có nhánh xoá
  đơn» khớp luật 2 §0a. Nhưng chúng KHÔNG chặn hai lỗi TÌNH HUỐNG, cả hai đều kết thúc bằng một
  đơn thật nằm sai trạng thái: đích sai vì bảng mã chưa ai kiểm (N1) và nguồn sai vì không đọc lại
  trạng thái live trước khi ghi (N2). Cả hai lọt qua đủ ba cửa với ba đèn xanh. (2) Bảng
  `ket_noi_pos` ngoài-19-bảng KHÔNG phá hợp đồng nghiệp vụ nào của `luoc-do-v1`: `team_id NOT NULL`
  giữ đúng luật «ngoại lệ duy nhất là `bo_luat_chung`» (§2), mã hoá đúng cơ chế `db/khoa.js` (§4.5),
  seed `chua-phan` đúng pattern (§5), và phiếu có bắt khai lý do vào §thay-đổi. Nó phá đúng MỘT
  hợp đồng kỹ thuật: §0 «schema.sql sinh lại sau mỗi migration» — hỏng ở pathspec, sửa bằng một
  dòng (N5). Việc dựng bảng mới ở đây là đúng: 01 §8 đòi kết nối POS theo team và 19 bảng thật sự
  không có chỗ chứa.
