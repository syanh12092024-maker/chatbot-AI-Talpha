      thêm phép ④4b in phân bố hai giá trị `nguon` + số đơn không quyết được.

  - ma: N7
    muc: GHI-NO
    mo_ta: >-
      ④#3/#4 sẽ chạy dưới ctx của team kỹ thuật `chua-phan` — lặp lại đúng dạng ĐẠT RỖNG đã có án lệ
      ở L0-M2, chỉ khác chỗ.
    bang_chung: >-
      ②#1 seed `ket_noi_pos` team = `chua-phan`; luoc-do-v1 §1 nói `chua-phan` cấm hiện cho người
      dùng và CSDL có trigger cấm gán thành viên. Vậy phép «đọc được danh mục thật từ POS» đo trên
