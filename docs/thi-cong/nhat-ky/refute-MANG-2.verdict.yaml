  - "src/channels/whatsapp/ — không tìm được đường phá: adapter luôn ném LoiChuaCoEndpoint, BANG_MAU_TIN rỗng + `bang?.[ten]?.da_duyet` không lọt prototype ('constructor'/'__proto__' đều false). Cửa WA hiện KHÔNG gửi được gì, đúng như khai."
mu_nghiep_vu:
  - "F3 là lỗi NGHIỆP VỤ nặng nhất mảng này: hệ ghi «đã chốt đơn» + đẩy vào hàng chờ sale, còn khách thì im lặng tuyệt đối đúng lượt xác nhận đơn — sale gọi ra khách không biết mình đã đặt gì."
  - "F1+F2 làm câu «van kín trên máy dev» thành lời khai không đo được: cái được đo (PANCAKE_READONLY) không canh cái đang chảy (tools.js/order-bridge.js/pancake-orders.js)."
