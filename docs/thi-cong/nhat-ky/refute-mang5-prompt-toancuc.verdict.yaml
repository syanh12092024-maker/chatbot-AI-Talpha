      với kb có fastLaneAuth/fastLaneSize → 9/9 câu "chất liệu/size ngữ cảnh khác" bị BẮT.
    file_line: src/chat/lop-tu-khoa.js:58-59 (AUTH_Q) · :64 (SIZE_Q)

