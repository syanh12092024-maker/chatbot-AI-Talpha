      leather"/"is it real gold"/"is this original design" → that_gia; "family size
      portion"/"what is the size of your company"/"one size fits all"/"do you deliver to
      my area size 10 shoe" → hoi_size (bỏ qua vế giao hàng). CHỈ bắn khi page có
      kb.config.fastLaneAuth/fastLaneSize (đa số page hôm nay rỗng ⇒ nhường). Trả lời
      không trọn, không mất tiền, khách nhắn lại được — cùng hạng nhiễu keyword của
      fastLane cũ. 10 câu ngoài-luật của phiếu (giá/địa chỉ/chào) thì NHƯỜNG đúng (0 cướp).
    kich_ban: >-
