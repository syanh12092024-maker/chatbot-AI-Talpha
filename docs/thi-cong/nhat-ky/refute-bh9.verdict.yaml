cach_chay: >
  Ca phá nằm ngoài repo, ở scratchpad/refute-bh9/ (thư mục phiên). Chạy tất cả bằng `bash chay.sh`. Gồm 10 tệp hàm thuần r*.mjs (import
  thẳng src của worktree) và refute-bh9-luot.test.mjs, tệp này đi đường WORKER THẬT y khuôn test/bh9-luot-worker.test.mjs của thợ:
  chayMotVong → nhanDienSale → xuLyMotTin. Ca chạy trên Postgres hộp cát aicloser_v3_test_rfbh9_p<pid>, cửa gửi được TIÊM, chayCloser là
  model GIẢ, KHÔNG tiêm kiemTinRa (cửa ra thật), create_draft_order đi executeTool thật.
  Lệnh: cd <worktree> && node --env-file-if-exists=.env --import ./test/_an-toan.mjs --test --test-force-exit <tệp>.
  Không gọi mạng, không gọi model thật hay Pancake thật (.env có PANCAKE_READONLY=1). CSDL giả lập aicloser_gialap_pilot / aicloser_gialap_2
  chỉ được SELECT, và không tệp nào chứa chữ, tên hay SĐT của khách thật. Tên và số trong ca đều giả («Maria Santos» · 0551234567).
  Kết quả: 6/6 ca worker ĐỎ đúng như dự đoán (F1a F1b F2 F3 F4 F4b). Đối chứng: 4 tệp ca của thợ chạy lại trên cùng cây đều xanh
  (103 + 21 + 5 + 6 = 135/0).
findings:
  - ma: F1
    muc: CHAN
    mo_ta: >
      Người ĐANG MUỐN MUA bị coi là khách sau bán, nhận câu cố định, bị chuyển sale, rồi bị ghi donDaCo (không hết hạn) nên mất luôn lượt chốt.
      Bộ lọc [S1] `laHoiTruocBan` chỉ tha câu HỎI chính sách hoặc câu có mấy cụm «đang muốn mua» liệt kê sẵn. Câu khẳng định hoặc câu ngắn
      kiểu Taglish thì vẫn khớp ba nhánh dò khách. Hai nhánh cũ còn nguyên: «the (order|package|delivery|courier|rider) … is/has» và
      «N days … deliver». Nhánh mới «(you|u) deliver» cũng vậy.
      Đo 14/14 câu trước bán bị bắt: «5 days delivery ok po» · «2-5 days delivery is ok po» · «The order is 2 sets po» · «the order is buy 2 get 2»
      · «The package is 159 SAR right» · «the package is good for my hemorrhoids» · «the delivery is today or tomorrow» · «Ok sir u deliver
      tomorrow morning. <tên> <SĐT> <địa chỉ>» · «pls u deliver after 5pm…» · «I received that, how much 2 sets»…
      Khách thật đã nhắn đúng khuôn «How many days delivery» (tin 262 của UAE). Câu đáp tự nhiên sau khi bot nói «2-5 working days» là
      «5 days delivery ok po», và câu đó bị cổng 4a nuốt.
      Đây là đúng hệ quả mà [S1] của phiếu tự cảnh báo («khách đang muốn mua nhận câu cố định + bị giao sale, và donDaCo khoá bán vĩnh viễn»).
      Luật [S1] chỉ bàn tới câu HỎI nên chính phiếu đã hụt chỗ này.
    kich_ban: >
      `node r1-truoc-ban.mjs`: laCauSauBan(câu, hồ sơ rỗng).la = true với cả 14/14 câu.
      refute-bh9-luot.test.mjs F1a: lịch sử [khách «How many days delivery», bot «Delivery takes 2-5 working days po… Which set po…?»],
      khách «5 days delivery ok po, buy 2 get 2» ⇒ model 0 lượt · gửi CAU_NHAN_BAN_GIAO.en · HANDOFF/SALE · ho_so.donDaCo = «khách nói
      ĐƠN CŨ chưa xong/khach». Phiếu ② 2d đòi la:false, tức là model phải được gọi.
      F1b: khách gửi đủ tên + SĐT + địa chỉ kèm «Ok sir u deliver tomorrow morning» ⇒ model 0 lượt · hang_cho_tao_don 0 dòng · HANDOFF/SALE.
    file_line: "src/context.js:466-467 (hai nhánh cũ còn nguyên) · src/context.js:475-485 (HOI_CHINH_SACH/laHoiTruocBan chỉ tha câu hỏi) · src/context.js:235 (donDaCo nguồn khách ghi vĩnh viễn) · src/chat/handler-v3.js:688 (cổng 4a)"
    goi_y_va: >
      Lật chiều của nhánh dò khách. Chỉ coi là «đơn đã có» khi câu có dấu QUÁ KHỨ/ĐÃ XẢY RA (why did you deliver · you delivered ·
      received · cancelled · haven't arrived · called me…). Bỏ hẳn hai nhánh rộng «the X is/has» và «N days deliver» khỏi cổng 4a, hoặc chỉ
      dùng chúng khi hồ sơ đã có donDaCo nguồn page. Thêm ca âm cho 14 câu trên vào ④2 kèm laCauSauBan(hồ sơ rỗng).
