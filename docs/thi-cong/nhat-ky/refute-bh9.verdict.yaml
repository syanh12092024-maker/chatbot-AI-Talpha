khong_pha_duoc:
  - "(c) câu cố định sai lúc: worker nhường trước handler khi page hoặc Botcake nói cuối, khi sale người nhắn (nhanDienSale) và khi page ngắt (locPageNgat); ≤ 1 câu cố định mỗi lượt; lượt sau HANDOFF im (ca Wi của thợ). Không dựng được ca hỏng."
  - "(e) COD ngầm: tin page nêu COD kèm phủ định không tính; khách từ chối thì codTuChoi chặn; đồng ý rõ thì cờ ngầm tắt; cờ cod_ngam và ten_tu_facebook tới hàng chờ, Hộp thư và màn Vận hành. Lỗ duy nhất là F8 (tên sai thì không cờ)."
  - "(h) luật cửa ra CŨ giữ nguyên: bốn luật mới đứng sau return pass cũ và chỉ chạy khi luatBH9; lớp từ khoá và Fast Lane không bật."
  - "Câu chính sách người quyết 15/10 cho nói (2–5 ngày · đổi khi lỗi trong 7 ngày · kiểm rồi trả · FDA approved · rider gọi trước khi tới) QUA cả bốn luật, kể cả khi khách có đơn (`node r9-chinh-sach.mjs`)."
