<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kỹ năng theo sản phẩm — AI Closer</title>
<!-- Dựng trên hệ kiểu. KHÔNG CSS riêng — trước lượt này là 84 dòng, gồm cả một công tắc tự
     vẽ bằng `.ray` (kiểu thứ ba của công tắc trong sản phẩm). Mỗi kỹ năng nay là một hàng
     cài đặt: tên và phạm vi bên trái, công tắc bên phải, khoanh sản phẩm ở dưới. -->
<link rel="stylesheet" href="/chung/kieu.css" data-ds="v3">
<!-- Hàm dựng thành phần (window.UI). ĐỒNG BỘ, KHÔNG `defer`: khung ứng dụng ở cuối trang
     lấy biểu tượng từ đây — `defer` chạy SAU script cuối trang, khung sẽ mất biểu tượng. -->
<script src="/chung/ui.js"></script>
</head>
<body>
<header>
  <h1>Kỹ năng theo sản phẩm</h1>
  <span class="sub">Khối tư vấn dùng lại được — bật cho đúng sản phẩm cần, nằm giữa quy tắc chung và kịch bản page.</span>
</header>

<main>
  <div id="bang-tin" aria-live="polite"></div>

  <section class="section table-wrap" aria-labelledby="tieu-ky">
    <div class="table-toolbar"><h2 id="tieu-ky">Kỹ năng của team</h2>
      <span class="table-count" id="tomTat"></span></div>
    <div class="setting-list" id="ds"><div class="empty-state"><span class="skeleton"></span></div></div>
  </section>

  <p class="page-note">Không chọn sản phẩm nào nghĩa là áp cho CẢ TEAM — khác hẳn với tắt. Muốn ngừng hẳn thì gạt công tắc.</p>
</main>

<script>
const { esc, statusBadge, alert: canhBao, emptyState, button, toast, formatNumber: so } = window.UI;
const $ = (s) => document.querySelector(s);

let D = null, SUA = false, LOI = null;

async function goi(duong, tuyChon) {
  const r = await fetch(duong, { headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' }, ...tuyChon });
  if (r.status === 401) { location.href = '/dang-nhap?tiep=' + encodeURIComponent(location.pathname); return null; }
  let d = null; try { d = await r.json(); } catch { /* null */ }
  if (!r.ok || !d || d.ok === false) throw new Error((d && d.thongDiep) || ('Máy chủ trả ' + r.status + '.'));
  return d;
}

function veBangTin() {
  const kh = [];
  if (LOI) kh.push(canhBao({ level: 'error', title: LOI.title, body: LOI.body }));
  for (const c of (D && D.canhBao) || []) kh.push(canhBao({ level: c.muc === 'do' ? 'error' : 'warning', body: c.chu }));
  if (D && !SUA) kh.push(canhBao({ level: 'info', title: 'Vai của bạn chỉ xem được', body: 'Bật tắt kỹ năng và khoanh sản phẩm cần vai Quản trị.' }));
  $('#bang-tin').innerHTML = kh.length ? `<div class="duoi-5">${kh.join('')}</div>` : '';
}
function baoLoi(title, body) { LOI = { title, body }; veBangTin(); }

function veDs() {
  $('#tomTat').textContent = `${so(D.kyNang.length)} kỹ năng · ${so(D.soPage)} page · ${so(D.sanPham.length)} sản phẩm`;
  if (D.trong) {
    $('#ds').innerHTML = emptyState({ icon: 'triangle-alert', title: D.trong.noi,
      actionsHtml: D.trong.diTiep && D.trong.diTiep.duong ? button(D.trong.diTiep.chu, { href: D.trong.diTiep.duong, size: 'sm' }) : '' });
    return;
  }

  $('#ds').innerHTML = D.kyNang.map((k) => {
    // «Bật mà không page nào nhận» là cảnh nguy: trông như đang chạy, thật ra không vào
    // prompt của ai. Nói ngay tại hàng đó, không chỉ ở băng tin đầu trang.
    const rong = k.bat && k.soPageNhan === 0;
    return `<div class="setting-row" data-ky="${esc(k.id)}">
      <div>
        <div class="setting-name">${esc(k.ten)} <span class="meta"><code>${esc(k.ma)}</code></span></div>
        <div class="setting-desc">${esc(D.chuPhamVi[k.phamVi])}</div>
        <div class="tren-2 hang">
          ${statusBadge(rong ? 'blocked' : k.bat ? 'feature_on' : 'feature_off',
            { label: rong ? 'Bật nhưng 0 page nhận' : k.bat ? `${so(k.soPageNhan)}/${so(D.soPage)} page nhận` : 'Đang tắt' })}
          <span class="meta">≈ ${so(k.uocToken)} token mỗi lượt · ${so(k.soKyTu)} ký tự</span>
        </div>
      </div>
      <div class="setting-control">
        <label class="switch" ${SUA ? '' : 'title="Cần vai Quản trị"'}>
          <input type="checkbox" role="switch" data-bat="${esc(k.id)}" aria-label="Bật kỹ năng ${esc(k.ten)}"
                 ${k.bat ? 'checked' : ''} ${SUA ? '' : 'disabled'}>
          <span>${k.bat ? 'Đang bật' : 'Tắt'}</span>
        </label>
        ${D.sanPham.length ? `<div class="tren-2">
          <div class="field-label duoi-1">Khoanh theo sản phẩm</div>
          <div class="chip-list" role="group" aria-label="Khoanh sản phẩm cho kỹ năng ${esc(k.ten)}" data-nhom="${esc(k.id)}">
            ${D.sanPham.map((s) => `<label class="chip"><input type="checkbox" value="${esc(s.ma)}"
              ${k.nhom.includes(s.ma) ? 'checked' : ''} ${SUA ? '' : 'disabled'}> ${esc(s.ten)}</label>`).join('')}
          </div>
          <div class="field-hint">Bỏ trống = áp cho cả team.</div>
        </div>` : '<div class="field-hint tren-2">Chưa có sản phẩm nào để khoanh nhóm — kỹ năng bật sẽ áp cho cả team.</div>'}
        <details class="tren-2"><summary class="text-sm">Xem nội dung kỹ năng</summary>
          <pre class="code-block tren-2">${esc(k.noiDung)}</pre></details>
      </div>
    </div>`;
  }).join('');

  document.querySelectorAll('[data-bat]').forEach((el) => el.addEventListener('change', () => gat(el)));
  document.querySelectorAll('[data-nhom]').forEach((o) => o.addEventListener('change', () => datNhom(o)));
}

async function gat(el) {
  LOI = null; veBangTin();
  el.disabled = true;
  try {
    const kq = await goi(`/api/ky-nang/${encodeURIComponent(el.dataset.bat)}/bat`,
      { method: 'POST', body: JSON.stringify({ bat: el.checked }) });
    toast(kq.bat ? 'Đã bật — page nhận kỹ năng này từ lượt chat kế tiếp.' : 'Đã tắt kỹ năng.');
    await nap();
  } catch (e) { el.checked = !el.checked; baoLoi('Không đổi được trạng thái kỹ năng', e.message); }
  finally { el.disabled = false; }
}

async function datNhom(o) {
  const nhom = [...o.querySelectorAll('input:checked')].map((c) => c.value);
  LOI = null; veBangTin();
  try {
    await goi(`/api/ky-nang/${encodeURIComponent(o.dataset.nhom)}/nhom`,
      { method: 'POST', body: JSON.stringify({ nhom }) });
    toast(nhom.length ? `Đã khoanh ${so(nhom.length)} sản phẩm.` : 'Đã bỏ khoanh — kỹ năng áp cho cả team.');
    await nap();
  } catch (e) { baoLoi('Không lưu được nhóm sản phẩm', e.message); await nap(); }
}

async function nap() {
  try {
    const d = await goi('/api/ky-nang');
    if (!d) return;
    D = d; SUA = !!d.suaDuoc;
    veBangTin(); veDs();
  } catch (e) {
    baoLoi('Không tải được danh sách kỹ năng', e.message);
    $('#ds').innerHTML = emptyState({ icon: 'circle-alert', title: 'Không tải được', body: 'Kiểm kết nối rồi tải lại trang.' });
  }
}
nap();
</script>
<script src="/chung/dieu-huong.js"></script>
</body>
</html>
