<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Bắt đầu — AI Closer</title>
<!-- BẢN MẪU của hệ kiểu v3: KHÔNG một dòng CSS riêng, KHÔNG một thuộc tính style=. Mọi thứ
     đi qua `chung/kieu.css` và `chung/ui.js`. Cần một kiểu chưa có? Thêm vào hệ, đừng thêm
     vào đây. Ca HK6 và HK7 canh. -->
<link rel="stylesheet" href="/chung/kieu.css" data-ds="v3">
<!-- Hàm dựng thành phần (window.UI). ĐỒNG BỘ, KHÔNG `defer`: khung ứng dụng ở cuối trang
     lấy biểu tượng từ đây — `defer` chạy SAU script cuối trang, khung sẽ mất biểu tượng. -->
<script src="/chung/ui.js"></script>
</head>
<body>
<header>
  <h1>Bắt đầu</h1>
  <span class="sub">Làm cho đủ bốn điều kiện của một page, rồi bật bot.</span>
</header>

<main>
  <div id="bang-tin" aria-live="polite"></div>

  <section class="section" aria-label="Tình hình các page">
    <div id="dem"></div>
  </section>

  <div id="khung" class="cot-ds tren-6">
    <!-- Danh sách chọn là MỘT đối tượng tự đứng — nên nó là tấm. Bên phải thì KHÔNG bọc tấm:
         bên trong đã có khung kiểm tra sẵn sàng, bọc thêm là thẻ lồng thẻ (mục Z). -->
    <section class="panel" aria-labelledby="tieu-ds">
      <h2 id="tieu-ds">Chọn một page</h2>
      <label for="tim" class="sr-only">Tìm page theo tên</label>
      <input id="tim" type="search" placeholder="Tìm theo tên page…" autocomplete="off" spellcheck="false">
      <div id="ds" role="list" class="tren-3 cuon-doc"></div>
    </section>

    <section id="chi-tiet" aria-live="polite"></section>
  </div>
</main>

<script>
const { esc, statusBadge, button, setBusy, alert: canhBao, emptyState, metricRow, readiness,
        toast, confirmDialog, formatNumber } = window.UI;

let DL = null;
let chonId = new URLSearchParams(location.search).get('page') || null;

function banner(level, title, body) {
  document.getElementById('bang-tin').innerHTML =
    `<div class="duoi-4">${canhBao({ level, title, body })}</div>`;
}

// ── HÀNG CHỈ SỐ — bốn con số, CHUNG MỘT viền (mục M1) ─────────────────────────────
function veDem(d) {
  document.getElementById('dem').innerHTML = metricRow([
    { label: 'Đang chạy', value: d.dangChay || 0,
      statusHtml: d.dangChay ? statusBadge('bot_on') : '' },
    { label: 'Sẵn sàng, chưa bật', value: d.sanChuaBat || 0,
      statusHtml: d.sanChuaBat ? statusBadge('ready') : '' },
    { label: 'Còn thiếu điều kiện', value: d.conViec || 0,
      statusHtml: d.conViec ? statusBadge('blocked') : '' },
    { label: 'Bot không thấy', value: d.botKhongThay || 0,
      statusHtml: d.botKhongThay ? statusBadge('not_seen') : '' },
  ]);
}

// Trạng thái của MỘT page — màu do ánh xạ tập trung quyết, trang chỉ nói nghĩa.
function trangThaiPage(p) {
  if (p.botKhongThay) return statusBadge('not_seen');
  if (p.dangChay) return statusBadge('bot_on');
  if (p.batDuoc) return statusBadge('ready');
  return statusBadge('blocked', { label: `Thiếu ${formatNumber(p.chan.length)}` });
}

// ── danh sách page ────────────────────────────────────────────────────────────────
function veDanhSach() {
  const q = document.getElementById('tim').value.trim().toLowerCase();
  const ds = DL.page.filter((p) => !q || p.ten.toLowerCase().includes(q));
  const o = document.getElementById('ds');
  if (!ds.length) {
    o.innerHTML = emptyState({ icon: 'search', title: 'Không page nào khớp',
      body: 'Xoá chữ trong ô tìm để xem lại tất cả.' });
    return;
  }
  o.innerHTML = ds.map((p) => `
    <button type="button" class="nut nut-dong duoi-1 mot-page" data-id="${esc(p.pageId)}" role="listitem"
      aria-current="${p.pageId === chonId ? 'true' : 'false'}">
      <span class="cat manh">${esc(p.ten)}</span>
      ${trangThaiPage(p)}
    </button>`).join('');
  for (const b of o.querySelectorAll('.mot-page')) b.addEventListener('click', () => chon(b.dataset.id));
}

// ── M4 · KIỂM TRA SẴN SÀNG ─────────────────────────────────────────────────────────
// Tên điều kiện là tên TRUNG TÍNH (`nhan`). Tên dạng lỗi (`ten`) chỉ hợp khi điều kiện hỏng —
// dùng cho điều kiện đã đạt thì ra «Xong · Không token nào phủ page», tự mâu thuẫn.
function mucKiem(ma, bi, laNhac) {
  const dk = (DL.dieuKien && DL.dieuKien[ma]) || {};
  const hong = !!bi;
  const chiTiet = hong
    ? [bi.chiTiet ? `Bot nói: ${bi.chiTiet}` : '', dk.lam || ''].filter(Boolean).join(' · ')
    : '';
  return {
    ok: hong ? (laNhac ? 'warn' : false) : true,
    name: dk.nhan || dk.ten || ma,
    detail: chiTiet,
    actionHtml: hong && dk.di ? button(dk.nutDi || 'Đi sửa', { href: dk.di, size: 'sm' }) : '',
  };
}

function chanTrangKiem(p) {
  if (p.botKhongThay) {
    return canhBao({ level: 'info', title: 'Bot không thấy page này',
      body: 'Page có trong v3 nhưng tiến trình bot không nhận ra nó — đây là «chưa biết», không phải «sẵn sàng». Kiểm token ở màn Kết nối trước.',
      actionsHtml: button('Mở kết nối', { href: '/ket-noi', size: 'sm' }) });
  }
  if (p.dangChay) {
    return `<div class="hang day">
      <span>${statusBadge('bot_on')} <span class="mo nho">Bot đang trả lời khách của page này.</span></span>
      <span class="hang">${button('Xem tốn bao nhiêu', { href: '/chi-phi', size: 'sm' })}
        ${button('Tắt ở Công tắc từng page', { href: '/page-bot', size: 'sm', variant: 'ghost' })}</span>
    </div>`;
  }
  if (!p.batDuoc) {
    return `<span class="mo">Bot chưa thể bật — còn thiếu ${formatNumber(p.chan.length)} điều kiện.</span>`;
  }
  return `<div class="hang day">
      <span class="mo nho">Lượt bật được ghi nhật ký kèm tên người bấm.</span>
      ${button('Bật bot cho page này', { variant: 'primary', id: 'nut-bat', icon: 'bot' })}
    </div>`;
}

function veChiTiet() {
  const o = document.getElementById('chi-tiet');
  const p = DL.page.find((x) => x.pageId === chonId);
  if (!p) {
    o.innerHTML = emptyState({ icon: 'inbox', title: 'Chưa chọn page nào',
      body: 'Bấm một page ở danh sách bên trái.' });
    return;
  }
  const theoMa = new Map([...p.chan, ...p.nhac].map((b) => [b.ma, b]));

  o.innerHTML = `
    <div class="hang day duoi-4">
      <div class="page-identity">
        <span class="page-avatar" aria-hidden="true">${esc((p.ten || '?').trim()[0] || '?').toUpperCase()}</span>
        <div class="page-identity-text">
          <h2 class="page-identity-name">${esc(p.ten)}</h2>
          <div class="page-identity-sub">Mã page ${esc(p.pageId)}${p.marketer ? ' · marketer ' + esc(p.marketer) : ''}</div>
        </div>
      </div>
      ${trangThaiPage(p)}
    </div>

    ${p.lechBanSao ? `<div class="duoi-4">${canhBao({ level: 'warning', title: 'Hai nguồn đang nói khác nhau',
      body: 'Tiến trình bot và bản sao trong v3 không khớp về việc page này có bật hay không. Số đúng là của tiến trình bot.' })}</div>` : ''}

    ${readiness({
      title: 'Bốn điều kiện bắt buộc',
      items: DL.maChan.map((ma) => mucKiem(ma, theoMa.get(ma), false)),
      footHtml: chanTrangKiem(p),
    })}

    ${p.nhac.length ? `<div class="tren-4">${readiness({
      title: 'Đáng biết, không chặn',
      mode: 'advisory',
      items: p.nhac.map((b) => mucKiem(b.ma, b, true)),
    })}</div>` : ''}

    ${p.la.length ? `<div class="tren-4">${canhBao({ level: 'warning', title: 'Bot trả về điều kiện màn này chưa biết',
      body: `${p.la.map((b) => b.ma).join(', ')} — tầng dưới vừa thêm bậc mới. Hiện ra để nó không lặng lẽ biến mất.` })}</div>` : ''}`;

  const nut = document.getElementById('nut-bat');
  if (nut) nut.addEventListener('click', () => batBot(p, nut));
}

function chon(id) {
  chonId = id;
  const u = new URL(location.href);
  u.searchParams.set('page', id);           // trạng thái nằm trong URL — chia sẻ được, F5 không mất
  history.replaceState(null, '', u);
  veDanhSach();
  veChiTiet();
}

// ── bật bot: gọi ĐƯỜNG ĐÃ CÓ của màn Công tắc từng page (bảy chốt, nhật ký, xác nhận) ────
async function batBot(p, nut) {
  const dongY = await confirmDialog({
    title: `Bật bot cho «${p.ten}»?`,
    body: 'Bot sẽ bắt đầu trả lời khách thật của page này. Lượt bật được ghi nhật ký kèm tên bạn.',
    confirmLabel: 'Bật bot',
  });
  if (!dongY) return;
  setBusy(nut, true);
  try {
    // `p.id` (khoá dòng CSDL), KHÔNG phải `p.pageId` (mã Facebook): cửa này tra theo
    // `page.id`. Gửi nhầm mã là 404, và người mới không có cách nào đoán ra vì sao.
    const r = await fetch(`/api/page-bot/${encodeURIComponent(p.id)}/bot`, {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bat: true }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || j.ok === false) {
      // Lỗi phải kèm BƯỚC TIẾP THEO, không chỉ nêu vấn đề (mục P).
      setBusy(nut, false);
      banner('error', 'Không thể bật bot',
        `${j.thongDiep || `Máy chủ trả ${r.status}.`} Nếu do quyền thì cần vai Quản trị; nếu cửa ghi đang khoá thì bỏ V3_BOT_KHOA trong .env của v3 rồi khởi động lại.`);
      return;
    }
    toast('Đã bật bot.');
    await tai();
  } catch (e) {
    setBusy(nut, false);
    toast('Không gọi được máy chủ. Kiểm mạng rồi bấm lại.', { level: 'error' });
  }
}

// ── tải ───────────────────────────────────────────────────────────────────────────
async function tai() {
  try {
    const r = await fetch('/api/bat-dau', { credentials: 'same-origin' });
    if (r.status === 401) { location.href = '/dang-nhap?tiep=' + encodeURIComponent('/bat-dau'); return; }
    const j = await r.json();
    if (!r.ok || j.ok === false) {
      banner('error', 'Không đọc được cửa kiểm',
        `${j.thongDiep || `Máy chủ trả ${r.status}.`} Màn này không đoán: một danh sách rỗng ở đây trông y như «mọi page đều ổn».`);
      return;
    }
    DL = j;
    document.getElementById('bang-tin').innerHTML = '';
    veDem(DL.dem);
    const khung = document.getElementById('khung');
    if (DL.trong && DL.trong.rong) {
      banner('warning', DL.trong.noi || 'Chưa có gì để hiện', DL.trong.diTiep || '');
      khung.hidden = true;
      return;
    }
    khung.hidden = false;
    if (!chonId || !DL.page.some((p) => p.pageId === chonId)) {
      chonId = DL.page.length ? DL.page[0].pageId : null;   // mở sẵn page gần xong nhất
    }
    veDanhSach();
    veChiTiet();
  } catch (e) {
    banner('error', 'Không gọi được máy chủ', `${e && e.message ? e.message : String(e)} Kiểm mạng rồi tải lại trang.`);
  }
}

document.getElementById('tim').addEventListener('input', () => veDanhSach());
tai();
</script>
<script src="/chung/dieu-huong.js"></script>
</body>
</html>
