<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chi tiết việc cần xử — AI Closer</title>
<!-- Dựng trên hệ kiểu. KHÔNG CSS riêng — trước lượt này là 51 dòng.
     ⚠️ 14/09: màn này ĐANG CHẾT TRẮNG trước lượt viết lại — nó gọi `veHoSoKhach(...)`, một
        hàm nằm trong hàm bọc của `dong-viec-ui.js` nên trang không thấy; cả thân trang rơi
        vào nhánh lỗi «veHoSoKhach is not defined» kể từ lượt tách khối 11/09. Nay khối ấy đi
        ra qua `DongViecUI.hoSoKhachHtml()`. Bắt được bằng ẢNH CHỤP THẬT, không ca nào đỏ. -->
<link rel="stylesheet" href="/chung/kieu.css" data-ds="v3">
<!-- Hàm dựng thành phần (window.UI). ĐỒNG BỘ, KHÔNG `defer`: khung ứng dụng ở cuối trang
     lấy biểu tượng từ đây — `defer` chạy SAU script cuối trang, khung sẽ mất biểu tượng. -->
<script src="/chung/ui.js"></script>
</head>
<body>
<header>
  <h1>Chi tiết việc cần xử</h1>
  <span class="sub" id="phu-de"></span>
</header>

<main id="than"><div class="panel"><span class="skeleton"></span></div></main>

<script>
const { esc, statusBadge, button, alert: canhBao, emptyState } = window.UI;
const $ = (s) => document.querySelector(s);
const gio2 = (t) => (t ? new Date(t).toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' }) : '—');

/* Id lấy từ ĐƯỜNG DẪN, không phải query string: "Không nhét dữ liệu khách vào query
   string" — mọi thứ đi qua `/api/...` với id. */
const VIEC_ID = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');

let lech = 0;
const gio = () => Date.now() + lech;

function chuoiDem(han) {
  if (!Number.isFinite(han)) return '—';
  const con = han - gio();
  const giay = Math.floor(Math.abs(con) / 1000);
  const p = Math.floor(giay / 60), g = giay % 60;
  return (con < 0 ? '+' : '') + p + ':' + String(g).padStart(2, '0');
}
const tonDem = (han) => (!Number.isFinite(han) ? 'neutral' : (han - gio() < 0 ? 'danger' : (han - gio() <= 300000 ? 'warning' : 'neutral')));

function nhipDongHo() {
  for (const el of document.querySelectorAll('[data-han]')) {
    const han = Number(el.getAttribute('data-han'));
    el.textContent = chuoiDem(han);
    el.dataset.tone = tonDem(han);
  }
}

/* Nhãn tiếng Việt cho những cột đơn hàng đoán được; cột lạ hiện nguyên tên cột chứ không
   giấu đi — lược đồ `don_hang` là của người A, giấu cột là giấu mất thông tin sale cần. */
const NHAN = {
  // Hai mã KHÁC NHAU, đừng để chung một nhãn: sale đọc mã cho kho mà đọc nhầm mã nội bộ
  // thì kho không tra ra đơn nào. `ma_pos` là "<shop>:<số đơn POS>", không phải số trần.
  id: 'Mã trong hệ thống', ma_pos: 'Mã đơn trên POS',
  // HAI cột trạng thái TÁCH HẲN nhau trong lược đồ thật: đơn có thể «chờ khách trả lời»
  // trong hệ mà trên POS vẫn «chờ xác nhận». Gộp một nhãn là giấu mất một nửa sự thật.
  trang_thai_he: 'Trạng thái trong hệ', trang_thai_pos: 'Trạng thái POS',
  tong_tien: 'Tổng tiền', tien_te: 'Tiền tệ', so_luong: 'Số lượng', san_pham: 'Sản phẩm',
  nguon: 'Nguồn', dia_chi: 'Địa chỉ', thanh_pho: 'Thành phố', quoc_gia: 'Quốc gia',
  so_dien_thoai: 'Số điện thoại', ten_khach: 'Tên khách', ghi_chu: 'Ghi chú',
  tao_luc: 'Tạo lúc', sua_luc: 'Sửa lúc', dong_luc: 'Đóng lúc',
};
// Khoá ngoại và cột nội bộ: giấu đi vì chúng là SỐ, sale không tra được gì bằng chúng —
// thứ chúng trỏ tới đã hiện sẵn ở khối trên (khách, page, hội thoại).
const AN = new Set(['team_id', 'khach_id', 'page_id', 'hoi_thoai_id']);

function bangDoiTuong(o) {
  const hang = Object.entries(o)
    .filter(([k, v]) => !AN.has(k) && v != null && v !== '' && typeof v !== 'object')
    .map(([k, v]) => `<tr><th scope="row">${esc(NHAN[k] || k)}</th><td>${esc(v)}</td></tr>`)
    .join('');
  return hang ? `<table class="data-table">${hang}</table>`
    : emptyState({ icon: 'inbox', title: 'Không có thông tin đơn' });
}

function ve(d) {
  const v = d.viec || {};
  const han = Number(v.han_luc);
  const huyHieu = v.quaHan ? statusBadge('blocked', { label: 'Quá hạn' })
    : v.mucKhan === 'gap' ? statusBadge('needs_attention', { label: 'Sắp hết giờ' })
    : statusBadge('ready', { label: 'Còn giờ' });

  const ai = [
    v.tenKhach ? `Khách ${esc(v.tenKhach)}` : null,
    v.soDienThoai ? esc(v.soDienThoai) : null,
    v.tenPage ? `Page ${esc(v.tenPage)}` : null,
    `Bot đẩy sang lúc ${esc(gio2(Number(v.day_luc)))}`,
  ].filter(Boolean).join(' · ');

  const nutPancake = d.lienKet && d.lienKet.pancake
    ? button('Mở Pancake', { href: d.lienKet.pancake, variant: 'primary' })
      .replace('<a ', '<a target="_blank" rel="noopener" ')
    : `<span class="btn" data-variant="primary" aria-disabled="true" title="Việc này không gắn hội thoại nào"><span>Mở Pancake</span></span>`;
  const nutPos = d.lienKet && d.lienKet.pos
    ? button('Mở POS', { href: d.lienKet.pos }).replace('<a ', '<a target="_blank" rel="noopener" ')
    : `<span class="btn" aria-disabled="true" title="${v.don_hang_id ? 'Chưa cấu hình đường POS' : 'Việc này không gắn đơn nào'}"><span>Mở POS</span></span>`;

  $('#than').innerHTML =
    // KHỐI 1 — lý do bot dừng, và đồng hồ
    '<section class="panel">'
      + '<div class="detail-head">'
        + `<div><h2>${esc(d.lyDoChu)}</h2><div class="text-muted text-sm tren-1">${ai}</div></div>`
        + `<div class="hang">${huyHieu}<span class="status-badge" data-tone="${tonDem(han)}" data-han="${Number.isFinite(han) ? han : ''}">${chuoiDem(han)}</span></div>`
      + '</div>'
      + `<div class="hang">${nutPancake}${nutPos}</div>`
      // KHỐI 2 — hội thoại: KHÔNG chép về đây. Bỏ đoạn chat ngày 23/08 (chủ dự án duyệt):
      // `so_ai` chỉ ghi hành động của bot, không giữ nội dung tin và không có tin của khách,
      // nên dựng ở đây là dựng một nửa cuộc nói chuyện. Bản đầy đủ nằm ở Pancake — một cú bấm.
      + '<p class="page-note">Hội thoại đầy đủ nằm ở Pancake. Bấm «Mở Pancake» để đọc và trả lời khách.</p>'
    + '</section>'

    + '<div class="cot-ds tren-4" data-huong="phai">'
      // KHỐI 3 — thông tin đơn
      + '<section class="table-wrap"><div class="table-toolbar"><h2>Thông tin đơn</h2></div>'
        + (d.donHang ? bangDoiTuong(d.donHang) : emptyState({ icon: 'inbox', title: 'Việc này không gắn với đơn nào',
            body: 'Việc đến từ một hội thoại, chưa có đơn nào được tạo.' }))
      + '</section>'
      + '<div class="stack">'
        // KHỐI 2b — HỒ SƠ KHÁCH (bản vẽ 11/09). Dùng CHUNG một bản với ô xem nhanh của bảng
        // điều phối, lấy qua `DongViecUI.hoSoKhachHtml`.
        + (window.DongViecUI ? window.DongViecUI.hoSoKhachHtml(d.hoSoKhach) : '')
        // Chỗ để sẵn cho L4-M2 (đánh dấu đã xử). ĐỂ RỖNG — đắp gì vào đây là việc của module đó.
        + '<div id="o-dong-viec"></div>'
      + '</div>'
    + '</div>';

  $('#phu-de').textContent = d.lyDoChu || '';
  nhipDongHo();
  veDongViec(d);                       // KHỐI 4 — L4-M2, đắp vào ô đã chừa ở trên
}

/* ══════════════════════ KHỐI 4 · L4-M2 ══════════════════════
   Khối này ĐÃ CHUYỂN sang `trang/dong-viec-ui.js` (11/09) để bảng điều phối dùng chung
   một bản. Mọi lệnh ghi (`/nhan`, `/dong`) nằm trọn trong tệp đó — trang này KHÔNG được
   tự gọi lại chúng, vì hai chỗ cùng ghi một dòng việc thì cái thứ hai bao giờ cũng trôi. */

function veDongViec(d) {
  if (!window.DongViecUI) {
    $('#o-dong-viec').innerHTML = canhBao({ level: 'warning', title: 'Không tải được khối xử việc',
      body: 'Tải lại trang. Nếu vẫn không được, xử tạm bên Pancake rồi quay lại đóng việc.' });
    return;
  }
  return window.DongViecUI.gan(d, { sauKhiGhi: tai });
}

function baoTrang(level, title, body, actionsHtml) {
  $('#than').innerHTML = canhBao({ level, title, body, actionsHtml: actionsHtml || '' });
}

async function tai() {
  try {
    const r = await fetch('/api/dieu-phoi/viec/' + encodeURIComponent(VIEC_ID), { headers: { accept: 'application/json' } });
    if (r.status === 401) {
      baoTrang('warning', 'Phiên đăng nhập đã hết', 'Đăng nhập lại rồi mở lại việc này.',
        button('Đăng nhập lại', { href: '/dang-nhap', size: 'sm', variant: 'primary' }));
      return;
    }
    if (r.status === 404) {
      baoTrang('warning', 'Không có việc này', 'Có thể việc đã rời hàng chờ, hoặc đường dẫn sai.',
        button('Về Việc đang chờ', { href: '/dieu-phoi', size: 'sm' }));
      return;
    }
    const j = await r.json().catch(() => null);
    if (!r.ok || !j || j.ok !== true) throw new Error((j && j.thongDiep) || ('Máy chủ trả ' + r.status));
    if (Number.isFinite(j.bay)) lech = j.bay - Date.now();
    ve(j);
  } catch (e) {
    baoTrang('error', 'Không tải được việc này', 'Kiểm kết nối rồi tải lại trang.',
      button('Về Việc đang chờ', { href: '/dieu-phoi', size: 'sm' }));
    const o = document.querySelector('.alert-body');
    if (o) o.insertAdjacentHTML('afterend', `<div class="alert-detail">${esc(e && e.message ? e.message : 'lỗi mạng')}</div>`);
  }
}

setInterval(nhipDongHo, 1000);
tai();
</script>
<script src="/dieu-phoi/dong-viec-ui.js"></script>
<script src="/chung/dieu-huong.js"></script>
</body>
</html>
