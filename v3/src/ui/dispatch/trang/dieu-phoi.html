<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Việc đang chờ — AI Closer</title>
<!-- Dựng trên hệ kiểu. KHÔNG CSS riêng — trước lượt này là 91 dòng, trong đó khuôn «bảng
     thành thẻ ở khổ hẹp» nay là của hệ (`.data-table[data-hep="the"]`, mục S) nên bảng nào
     cũng dùng được. Màn này là màn sale mở cả ngày: đồng hồ đếm ngược chạy phía trình duyệt
     mỗi giây, máy chủ chỉ bị hỏi 15 giây một lần. -->
<link rel="stylesheet" href="/chung/kieu.css" data-ds="v3">
<!-- Hàm dựng thành phần (window.UI). ĐỒNG BỘ, KHÔNG `defer`: khung ứng dụng ở cuối trang
     lấy biểu tượng từ đây — `defer` chạy SAU script cuối trang, khung sẽ mất biểu tượng. -->
<script src="/chung/ui.js"></script>
</head>
<body>
<header>
  <h1>Việc đang chờ</h1>
  <span class="sub" id="tom">đang tải…</span>
  <span class="sp"></span>
  <span id="dau-phai"></span>
</header>

<main>
  <div id="bao-dong" aria-live="polite"></div>

  <!-- HÀNG ĐỢI (bản 4, 28/09): MỘT danh sách, xếp theo hạn — hội thoại và đơn chung một hàng,
       vì sale hỏi «việc nào gấp nhất», không hỏi «trong hai loại, loại nào». Trước đây là hai
       bảng + hộp báo động đỏ + ô xem nhanh cố định: bốn khối cho một việc. Tab lọc giữ lại
       cách tách theo loại cho ai cần. -->
  <section class="section table-wrap" aria-labelledby="tieu-hd">
    <h2 id="tieu-hd" class="sr-only">Hàng đợi</h2>
    <div class="tabs" role="tablist" aria-label="Lọc theo loại việc">
      <button type="button" class="tab" role="tab" aria-selected="true" data-loc="">Tất cả<span class="count" id="n-tat">0</span></button>
      <button type="button" class="tab" role="tab" aria-selected="false" data-loc="hoi_thoai">Hội thoại<span class="count" id="n-ht">0</span></button>
      <button type="button" class="tab" role="tab" aria-selected="false" data-loc="don_hang">Đơn<span class="count" id="n-don">0</span></button>
    </div>
    <table class="data-table" data-hep="the" data-kieu="hang-doi">
      <thead><tr><th scope="col" class="c-dem-dau">Còn lại</th><th scope="col">Khách</th><th scope="col">Lý do bot đẩy sang</th>
        <th scope="col">Loại · page</th><th scope="col">Đang xử</th></tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </section>

  <!-- XEM NHANH là NGĂN KÉO phải: danh sách giữ trọn bề ngang, và trên điện thoại ngăn kéo phủ
       cả màn — hết cảnh ô xem nhanh nằm dưới đáy trang (audit 28/09). -->
  <dialog class="drawer" id="ngan" aria-labelledby="ngan-tieu">
    <div class="drawer-header">
      <div class="gian"><h2 id="ngan-tieu">Xem nhanh</h2><div class="text-muted text-sm cat" id="ngan-phu"></div></div>
      <button type="button" class="icon-btn" id="ngan-dong" aria-label="Đóng xem nhanh"></button>
    </div>
    <div class="drawer-body" id="o-xem"></div>
  </dialog>
</main>

<script>
const { esc, statusBadge, button, alert: canhBao, emptyState, formatNumber } = window.UI;
const $ = (s) => document.querySelector(s);

/* Đồng hồ của MÁY CHỦ, không phải của máy khách: mỗi lần tải, `bay` từ máy chủ về được so
   với `Date.now()` tại chỗ rồi giữ lại độ lệch. Máy sale đặt sai giờ 3 phút thì cả bảng
   đếm sai 3 phút mà không ai ngờ. */
let lech = 0;
const gio = () => Date.now() + lech;

/* Đếm ngược chạy PHÍA TRÌNH DUYỆT mỗi giây; máy chủ chỉ được hỏi 15 giây một lần.
   Hỏi máy chủ mỗi giây thì 20 sale mở màn này là 20 lượt/giây, cả ngày, chỉ để đổi con số. */
const CHU_KY_TAI_MS = 15000;

function chuoiDem(hanLuc) {
  if (!Number.isFinite(hanLuc)) return '—';
  const con = hanLuc - gio();
  const giay = Math.floor(Math.abs(con) / 1000);
  const p = Math.floor(giay / 60), g = giay % 60;
  // Quá hạn thì hiện `+3:20` — đếm lùi qua số âm không ai đọc được là trễ bao lâu.
  return (con < 0 ? '+' : '') + p + ':' + String(g).padStart(2, '0');
}

/** Đồng hồ nói bằng CHỮ lẫn màu: «quá hạn» và «sắp hết» là hai nghĩa, không phải hai sắc đỏ. */
function tonDem(hanLuc) {
  if (!Number.isFinite(hanLuc)) return 'neutral';
  const con = hanLuc - gio();
  if (con < 0) return 'danger';
  return con <= 5 * 60 * 1000 ? 'warning' : 'neutral';
}

function nhipDongHo() {
  for (const el of document.querySelectorAll('[data-han]')) {
    const han = Number(el.getAttribute('data-han'));
    el.textContent = chuoiDem(han);
    el.dataset.tone = tonDem(han);
    const tr = el.closest('tr');
    if (tr) tr.dataset.muc = tonDem(han);
  }
}

/* Cột "Đang xử" (L4-M2): trống khi `cho`, tên người khi `dang_xu`. Chỉ đọc — nhận việc và
   đóng việc đều làm ở khối «Đánh dấu đã xử», không ai bấm nhầm từ một danh sách đang tự
   làm mới.

   `trangThai` và `tenNguoiNhan` do MÁY CHỦ dựng sẵn. Trang KHÔNG tự nhìn `nguoi_nhan_id`
   với `dong_luc` mà suy lại — công thức trạng thái chỉ có một bản, ở `kho-viec.js`. Và
   `nguoi_nhan_id` vốn là một con số khoá ngoại, in ra đây thì sale đọc được gì. */
function dangXuCua(v) {
  if (v.trangThai !== 'dang_xu') return '';
  return esc(v.tenNguoiNhan || 'ai đó');
}

const TEN_LOAI = { hoi_thoai: 'Hội thoại', don_hang: 'Đơn' };

function dongViec(v) {
  const han = Number(v.han_luc);
  const nhan = dangXuCua(v);
  // Đồng hồ là CỘT ĐẦU: thứ sale nhìn trước nhất. Ở khổ hẹp `c-dem` nhảy lên góc phải thẻ.
  return '<tr data-id="' + esc(v.id) + '" data-loai="' + esc(v.loai || '') + '" data-muc="' + tonDem(han) + '" data-han-dong="'
      + (Number.isFinite(han) ? han : '') + '">'
    + '<td class="num c-dem"><span class="dong-ho" data-tone="' + tonDem(han) + '" data-han="'
      + (Number.isFinite(han) ? han : '') + '">' + chuoiDem(han) + '</span></td>'
    + '<td data-nhan="Khách"><a class="manh" href="/viec/' + encodeURIComponent(v.id) + '">'
      + esc(v.tenKhach || '(chưa có tên)') + '</a>'
      + (v.soDienThoai ? '<div class="meta so">' + esc(v.soDienThoai) + '</div>' : '')
    + '</td>'
    + '<td data-nhan="Lý do">' + esc(v.lyDoChu) + '</td>'
    + '<td class="meta" data-nhan="Loại">' + esc(TEN_LOAI[v.loai] || v.loai || '') + (v.tenPage ? ' · ' + esc(v.tenPage) : '') + '</td>'
    + '<td class="meta" data-nhan="Đang xử"' + (nhan ? ' title="' + nhan + '"' : '') + '>' + (nhan || '<span class="text-disabled">chưa ai nhận</span>') + '</td>'
    + '</tr>';
}

// Bảng rỗng có HAI nghĩa khác hẳn nhau. Máy chủ gửi kèm `tt.team` khi bảng rỗng để phân biệt:
//   · team ĐÃ có page  → "không có việc nào đang chờ"  = tin mừng, sale nghỉ tay
//   · team CHƯA có page → "chưa cài đặt xong"           = phải đi gán page, không phải chờ
// Nói nhầm nghĩa thứ hai thành thứ nhất là để người ta ngồi chờ một hệ thống không bao giờ
// có việc. Đã dính thật 24/08.
let _tt = null;

function khoiRong() {
  if (LOC && _ds.length) return emptyState({ icon: 'circle-check', title: 'Không có việc loại này',
    body: 'Còn ' + formatNumber(_ds.length) + ' việc loại khác ở tab «Tất cả».' });
  if (_tt && _tt.team && !_tt.team.daGanPage) {
    return emptyState({ icon: 'triangle-alert', title: 'Team này chưa được gán page nào',
      body: 'Gán page cho team xong thì việc mới chảy về đây.',
      actionsHtml: button('Mở Người và team', { href: '/cau-hinh-team', size: 'sm' }) });
  }
  return emptyState({ icon: 'circle-check', title: 'Không có việc nào đang chờ',
    body: 'Việc bot không xử được sẽ hiện ở đây, gấp nhất lên đầu.' });
}

let _ds = [];
let LOC = '';

function veBang() {
  const el = $('#tb');
  const ds = LOC ? _ds.filter((v) => v.loai === LOC) : _ds;
  if (!ds.length) {
    el.innerHTML = '<tr><td colspan="5">' + khoiRong() + '</td></tr>';
    return;
  }
  el.innerHTML = ds.map(dongViec).join('');
}

document.querySelectorAll('[data-loc]').forEach((b) => b.addEventListener('click', () => {
  LOC = b.dataset.loc;
  document.querySelectorAll('[data-loc]').forEach((x) => x.setAttribute('aria-selected', String(x === b)));
  veBang();
}));

// Tóm tắt nằm DƯỚI TIÊU ĐỀ, không trong một hộp đỏ: số việc, số quá hạn chưa ai nhận (con
// số của MÁY CHỦ — `quaHanTong`, cùng công thức với tiêu chí L4), và lúc làm mới.
function veTomTat(tt) {
  _tt = tt;
  const phan = [formatNumber(_ds.length) + ' việc'];
  if (tt && tt.quaHanTong) phan.push(formatNumber(tt.quaHanTong) + ' quá 10 phút chưa ai nhận');
  phan.push('làm mới ' + new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
  $('#tom').textContent = phan.join(' · ');
  $('#tom').dataset.tone = tt && tt.quaHanTong ? 'danger' : '';
  const cu = tt && tt.cuNhat;
  $('#dau-phai').innerHTML = cu && tt.quaHanTong
    ? button('Mở việc cũ nhất · quá ' + formatNumber(cu.phutQuaHan) + ' phút', { href: '/viec/' + encodeURIComponent(cu.id), size: 'sm', variant: 'primary' })
    : '';
}

// Hộp cảnh báo CHỈ còn cho cảnh «chưa cài đặt xong» — đó là việc phải làm khác, không phải
// một con số của hàng đợi.
function veBaoDong(tt) {
  const el = $('#bao-dong');
  if (tt && tt.team && !tt.team.daGanPage) {
    el.innerHTML = '<div class="duoi-4">' + canhBao({ level: 'warning',
      title: 'Team này chưa được gán page nào',
      body: 'Bảng dưới rỗng vì chưa có dữ liệu, không phải vì đã xử hết việc.',
      actionsHtml: button('Gán page cho team', { href: '/cau-hinh-team', size: 'sm' }) }) + '</div>';
    return;
  }
  el.innerHTML = '';
}

function veLoi(chu, dangNhapLai) {
  $('#bao-dong').innerHTML = '<div class="duoi-5">' + canhBao({ level: 'warning', title: chu,
    body: dangNhapLai ? 'Đăng nhập lại rồi mở lại màn này.' : 'Sẽ thử lại sau 15 giây.',
    actionsHtml: dangNhapLai ? button('Đăng nhập lại', { href: '/dang-nhap', size: 'sm', variant: 'primary' }) : '' }) + '</div>';
}

async function doc(duong) {
  const r = await fetch(duong, { headers: { accept: 'application/json' } });
  if (r.status === 401) { const e = new Error('het_phien'); e.ma = 'het_phien'; throw e; }
  const j = await r.json().catch(() => null);
  if (!r.ok || !j || j.ok !== true) {
    const e = new Error((j && j.thongDiep) || ('Máy chủ trả ' + r.status));
    e.ma = j && j.ma; throw e;
  }
  return j;
}

let dangTai = false;
async function tai() {
  if (dangTai) return;
  dangTai = true;
  try {
    const [tt, hc] = await Promise.all([
      doc('/api/dieu-phoi/tom-tat'),
      doc('/api/dieu-phoi/hang-cho'),
    ]);
    if (Number.isFinite(hc.bay)) lech = hc.bay - Date.now();
    // Gộp hai loại thành MỘT hàng đợi, xếp theo hạn. Máy chủ đã xếp từng loại theo `han_luc`
    // (luật 2 của kho-viec.js); ở đây chỉ trộn hai dãy đã xếp — không có công thức thứ hai.
    const han = (v) => { const h = Number(v.han_luc); return Number.isFinite(h) ? h : Infinity; };
    _ds = [...(hc.hoiThoai || []).map((v) => ({ loai: 'hoi_thoai', ...v })),
           ...(hc.don || []).map((v) => ({ loai: 'don_hang', ...v }))].sort((a, b) => han(a) - han(b));
    veBaoDong(tt);
    veTomTat(tt);
    veBang();
    $('#n-tat').textContent = formatNumber(_ds.length);
    $('#n-ht').textContent = formatNumber((hc.hoiThoai || []).length);
    $('#n-don').textContent = formatNumber((hc.don || []).length);
    nhipDongHo();
  } catch (e) {
    if (e && e.ma === 'het_phien') veLoi('Phiên đăng nhập đã hết', true);
    else veLoi('Không tải được danh sách việc: ' + (e && e.message ? e.message : 'lỗi mạng'));
    $('#tom').textContent = 'Lỗi lúc ' + new Date().toLocaleTimeString('vi-VN');
  } finally { dangTai = false; }
}

/* ═══════════ XEM NHANH — ngăn kéo phải ══════════════════════════════════════════════
 * Bấm một dòng thì mở ngăn kéo với hồ sơ khách, KHÔNG rời trang. Trang chi tiết vẫn là nơi
 * đóng việc đầy đủ — nút «Mở việc đầy đủ» đi sang đó, và thẻ <a> ở cột tên vẫn mở tab mới
 * bằng chuột giữa như cũ. `<dialog>` gốc: bẫy lấy nét và phím Esc có sẵn, trả lấy nét về
 * dòng vừa bấm khi đóng.
 *
 * Ngăn kéo CHỈ ĐỌC, trừ khối «Đánh dấu đã xử» dùng chung — mọi lệnh ghi nằm trọn trong
 * `dong-viec-ui.js`, một bản cho cả hai trang.
 */
let xemId = null;
const ngan = $('#ngan');
$('#ngan-dong').innerHTML = window.UI.icon ? window.UI.icon('x') : '×';
$('#ngan-dong').addEventListener('click', () => ngan.close());
ngan.addEventListener('click', (e) => { if (e.target === ngan) ngan.close(); });

function veXemRong(chu) {
  $('#o-xem').innerHTML = '<p class="text-muted">' + esc(chu) + '</p>';
}

function veHoSo(h) {
  if (!h) return '';
  if (!h.co) return '<p class="text-muted text-sm">' + esc(h.viSao || 'Không có hồ sơ khách') + '</p>';
  const maTang = { chan: 'blocked', nhac: 'needs_attention', san: 'ready' }[h.tangHoan.muc] || 'unknown';
  const hg = (nh, gt) => (gt ? '<div class="hang"><span class="text-muted text-sm hep-nhan">' + nh + '</span><span>' + esc(gt) + '</span></div>' : '');
  return '<div class="hang duoi-2"><span class="text-muted text-sm hep-nhan">Rủi ro hoàn</span>'
      + statusBadge(maTang, { label: h.tangHoan.chu }) + '</div>'
    + hg('Tên', h.ten)
    + hg('Số điện thoại', h.soDienThoai || '(khách chưa đưa số)')
    + hg('Địa chỉ', h.diaChi)
    + hg('Tổng số đơn', String(h.soDon));
}

async function moXem(id) {
  xemId = id;
  $('#ngan-phu').textContent = '';
  veXemRong('Đang đọc…');
  if (!ngan.open) ngan.showModal();
  let d;
  try {
    d = await doc('/api/dieu-phoi/viec/' + encodeURIComponent(id));
  } catch (e) {
    if (xemId !== id) return;                 // người dùng đã bấm dòng khác
    veXemRong('Không đọc được việc này: ' + (e && e.message ? e.message : 'lỗi mạng'));
    return;
  }
  if (xemId !== id) return;
  const v = (d && d.viec) || {};
  const lk = (d && d.lienKet) || {};
  $('#ngan-tieu').textContent = v.tenKhach || '(chưa có tên)';
  $('#ngan-phu').textContent = [v.tenPage, (d && d.lyDoChu)].filter(Boolean).join(' · ');
  $('#o-xem').innerHTML = '<div class="stack">'
    + '<div>' + veHoSo(d && d.hoSoKhach) + '</div>'
    + '<div class="hang">'
      + (lk.pancake
          ? '<a class="btn" data-variant="primary" data-size="sm" target="_blank" rel="noopener" href="' + esc(lk.pancake) + '"><span>Mở Pancake</span></a>'
          : '<span class="btn" data-variant="outline" data-size="sm" aria-disabled="true" title="Việc này không gắn hội thoại nào"><span>Mở Pancake</span></span>')
      + '<a class="btn" data-variant="outline" data-size="sm" href="/viec/' + encodeURIComponent(id) + '"><span>Mở việc đầy đủ</span></a>'
    + '</div>'
    // Ô cho khối «Đánh dấu đã xử». CÙNG một bản với trang chi tiết (`trang/dong-viec-ui.js`)
    // — không chép, vì hai chỗ cùng ghi một dòng việc thì cái thứ hai bao giờ cũng là cái
    // ghi theo luật cũ.
    + '<div id="o-dong-viec"></div></div>';

  if (window.DongViecUI) {
    // Ghi xong thì tải lại CẢ danh sách (số đếm và thứ tự đổi theo) rồi mở lại chính việc
    // này — để người dùng thấy trạng thái vừa ghi, không phải tự đoán.
    window.DongViecUI.gan(d, { sauKhiGhi: async () => { await tai(); await moXem(id); } });
  } else {
    $('#o-dong-viec').innerHTML = canhBao({ level: 'warning', title: 'Không tải được khối đánh dấu đã xử',
      body: 'Tải lại trang, hoặc bấm «Mở việc đầy đủ».' });
  }
}

// Bấm bất cứ đâu trên dòng là mở ngăn kéo. Bấm đúng cái tên thì để thẻ <a> tự đi sang trang
// chi tiết — giữ được mở tab mới bằng chuột giữa.
document.addEventListener('click', (ev) => {
  if (ev.target.closest('a') || ev.target.closest('dialog')) return;
  const tr = ev.target.closest('tr[data-id]');
  if (tr) moXem(tr.getAttribute('data-id'));
});

setInterval(nhipDongHo, 1000);
setInterval(tai, CHU_KY_TAI_MS);
tai();
</script>
<script src="/dieu-phoi/dong-viec-ui.js"></script>
<script src="/chung/dieu-huong.js"></script>
</body>
</html>
