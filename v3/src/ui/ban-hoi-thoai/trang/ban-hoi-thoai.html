<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hộp thư — AI Closer</title>
<!-- BÀN HỘI THOẠI (UI-HT2 · CR-28-09, `01-QUYET-DINH.md` §10). Ba cột: danh sách hội thoại ·
     khung chat đọc THẲNG Pancake · bối cảnh khách. CHỈ ĐỌC — không ô soạn tin, không nút gửi:
     sale trả lời ở Pancake; ở đây chỉ nhận việc, trả lại bot, đánh dấu đã xử (khối dùng chung
     `dong-viec-ui.js` của điều phối — một bản cho mọi trang ghi việc). KHÔNG CSS riêng.
     LL2 · 29/09 (CR-28-09c, §10 bổ sung): thành HỘP THƯ — thêm tab Đơn chờ, duyệt đơn
     Messenger cạnh chat, nhận thay bot; gõ số điện thoại vào ô tìm thì hiện cả hồ sơ khách mọi kênh.
     Trang VẪN chỉ đọc: mọi lời gọi ghi nằm ở `/hop-thu/hop-thu-ui.js`. -->
<link rel="stylesheet" href="/chung/kieu.css" data-ds="v3">
<script src="/chung/ui.js"></script>
</head>
<body>
<header>
  <h1>Hộp thư</h1>
  <span class="sub" id="tom">đang tải…</span>
</header>

<main>
  <div class="ban-ht" id="ban">
    <section class="ban-ht-ds" aria-label="Danh sách hội thoại">
      <div class="tabs" role="tablist" aria-label="Lọc hội thoại">
        <button type="button" class="tab" role="tab" aria-selected="true" data-loc="nguoi">Cần người<span class="count" id="n-nguoi">0</span></button>
        <button type="button" class="tab" role="tab" aria-selected="false" data-loc="bot">Bot đang xử<span class="count" id="n-bot"></span></button>
        <button type="button" class="tab" role="tab" aria-selected="false" data-loc="tat">Tất cả<span class="count" id="n-tat"></span></button>
        <button type="button" class="tab" role="tab" aria-selected="false" data-loc="don">Đơn chờ<span class="count" id="n-don"></span></button>
      </div>
      <form class="ban-ht-tim" id="f-tim" role="search">
        <label class="sr-only" for="tim">Tìm theo số điện thoại (mọi kênh) hoặc mã khách</label>
        <input type="search" id="tim" placeholder="Số điện thoại (mọi kênh) hoặc mã khách…" autocomplete="off" spellcheck="false">
      </form>
      <div class="ban-ht-ghi" id="ghi-ds"></div>
      <div id="khach-tim"></div>
      <ul id="ds" role="listbox" aria-label="Hội thoại"></ul>
      <div id="khac" hidden></div>
    </section>

    <section class="ban-ht-chat" aria-label="Hội thoại đang mở">
      <div class="chat-dau">
        <button type="button" class="btn lui" id="lui" data-size="sm" aria-label="Về danh sách">←</button>
        <div class="gian"><h2 id="c-ten">Chọn một hội thoại</h2><div class="phu" id="c-phu"></div></div>
        <span class="dong-ho" id="c-dem"></span>
      </div>
      <div class="chat-than" id="chat" aria-live="polite"></div>
      <div class="chat-chan" id="chan"></div>
    </section>

    <aside class="ban-ht-bc" aria-label="Bối cảnh khách" id="bc"></aside>
  </div>
</main>

<script>
const { esc, button, alert: canhBao, emptyState, statusBadge, formatNumber: so } = window.UI;
const $ = (s) => document.querySelector(s);

const GIAI_DOAN = { GREET: 'Chào', QUALIFY: 'Tìm hiểu nhu cầu', SELLING: 'Tư vấn', CLOSING: 'Chốt đơn',
  HANDOFF: 'Chờ người', POST_SALE: 'Sau bán' };
const NGUOI_GIU = { AI: 'Bot AI', SALE: 'Sale', BOTCAKE: 'Botcake' };
/* Nguồn tin page (UI-HT3) — CHỈ theo điều đo được; «Page» = sale gõ tay HOẶC bot ngoài dữ liệu đối chiếu. */
const NGUON_TIN = { ai: 'Bot AI', tu_dong: 'Tự động', page: 'Page' };
const tenHien = (h) => h.tenKhach || h.tenMessenger || h.soDienThoai || 'Khách chưa có tên';
const CHU_KY_TAI_MS = 15000;

let LOC = 'nguoi', TIM = '', DS = [], MO = null, lech = 0;
/* Tab KHÔNG phải lát hội thoại (LL2): vẽ bằng khối Hộp thư, không gọi `/api/ban-hoi-thoai`. */
const TAB_KHAC = new Set(['don']);
const gio = () => Date.now() + lech;

/* Đồng hồ — cùng cách đọc với bảng điều phối: quá hạn hiện «+3:20», sắp hết (≤5 phút) màu cam. */
function chuoiDem(han) {
  if (!Number.isFinite(han)) return '';
  const con = han - gio(); const giay = Math.floor(Math.abs(con) / 1000);
  return (con < 0 ? '+' : '') + Math.floor(giay / 60) + ':' + String(giay % 60).padStart(2, '0');
}
function tonDem(han) {
  if (!Number.isFinite(han)) return '';
  const con = han - gio(); return con < 0 ? 'danger' : con <= 5 * 60 * 1000 ? 'warning' : '';
}
function nhipDongHo() {
  for (const el of document.querySelectorAll('[data-han]')) {
    const han = Number(el.dataset.han); el.textContent = chuoiDem(han); el.dataset.tone = tonDem(han);
  }
}
const lucNgan = (ms) => {
  if (!Number.isFinite(ms)) return '';
  const d = new Date(ms), nay = new Date(gio());
  return d.toDateString() === nay.toDateString()
    ? d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })
    : d.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit' });
};

async function doc(duong) {
  const r = await fetch(duong, { headers: { accept: 'application/json' } });
  if (r.status === 401) { location.href = '/dang-nhap?tiep=' + encodeURIComponent(location.pathname); throw new Error('hết phiên'); }
  const j = await r.json().catch(() => null);
  if (!r.ok || !j || j.ok !== true) throw new Error((j && j.thongDiep) || ('Máy chủ trả ' + r.status));
  return j;
}

/* ═══ cột trái ═══ */
function dongHt(h) {
  const v = h.viec;
  const luc = v ? `<span class="ht-luc" data-han="${v.hanLuc}" data-tone="${tonDem(v.hanLuc)}">${chuoiDem(v.hanLuc)}</span>`
                : `<span class="ht-luc">${lucNgan(h.chamLuc)}</span>`;
  const trangThai = v ? statusBadge(v.trangThai === 'dang_xu' ? 'owner_sale' : 'owner_waiting',
                          { label: v.trangThai === 'dang_xu' ? `${v.tenNguoiNhan || 'Sale'} đang xử` : 'Chờ người' })
                      : statusBadge(h.nguoiGiu === 'AI' ? 'owner_ai' : 'owner_paused', { label: NGUOI_GIU[h.nguoiGiu] || h.nguoiGiu || '—' });
  const phu = v ? v.lyDoChu : (h.aiNoiGi ? 'Bot: ' + h.aiNoiGi : (GIAI_DOAN[h.giaiDoan] || ''));
  return `<li class="ht-dong" role="option" tabindex="0" data-id="${esc(h.id)}" aria-selected="${h.id === MO}">
    <span class="ht-ten">${esc(tenHien(h))}</span>${luc}
    <span class="ht-phu">${esc(phu || '')}</span>
    <span class="ht-meta">${trangThai}<span>${esc(h.tenPage || '')}</span></span>
  </li>`;
}

function khoiRongDs(d) {
  if (d.tim) return emptyState({ icon: 'search', title: 'Không tìm thấy hội thoại',
    body: 'Tìm theo đúng số điện thoại khách đã để lại, hoặc mã khách (psid) của Messenger.' });
  if (LOC === 'nguoi') return emptyState({ icon: 'circle-check', title: 'Không có hội thoại nào cần người',
    body: 'Hội thoại bot đẩy sang người sẽ hiện ở đây, gấp nhất lên đầu.' });
  return emptyState({ icon: 'inbox', title: `Không có hội thoại nào trong ${d.cuaSoNgay} ngày qua`,
    body: 'Bot chưa trả lời khách nào gần đây. Tìm theo số điện thoại hoặc mã khách để mở hội thoại cũ.' });
}

async function taiDs() {
  let d;
  try {
    d = await doc('/api/ban-hoi-thoai?loc=' + encodeURIComponent(LOC) + (TIM ? '&tim=' + encodeURIComponent(TIM) : ''));
  } catch (e) {
    $('#ds').innerHTML = `<li>${canhBao({ level: 'warning', title: 'Không tải được danh sách', body: e.message })}</li>`;
    return;
  }
  if (Number.isFinite(d.bay)) lech = d.bay - Date.now();
  DS = d.items || [];
  $('#n-nguoi').textContent = so(d.demCanNguoi);
  if (LOC !== 'nguoi' && !d.tim) $('#n-' + LOC).textContent = so(DS.length) + (d.catBot ? '+' : '');
  $('#tom').textContent = d.demCanNguoi
    ? `${so(d.demCanNguoi)} hội thoại cần người · trả lời ở Pancake`
    : 'Không hội thoại nào cần người · trả lời ở Pancake';
  const ghi = [];
  if (d.donKhongHoiThoai) ghi.push(`${so(d.donKhongHoiThoai)} đơn không gắn hội thoại — xem ở tab «Đơn chờ».`);
  if (d.catBot) ghi.push(`Chỉ hiện ${so(DS.length)} hội thoại mới nhất.`);
  $('#ghi-ds').innerHTML = ghi.join(' ');
  $('#ds').innerHTML = DS.length ? DS.map(dongHt).join('') : `<li>${khoiRongDs(d)}</li>`;
}

/* ═══ cột giữa + phải ═══ */
function veChat(ht, kq) {
  const chat = $('#chat');
  if (kq.lichSuLoi) {
    chat.innerHTML = canhBao({ level: 'warning', title: 'Chưa đọc được hội thoại từ Pancake', body: kq.lichSuLoi });
    return;
  }
  if (!kq.lichSu.length) { chat.innerHTML = emptyState({ icon: 'inbox', title: 'Pancake chưa có tin nào trong hội thoại này' }); return; }
  let ngay = '';
  chat.innerHTML = kq.lichSu.map((t) => {
    const ms = t.luc ? Date.parse(/[zZ]|[+-]\d\d:?\d\d$/.test(t.luc) ? t.luc : t.luc + 'Z') : NaN;
    const n = Number.isFinite(ms) ? new Date(ms).toLocaleDateString('vi-VN') : '';
    const moc = n && n !== ngay ? `<div class="nhan-hoa" role="separator">${esc(n)}</div>` : '';
    ngay = n || ngay;
    const nguon = t.laPage ? (NGUON_TIN[t.nguon] ? t.nguon : 'page') : '';
    return moc + `<div class="tin" data-ben="${t.laPage ? 'page' : 'khach'}"${nguon ? ` data-nguon="${nguon}"` : ''}><div class="tin-bong">${esc(t.text || '(tin không có chữ — ảnh hoặc tệp)')}</div>`
      + `<span class="tin-luc">${nguon ? `<span class="tin-nguon">${NGUON_TIN[nguon]}</span> · ` : ''}${Number.isFinite(ms) ? new Date(ms).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) : ''}</span></div>`;
  }).join('');
  chat.scrollTop = chat.scrollHeight;
}

const lucDay = (ms) => {
  if (!Number.isFinite(ms)) return '';
  const d = new Date(ms);
  const hai = (n) => String(n).padStart(2, '0');   // «22/09 15:01» — ICU của trình duyệt in «22-09»
  return `${hai(d.getDate())}/${hai(d.getMonth() + 1)} ${hai(d.getHours())}:${hai(d.getMinutes())}`;
};
const tien = (so_, te) => (Number.isFinite(so_) ? so(so_) + (te ? ' ' + te : '') : '');

/* Cột bối cảnh. `ht` = dòng danh sách (vẽ NGAY khi bấm) · `x` = `/boi-canh` (vẽ lại khi về; lỗi thì
   giữ phần đã có và nói ra). Khối nào không có dữ liệu thì ẩn hẳn, trừ khi «không có» là thông tin. */
function veBoiCanh(ht, x) {
  const dong = (nh, gt, tho) => (gt ? `<dt>${nh}</dt><dd>${tho ? gt : esc(gt)}</dd>` : '');
  const khoi = (tieuDe, than) => (than ? `<div class="bc-khoi"><h3 class="nhan-hoa">${tieuDe}</h3>${than}</div>` : '');
  const dl = (than) => (than ? `<dl class="bc-dl">${than}</dl>` : '');
  const cam = (chu) => `<p class="bc-cam">${esc(chu)}</p>`;
  const v = ht.viec;
  const h = x && !x.loi ? x : ht;
  const k = x && x.khach;

  let khach;
  if (k && k.co) {
    const hoan = window.DongViecUI ? window.DongViecUI.huyHieuHoan(k.tangHoan) : esc(k.tangHoan.chu);
    khach = dl(dong('Tên', k.ten || ht.tenMessenger || 'Chưa có tên') + dong('Điện thoại', k.soDienThoai || 'Chưa để lại')
      + dong('Địa chỉ', k.diaChi) + dong('Rủi ro hoàn', hoan + (k.tiLeHoan == null ? '' : ` <span class="text-muted">${esc(so(k.tiLeHoan))}%</span>`), true)
      + dong('Số đơn', so(k.soDon)) + dong('Page', h.tenPage));
  } else {
    const tenMs = (x && x.tenMessenger) || ht.tenMessenger;
    khach = dl(dong('Messenger', tenMs) + dong('Điện thoại', ht.soDienThoai) + dong('Page', h.tenPage))
      + cam(k ? k.viSao : 'Đang tải hồ sơ khách…');
  }

  const d = x && x.donDangBan;
  const don = d ? dl(dong('Mã POS', d.maPos || 'Chưa có mã') + dong('Trạng thái', d.trangThai) + dong('Trên POS', d.trangThaiPos)
    + dong('Tổng tiền', tien(d.tongTien, d.tienTe)) + dong('Tạo lúc', lucDay(d.taoLuc))) : '';

  const hoiThoai = dl(dong('Giai đoạn', GIAI_DOAN[h.giaiDoan] || h.giaiDoan) + dong('Người giữ', NGUOI_GIU[h.nguoiGiu] || h.nguoiGiu)
    + dong('Lý do cuối', h.lyDoCuoi) + dong('Bot nói gần nhất', h.aiNoiGi));

  let bot = '';
  if (x && !x.loi) {
    const kb = x.kichBan || {};
    const s = x.soAi || {};
    const cu = x.botCu;
    bot = dl(dong('Kịch bản', kb.co
        ? ['bản ' + (kb.phienBan ?? '?'), kb.tuDau, kb.suaLuc ? 'sửa ' + lucDay(kb.suaLuc) + (kb.nguoiSua ? ' bởi ' + kb.nguoiSua : '') : ''].filter(Boolean).join(' · ')
        : kb.viSao)
      + dong('Bot v3', s.co
        ? [so(s.soLuot) + ' lượt trả lời', s.model, s.tienVnd == null ? '' : tien(Math.round(s.tienVnd), 'đ') + (s.soDongCoTien < s.soGoiModel ? ` (${so(s.soDongCoTien)}/${so(s.soGoiModel)} lượt có giá)` : '')].filter(Boolean).join(' · ')
        : s.viSao)
      + dong('Bot cũ', cu && cu.soLuot ? so(cu.soLuot) + ' lượt trả lời' + (cu.cuoiLuc ? ' · lần cuối ' + lucDay(cu.cuoiLuc) : '') + ' · theo Sổ AI bot cũ' : ''));
  }

  const dc = x && x.donChoDuyet;
  const donCho = dc ? dl(dong('Khách', dc.ten) + dong('Điện thoại', dc.soDienThoai) + dong('Số lượng', dc.soLuong == null ? '' : so(dc.soLuong) + ' gói')
      + dong('Tổng tiền', tien(dc.tongTien, dc.tienTe)) + dong('Bot chốt', lucDay(dc.taoLuc)))
    + (dc.soDon > 1 ? cam(`Còn ${so(dc.soDon)} đơn chờ trong hội thoại này — đang mở đơn mới nhất.`) : '')
    + '<div class="form-actions"><button type="button" class="btn" data-variant="primary" data-size="sm" id="mo-don">Xem · sửa · duyệt</button></div>'
    + '<div id="o-don"></div>' : '';

  $('#bc').innerHTML = `
    <div class="dong-bc"><button type="button" class="icon-btn" id="dong-bc" aria-label="Đóng thông tin khách">×</button></div>
    ${khoi('Khách', khach)}
    ${khoi('Đơn chờ duyệt', donCho)}
    ${khoi('Đơn đang bàn', don)}
    ${khoi('Hội thoại', hoiThoai)}
    ${v ? khoi('Việc cần người', dl(dong('Lý do', v.lyDoChu) + dong('Đang xử', v.tenNguoiNhan || 'Chưa ai nhận'))) + '<div class="bc-khoi" id="o-dong-viec"></div>' : ''}
    ${khoi('Bot & kịch bản', bot)}
    ${x && x.loi ? khoi('Bối cảnh', cam('Chưa tải được bối cảnh: ' + x.loi)) : ''}`;
  $('#dong-bc').addEventListener('click', () => { delete $('#ban').dataset.bc; });
  if (dc && window.HopThu) {
    $('#mo-don').addEventListener('click', () => window.HopThu.moDon(dc.id, $('#o-don'), {
      sauKhiGhi: async () => { await taiDs(); },
    }));
  }
}

async function mo(id) {
  MO = id;
  let ht = DS.find((h) => h.id === id);
  if (!ht) {
    // LL2: mở từ tab Đơn chờ / Tìm khách — đọc đúng MỘT dòng, cùng đường đọc của danh sách.
    const d = await doc('/api/ban-hoi-thoai?ht=' + encodeURIComponent(id)).catch(() => null);
    ht = d && d.items && d.items[0];
    if (!ht || MO !== id) return;
    DS = [ht, ...DS];
  }
  document.querySelectorAll('.ht-dong').forEach((li) => li.setAttribute('aria-selected', String(li.dataset.id === id)));
  $('#ban').dataset.xem = 'chat';
  $('#c-ten').textContent = tenHien(ht);
  $('#c-phu').textContent = [ht.tenPage, ht.soDienThoai].filter(Boolean).join(' · ');
  const v = ht.viec;
  if (v) { $('#c-dem').dataset.han = v.hanLuc; } else { delete $('#c-dem').dataset.han; $('#c-dem').textContent = ''; }
  $('#chat').innerHTML = '<p class="text-muted">Đang đọc từ Pancake…</p>';
  $('#chan').innerHTML = '';
  veBoiCanh(ht);
  nhipDongHo();

  const duong = '/api/ban-hoi-thoai/' + encodeURIComponent(id);
  const pCt = v ? doc('/api/dieu-phoi/viec/' + encodeURIComponent(v.id)).catch(() => null) : Promise.resolve(null);
  // Bối cảnh KHÔNG chờ Pancake: đọc chat có thể mất vài giây, hồ sơ khách thì không.
  Promise.all([doc(duong + '/boi-canh').catch((e) => ({ loi: e.message })), pCt]).then(([x, ct]) => {
    if (MO !== id) return;
    veBoiCanh(ht, x);
    if (ct && window.DongViecUI && $('#o-dong-viec')) {
      window.DongViecUI.gan(ct, { sauKhiGhi: async () => { await taiDs(); await mo(id); } });
    }
  });
  const [kq, ct] = await Promise.all([
    doc(duong).catch((e) => ({ lichSu: [], lichSuLoi: e.message, pancake: null })),
    pCt,
  ]);
  if (MO !== id) return;
  veChat(ht, kq);
  const lk = kq.pancake || (ct && ct.lienKet && ct.lienKet.pancake);
  $('#chan').innerHTML = (lk
      ? `<a class="btn" data-variant="primary" data-size="sm" target="_blank" rel="noopener" href="${esc(lk)}"><span>Trả lời trên Pancake</span></a>`
      : `<span class="btn" data-variant="outline" data-size="sm" aria-disabled="true"><span>Trả lời trên Pancake</span></span>`)
    + (ht.nguoiGiu === 'AI' && !ht.viec && window.HopThu
      ? '<button type="button" class="btn" data-variant="outline" data-size="sm" id="nut-nhan">Nhận thay bot</button>' : '')
    + '<button type="button" class="btn nut-bc" data-variant="outline" data-size="sm" id="nut-bc">'
    + (ht.viec ? 'Khách & đóng việc' : 'Khách') + '</button>'
    + '<span class="text-muted">Trả lời ở Pancake · ở đây nhận việc, duyệt đơn, đóng việc</span>';
  $('#nut-bc').addEventListener('click', () => { $('#ban').dataset.bc = 'mo'; });
  const nutNhan = $('#nut-nhan');
  if (nutNhan) nutNhan.addEventListener('click', async () => {
    nutNhan.disabled = true;
    try {
      await window.HopThu.nhanThayBot(id);
      DS = DS.filter((h) => h.id !== id);
      await taiDs(); await mo(id);
    } catch (e) {
      nutNhan.disabled = false;
      $('#chat').insertAdjacentHTML('afterbegin', canhBao({ level: 'danger', title: 'Chưa nhận được', body: e.message }));
    }
  });
}

$('#ds').addEventListener('click', (e) => { const li = e.target.closest('.ht-dong'); if (li) mo(li.dataset.id); });
$('#ds').addEventListener('keydown', (e) => {
  const li = e.target.closest('.ht-dong'); if (li && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); mo(li.dataset.id); }
});
async function taiDonCho() {
  const n = window.HopThu ? await window.HopThu.veDonCho($('#khac'), { moHoiThoai: mo }) : null;
  if (n != null) $('#n-don').textContent = so(n);
}
document.querySelectorAll('[data-loc]').forEach((b) => b.addEventListener('click', () => {
  LOC = b.dataset.loc; TIM = ''; $('#tim').value = '';
  document.querySelectorAll('[data-loc]').forEach((x) => x.setAttribute('aria-selected', String(x === b)));
  const khac = TAB_KHAC.has(LOC);
  $('#ds').hidden = khac; $('#f-tim').hidden = khac; $('#ghi-ds').hidden = khac; $('#khach-tim').hidden = khac; $('#khac').hidden = !khac;
  $('#khach-tim').innerHTML = '';
  if (LOC === 'don') taiDonCho();
  else taiDs();
}));
$('#f-tim').addEventListener('submit', async (e) => {
  e.preventDefault(); TIM = $('#tim').value.trim();
  $('#khach-tim').innerHTML = '';
  await taiDs();
  // Số điện thoại (≥6 chữ số) ⇒ kèm hồ sơ khách mọi kênh — đơn Ladi không có hội thoại vẫn thấy.
  if (!window.HopThu || (TIM.match(/\d/g) || []).length < 6) return;
  const kh = await window.HopThu.veKhachTheoSo($('#khach-tim'), TIM, { moHoiThoai: mo });
  // Ô tìm hội thoại so số ĐÃ chuẩn hoá; người gõ «0501…» hay «+966 50…». Máy chủ vừa chuẩn hoá hộ
  // (luật cắt mã nước chỉ có MỘT bản, ở `loc-trung.js`) ⇒ tìm lại bằng đúng số đó.
  const so = kh && kh[0] && kh[0].soDienThoai;
  if (!DS.length && so && so !== TIM) { TIM = so; await taiDs(); }
});
$('#lui').addEventListener('click', () => { $('#ban').dataset.xem = 'ds'; delete $('#ban').dataset.bc; });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') delete $('#ban').dataset.bc; });

$('#chat').innerHTML = emptyState({ icon: 'inbox', title: 'Chọn một hội thoại bên trái',
  body: 'Đọc chat ngay tại đây. Trả lời thì bấm «Trả lời trên Pancake».' });
setInterval(nhipDongHo, 1000);
setInterval(() => { if (LOC === 'nguoi' && !TIM) taiDs(); }, CHU_KY_TAI_MS);
taiDs();
// `hop-thu-ui.js` nạp SAU đoạn này (cuối <body>) ⇒ đếm Đơn chờ khi mọi script đã chạy.
document.addEventListener('DOMContentLoaded', () => {
  if (window.HopThu) window.HopThu.veDonCho(document.createElement('div')).then((n) => { if (n != null) $('#n-don').textContent = so(n); });
});
</script>
