<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Người và team — AI Closer</title>
<!-- Dựng trên hệ kiểu (mục M12: cài đặt chia nhóm, thao tác nguy hiểm tách riêng và hỏi lại).
     KHÔNG CSS riêng — trước lượt này là 81 dòng. Bốn khối xếp dọc một trang dài → hàng chỉ số
     + ba tab (Thành viên · Kết nối POS · Chuyển page). Chuyển page là đổi CHỦ dữ liệu, nên nó
     ở tab riêng, có thanh chọn hàng loạt và hộp xác nhận nói hệ quả. -->
<link rel="stylesheet" href="/chung/kieu.css" data-ds="v3">
<!-- Hàm dựng thành phần (window.UI). ĐỒNG BỘ, KHÔNG `defer`: khung ứng dụng ở cuối trang
     lấy biểu tượng từ đây — `defer` chạy SAU script cuối trang, khung sẽ mất biểu tượng. -->
<script src="/chung/ui.js"></script>
</head>
<body>
<header>
  <h1>Người và team</h1>
  <span class="sub">Ai trong team mang vai gì, shop POS nào nối vào, và page nào thuộc team này.</span>
</header>

<main>
  <div id="bang-tin" aria-live="polite"></div>

  <section class="section" aria-label="Tổng quan team">
    <div id="soDo"><div class="metric-row"><div class="metric"><span class="skeleton"></span></div></div></div>
  </section>

  <section class="section">
    <div class="tabs duoi-4" role="tablist" aria-label="Phần cấu hình">
      <button type="button" class="tab" role="tab" id="tab-tv" aria-controls="p-tv" data-tab="tv">Thành viên</button>
      <button type="button" class="tab" role="tab" id="tab-pos" aria-controls="p-pos" data-tab="pos">Kết nối POS</button>
      <button type="button" class="tab" role="tab" id="tab-gan" aria-controls="p-gan" data-tab="gan">Chuyển page sang team khác</button>
    </div>

    <div role="tabpanel" id="p-tv" aria-labelledby="tab-tv">
      <div class="table-wrap">
        <div class="table-toolbar"><h2>Thành viên và vai</h2><span class="table-count" id="demTv"></span></div>
        <div id="khoiThanhVien"><div class="empty-state"><span class="skeleton"></span></div></div>
        <div class="table-footer" id="themThanhVien" hidden>
          <label for="chonNguoi" class="sr-only">Chọn người</label>
          <select id="chonNguoi"></select>
          <label for="chonVai" class="sr-only">Chọn vai</label>
          <select id="chonVai"></select>
          <button type="button" class="btn" data-variant="primary" data-size="md" id="nutThem"><span>Cấp vai</span></button>
          <span class="text-muted">Một người mang được nhiều vai trong cùng một team.</span>
        </div>
      </div>
    </div>

    <div role="tabpanel" id="p-pos" aria-labelledby="tab-pos" hidden>
      <div class="table-wrap">
        <div class="table-toolbar"><h2>Kết nối POS</h2><span class="table-count">Khoá API không bao giờ hiện ở đây</span></div>
        <div id="khoiKetNoi"><div class="empty-state"><span class="skeleton"></span></div></div>
      </div>
    </div>

    <div role="tabpanel" id="p-gan" aria-labelledby="tab-gan" hidden>
      <div id="khoiGanPage"><div class="empty-state"><span class="skeleton"></span></div></div>
    </div>
  </section>
</main>

<script>
const { esc, text, icon, statusBadge, button, setBusy, alert: canhBao, emptyState, metricRow, toast,
        confirmDialog, formatNumber: so } = window.UI;
const $ = (s) => document.querySelector(s);

async function goi(duong, tuyChon) {
  const r = await fetch(duong, { headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' }, ...tuyChon });
  if (r.status === 401) { location.href = '/dang-nhap?tiep=' + encodeURIComponent(location.pathname); return null; }
  let d = null;
  try { d = await r.json(); } catch { /* để nguyên null */ }
  if (!r.ok || !d || d.ok === false) throw new Error((d && d.thongDiep) || `Máy chủ trả ${r.status}.`);
  return d;
}

// ── BĂNG TIN — cảnh báo của team + lỗi của từng khối, khối nào hỏng nói khối đó ────────
let CANH = [], LOI = {};
function veBangTin() {
  const kh = Object.entries(LOI).map(([k, m]) => canhBao({ level: 'error', title: `Khối «${k}» không tải được`, body: m }));
  const diTiep = {
    thieu_marketer: button('Gán marketer', { href: '/page-bot', size: 'sm' }),
    chua_cau_hinh_model: button('Chọn model', { href: '/model-ai', size: 'sm' }),
    bot_bat_ma_khong_model: button('Chọn model', { href: '/model-ai', size: 'sm' }),
  };
  for (const c of CANH) {
    kh.push(canhBao({ level: c.muc === 'do' ? 'error' : 'warning', body: c.chu, actionsHtml: diTiep[c.ma] || '' }));
  }
  $('#bang-tin').innerHTML = kh.length ? `<div class="duoi-5">${kh.join('')}</div>` : '';
}
function baoLoi(khoi, m) { LOI[khoi] = m; veBangTin(); }
function xoaLoi(khoi) { delete LOI[khoi]; veBangTin(); }

// ── TAB — nhớ trong URL (#thanh-vien…) để F5 không nhảy về tab đầu ───────────────────
const TEN_TAB = { tv: 'thanh-vien', pos: 'ket-noi-pos', gan: 'chuyen-page' };
function moTab(ma) {
  document.querySelectorAll('[data-tab]').forEach((b) => {
    const dung = b.dataset.tab === ma;
    b.setAttribute('aria-selected', String(dung));
    b.tabIndex = dung ? 0 : -1;
    $('#' + b.getAttribute('aria-controls')).hidden = !dung;
  });
  history.replaceState(null, '', '#' + TEN_TAB[ma]);
}
document.querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', () => moTab(b.dataset.tab)));
moTab(Object.keys(TEN_TAB).find((k) => '#' + TEN_TAB[k] === location.hash) || 'tv');

/* ─── tổng quan ─── */
function veTongQuan(t) {
  const p = t.page;
  $('#soDo').innerHTML = metricRow([
    { label: 'Page thuộc team', value: p.tong, hint: `${so(p.trongDiem)} trọng điểm · ${so(t.hoiThoai)} hội thoại` },
    { label: 'Đang bật bot', value: p.botBat,
      hint: p.nguonBotBat && p.nguonBotBat.nguon === 'cot_csdl' ? 'Đếm từ bản sao trong CSDL — số thật ở màn Công tắc từng page' : '' },
    { label: 'Chưa có marketer', value: p.thieuMarketer,
      statusHtml: p.thieuMarketer ? statusBadge(p.coMarketer === 0 ? 'blocked' : 'needs_attention', { label: `${so(p.thieuMarketer)}/${so(p.tong)} page` }) : '' },
    { label: 'Model AI', value: t.model.daCauHinh ? `${so(t.model.soDong)} dòng` : '—',
      statusHtml: t.model.daCauHinh ? statusBadge('ready', { label: 'Đã cấu hình' }) : statusBadge('blocked', { label: 'Chưa cấu hình' }) },
  ]);
  CANH = t.canhBao || [];
  veBangTin();
}

/* ─── thành viên ─── */
let VAI_HIEN = [], TV = [];
function veThanhVien(d) {
  VAI_HIEN = d.vai || []; TV = d.thanhVien || [];
  $('#demTv').textContent = d.suaDuoc ? `${so(TV.length)} người` : `${so(TV.length)} người · vai của bạn chỉ xem được`;

  if (d.trong) {
    $('#khoiThanhVien').innerHTML = emptyState({ icon: 'inbox', title: d.trong.noi,
      actionsHtml: d.trong.diTiep && d.trong.diTiep.duong ? button(d.trong.diTiep.chu, { href: d.trong.diTiep.duong, size: 'sm' }) : '' });
  } else {
    $('#khoiThanhVien').innerHTML = `<table class="data-table"><thead><tr>
        <th scope="col">Người</th><th scope="col">Vai trong team</th><th scope="col">Tài khoản</th>
      </tr></thead><tbody>${TV.map((n) => `
      <tr>
        <td><div class="manh">${esc(n.ten || n.email)}</div>${n.ten ? `<div class="meta">${esc(n.email)}</div>` : ''}</td>
        <td><div class="chip-list">${n.vai.length ? n.vai.map((v) => `<span class="chip">${esc(v.ten)}${d.suaDuoc
          ? `<button type="button" data-rut="${esc(n.nguoiDungId)}" data-vai="${esc(v.ma)}" aria-label="Rút vai ${esc(v.ten)} của ${esc(n.email)}" title="Rút vai ${esc(v.ten)}">${icon('x')}</button>` : ''}</span>`).join('')
          : '<span class="text-muted">Không có vai</span>'}</div></td>
        <td>${statusBadge(n.hoatDong ? 'feature_on' : 'blocked', { label: n.hoatDong ? 'Hoạt động' : 'Đã khoá' })}</td>
      </tr>`).join('')}</tbody></table>`;
  }

  $('#themThanhVien').hidden = !d.suaDuoc;
  if (d.suaDuoc) {
    const chon = d.nguoiChonDuoc || [];
    $('#chonNguoi').innerHTML = chon.length
      ? chon.map((n) => `<option value="${esc(n.nguoiDungId)}">${esc(n.email)}${n.daO ? ' (đã ở team)' : ''}</option>`).join('')
      : '<option value="">Không có tài khoản nào</option>';
    $('#chonVai').innerHTML = VAI_HIEN.map((v) => `<option value="${esc(v.ma)}">${esc(v.ten)}</option>`).join('');
    $('#nutThem').disabled = !chon.length;
  }
  document.querySelectorAll('[data-rut]').forEach((b) => b.addEventListener('click', () => rut(b.dataset.rut, b.dataset.vai)));
}

async function rut(nguoiDungId, maVai) {
  const ten = (VAI_HIEN.find((v) => v.ma === maVai) || {}).ten || maVai;
  const nguoi = (TV.find((n) => n.nguoiDungId === nguoiDungId) || {}).email || 'người này';
  const dongY = await confirmDialog({
    title: `Rút vai «${ten}» của ${nguoi}?`,
    body: 'Người này mất ngay quyền của vai đó trong team. Các vai khác của họ giữ nguyên. Lượt rút được ghi nhật ký.',
    confirmLabel: 'Rút vai', danger: true,
  });
  if (!dongY) return;
  try {
    await goi('/api/team/thanh-vien', { method: 'DELETE', body: JSON.stringify({ nguoiDungId, maVai }) });
    xoaLoi('thành viên');
    toast(`Đã rút vai «${ten}» của ${nguoi}.`);
    await napThanhVien(); await napTongQuan();
  } catch (e) { baoLoi('thành viên', e.message); }
}

$('#nutThem').addEventListener('click', async () => {
  const nguoiDungId = $('#chonNguoi').value;
  const maVai = $('#chonVai').value;
  if (!nguoiDungId) return;
  const nut = $('#nutThem');
  setBusy(nut, true);
  try {
    const kq = await goi('/api/team/thanh-vien', { method: 'POST', body: JSON.stringify({ nguoiDungId, maVai }) });
    xoaLoi('thành viên');
    toast(kq.daCo ? 'Người này đã có sẵn vai đó — không thêm gì.' : 'Đã cấp vai.');
    await napThanhVien(); await napTongQuan();
  } catch (e) { baoLoi('thành viên', e.message); }
  finally { setBusy(nut, false); }
});

/* ─── kết nối POS ─── */
function veKetNoi(d) {
  if (d.trong) {
    $('#khoiKetNoi').innerHTML = emptyState({ icon: 'inbox', title: d.trong.noi,
      actionsHtml: d.trong.diTiep && d.trong.diTiep.duong ? button(d.trong.diTiep.chu, { href: d.trong.diTiep.duong, size: 'sm' }) : '' });
    return;
  }
  $('#khoiKetNoi').innerHTML = `<table class="data-table"><thead><tr>
      <th scope="col">Thị trường</th><th scope="col">Shop POS</th><th scope="col">Trạng thái</th>
    </tr></thead><tbody>${d.pos.map((k) => `
    <tr><td class="manh">${esc(k.market)}</td>
      <td><code>${esc(k.shopId)}</code></td>
      <td>${statusBadge(k.bat ? 'feature_on' : 'feature_off', { label: k.bat ? 'Đang bật' : 'Đã tắt' })}</td>
    </tr>`).join('')}</tbody></table>`;
}

/* ─── chuyển page ↔ team ─── */
let TIM_PAGE = '', G = null;

function veGanPage(d) {
  G = d;
  const g = d.ganPage;
  if (!g.moDuoc) {
    // Chưa nối dây thì hiện kèm lý do — không giấu đi, để người ta biết đang đợi gì (mục O).
    $('#khoiGanPage').innerHTML = `<div class="panel"><div class="feature-row" data-state="off">
      <div><div class="feature-name">Chuyển page sang team khác</div>
        <div class="feature-desc">Team này đang có ${so(g.soPageTeamNay)} page. ${text(g.ghiChu || '')}</div>
        ${g.lyDo ? `<div class="feature-reason">${text(g.lyDo)}</div>` : ''}</div>
      ${statusBadge('feature_unavailable')}</div></div>`;
    return;
  }
  if (!d.teamDich.length) {
    $('#khoiGanPage').innerHTML = `<div class="panel">${emptyState({ icon: 'inbox',
      title: 'Không có team nào khác để chuyển sang', body: 'Hệ thống chỉ có một team nghiệp vụ.',
      actionsHtml: button('Xem danh sách team', { href: '/chon-team', size: 'sm' }) })}</div>`;
    return;
  }

  $('#khoiGanPage').innerHTML = `
    <div class="duoi-4">${canhBao({ level: 'warning', title: 'Chuyển page là đổi chủ dữ liệu',
      body: `Hội thoại, kịch bản và sản phẩm của page đi theo sang team mới; team này sẽ không còn thấy chúng. Tối đa ${so(d.toiDaMotMe)} page mỗi lần.` })}</div>
    <div class="table-wrap">
      <div class="table-toolbar">
        <label for="timPage" class="sr-only">Lọc page</label>
        <input id="timPage" type="search" placeholder="Tên page, id Facebook, thị trường…" value="${esc(TIM_PAGE)}" autocomplete="off">
        <span class="table-count">${d.soKhop === d.soTong ? `${so(d.soTong)} page` : `${so(d.soKhop)}/${so(d.soTong)} page khớp`}</span>
      </div>
      ${d.page.length ? `<table class="data-table"><thead><tr>
          <th scope="col" class="check"><input type="checkbox" id="chonHet" aria-label="Chọn hết ${so(d.page.length)} page đang hiện"></th>
          <th scope="col">Page</th><th scope="col">Thị trường</th><th scope="col">Bot</th>
        </tr></thead><tbody id="dsPage">${d.page.map((p) => `
        <tr>
          <td class="check"><input type="checkbox" value="${esc(p.id)}" id="cp-${esc(p.id)}"></td>
          <td><label for="cp-${esc(p.id)}"><span class="option-title">${esc(p.ten || '(chưa có tên)')}</span>
            <span class="option-meta">${esc(p.pageId)}</span></label></td>
          <td class="meta">${esc(p.thiTruong || '—')}</td>
          <td>${statusBadge(p.botAiBat ? 'bot_on' : 'bot_off')}</td>
        </tr>`).join('')}</tbody></table>`
        : emptyState({ icon: 'search', title: 'Không page nào khớp', body: 'Xoá chữ trong ô lọc để xem lại tất cả.' })}
      ${d.catBot ? `<div class="pagination"><span>Còn ${so(d.catBot)} page không hiện — gõ vào ô lọc để thu hẹp (danh sách cắt ở 200 dòng).</span></div>` : ''}
      <div class="table-footer">
        <span class="text-muted tabular" id="demChon" aria-live="polite">Chưa chọn page nào</span>
        <span class="gian"></span>
        <label for="teamDich" class="text-muted">Chuyển sang</label>
        <select id="teamDich">${d.teamDich.map((t) => `<option value="${esc(t.teamId)}">${esc(t.ten)}</option>`).join('')}</select>
        ${button('Chuyển page đã chọn', { variant: 'danger', id: 'nutChuyen', disabled: true })}
      </div>
    </div>
    ${d.suaDuoc ? '' : '<p class="page-note">Vai của bạn chỉ xem được.</p>'}
    <div id="kqChuyen" class="tren-4"></div>`;

  const dsChon = () => [...document.querySelectorAll('#dsPage input:checked')];
  const demChon = () => {
    const n = dsChon().length;
    $('#demChon').textContent = n ? `Đã chọn ${so(n)} page` : 'Chưa chọn page nào';
    $('#nutChuyen').disabled = !n || !d.suaDuoc;
    const het = $('#chonHet');
    if (het) { const tong = document.querySelectorAll('#dsPage input').length; het.checked = n > 0 && n === tong; het.indeterminate = n > 0 && n < tong; }
  };
  if ($('#dsPage')) $('#dsPage').addEventListener('change', demChon);
  if ($('#chonHet')) $('#chonHet').addEventListener('change', (e) => {
    document.querySelectorAll('#dsPage input').forEach((c) => { c.checked = e.target.checked; }); demChon();
  });
  let henP = null;
  $('#timPage').addEventListener('input', (e) => {
    clearTimeout(henP);
    henP = setTimeout(() => { TIM_PAGE = e.target.value.trim(); napGanPage().then(() => { const o = $('#timPage'); o.focus(); o.setSelectionRange(o.value.length, o.value.length); }); }, 250);
  });
  $('#nutChuyen').addEventListener('click', chuyen);
}

async function chuyen() {
  const ds = [...document.querySelectorAll('#dsPage input:checked')].map((c) => c.value);
  if (!ds.length) return;
  const oTeam = $('#teamDich');
  const tenTeam = oTeam.options[oTeam.selectedIndex].textContent.trim();
  // Hỏi lại và nói RÕ hệ quả: đây là đổi chủ dữ liệu, không phải một cờ hiển thị.
  const dongY = await confirmDialog({
    title: `Chuyển ${so(ds.length)} page sang team «${tenTeam}»?`,
    body: 'Hội thoại, kịch bản và sản phẩm của những page đó sẽ đi theo sang team mới. Team hiện tại sẽ KHÔNG còn nhìn thấy chúng.',
    confirmLabel: 'Chuyển page', danger: true,
  });
  if (!dongY) return;
  const nut = $('#nutChuyen');
  setBusy(nut, true);
  try {
    const kq = await goi('/api/team/gan-page', { method: 'POST',
      body: JSON.stringify({ pageIds: ds, teamDichId: oTeam.value, lyDo: `chuyển sang ${tenTeam}` }) });
    xoaLoi('chuyển page');
    await napGanPage();
    veKetQuaChuyen(kq, tenTeam);
    await napTongQuan();
  } catch (e) { baoLoi('chuyển page', e.message); setBusy(nut, false); }
}

function veKetQuaChuyen(kq, tenTeam) {
  const di = Object.entries(kq.daChuyen || {}).filter(([, n]) => n > 0);
  const lai = Object.entries(kq.boLai || {}).filter(([, n]) => n > 0);
  const hong = kq.ketQua.filter((r) => !r.xong);
  // Hiện CẢ phần xong lẫn phần hỏng. Gộp thành một chữ «lỗi» là lấy mất thứ người ta cần.
  $('#kqChuyen').innerHTML = canhBao({
    level: hong.length ? 'warning' : 'success',
    title: `Chuyển xong ${so(kq.soXong)}/${so(kq.soChon)} page sang «${tenTeam}»`,
    body: [di.length ? `Đi theo: ${di.map(([b, n]) => `${so(n)} ${b}`).join(' · ')}.` : '',
           lai.length ? `Cố ý ở lại team cũ (số liệu lịch sử): ${lai.map(([b, n]) => `${so(n)} ${b}`).join(' · ')}.` : ''].filter(Boolean).join(' '),
    detail: hong.slice(0, 8).map((r) => `page ${r.pageId}: ${r.loi}`),
  });
}

/* ─── nạp ─── */
async function napTongQuan() { const d = await goi('/api/team/tong-quan'); if (d) veTongQuan(d.tongQuan); }
async function napThanhVien() { const d = await goi('/api/team/thanh-vien'); if (d) veThanhVien(d); }
async function napKetNoi() { const d = await goi('/api/team/ket-noi'); if (d) veKetNoi(d); }
async function napGanPage() { const d = await goi('/api/team/gan-page?tim=' + encodeURIComponent(TIM_PAGE)); if (d) veGanPage(d); }

(async function nap() {
  // Nạp từng khối riêng: một khối hỏng thì ba khối kia vẫn hiện. Gộp `Promise.all` rồi để
  // một lỗi làm trắng cả trang là đúng thứ màn này sinh ra để chống.
  const khoi = [['tổng quan', napTongQuan, null], ['thành viên', napThanhVien, '#khoiThanhVien'],
                ['kết nối POS', napKetNoi, '#khoiKetNoi'], ['chuyển page', napGanPage, '#khoiGanPage']];
  for (const [ten, fn, cho] of khoi) {
    try { await fn(); } catch (e) {
      baoLoi(ten, e.message);
      if (cho) $(cho).innerHTML = emptyState({ icon: 'circle-alert', title: 'Không tải được', body: 'Xem cảnh báo đầu trang.' });
    }
  }
})();
</script>
<script src="/chung/dieu-huong.js"></script>
</body>
</html>
