<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hệ còn sống không — AI Closer</title>
<!-- Dựng trên hệ kiểu. KHÔNG CSS riêng — trước lượt này là 85 dòng. Chín thẻ đèn xếp lưới →
     một danh sách một cột: đèn hỏng nằm trên, lý do đọc hết một dòng thay vì bị cắt trong ô
     hẹp. Bốn màu đèn (do · vang · xam · xanh) đi qua ánh xạ trạng thái tập trung — «xám» là
     `unknown`, không bao giờ là xanh (luật «chưa đo được ≠ đạt»). -->
<link rel="stylesheet" href="/chung/kieu.css" data-ds="v3">
<!-- Hàm dựng thành phần (window.UI). ĐỒNG BỘ, KHÔNG `defer`: khung ứng dụng ở cuối trang
     lấy biểu tượng từ đây — `defer` chạy SAU script cuối trang, khung sẽ mất biểu tượng. -->
<script src="/chung/ui.js"></script>
</head>
<body>
<header>
  <h1>Hệ còn sống không</h1>
  <span class="sub">Chín đèn hạ tầng. Đèn xám là chưa đo được — khác hẳn «đang ổn».</span>
  <span class="sp"></span>
  <span class="text-muted text-sm" id="nhipNap">Tự nạp lại mỗi phút</span>
</header>

<main>
  <div id="bang-tin" aria-live="polite"></div>
  <div id="dem"></div>

  <section class="section" aria-labelledby="tieu-den">
    <div class="section-header"><h2 id="tieu-den">Chín đèn</h2>
      <span class="text-muted text-sm">Hỏng và cần để ý xếp lên trước</span></div>
    <ul class="item-list" id="luoi"><li class="item"><div><span class="skeleton"></span></div></li></ul>
  </section>
</main>

<script>
const { esc, text, statusBadge, button, alert: canhBao, metricRow, formatNumber: so } = window.UI;
const $ = (s) => document.querySelector(s);

let D = null;

async function goi(duong) {
  const r = await fetch(duong, { headers: { Accept: 'application/json' }, credentials: 'same-origin' });
  if (r.status === 401) { location.href = '/dang-nhap?tiep=' + encodeURIComponent(location.pathname); return null; }
  let d = null; try { d = await r.json(); } catch { /* null */ }
  if (!r.ok || !d || d.ok === false) throw new Error((d && d.thongDiep) || ('Máy chủ trả ' + r.status + '.'));
  return d;
}

// Bốn mức của kho → bốn trạng thái của hệ. «xam» = chưa đo được: KHÔNG BAO GIỜ tô xanh.
const MA = { do: 'blocked', vang: 'needs_attention', xam: 'unknown', xanh: 'ready' };
const MUC_CANH = { do: 'error', vang: 'warning', xam: 'info', xanh: 'success' };

function ve() {
  const m = D.tongThe;
  const cau = m === 'do' ? 'Có chỗ đang hỏng'
    : m === 'vang' ? 'Không có gì hỏng, nhưng có chỗ cần để ý'
    : m === 'xam' ? 'Không có gì hỏng — nhưng có đèn chưa đo được'
    : 'Mọi đèn đều ổn';
  $('#bang-tin').innerHTML = `<div class="duoi-5">${canhBao({ level: MUC_CANH[m] || 'info', title: cau,
    body: m === 'xanh' ? 'Chín đèn hạ tầng đều xanh ở lượt đo gần nhất.'
      : 'Xem danh sách bên dưới: đèn hỏng và đèn cần để ý xếp lên trước.' })}</div>`;

  $('#dem').innerHTML = metricRow([
    { label: 'Đang hỏng', value: D.dem.do, statusHtml: D.dem.do ? statusBadge('blocked', { label: 'Cần sửa ngay' }) : '' },
    { label: 'Cần để ý', value: D.dem.vang, statusHtml: D.dem.vang ? statusBadge('needs_attention') : '' },
    { label: 'Chưa đo được', value: D.dem.xam, statusHtml: D.dem.xam ? statusBadge('unknown', { label: 'Không phải là ổn' }) : '' },
    { label: 'Đang ổn', value: D.dem.xanh, statusHtml: D.dem.xanh ? statusBadge('ready', { label: 'Đo được và đạt' }) : '' },
  ]);

  // Xếp theo mức: đỏ trước, rồi vàng, rồi xám, rồi xanh. Đèn xanh xếp trên là nó đẩy đèn
  // đỏ xuống dưới màn hình, và người ta cuộn qua đúng thứ cần nhìn.
  const thu = { do: 0, vang: 1, xam: 2, xanh: 3 };
  const ds = [...D.den].sort((a, b) => thu[a.muc] - thu[b.muc]);

  $('#luoi').innerHTML = ds.map((d) => `<li class="item">
    <div>
      <div class="item-title">${esc(d.ten)}${d.so ? ` <span class="meta">· ${esc(d.so)}</span>` : ''}</div>
      <div class="item-desc">${text(d.vi)}</div>
      ${d.diTiep && !d.diTiep.duong ? `<div class="item-detail">Việc cần làm: ${text(d.diTiep.chu)}</div>` : ''}
    </div>
    <div class="item-trail">
      ${statusBadge(MA[d.muc] || 'unknown', { label: (D.chuMuc && D.chuMuc[d.muc]) || undefined })}
      ${d.diTiep && d.diTiep.duong ? button(d.diTiep.chu, { href: d.diTiep.duong, size: 'sm' }) : ''}
    </div>
  </li>`).join('');
}

async function nap() {
  try {
    const d = await goi('/api/suc-khoe');
    if (!d) return;
    D = d; ve();
    $('#nhipNap').textContent = `Đo lúc ${new Date().toLocaleTimeString('vi-VN')} · tự nạp lại mỗi phút`;
  } catch (e) {
    $('#bang-tin').innerHTML = `<div class="duoi-5">${canhBao({ level: 'error', title: 'Không đọc được bảng sức khoẻ',
      body: 'Chưa đo được đèn nào. Đây là «chưa biết», không phải «mọi thứ đều ổn».', detail: [e.message] })}</div>`;
  }
}
nap();
setInterval(nap, 60000);   // tự nạp lại mỗi phút — đây là màn người ta để mở
</script>
<script src="/chung/dieu-huong.js"></script>
</body>
</html>
