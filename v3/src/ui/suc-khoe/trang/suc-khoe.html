<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hệ còn sống không — AI Closer</title>
<!-- Dựng trên hệ kiểu. KHÔNG CSS riêng — trước lượt này là 85 dòng. Chín thẻ đèn xếp lưới →
     một danh sách một cột: đèn hỏng nằm trên, lý do đọc hết một dòng thay vì bị cắt trong ô
     hẹp. Bốn màu đèn (do · vang · xam · xanh) đi qua ánh xạ trạng thái tập trung — «xám» là
     `unknown`, không bao giờ là xanh (luật «chưa đo được ≠ đạt»). -->
<link rel="stylesheet" href="/chung/kieu.css" data-ds="v3">
<!-- Hàm dựng thành phần (window.UI). ĐỒNG BỘ, KHÔNG `defer`: khung ứng dụng ở cuối trang
     lấy biểu tượng từ đây — `defer` chạy SAU script cuối trang, khung sẽ mất biểu tượng. -->
<script src="/chung/ui.js"></script>
</head>
<body>
<header>
  <h1>Hệ còn sống không</h1>
  <span class="sub">Các đèn hạ tầng. Đèn xám là chưa đo được — khác hẳn «đang ổn».</span>
  <span class="sp"></span>
  <span class="text-muted text-sm" id="nhipNap">Tự nạp lại mỗi phút</span>
</header>

<main>
  <div id="bang-tin" aria-live="polite"></div>
  <div id="dem"></div>

  <section class="section" aria-labelledby="tieu-den">
    <div class="section-header"><h2 id="tieu-den">Các đèn</h2></div>
    <ul class="item-list" id="luoi"><li class="item"><div><span class="skeleton"></span></div></li></ul>
  </section>
  <!-- VE7a · 30/09 (bản vẽ 4): «Việc vận hành» — ba việc của màn Vận hành (đã rời thanh tab Cài đặt) với SỐ THẬT và lối sang đúng
       tab (`/van-hanh-v3?tab=…`). Chỉ vai mở được Vận hành thấy khối (hỏi menu trước — không gọi cửa rồi ăn 403). -->
  <section class="section" id="viec-van-hanh" aria-labelledby="tieu-vh" hidden></section>
</main>

<script>
const { esc, text, statusBadge, button, alert: canhBao, metricRow, formatNumber: so } = window.UI;
const $ = (s) => document.querySelector(s);

let D = null;

async function goi(duong) {
  const r = await fetch(duong, { headers: { Accept: 'application/json' }, credentials: 'same-origin' });
  if (r.status === 401) { location.href = '/dang-nhap?tiep=' + encodeURIComponent(location.pathname); return null; }
  let d = null; try { d = await r.json(); } catch { /* null */ }
  if (!r.ok || !d || d.ok === false) throw new Error((d && d.thongDiep) || ('Máy chủ trả ' + r.status + '.'));
  return d;
}

// Bốn mức của kho → bốn trạng thái của hệ. «xam» = chưa đo được: KHÔNG BAO GIỜ tô xanh.
const MA = { do: 'blocked', vang: 'needs_attention', xam: 'unknown', xanh: 'ready' };
const MUC_CANH = { do: 'error', vang: 'warning', xam: 'info', xanh: 'success' };

function ve() {
  const m = D.tongThe;
  const cau = m === 'do' ? 'Có chỗ đang hỏng'
    : m === 'vang' ? 'Không có gì hỏng, nhưng có chỗ cần để ý'
    : m === 'xam' ? 'Không có gì hỏng — nhưng có đèn chưa đo được'
    : 'Mọi đèn đều ổn';
  $('#bang-tin').innerHTML = `<div class="duoi-5">${canhBao({ level: MUC_CANH[m] || 'info', title: cau,
    body: m === 'xanh' ? `Cả ${D.den.length} đèn hạ tầng đều xanh ở lượt đo gần nhất.`
      : 'Đèn hỏng xếp lên trước.' })}</div>`;

  $('#dem').innerHTML = metricRow([
    { label: 'Đang hỏng', value: D.dem.do, statusHtml: D.dem.do ? statusBadge('blocked', { label: 'Cần sửa ngay' }) : '' },
    { label: 'Cần để ý', value: D.dem.vang, statusHtml: D.dem.vang ? statusBadge('needs_attention') : '' },
    { label: 'Chưa đo được', value: D.dem.xam, statusHtml: D.dem.xam ? statusBadge('unknown', { label: 'Chưa rõ' }) : '' },
    { label: 'Đang ổn', value: D.dem.xanh, statusHtml: D.dem.xanh ? statusBadge('ready', { label: 'Ổn' }) : '' },
  ]);

  // Xếp theo mức: đỏ trước, rồi vàng, rồi xám, rồi xanh. Đèn xanh xếp trên là nó đẩy đèn
  // đỏ xuống dưới màn hình, và người ta cuộn qua đúng thứ cần nhìn.
  const thu = { do: 0, vang: 1, xam: 2, xanh: 3 };
  const ds = [...D.den].sort((a, b) => thu[a.muc] - thu[b.muc]);
  // Đếm theo đèn THẬT trả về — tiêu đề cứng «Chín đèn» từng đứng trên 11 dòng (audit 28/09).
  $('#tieu-den').textContent = `${ds.length} đèn`;

  // 28/09 rút chữ: đèn XANH chỉ hiện tên, con số và nhãn «Ổn» — câu giải thích của nó
  // lặp lại con số. Đèn đỏ, vàng, xám vẫn giữ câu, vì câu ấy nói vì sao và làm gì.
  $('#luoi').innerHTML = ds.map((d) => `<li class="item">
    <div>
      <div class="item-title">${esc(d.ten)}${d.so ? ` <span class="meta">· ${esc(d.so)}</span>` : ''}</div>
      ${d.muc === 'xanh' ? '' : `<div class="item-desc">${text(d.vi)}</div>`}
      ${d.diTiep && !d.diTiep.duong ? `<div class="item-detail">Việc cần làm: ${text(d.diTiep.chu)}</div>` : ''}
    </div>
    <div class="item-trail">
      ${statusBadge(MA[d.muc] || 'unknown', { label: (D.chuMuc && D.chuMuc[d.muc]) || undefined })}
      ${d.diTiep && d.diTiep.duong ? button(d.diTiep.chu, { href: d.diTiep.duong, size: 'sm' }) : ''}
    </div>
  </li>`).join('');
}

async function nap() {
  try {
    const d = await goi('/api/suc-khoe');
    if (!d) return;
    D = d; ve();
    $('#nhipNap').textContent = `Đo lúc ${new Date().toLocaleTimeString('vi-VN')} · tự nạp lại mỗi phút`;
  } catch (e) {
    $('#bang-tin').innerHTML = `<div class="duoi-5">${canhBao({ level: 'error', title: 'Không đọc được bảng sức khoẻ',
      body: 'Chưa đo được đèn nào. Đây là «chưa biết», không phải «mọi thứ đều ổn».', detail: [e.message] })}</div>`;
  }
}
/* ── VE7a · VIỆC VẬN HÀNH (bản vẽ 4) ─────────────────────────────────────────────────────────────────────────────
 * Số từ `/api/van-hanh/tom-tat` (một hàm, một lượt). Không có việc ⇒ nói «không có», không giấu khối; cửa hỏng ⇒ nói không đọc
 * được, không vẽ số 0 (0 là lời khai «không có việc»). */
let MENU = null;
async function taiViecVanHanh() {
  if (!MENU) { try { MENU = await goi('/api/dieu-huong'); } catch { return; } }
  const co = (d) => ((MENU && MENU.nhom) || []).some((n) => (n.man || []).some((m) => m.duong === d));
  if (!co('/van-hanh-v3')) return;
  const o = $('#viec-van-hanh');
  o.hidden = false;
  const dau = '<div class="section-header"><h2 id="tieu-vh">Việc vận hành</h2><span class="text-muted text-sm">ba việc của màn Vận hành</span></div>';
  let d = null;
  try { d = await goi('/api/van-hanh/tom-tat'); }
  catch (e) { o.innerHTML = dau + canhBao({ level: 'warning', title: 'Chưa đọc được việc vận hành', body: e.message }); return; }
  if (!d) return;
  const viec = (ten, n, sau, vi, chuNut, lk) => `<li class="item"><div>
      <div class="item-title">${esc(ten)} · <b class="so-lon">${so(n)}</b>${sau}</div>
      <div class="item-desc">${vi}</div></div>
    <div class="item-trail">${button(chuNut, { href: lk, size: 'sm' })}</div></li>`;
  const l = d.tinLoi; const b = d.boQua24h; const t = d.dienTap;
  o.innerHTML = dau + `<ul class="item-list">
    ${viec('Tin cần đối chiếu', l.tong, '', !l.tong ? 'Không tin nào chờ đối chiếu.'
      : `${so(l.khongRo)} tin gửi không rõ kết quả — bot gửi mà Pancake không trả lời chắc chắn. Tin lỗi hoặc bị chặn: đối chiếu từng tin — đã tới khách, hay giao cho người gửi lại.`,
      'Đối chiếu', '/van-hanh-v3?tab=conversations')}
    ${viec('Tin bị bộ lọc loại', b.tong, ' / 24 giờ', `${so(b.dangNgo)} đáng ngờ. Năm cửa lọc bỏ tin mỗi vòng — một cửa bắt oan là khách im lặng mà không ai biết.`,
      'Xem theo cửa', '/van-hanh-v3?tab=bo-qua')}
    ${viec('Diễn tập', t.soLuot, ' lượt', `Diễn tập ${t.dangBat ? 'đang bật' : 'đang tắt'}: bot chạy trên tin thật nhưng KHÔNG gửi — chấm câu trả lời trước khi mở cho khách.`,
      'Xem lượt diễn tập', '/van-hanh-v3?tab=dien-tap')}
  </ul>`;
}

nap();
taiViecVanHanh();
setInterval(() => { nap(); taiViecVanHanh(); }, 60000);   // tự nạp lại mỗi phút — đây là màn người ta để mở
</script>
<script src="/chung/dieu-huong.js"></script>
</body>
</html>
