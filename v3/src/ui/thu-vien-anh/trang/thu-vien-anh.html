<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ảnh gửi khách — AI Closer</title>
<!-- Dựng trên hệ kiểu. KHÔNG CSS riêng — trước lượt này là 41 dòng. Lưới ảnh nay là thành
     phần của hệ (`.thumb-grid`). Vế «bot chọn ảnh đúng lúc» CHƯA làm được: nói bằng cảnh báo
     có tiêu đề ở đầu màn, không phải một dải xanh có dấu tích. -->
<link rel="stylesheet" href="/chung/kieu.css" data-ds="v3">
<!-- Hàm dựng thành phần (window.UI). ĐỒNG BỘ, KHÔNG `defer`: khung ứng dụng ở cuối trang
     lấy biểu tượng từ đây — `defer` chạy SAU script cuối trang, khung sẽ mất biểu tượng. -->
<script src="/chung/ui.js"></script>
</head>
<body>
<header>
  <h1>Ảnh gửi khách</h1>
  <span class="sub">Ảnh bot có thể gửi trong hội thoại. Có ảnh là một chuyện; gắn chủ đề để bot biết gửi lúc nào là chuyện khác.</span>
</header>

<main>
  <div id="bang-tin" aria-live="polite"></div>

  <section class="section" aria-label="Tình hình ảnh">
    <div id="dem"></div>
  </section>

  <section class="section" aria-labelledby="tieu-nhan">
    <div class="section-header"><div><h2 id="tieu-nhan">Nhãn đang dùng</h2>
      <div class="section-desc">Nhãn là tên người đặt cho ảnh — chưa phải chủ đề bot dùng để chọn ảnh.</div></div></div>
    <div class="panel"><div class="chip-list" id="dsNhan"></div></div>
  </section>

  <section class="section" aria-labelledby="tieu-anh">
    <div class="section-header"><h2 id="tieu-anh">Ảnh</h2>
      <span class="text-muted text-sm" id="hSo"></span></div>
    <div id="luoi"><div class="empty-state"><span class="skeleton"></span></div></div>
    <div id="phanTrang"></div>
  </section>
</main>

<script>
const { esc, statusBadge, button, alert: canhBao, emptyState, metricRow, formatNumber } = window.UI;
const $ = (s) => document.querySelector(s);
const d0 = (n) => (n == null ? '—' : formatNumber(n));

let trang = 0;

async function goi(d) {
  const r = await fetch(d, { credentials: 'same-origin', headers: { Accept: 'application/json' } });
  if (r.status === 401) { location.href = '/dang-nhap?tiep=' + encodeURIComponent(location.pathname); return null; }
  const j = await r.json().catch(() => null);
  if (!r.ok || !j || j.ok === false) throw new Error((j && j.thongDiep) || 'Máy chủ trả ' + r.status + '.');
  return j;
}

function veBangTin(d) {
  const kh = [];
  const c = d.chuDe;
  if (c && !c.duoc) {
    // Vế «bot chọn đúng lúc» CHƯA làm được — nói ngay đầu màn, không để cuối.
    kh.push(canhBao({ level: 'warning', title: 'Ảnh đã có, nhưng chưa gắn chủ đề',
      body: c.noi, detail: [c.diTiep] }));
  } else if (c) {
    kh.push(canhBao({ level: 'success', title: 'Ảnh đã gắn chủ đề', body: c.noi }));
  }
  if (d.hong && d.hong.length) {
    kh.push(canhBao({ level: 'warning', title: `${d0(d.hong.length)} page không đọc được ảnh`,
      body: 'Một page hỏng không làm hỏng cả thư viện — phần còn lại vẫn hiện đủ.',
      detail: [d.hong.map((x) => x.tenPage || x.pageId).join(' · ')] }));
  }
  $('#bang-tin').innerHTML = kh.length ? `<div class="duoi-5">${kh.join('')}</div>` : '';
}

function veDem(k) {
  $('#dem').innerHTML = metricRow([
    { label: 'Ảnh đọc được', value: d0(k.anh) },
    { label: 'Ảnh có chủ đề riêng', value: d0(k.coChuDe),
      statusHtml: k.coChuDe ? statusBadge('ready') : statusBadge('blocked', { label: 'Chưa ảnh nào' }) },
    { label: 'Ảnh chưa biết dùng lúc nào', value: d0(k.khongChuDe),
      statusHtml: k.khongChuDe ? statusBadge('needs_attention', { label: 'Bot không tự chọn được' }) : '' },
    { label: 'Page đã đọc', value: `${d0(k.pageDaDoc)}/${d0(k.pageCoSanPham)}` },
  ]);
}

function veNhan(ds) {
  $('#dsNhan').innerHTML = ds.length
    ? ds.map((n) => `<span class="chip">${esc(n.ten)} <span class="meta">${d0(n.so)}</span></span>`).join('')
    : '<span class="text-muted text-sm">Chưa có nhãn nào.</span>';
}

function veLuoi(d) {
  $('#hSo').textContent = `${d0(d.anh.length)} ảnh trong trang này`;
  if (!d.anh.length) {
    $('#luoi').innerHTML = emptyState({ icon: 'inbox', title: d.trong ? d.trong.noi : 'Chưa có ảnh nào',
      body: d.trong && d.trong.diTiep ? d.trong.diTiep : '' });
    return;
  }
  $('#luoi').innerHTML = `<div class="thumb-grid">${d.anh.map((a) => `
    <figure class="thumb">
      <img src="${esc(a.duong)}" alt="${esc(a.nhan || a.tenSp || 'Ảnh sản phẩm')}" loading="lazy">
      <figcaption class="thumb-meta">
        <div class="thumb-name">${a.laChuDe ? esc(a.nhan) : `<span class="text-muted">${esc(a.nhan || '(không nhãn)')}</span>`}</div>
        <div class="thumb-sub" title="${esc(a.tenPage)}">${esc(a.tenPage)}</div>
        <div class="thumb-sub">${a.thieuTenSp ? `mã ${esc(a.maSp)}` : esc(a.tenSp)}</div>
      </figcaption>
    </figure>`).join('')}</div>`;
}

function vePhanTrang(t) {
  const soTrang = Math.ceil(t.tong / t.moiTrang);
  if (soTrang <= 1) { $('#phanTrang').innerHTML = ''; return; }
  $('#phanTrang').innerHTML = `<div class="pagination surface tren-3">
    <span>Page ${formatNumber(t.hienTai * t.moiTrang + 1)}–${formatNumber(Math.min((t.hienTai + 1) * t.moiTrang, t.tong))} / ${d0(t.tong)}
      · mỗi lượt đọc ${d0(t.moiTrang)} page, mỗi page là một lời gọi sang tiến trình bot</span>
    <span class="hang">${button('Trước', { size: 'sm', id: 'tr', disabled: t.hienTai <= 0 })}
      ${button('Sau', { size: 'sm', id: 'sa', disabled: t.hienTai >= soTrang - 1 })}</span>
  </div>`;
  const tr = $('#tr'), sa = $('#sa');
  if (tr) tr.onclick = () => { trang -= 1; tai(); };
  if (sa) sa.onclick = () => { trang += 1; tai(); };
}

async function tai() {
  $('#luoi').innerHTML = '<div class="empty-state"><span class="skeleton"></span></div>';
  try {
    const d = await goi('/api/thu-vien-anh?trang=' + trang);
    if (!d) return;
    veBangTin(d); veDem(d.dem); veNhan(d.nhanDaDung || []); veLuoi(d);
    if (d.trang) vePhanTrang(d.trang);
  } catch (e) {
    $('#dem').innerHTML = '';
    $('#bang-tin').innerHTML = `<div class="duoi-5">${canhBao({ level: 'error', title: 'Không đọc được thư viện ảnh',
      body: 'Màn này TỪ CHỐI đoán — một thư viện rỗng ở đây trông y như «team này chưa có ảnh nào».',
      detail: [e.message] })}</div>`;
    $('#luoi').innerHTML = emptyState({ icon: 'circle-alert', title: 'Chưa đọc được ảnh nào',
      body: 'Kiểm kết nối sang tiến trình bot rồi tải lại trang.' });
  }
}

tai();
</script>
<script src="/chung/dieu-huong.js"></script>
</body>
</html>
