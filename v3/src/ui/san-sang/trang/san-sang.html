<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page còn thiếu gì — AI Closer</title>
<!-- Dựng trên hệ kiểu (mục M4: kiểm tra sẵn sàng). KHÔNG CSS riêng — trước lượt này là 55 dòng.
     Tám ô số rời → bốn chỉ số; sáu nút lọc tự vẽ → tab có số đếm; điều kiện thiếu là huy hiệu
     theo NGHĨA (chặn = danger, nhắc = warning) và bấm được sang chỗ sửa.
     ⚠️ Giữ nguyên `locHien = 'bat_duoc'` và bộ lọc `bat_duoc`: ca ②b3 của `san-sang.test.mjs`
        canh màn mở mặc định ở «bật được ngay», không mở ở «bị chặn». -->
<link rel="stylesheet" href="/chung/kieu.css" data-ds="v3">
<!-- Hàm dựng thành phần (window.UI). ĐỒNG BỘ, KHÔNG `defer`: khung ứng dụng ở cuối trang
     lấy biểu tượng từ đây — `defer` chạy SAU script cuối trang, khung sẽ mất biểu tượng. -->
<script src="/chung/ui.js"></script>
</head>
<body>
<header>
  <h1>Page còn thiếu gì</h1>
  <span class="sub">Điều kiện để bot chạy được trên một page. Bậc chặn thì bot không bật được; bậc nhắc thì bật vẫn được. Page chạy bot cũ và page chạy bot mới có hai bộ điều kiện khác nhau.</span>
</header>

<main>
  <div id="bang-tin" aria-live="polite"></div>

  <section class="section" aria-label="Tình hình page">
    <div id="dem"><div class="metric-row"><div class="metric"><span class="skeleton"></span></div></div></div>
  </section>

  <section class="section table-wrap" aria-labelledby="tieu-page">
    <h2 id="tieu-page" class="sr-only">Page của team</h2>
    <div class="tabs" role="tablist" aria-label="Lọc page" id="loc"></div>
    <div class="table-toolbar">
      <span class="text-muted text-sm">Bấm một điều kiện để sang thẳng chỗ sửa.</span>
      <span class="table-count" id="hSo" aria-live="polite"></span>
    </div>
    <div id="bang"><div class="empty-state"><span class="skeleton"></span></div></div>
  </section>

  <section class="section table-wrap" aria-labelledby="tieu-dk">
    <div class="table-toolbar"><h2 id="tieu-dk">Các điều kiện</h2>
      <span class="table-count">Bậc nào chặn, bậc nào chỉ nhắc</span></div>
    <div id="dsDk"></div>
  </section>

  <section class="section" aria-label="Nguồn của các con số">
    <div id="nguon-so"></div>
  </section>
</main>

<script>
const { esc, statusBadge, button, alert: canhBao, emptyState, metricRow, nguonSo, formatNumber: so } = window.UI;
const $ = (s) => document.querySelector(s);

let DL = null;
// Mở màn ở «bật được ngay», không phải «bị chặn». Người ta tới đây để bật page, và mở ra
// thấy ngay 445 dòng hỏng thì câu trả lời họ cần bị chôn dưới đó.
let locHien = 'bat_duoc';

// `bat_duoc` đứng ĐẦU vì đó là câu hỏi người ta mang tới màn này. Các bộ lọc sau là cách
// chẻ nhỏ; ai cần mới dùng.
const LOC = [
  { ma: 'bat_duoc', ten: 'Bật được ngay' },
  { ma: 'chan', ten: 'Bị chặn' },
  { ma: 'nhac', ten: 'Chỉ nhắc' },
  { ma: 'san', ten: 'Sạch hoàn toàn' },
  { ma: 'chay', ten: 'Đang chạy' },
  { ma: 'tat_ca', ten: 'Tất cả' },
];

function locPage(ma = locHien) {
  const ds = DL.page;
  // Bật được = KHÔNG vướng điều kiện chặn nào. Cảnh báo không chặn, nên page «chỉ nhắc»
  // vẫn nằm trong đây.
  if (ma === 'bat_duoc') return ds.filter((p) => !p.botKhongThay && !p.chan.length);
  if (ma === 'chan') return ds.filter((p) => p.chan.length);
  if (ma === 'nhac') return ds.filter((p) => !p.chan.length && p.nhac.length);
  if (ma === 'san') return ds.filter((p) => !p.botKhongThay && !p.chan.length && !p.nhac.length);
  if (ma === 'chay') return ds.filter((p) => p.botTheoBot);
  return ds;
}

function veLoc() {
  $('#loc').innerHTML = LOC.map((l) =>
    `<button type="button" class="tab" role="tab" data-l="${l.ma}" aria-selected="${l.ma === locHien}">${esc(l.ten)}<span class="count">${so(locPage(l.ma).length)}</span></button>`).join('');
  $('#loc').querySelectorAll('[data-l]').forEach((n) => {
    n.onclick = () => { locHien = n.dataset.l; veLoc(); veBang(); };
  });
}

/**
 * Một điều kiện đang vướng. Tên bậc / chỗ nhảy / câu chỉ việc tra từ `DL.dieuKien` theo mã —
 * gói dữ liệu KHÔNG chở chúng theo từng page (xem chú thích ở `kho-san-sang.js#nhan`).
 * Có chỗ nhảy thì là <a> bấm được; không có thì là huy hiệu thường, kèm lời chỉ việc ở title.
 */
function veO(x) {
  const dk = (DL.dieuKien && DL.dieuKien[x.ma]) || null;
  const nhan = (dk ? dk.ten : x.ma) + (x.la ? ' (mã lạ)' : '');
  const lam = dk ? dk.lam : 'Mã này tiến trình bot vừa thêm, màn chưa biết cách chỉ chỗ sửa.';
  const hh = statusBadge(x.chan ? 'blocked' : 'needs_attention', { label: nhan });
  if (dk && dk.di) return `<a href="${esc(dk.di)}" title="${esc(lam)}">${hh}</a>`;
  return `<span title="${esc(lam)}">${hh}</span>`;
}

function veBang() {
  const ds = locPage();
  $('#hSo').textContent = `${so(ds.length)}/${so(DL.page.length)} page`;
  const b = $('#bang');

  if (!DL.page.length) {
    b.innerHTML = emptyState({ icon: 'triangle-alert',
      title: DL.trong ? DL.trong.noi : 'Chưa đọc được page nào',
      body: `Màn này chưa dùng được — KHÔNG phải vì mọi thứ đã xong. ${DL.trong && DL.trong.diTiep ? DL.trong.diTiep : ''}` });
    return;
  }
  if (!ds.length) {
    b.innerHTML = emptyState({ icon: locHien === 'chan' ? 'circle-check' : 'search',
      title: 'Không page nào ở nhóm này',
      body: locHien === 'chan' ? 'Đây là tin tốt — không page nào bị chặn.'
        : locHien === 'bat_duoc' ? 'Mọi page của team đều đang vướng ít nhất một điều kiện chặn. Xem tab «Bị chặn» để biết vướng gì.'
        : 'Đổi tab để xem nhóm khác.' });
    return;
  }

  b.innerHTML = `<table class="data-table"><thead><tr>
      <th scope="col">Page</th><th scope="col">Bot</th><th scope="col">Điều kiện chặn</th>
      <th scope="col">Nhắc</th><th scope="col">Marketer</th>
    </tr></thead><tbody>${ds.map((p) => `
    <tr>
      <td><div class="page-identity-name">${esc(p.ten)}</div><div class="page-identity-sub">${esc(p.pageId)} · ${p.banBot === 'moi' ? 'bot mới' : 'bot cũ'}</div></td>
      <td>${p.botKhongThay ? statusBadge('not_seen') : statusBadge(p.botTheoBot ? 'bot_on' : 'bot_off')}
        ${p.botTheoCsdl !== p.botTheoBot && !p.botKhongThay
          ? `<div class="meta" title="Cột trong cơ sở dữ liệu là bản sao — con số đúng là của tiến trình bot">CSDL ghi ${p.botTheoCsdl ? 'bật' : 'tắt'}</div>` : ''}</td>
      <td>${p.botKhongThay ? statusBadge('unknown', { label: 'Chưa biết' })
            : (p.chan.length ? `<div class="chip-list">${p.chan.map(veO).join('')}</div>` : '<span class="text-muted">Không vướng gì</span>')}
        ${p.chan.length ? `<div class="meta">${esc(p.chan.map((x) => x.chiTiet).filter(Boolean).join(' · '))}</div>` : ''}</td>
      <td>${p.nhac.length ? `<div class="chip-list">${p.nhac.map(veO).join('')}</div>` : '<span class="text-muted">—</span>'}</td>
      <td>${p.marketer ? esc(p.marketer) : '<span class="text-muted">Chưa gán</span>'}</td>
    </tr>`).join('')}</tbody></table>`;
}

function veDem(k) {
  $('#dem').innerHTML = metricRow([
    { label: 'Bật được ngay', value: k.batDuoc, hint: `trên ${so(k.tong)} page của team`,
      statusHtml: k.batDuoc ? statusBadge('ready') : statusBadge('blocked', { label: 'Không page nào' }) },
    { label: 'Bị chặn', value: k.chan,
      statusHtml: k.chan ? statusBadge('blocked', { label: 'Bot không bật được' }) : '' },
    { label: 'Bot đang thật sự chạy', value: k.dangChay,
      statusHtml: k.dangChay ? statusBadge('bot_on') : '' },
    { label: 'Bot không thấy page', value: k.botKhongThay,
      statusHtml: k.botKhongThay ? statusBadge('not_seen', { label: 'Chưa biết tình trạng' }) : '' },
  ]);
}

// Bảng điều kiện chở CẢ HAI bộ: của bot cũ và của bot mới. Tách nhóm có nhãn, vì không page
// nào phải đạt cả hai bộ — gộp một mạch là bắt người đọc tự đoán dòng nào áp cho page của họ.
function veDieuKien(dk) {
  const hang = ([ma, d]) => `
    <tr>
      <td><div class="manh">${esc(d.nhan || d.ten)}</div></td>
      <td>${statusBadge(d.chan ? 'blocked' : 'needs_attention', { label: d.chan ? 'Chặn bot' : 'Chỉ nhắc' })}</td>
      <td>${esc(d.lam)}</td>
      <td class="actions">${d.di ? button(d.nutDi || 'Đi sửa', { href: d.di, size: 'sm' }) : ''}</td>
    </tr>`;
  const r = Object.entries(dk).filter(([m]) => m !== 'READY');
  const cu = r.filter(([m]) => !m.startsWith('BOTMOI_'));
  const moi = r.filter(([m]) => m.startsWith('BOTMOI_'));
  const nhomHang = (ten, so) => `<tr><th colspan="4" scope="colgroup" class="meta">${esc(ten)} · ${so} điều kiện</th></tr>`;
  $('#dsDk').innerHTML = `<table class="data-table"><thead><tr>
      <th scope="col">Điều kiện</th><th scope="col">Mức</th><th scope="col">Phải làm gì</th>
      <th scope="col" class="actions"><span class="sr-only">Chỗ sửa</span></th>
    </tr></thead><tbody>${nhomHang('Page chạy bot cũ', cu.length)}${cu.map(hang).join('')}`
    + `${moi.length ? nhomHang('Page chạy bot mới', moi.length) + moi.map(hang).join('') : ''}</tbody></table>`;
}

/* Ô «Nguồn số» — luật 8 của sổ vẫn nguyên, chỉ đổi CHỖ ĐỨNG: người vận hành không phải đọc
   tên bảng và mã máy giữa mặt màn, người đi kiểm mở ô này ra là có đủ. */
function veNguonSo(d) {
  const ma = Object.entries(d.dieuKien || {})
    .filter(([m]) => m !== 'READY')
    .map(([m, x]) => `${x.nhan || x.ten} = \`${m}\``)
    .join(' · ');
  $('#nguon-so').innerHTML = nguonSo({
    dong: [
      { ten: 'Page của team', tu: 'bảng page của team đang mở — không gồm page team khác và page chưa phân team' },
      { ten: 'Bot có đang chạy', tu: 'hỏi thẳng tiến trình bot, không đọc cột bản sao trong cơ sở dữ liệu' },
      { ten: 'Điều kiện của page bot cũ', tu: 'cửa kiểm của tiến trình bot (`src/readiness.js`), đọc qua cầu HTTP' },
      { ten: 'Điều kiện của page bot mới', tu: 'phép kiểm cấu hình của đường v3 (`pageStatus`) — mới kiểm cấu hình, chưa hỏi máy chạy bot còn sống' },
      { ten: 'Mã máy của từng điều kiện', tu: ma },
    ],
    chuY: 'Cầu sang tiến trình bot hỏng thì màn TỪ CHỐI đoán: nó nói hỏng chứ không hiện một bảng rỗng.',
  });
}

async function tai() {
  try {
    const r = await fetch('/api/san-sang', { credentials: 'same-origin', headers: { Accept: 'application/json' } });
    if (r.status === 401) { location.href = '/dang-nhap?tiep=' + encodeURIComponent(location.pathname); return; }
    const d = await r.json();
    if (!r.ok || d.ok === false) throw new Error(d.thongDiep || 'Máy chủ trả ' + r.status + '.');
    DL = d;

    const kh = [];
    if (d.lech) {
      kh.push(canhBao({ level: 'warning', title: 'Cơ sở dữ liệu v3 và tiến trình bot đang nói khác nhau',
        body: d.lech.noi,
        detail: d.lech.viDu.map((v) => `${v.ten} (${v.pageId}) — CSDL: ${v.csdl ? 'bật' : 'tắt'} · bot: ${v.bot ? 'bật' : 'tắt'}`) }));
    }
    if (d.dem.chayMaBiChan) {
      kh.push(canhBao({ level: 'error', title: `${so(d.dem.chayMaBiChan)} page đang chạy nhưng có điều kiện chặn`,
        body: 'Bot vẫn trả lời khách trên các page này dù chưa đủ điều kiện. Xem tab «Đang chạy».' }));
    }
    $('#bang-tin').innerHTML = kh.length ? `<div class="duoi-5">${kh.join('')}</div>` : '';

    veDem(d.dem); veDieuKien(d.dieuKien); veLoc(); veBang(); veNguonSo(d);
  } catch (e) {
    $('#dem').innerHTML = '';
    $('#bang-tin').innerHTML = `<div class="duoi-5">${canhBao({ level: 'error', title: 'Không đọc được điều kiện sẵn sàng',
      body: 'Màn này TỪ CHỐI hiện bảng rỗng — một bảng rỗng ở đây trông y như «mọi page đều ổn».',
      detail: [e.message] })}</div>`;
    $('#bang').innerHTML = emptyState({ icon: 'circle-alert', title: 'Không đọc được cửa kiểm',
      body: 'Kiểm kết nối sang tiến trình bot rồi tải lại trang.' });
  }
}

tai();
</script>
<script src="/chung/dieu-huong.js"></script>
</body>
</html>
