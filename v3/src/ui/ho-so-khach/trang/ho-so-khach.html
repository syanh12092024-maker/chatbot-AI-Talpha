<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Khách hàng — AI Closer</title>
<!-- Dựng trên hệ kiểu. KHÔNG CSS riêng — trước lượt này là 47 dòng. Bốn dải cảnh báo cùng
     một sắc vàng → cảnh báo theo mức của hệ; ba «kênh» vẽ bằng emoji ✅/⛔ → hàng tính năng
     có huy hiệu trạng thái (mục N: kênh chưa nối KHÔNG được trông như đang chạy). -->
<link rel="stylesheet" href="/chung/kieu.css" data-ds="v3">
<!-- Hàm dựng thành phần (window.UI). ĐỒNG BỘ, KHÔNG `defer`: khung ứng dụng ở cuối trang
     lấy biểu tượng từ đây — `defer` chạy SAU script cuối trang, khung sẽ mất biểu tượng. -->
<script src="/chung/ui.js"></script>
</head>
<body>
<header>
  <h1>Khách hàng</h1>
  <span class="sub">Gộp theo số điện thoại — một người mua nhiều lần chỉ là một dòng.</span>
</header>

<main>
  <div id="bang-tin" aria-live="polite"></div>

  <section class="section table-wrap" aria-labelledby="tieu-khach">
    <div class="table-toolbar">
      <h2 id="tieu-khach" class="sr-only">Khách</h2>
      <label for="tim" class="sr-only">Tìm khách</label>
      <input type="search" id="tim" placeholder="Số điện thoại hoặc tên khách…" autocomplete="off">
      <span class="table-count" id="hSo"></span>
    </div>
    <div id="bang"><div class="empty-state"><span class="skeleton"></span></div></div>
    <div id="phanTrang"></div>
  </section>

  <section class="section" aria-labelledby="tieu-kenh">
    <div class="section-header"><div>
      <h2 id="tieu-kenh">Ba kênh dữ liệu khách</h2>
      <div class="section-desc">Kênh nào gộp được về một người, kênh nào chưa nối.</div>
    </div></div>
    <div class="panel" id="kenh"></div>
  </section>
</main>

<script>
const { esc, text, statusBadge, button, alert: canhBao, emptyState, formatNumber } = window.UI;
const $ = (s) => document.querySelector(s);
const d0 = (n) => (n == null ? '—' : formatNumber(n));

let trang = 0, tim = '', hen = null;

async function goi(u) {
  const r = await fetch(u, { credentials: 'same-origin', headers: { Accept: 'application/json' } });
  if (r.status === 401) { location.href = '/dang-nhap?tiep=' + encodeURIComponent(location.pathname); return null; }
  const j = await r.json().catch(() => null);
  if (!r.ok || !j || j.ok === false) throw new Error((j && j.thongDiep) || 'Máy chủ trả ' + r.status + '.');
  return j;
}

function veKenh(ds) {
  $('#kenh').innerHTML = ds.map((k) => `
    <div class="feature-row" data-state="${k.noiDuoc ? 'on' : 'off'}">
      <div>
        <div class="feature-name">${esc(k.ten)} <span class="meta">· khoá gộp: ${text(String(k.khoa))}</span></div>
        <div class="feature-desc">${text(k.noi)}</div>
        ${k.diTiep ? `<div class="feature-reason">${text(k.diTiep)}</div>` : ''}
      </div>
      ${statusBadge(k.noiDuoc ? 'feature_on' : 'feature_unavailable', { label: k.noiDuoc ? `Nối được · ${d0(k.so)}` : 'Chưa nối' })}
    </div>`).join('');
}

function veBangTin(d) {
  const k = d.dem;
  const kh = [];
  if (k.soBiTach) {
    kh.push(canhBao({ level: 'info', title: `${d0(k.soBiTach)} người đang nằm ở nhiều dòng khách khác nhau`,
      body: 'Màn này đã gộp theo số điện thoại. Không gộp thì cùng một người hiện nhiều lần với nhiều lịch sử mua khác nhau.' }));
  }
  if (k.soKhongCoSo) {
    kh.push(canhBao({ level: 'warning', title: `${d0(k.soKhongCoSo)} dòng khách không có số điện thoại`,
      body: 'Không gộp được nên không nằm trong bảng dưới — đây là khách có thật, chỉ là chưa đủ khoá để gộp.' }));
  }
  if (k.donKhongQuyDuoc) {
    kh.push(canhBao({ level: 'warning', title: `${d0(k.donKhongQuyDuoc)} đơn chưa nối được về khách nào`,
      body: 'Những đơn đó không được tính vào số đơn và tiền của bất kỳ khách nào trong bảng.' }));
  }
  if (k.chamTran) {
    kh.push(canhBao({ level: 'warning', title: 'Đã đọc tới trần',
      body: 'Bảng dưới là MỘT PHẦN, không phải toàn bộ. Dùng ô tìm để thu hẹp.' }));
  }
  $('#bang-tin').innerHTML = kh.length ? `<div class="duoi-5">${kh.join('')}</div>` : '';
}

function veBang(d) {
  $('#hSo').textContent = `${d0(d.trang.tong)} người · ${d0(d.dem.soDongKhach)} dòng khách`;
  if (!d.khach.length) {
    $('#bang').innerHTML = emptyState({ icon: tim ? 'search' : 'inbox',
      title: tim ? 'Không khách nào khớp' : (d.trong ? d.trong.noi : 'Chưa có khách nào'),
      body: tim ? 'Xoá chữ trong ô tìm để xem lại tất cả.' : (d.trong && d.trong.diTiep ? d.trong.diTiep : '') });
    $('#phanTrang').innerHTML = '';
    return;
  }
  $('#bang').innerHTML = `<table class="data-table"><thead><tr>
      <th scope="col">Số điện thoại</th><th scope="col">Tên</th><th scope="col" class="num">Đơn</th>
      <th scope="col">Hoàn</th><th scope="col" class="num">Tiền</th><th scope="col">Luồng</th>
    </tr></thead><tbody>${d.khach.map((x) => `
    <tr>
      <td><span class="manh tabular">${esc(x.so)}</span>
        ${x.soDongGop > 1 ? ` <span class="badge" title="Cùng một số điện thoại, nhiều dòng trong bảng khách">Gộp ${d0(x.soDongGop)} dòng</span>` : ''}</td>
      <td>${x.ten ? esc(x.ten) : '<span class="text-muted">—</span>'}
        ${x.thiTruong ? `<div class="meta">${esc(x.thiTruong)}</div>` : ''}</td>
      <td class="num manh">${d0(x.soDon)}</td>
      <td>${x.soDonHoan
        ? statusBadge('needs_attention', { label: `${d0(x.soDonHoan)} đơn${x.tiLeHoan != null ? ` · ${x.tiLeHoan}%` : ''}` })
        : '<span class="text-muted">0</span>'}</td>
      <td class="num">${x.soDonCoTien ? d0(x.tongTien) : '<span class="text-muted">—</span>'}
        ${!x.tienDayDu && x.soDon ? `<div class="meta">${d0(x.soDonCoTien)}/${d0(x.soDon)} đơn có tiền</div>` : ''}</td>
      <td class="meta">${x.luong.map(esc).join(', ') || '—'}</td>
    </tr>`).join('')}</tbody></table>`;
}

function vePhanTrang(t) {
  const soTrang = Math.ceil(t.tong / t.moiTrang);
  if (soTrang <= 1) { $('#phanTrang').innerHTML = ''; return; }
  $('#phanTrang').innerHTML = `<div class="pagination">
    <span>${formatNumber(t.hienTai * t.moiTrang + 1)}–${formatNumber(Math.min((t.hienTai + 1) * t.moiTrang, t.tong))} / ${d0(t.tong)} người</span>
    <span class="hang">${button('Trước', { size: 'sm', id: 'tr', disabled: t.hienTai <= 0 })}
      ${button('Sau', { size: 'sm', id: 'sa', disabled: t.hienTai >= soTrang - 1 })}</span>
  </div>`;
  const a = $('#tr'), b = $('#sa');
  if (a) a.onclick = () => { trang -= 1; tai(); };
  if (b) b.onclick = () => { trang += 1; tai(); };
}

async function tai() {
  try {
    const d = await goi(`/api/ho-so-khach?trang=${trang}&tim=${encodeURIComponent(tim)}`);
    if (!d) return;
    veBangTin(d); veKenh(d.kenh || []); veBang(d); vePhanTrang(d.trang);
  } catch (e) {
    $('#bang-tin').innerHTML = `<div class="duoi-5">${canhBao({ level: 'error', title: 'Không đọc được danh sách khách', body: e.message })}</div>`;
    $('#bang').innerHTML = emptyState({ icon: 'circle-alert', title: 'Không tải được', body: 'Kiểm kết nối rồi tải lại trang.' });
  }
}

$('#tim').addEventListener('input', (e) => {
  clearTimeout(hen);
  hen = setTimeout(() => { tim = e.target.value.trim(); trang = 0; tai(); }, 250);
});

tai();
</script>
<script src="/chung/dieu-huong.js"></script>
</body>
</html>
