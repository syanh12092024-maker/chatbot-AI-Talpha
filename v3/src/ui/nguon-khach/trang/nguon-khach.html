<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Khách vào từ đâu — AI Closer</title>
<!-- Dựng trên hệ kiểu. KHÔNG CSS riêng — trước lượt này là 46 dòng.
     ⚠️ HAI LUẬT RIÊNG CỦA MÀN NÀY, giữ nguyên:
        ① Số 37,4% là số ĐO CŨ trong tài liệu, không phải chỉ số đang sống — chỗ nào nhắc nó
          cũng phải có nhãn «số cũ» ngay cạnh (ca ①c của `nguon-khach.test.mjs` canh).
        ② Phễu là ẢNH CHỤP chỗ đứng hiện tại, KHÔNG phải tỉ lệ rơi theo thời gian — nên
          thanh ngang chỉ so độ lớn giữa các bậc, không có mũi tên «rơi bao nhiêu phần trăm». -->
<link rel="stylesheet" href="/chung/kieu.css" data-ds="v3">
<!-- Hàm dựng thành phần (window.UI). ĐỒNG BỘ, KHÔNG `defer`: khung ứng dụng ở cuối trang
     lấy biểu tượng từ đây — `defer` chạy SAU script cuối trang, khung sẽ mất biểu tượng. -->
<script src="/chung/ui.js"></script>
</head>
<body>
<header>
  <h1>Khách vào từ đâu</h1>
  <span class="sub">Hai luồng bán chạy song song và chỉ gặp nhau ở POS.</span>
  <span class="sp"></span>
  <span id="khoang"></span>
</header>

<main>
  <div id="bang-tin" aria-live="polite"></div>

  <section class="section" aria-labelledby="tieu-luong">
    <div class="section-header"><div>
      <h2 id="tieu-luong">Hai luồng chạy song song</h2>
      <div class="section-desc" id="dich"></div>
    </div></div>
    <ul class="item-list" id="luong"><li class="item"><div><span class="skeleton"></span></div></li></ul>
  </section>

  <section class="section" aria-labelledby="tieu-roi">
    <div class="section-header"><div>
      <h2 id="tieu-roi">Chỗ rơi</h2>
      <div class="section-desc">Đơn từ trang bán hàng không được gửi WhatsApp — số cũ trong tài liệu: 37,4%.</div>
    </div></div>
    <div id="choRoi"></div>
  </section>

  <section class="section" aria-labelledby="tieu-pheu">
    <div class="section-header"><div>
      <h2 id="tieu-pheu">Hội thoại đang đứng ở đâu</h2>
      <div class="section-desc" id="hPheu">Ảnh chụp chỗ đứng hiện tại, không phải số đếm trong một khoảng ngày.</div>
    </div></div>
    <div id="pheu"></div>
  </section>
</main>

<script>
const { esc, text, statusBadge, alert: canhBao, emptyState, formatNumber } = window.UI;
const $ = (s) => document.querySelector(s);
const d0 = (n) => (n == null ? '—' : formatNumber(n));

async function goi(u) {
  const r = await fetch(u, { credentials: 'same-origin', headers: { Accept: 'application/json' } });
  if (r.status === 401) { location.href = '/dang-nhap?tiep=' + encodeURIComponent(location.pathname); return null; }
  const j = await r.json().catch(() => null);
  if (!r.ok || !j || j.ok === false) throw new Error((j && j.thongDiep) || 'Máy chủ trả ' + r.status + '.');
  return j;
}

function veLuong(ds) {
  $('#luong').innerHTML = ds.map((l) => `<li class="item">
    <div class="item-lead"${l.coDuLieu ? '' : ' data-muted'}>${d0(l.soDon)}</div>
    <div>
      <div class="item-title">${esc(l.ten)}</div>
      <div class="item-desc">${esc(l.moTa)}</div>
      <div class="item-detail">${l.tienDayDu && l.soDonCoTien
        ? `Tổng tiền ${d0(l.tongTien)}`
        : `${d0(l.soDonCoTien)}/${d0(l.soDon)} đơn có tổng tiền — số tiền chưa đủ để cộng`}</div>
    </div>
    <div class="item-trail">${l.coDuLieu ? '' : statusBadge('unknown', { label: 'Chưa có dữ liệu' })}</div>
  </li>`).join('');
}

function veChoRoi(c) {
  if (!c.doDuoc) {
    // KHÔNG hiện 37,4% như một chỉ số đang sống — nó là số đo cũ, và nhãn «số cũ» đi kèm.
    $('#choRoi').innerHTML = `<div class="panel"><div class="feature-row" data-state="off">
      <div><div class="feature-name">Chưa đo lại được chỗ rơi <span class="meta">· số cũ ${(c.taiLieuNoi * 100).toFixed(1).replace('.', ',')}%</span></div>
        <div class="feature-desc">${text(c.noi)}</div>
        <div class="feature-reason">${text(c.diTiep)}</div></div>
      ${statusBadge('unknown', { label: 'Chưa đo được' })}
    </div></div>`;
    return;
  }
  $('#choRoi').innerHTML = canhBao({ level: 'warning',
    title: `${d0(c.soKhongGui)}/${d0(c.soDonTrang)} đơn từ trang bán hàng chưa được gửi WhatsApp — ${Math.round(c.tiLe * 100)}%`,
    body: `Số cũ trong tài liệu là ${(c.taiLieuNoi * 100).toFixed(1).replace('.', ',')}%.`,
    detail: c.lyDo && c.lyDo.length ? [`Lý do: ${c.lyDo.join(' · ')}`] : [] });
}

function vePheu(p) {
  if (!p.docDuoc) {
    $('#pheu').innerHTML = `<div class="panel"><div class="feature-row" data-state="off">
      <div><div class="feature-name">Chưa đọc được phân bố hội thoại</div>
        <div class="feature-desc">${text(p.noi)}</div>
        <div class="feature-reason">${text(p.diTiep)}</div></div>
      ${statusBadge('unknown', { label: 'Chưa đọc được' })}
    </div></div>`;
    return;
  }
  $('#hPheu').textContent = `${d0(p.tong)} hội thoại · toàn hệ, không cắt theo team · ảnh chụp chỗ đứng hiện tại`;
  const max = Math.max(...p.bac.map((b) => b.so), 1);
  $('#pheu').innerHTML = `<div class="panel">
    <div class="bar-list">${p.bac.map((b) => `<div class="bar-row">
      <span class="bar-name">${esc(b.ten)}</span>
      <progress max="${max}" value="${b.so}" aria-label="${esc(b.ten)}: ${d0(b.so)} hội thoại"></progress>
      <span class="bar-value">${d0(b.so)}</span>
    </div>`).join('')}</div>
    ${Object.keys(p.theoChuSoHuu || {}).length ? `<div class="page-note">Ai đang giữ: ${
      Object.entries(p.theoChuSoHuu).map(([k, v]) => `${esc(k)} ${d0(v)}`).join(' · ')}</div>` : ''}
  </div>`
  + (p.canhBao ? `<div class="tren-3">${canhBao({ level: 'info', body: p.canhBao })}</div>` : '');
}

async function tai() {
  try {
    const d = await goi('/api/nguon-khach');
    if (!d) return;
    if (d.khoang) {
      $('#khoang').innerHTML = `<span class="badge" title="${esc(d.khoang.noi || '')}">Khoảng đo: ${esc(d.khoang.chu)}</span>`;
    }
    const kh = [];
    if (d.chamTran && d.chamTran.co) kh.push(canhBao({ level: 'warning', title: 'Đã đọc tới trần', body: d.chamTran.noi }));
    // Tiêu đề nói ĐIỀU CẦN NHỚ, không lặp lại cái huy hiệu khoảng đo đã nói ở đầu trang.
    if (d.khoang && d.khoang.canhBao) kh.push(canhBao({ level: 'info', title: 'Đây là ảnh chụp, không phải tỉ lệ rơi', body: d.khoang.canhBao }));
    $('#bang-tin').innerHTML = kh.length ? `<div class="duoi-5">${kh.join('')}</div>` : '';

    $('#dich').innerHTML = esc(d.gapNhauO)
      + (d.donKhac ? ` · ${d0(d.donKhac.so)} đơn mang nguồn khác: ${d.donKhac.nguon.map(esc).join(', ')}` : '');
    veLuong(d.luong);
    veChoRoi(d.choRoi);
    vePheu(d.pheu);
  } catch (e) {
    $('#bang-tin').innerHTML = `<div class="duoi-5">${canhBao({ level: 'error', title: 'Không đọc được nguồn khách', body: e.message })}</div>`;
    $('#luong').innerHTML = '';
    $('#pheu').innerHTML = emptyState({ icon: 'circle-alert', title: 'Không tải được', body: 'Kiểm kết nối rồi tải lại trang.' });
  }
}

tai();
</script>
<script src="/chung/dieu-huong.js"></script>
</body>
</html>
