<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Đoạn chữ gửi cho AI — AI Closer</title>
<!-- Dựng trên hệ kiểu. KHÔNG CSS riêng — trước lượt này là 81 dòng. Màn CHỈ ĐỌC: nó cho xem
     đúng năm khối mà `src/chat/rap-prompt.js` ghép lại, không dựng lại bản thứ hai.
     «Chưa biết đường chat có dùng bốn khối này không» là trạng thái CHƯA BIẾT — vẽ bằng
     cảnh báo warning, không bao giờ bằng dấu ✅ (luật «chưa đo được ≠ đạt»). -->
<link rel="stylesheet" href="/chung/kieu.css" data-ds="v3">
<!-- Hàm dựng thành phần (window.UI). ĐỒNG BỘ, KHÔNG `defer`: khung ứng dụng ở cuối trang
     lấy biểu tượng từ đây — `defer` chạy SAU script cuối trang, khung sẽ mất biểu tượng. -->
<script src="/chung/ui.js"></script>
</head>
<body>
<header>
  <h1>Đoạn chữ gửi cho AI</h1>
  <span class="sub">Đúng năm khối mà tiến trình bot ghép lại rồi gửi cho model. Màn này chỉ đọc.</span>
  <span class="sp"></span>
  <span id="dauPhai"></span>
</header>

<main>
  <div id="bang-tin" aria-live="polite"></div>

  <section class="section panel" aria-labelledby="tieu-chon">
    <div class="section-header"><h2 id="tieu-chon">Chọn page</h2>
      <span class="text-muted text-sm" id="tomTatPage"></span></div>
    <div class="hang">
      <label for="oTim" class="sr-only">Lọc page</label>
      <input class="hep" id="oTim" type="search" placeholder="Tên page hoặc id Facebook…" autocomplete="off">
      <label for="chonPage" class="sr-only">Page</label>
      <select id="chonPage" class="gian"></select>
    </div>
  </section>

  <div id="ketQua"></div>
</main>

<script>
const { esc, text, statusBadge, button, alert: canhBao, emptyState, formatNumber: so } = window.UI;
const $ = (s) => document.querySelector(s);

let D = null, TIM = '', LOI = null;

async function goi(duong, tuyChon) {
  const r = await fetch(duong, { headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' }, ...tuyChon });
  if (r.status === 401) { location.href = '/dang-nhap?tiep=' + encodeURIComponent(location.pathname); return null; }
  let d = null; try { d = await r.json(); } catch { /* null */ }
  if (!r.ok || !d || d.ok === false) throw new Error((d && d.thongDiep) || ('Máy chủ trả ' + r.status + '.'));
  return d;
}

/** Ba trạng thái, ba câu KHÁC nhau — «chưa biết» không được trông giống «đang bật». */
function veBangTin() {
  const kh = [];
  if (LOI) kh.push(canhBao({ level: 'error', title: LOI.title, body: LOI.body }));
  const hl = D && D.hieuLuc;
  if (hl) {
    kh.push(canhBao({
      level: hl.coBat === true ? 'success' : hl.coBat === false ? 'error' : 'warning',
      title: hl.coBat === true ? 'Đường chat đang dùng đúng các khối này'
        : hl.coBat === false ? 'Đường chat KHÔNG dùng các khối này'
        : 'Chưa biết đường chat có dùng các khối này không',
      body: hl.noi,
      detail: [hl.core && hl.core.noi],
    }));
  }
  kh.push(canhBao({ level: 'info', title: 'Màn này chỉ đọc',
    body: 'Năm khối dưới đây đọc từ đúng bộ ghép prompt của tiến trình bot, không phải một bản dựng lại. Sửa khối nào thì sang màn của khối đó.' }));
  $('#bang-tin').innerHTML = `<div class="duoi-5">${kh.join('')}</div>`;
}
function baoLoi(title, body) { LOI = { title, body }; veBangTin(); }

function veKetQua() {
  $('#dauPhai').innerHTML = statusBadge(D.page.botAiBat ? 'bot_on' : 'bot_off',
    { label: D.page.botAiBat ? 'Bot đang chạy' : 'Bot tắt' });

  const mt = D.mauThuan.length ? `<section class="section panel" aria-labelledby="tieu-mt">
      <div class="section-header"><div><h2 id="tieu-mt">Chỗ đáng đọc lại</h2>
        <div class="section-desc">Dò theo từ khoá: bắt được mâu thuẫn thô, bỏ sót kiểu tinh vi. Đây là gợi ý, không phải phán quyết.</div></div>
        ${statusBadge('needs_attention', { label: `${so(D.mauThuan.length)} chỗ` })}</div>
      <div class="stack">${D.mauThuan.map((m) => `<div>
        <div class="manh">${esc(m.tenA)} ↔ ${esc(m.tenB)}</div>
        <div class="text-muted text-sm">${esc(m.chu)}</div>
        ${m.trichA ? `<pre class="code-block tren-2">${esc(m.tenA)}: …${esc(m.trichA)}…</pre>` : ''}
        ${m.trichB ? `<pre class="code-block tren-2">${esc(m.tenB)}: …${esc(m.trichB)}…</pre>` : ''}
      </div>`).join('')}</div>
    </section>` : '';

  $('#ketQua').innerHTML = `
    <section class="section" aria-labelledby="tieu-khoi">
      <div class="section-header"><div><h2 id="tieu-khoi">Năm khối của prompt</h2>
        <div class="section-desc">Tổng ≈ ${so(D.tongToken)} token mỗi lượt chat${D.soKhoiThieu ? ` · ${so(D.soKhoiThieu)} khối đang thiếu` : ''}</div></div></div>
      <div class="stack">${D.khoi.map((k) => `
        <section class="panel">
          <div class="section-header"><div>
            <h3>${esc(k.ten)}</h3>
            <div class="section-desc">Ai sửa được: ${text(k.aiSua)}</div>
          </div>
          <div class="hang">${k.thieu
            ? statusBadge('blocked', { label: 'Đang thiếu' })
            : `<span class="text-muted text-sm tabular">≈ ${so(k.uocToken)} token${k.phu ? ` · ${esc(k.phu)}` : ''}</span>`}</div>
          </div>
          ${k.thieu
            ? `${canhBao({ level: 'warning', body: k.lyDoThieu,
                actionsHtml: k.duongSua ? button('Sang màn sửa', { href: k.duongSua, size: 'sm' }) : '' })}`
            : `<div class="bar-row duoi-3">
                 <span class="bar-name">So với thiết kế</span>
                 <progress max="2" value="${Math.min(2, k.soVoiThietKe)}" aria-label="Gấp ${k.soVoiThietKe} lần cỡ thiết kế"></progress>
                 <span class="bar-value">${String(k.soVoiThietKe).replace('.', ',')}×</span>
               </div>
               <div class="field-hint duoi-2">Thiết kế §6 cho khối này là ${so(k.tokenThietKe)} token.</div>
               <pre class="code-block">${esc(k.noiDung)}</pre>`}
        </section>`).join('')}
      </div>
    </section>${mt}`;
}

async function napPage() {
  const d = await goi('/api/prompt-page/danh-sach?tim=' + encodeURIComponent(TIM));
  if (!d) return;
  $('#tomTatPage').textContent = (d.soKhop === d.soTong ? `${so(d.soTong)} page` : `${so(d.soKhop)}/${so(d.soTong)} page khớp`)
    + (d.catBot ? ` · còn ${so(d.catBot)} không hiện` : '');
  const cu = $('#chonPage').value;
  $('#chonPage').innerHTML = d.page.length
    ? d.page.map((p) => `<option value="${esc(p.pageId)}">${esc(p.ten || '(chưa có tên)')} — ${esc(p.pageId)}${p.botAiBat ? ' · bot đang chạy' : ''}</option>`).join('')
    : '<option value="">Không page nào khớp</option>';
  if (cu && d.page.some((p) => p.pageId === cu)) $('#chonPage').value = cu;
  if ($('#chonPage').value) await napPrompt();
  else {
    $('#ketQua').innerHTML = emptyState({ icon: 'inbox', title: 'Team này chưa có page nào để xem prompt',
      actionsHtml: button('Sang Người và team', { href: '/cau-hinh-team', size: 'sm' }) });
  }
}

async function napPrompt() {
  LOI = null;
  try {
    const d = await goi('/api/prompt-page/' + encodeURIComponent($('#chonPage').value));
    if (!d) return;
    D = d; veBangTin(); veKetQua();
  } catch (e) {
    baoLoi('Không đọc được prompt của page này', e.message);
    $('#ketQua').innerHTML = '';
  }
}

$('#chonPage').addEventListener('change', napPrompt);
let hen = null;
$('#oTim').addEventListener('input', (e) => {
  clearTimeout(hen);
  hen = setTimeout(() => { TIM = e.target.value.trim(); napPage(); }, 250);
});

napPage().catch((e) => baoLoi('Không tải được danh sách page', e.message));
</script>
<script src="/chung/dieu-huong.js"></script>
</body>
</html>
