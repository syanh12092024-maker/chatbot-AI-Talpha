<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>So hai bản kịch bản — AI Closer v3</title>
<style>

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:16px;overflow:hidden}
  .panel h2{font-size:13px;margin:0;padding:11px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .panel h2 .hint{font-weight:400;color:var(--muted);font-size:11.5px}
  .panel h2 .sp{flex:1}
  .than{padding:14px 15px}

  /* hai luồng song song, gặp nhau ở đích */
  .so{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .so .l{border:1px solid var(--line);border-top:4px solid var(--pri);border-radius:10px;padding:14px 15px}
  .so .l:nth-child(2){border-top-color:var(--tim)}
  .so .l .n{font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--pri)}
  .so .l:nth-child(2) .n{color:var(--tim)}
  .so .l .ten{font-weight:600;margin:4px 0 3px}
  .so .l .mo{color:var(--muted);font-size:12px;line-height:1.55}
  .so .l .ph{margin-top:7px;font-size:11.5px;color:var(--muted)}
  .dich{margin-top:12px;text-align:center;background:var(--nen-2);border:1px dashed var(--vien-dam);
        border-radius:10px;padding:12px 15px;line-height:1.6;font-size:12.5px;color:var(--muted)}
  .dich b{color:var(--ink)}

  .bac{display:grid;gap:7px}
  .bac .b{display:flex;align-items:center;gap:11px}
  .bac .b .t{width:132px;flex:0 0 auto;font-size:12.5px}
  .bac .b .thanh{flex:1;height:22px;background:var(--nen-3);border-radius:5px;overflow:hidden;position:relative}
  .bac .b .thanh i{display:block;height:100%;background:var(--pri);opacity:.8}
  .bac .b .s{width:78px;flex:0 0 auto;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

  .canh{background:var(--warnSoft);border:1px solid var(--luu-vien);color:var(--luu-chu);border-radius:var(--r);
        padding:11px 14px;margin-bottom:14px;line-height:1.6;font-size:12.5px}
  .mu2{background:var(--nen-2);border:1px dashed var(--vien-dam);border-radius:var(--r);padding:14px 16px;line-height:1.65}
  .mu2 .ti{font-weight:600;margin-bottom:4px}
  .mu2 .di{margin-top:8px;font-size:12px;color:var(--muted)}
  .cu{display:inline-block;background:var(--nen-3);color:var(--muted);border-radius:20px;
      padding:2px 9px;font-size:11.5px;font-weight:600}

  .nho{color:var(--muted);font-size:11.5px;line-height:1.55}
  code{background:var(--nen-3);padding:1px 5px;border-radius:4px;font-size:11.5px;
       font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .trong{padding:34px 20px;text-align:center;color:var(--muted);line-height:1.6}
  .trong .ti{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:6px}

  @media (max-width:720px){
    header{padding:12px 14px} main{padding:12px 14px 50px}
    .than{padding:12px} .so{grid-template-columns:1fr}
    .bac .b .t{width:92px;font-size:11.5px} .bac .b .s{width:62px}
  }
</style>
</head>
<body>
<header>
  <h1>So hai bản kịch bản</h1>
  <span class="sub" id="hTeam">…</span>
  <span class="sp"></span>

</header>

<main>
  <div class="panel">
    <h2>Hai điều kiện để so được <span class="hint">thiếu cái nào thì thiếu vì lý do khác nhau</span></h2>
    <div class="than"><div class="bac" id="dieuKien"></div></div>
  </div>

  <div class="panel">
    <h2>So hai bản <span class="hint" id="hNguong"></span></h2>
    <div class="than"><div id="ketQua"></div></div>
  </div>
</main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const d0 = (n) => (n == null ? '—' : Number(n).toLocaleString('vi-VN'));

async function tai() {
  try {
    const r = await fetch('/api/hieu-qua', { credentials: 'same-origin' });
    const d = await r.json();
    if (!r.ok || d.ok === false) throw new Error(d.thongDiep || 'Lỗi ' + r.status);
    $('#hTeam').textContent = 'team ' + (d.teamId || '?');

    $('#dieuKien').innerHTML = d.dieuKien.map((x) => `
      <div class="mu2" style="${x.du ? 'border-style:solid;border-color:var(--ok);background:#fbfefc' : ''}">
        <div class="ti">${x.du ? '✅' : '⛔'} ${esc(x.ten)}</div>
        <div>${esc(x.noi.replace(/`/g, ''))}</div>
        ${x.diTiep ? `<div class="di">👉 ${esc(x.diTiep.replace(/`/g, ''))}</div>` : ''}
      </div>`).join('');

    const k = d.ketQua;
    if (!k.docDuoc) {
      $('#ketQua').innerHTML = `<div class="mu2"><div class="ti">— chưa đọc được</div>
        <div>${esc(k.noi.replace(/`/g, ''))}</div></div>`;
      return;
    }
    $('#hNguong').textContent = `cần ít nhất ${k.nguong} khách mỗi bản mới kết luận`;
    if (!k.dsBan.length) {
      $('#ketQua').innerHTML = `<div class="mu2"><div class="ti">— chưa có gì để so</div>
        <div>${esc(d.trong ? d.trong.noi : '')}</div>
        <div class="di">👉 ${esc(d.trong ? d.trong.diTiep : '')}</div></div>`;
      return;
    }
    $('#ketQua').innerHTML = `
      ${k.ketLuanChung ? `<div class="canh">⚖️ ${esc(k.ketLuanChung)}</div>` : ''}
      <div class="bao"><table>
        <thead><tr><th>Bản</th><th class="p">Khách</th><th class="p">Lượt</th>
          <th class="p">Chốt</th><th>Tỉ lệ chốt</th></tr></thead>
        <tbody>${k.dsBan.map((b) => `
          <tr><td><b>${esc(b.ban)}</b></td>
            <td class="p">${d0(b.soKhach)}</td>
            <td class="p">${d0(b.soLuot)}</td>
            <td class="p">${d0(b.soChot)}</td>
            <td>${b.duMau
              ? `<b>${Math.round(b.tiLeChot * 1000) / 10}%</b>`
              : `<span class="cu">CHƯA KẾT LUẬN — còn thiếu ${b.conThieu} khách</span>`}</td>
          </tr>`).join('')}</tbody></table></div>`;
  } catch (e) {
    $('#ketQua').innerHTML = `<div class="canh"><b>Không đọc được:</b> ${esc(e.message)}</div>`;
  }
}
tai();
</script>
<script src="/chung/dieu-huong.js"></script>
</body>
</html>
