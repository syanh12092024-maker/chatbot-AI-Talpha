<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>So hai bản kịch bản — AI Closer</title>
<!-- Dựng trên hệ kiểu. KHÔNG CSS riêng — trước lượt này là 39 dòng. Luật riêng của màn giữ
     nguyên: bản CHƯA ĐỦ MẪU không được hiện tỉ lệ chốt — một tỉ lệ trên mười khách đọc y hệt
     một tỉ lệ trên nghìn khách, và người ta sẽ chốt theo nó. -->
<link rel="stylesheet" href="/chung/kieu.css" data-ds="v3">
<!-- Hàm dựng thành phần (window.UI). ĐỒNG BỘ, KHÔNG `defer`: khung ứng dụng ở cuối trang
     lấy biểu tượng từ đây — `defer` chạy SAU script cuối trang, khung sẽ mất biểu tượng. -->
<script src="/chung/ui.js"></script>
</head>
<body>
<header>
  <h1>So hai bản kịch bản</h1>
  <span class="sub">Bản nào chốt tốt hơn — chỉ kết luận khi đủ mẫu, còn thiếu thì nói thẳng là chưa kết luận.</span>
</header>

<main>
  <div id="bang-tin" aria-live="polite"></div>

  <section class="section" aria-labelledby="tieu-dk">
    <div class="section-header"><div><h2 id="tieu-dk">Hai điều kiện để so được</h2>
      <div class="section-desc">Thiếu cái nào thì thiếu vì lý do khác nhau.</div></div></div>
    <div class="panel" id="dieuKien"></div>
  </section>

  <section class="section table-wrap" aria-labelledby="tieu-so">
    <div class="table-toolbar"><h2 id="tieu-so">So hai bản</h2>
      <span class="table-count" id="hNguong"></span></div>
    <div id="ketQua"><div class="empty-state"><span class="skeleton"></span></div></div>
  </section>
</main>

<script>
const { esc, text, statusBadge, alert: canhBao, emptyState, button, formatNumber } = window.UI;
const $ = (s) => document.querySelector(s);
const d0 = (n) => (n == null ? '—' : formatNumber(n));

async function tai() {
  try {
    const r = await fetch('/api/hieu-qua', { credentials: 'same-origin', headers: { Accept: 'application/json' } });
    if (r.status === 401) { location.href = '/dang-nhap?tiep=' + encodeURIComponent(location.pathname); return; }
    const d = await r.json();
    if (!r.ok || d.ok === false) throw new Error(d.thongDiep || 'Máy chủ trả ' + r.status + '.');

    $('#dieuKien').innerHTML = d.dieuKien.map((x) => `
      <div class="feature-row" data-state="${x.du ? 'on' : 'off'}">
        <div><div class="feature-name">${esc(x.ten)}</div>
          <div class="feature-desc">${text(x.noi)}</div>
          ${x.diTiep ? `<div class="feature-reason">${text(x.diTiep)}</div>` : ''}</div>
        ${statusBadge(x.du ? 'ready' : 'blocked', { label: x.du ? 'Đủ' : 'Chưa đủ' })}
      </div>`).join('');

    const k = d.ketQua;
    if (!k.docDuoc) {
      $('#hNguong').textContent = '';
      $('#ketQua').innerHTML = emptyState({ icon: 'triangle-alert', title: 'Chưa đọc được số để so',
        body: String(k.noi || '').replace(/`/g, '') });
      return;
    }
    $('#hNguong').textContent = `Cần ít nhất ${d0(k.nguong)} khách mỗi bản mới kết luận`;
    if (!k.dsBan.length) {
      $('#ketQua').innerHTML = emptyState({ icon: 'inbox', title: 'Chưa có gì để so',
        body: `${d.trong ? d.trong.noi : ''} ${d.trong && d.trong.diTiep ? d.trong.diTiep : ''}`.trim(),
        actionsHtml: button('Mở Kịch bản của page', { href: '/kich-ban', size: 'sm' }) });
      return;
    }

    $('#bang-tin').innerHTML = k.ketLuanChung
      ? `<div class="duoi-5">${canhBao({ level: 'info', title: 'Kết luận', body: k.ketLuanChung })}</div>` : '';

    // Bản CHƯA ĐỦ MẪU không hiện tỉ lệ: một tỉ lệ trên mười khách đọc y hệt một tỉ lệ trên
    // nghìn khách, và người đọc sẽ chốt theo nó.
    $('#ketQua').innerHTML = `<table class="data-table"><thead><tr>
        <th scope="col">Bản</th><th scope="col" class="num">Khách</th><th scope="col" class="num">Lượt</th>
        <th scope="col" class="num">Chốt</th><th scope="col">Tỉ lệ chốt</th>
      </tr></thead><tbody>${k.dsBan.map((b) => `
      <tr>
        <td class="manh">${esc(b.ban)}</td>
        <td class="num">${d0(b.soKhach)}</td>
        <td class="num">${d0(b.soLuot)}</td>
        <td class="num">${d0(b.soChot)}</td>
        <td>${b.duMau
          ? `<span class="manh tabular">${String(Math.round(b.tiLeChot * 1000) / 10).replace('.', ',')}%</span>`
          : statusBadge('unknown', { label: `Chưa kết luận — còn thiếu ${d0(b.conThieu)} khách` })}</td>
      </tr>`).join('')}</tbody></table>
      <div class="table-note">Bản chưa đủ mẫu KHÔNG hiện tỉ lệ: một tỉ lệ trên mười khách đọc y hệt một tỉ lệ trên nghìn khách.</div>`;
  } catch (e) {
    $('#bang-tin').innerHTML = `<div class="duoi-5">${canhBao({ level: 'error', title: 'Không đọc được số liệu so bản', body: e.message })}</div>`;
    $('#ketQua').innerHTML = emptyState({ icon: 'circle-alert', title: 'Không tải được', body: 'Kiểm kết nối rồi tải lại trang.' });
  }
}
tai();
</script>
<script src="/chung/dieu-huong.js"></script>
</body>
</html>
