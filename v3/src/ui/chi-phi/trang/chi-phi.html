<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chi phí AI — AI Closer</title>
<!-- Dựng trên hệ kiểu (mục M10: chi phí). KHÔNG CSS riêng — trước lượt này là 48 dòng. Sáu thẻ
     số rời → một hàng bốn chỉ số (mục M1: 4 là trần), số phụ đi vào dòng gợi ý dưới số chính.
     Bốn dải màu đầu trang (xanh · vàng · đỏ · xanh viền trái) → cảnh báo theo mức của hệ, và
     khoảng đo lên đầu trang cạnh tiêu đề: màn số liệu nào cũng phải nói nó đo trên khoảng nào.
     VE6b · 30/09 (bản vẽ 3b): bốn ô Mỗi đơn · Mỗi tin · Token mỗi lượt · Trúng cache (hai ô sau TOÀN HỆ — cầu không tách token
     đọc lại theo page) và ba tab Từng tin · Theo page · Theo model. Tổng tiền · lượt · đơn của team xuống thanh của tab Theo page. -->
<link rel="stylesheet" href="/chung/kieu.css" data-ds="v3">
<!-- Hàm dựng thành phần (window.UI). ĐỒNG BỘ, KHÔNG `defer`: khung ứng dụng ở cuối trang
     lấy biểu tượng từ đây — `defer` chạy SAU script cuối trang, khung sẽ mất biểu tượng. -->
<script src="/chung/ui.js"></script>
</head>
<body>
<header>
  <h1>Chi phí AI</h1>
  <span class="sub">Tiền gọi model theo page, đo tại tiến trình bot — nơi tiền thật sự bị tiêu.</span>
  <span class="sp"></span>
  <span id="khoangDau"></span>
</header>

<main>
  <div id="bang-tin" aria-live="polite"></div>

  <section class="section" aria-label="Tổng chi phí">
    <div id="dem"><div class="metric-row"><div class="metric"><span class="skeleton"></span></div></div></div>
    <div class="page-note tren-3" id="nguon"></div>
  </section>

  <div class="tabs" role="tablist" aria-label="Chi phí theo" id="thanhTab">
    <button type="button" class="tab" role="tab" id="t-tin" aria-controls="tab-tin" aria-selected="false" data-tab="tin" hidden>Từng tin</button>
    <button type="button" class="tab" role="tab" id="t-page" aria-controls="tab-page" aria-selected="true" data-tab="page">Theo page</button>
    <button type="button" class="tab" role="tab" id="t-model" aria-controls="tab-model" aria-selected="false" data-tab="model">Theo model</button>
  </div>

  <section class="section table-wrap" role="tabpanel" id="tab-tin" aria-labelledby="t-tin" hidden>
    <div class="table-toolbar"><h2>Từng tin</h2><span class="table-count" id="hTin"></span></div>
    <div id="bangTin"><span class="skeleton"></span></div>
    <!-- LL10 · 29/09: bản đủ (lọc page · khách · khoảng, gom theo khách/page/thị trường) ở màn Vận hành. -->
    <p class="page-note tren-3" id="chi-phi-tung-tin"><a href="/van-hanh-v3?tab=chi-phi-tin">Lọc theo page · khách · khoảng, gom theo khách / page / thị trường — ở Vận hành →</a></p>
  </section>

  <section class="section table-wrap" role="tabpanel" id="tab-page" aria-labelledby="t-page">
    <div class="table-toolbar"><h2 id="tieu-bang">Chi phí theo page</h2>
      <span class="table-count" id="hSo"></span></div>
    <div id="bang"></div>
  </section>

  <section class="section" role="tabpanel" id="tab-model" aria-labelledby="t-model" hidden>
    <div id="theoModel"></div>
  </section>
</main>

<script>
const { esc, text, statusBadge, alert: canhBao, emptyState, metricRow, formatNumber, formatVnd, nguonSo } = window.UI;
const $ = (s) => document.querySelector(s);
// Số CHƯA TÍNH ĐƯỢC hiện «—». «0 đồng» ở màn chi phí là câu dễ tin nhất và sai nhất.
const d0 = (n) => (n == null ? '—' : formatNumber(n));
const dong = (n) => (n == null ? '—' : formatVnd(n));

async function goi(u) {
  const r = await fetch(u, { credentials: 'same-origin', headers: { Accept: 'application/json' } });
  if (r.status === 401) { location.href = '/dang-nhap?tiep=' + encodeURIComponent(location.pathname); return null; }
  const j = await r.json().catch(() => null);
  if (!r.ok || !j || j.ok === false) throw new Error((j && j.thongDiep) || 'Máy chủ trả ' + r.status + '.');
  return j;
}

function veBangTin(d) {
  const kh = [];
  // Đốt tiền không ra đơn — cảnh báo chính của màn.
  if (d.dotTien && d.dotTien.so) {
    kh.push(canhBao({ level: 'warning',
      title: `${formatNumber(d.dotTien.so)} page tiêu tiền mà không ra đơn nào — tổng ${formatVnd(d.dotTien.tien)}`,
      body: d.dotTien.ds.map((p) => `${p.ten} (${formatVnd(p.tienVnd)} · ${formatNumber(p.soLuot)} tin)`).join(' · ') }));
  }
  // Hai sổ lệch nhau — nói ra, kèm số. Con số trên màn vẫn theo tiến trình bot.
  if (d.soAi && d.soAi.docDuoc && d.soAi.coLech) {
    kh.push(canhBao({ level: 'info', title: 'Sổ chi phí của v3 chưa khớp với tiến trình bot',
      body: `Sổ v3 ghi ${formatNumber(d.soAi.soLuot)} lượt / ${formatVnd(d.soAi.tienVnd)}; tiến trình bot đo được `
        + `${formatNumber(d.tong.soLuot)} lượt / ${formatVnd(d.tong.tienVnd)}. Màn này lấy theo tiến trình bot — nơi tiền thật sự bị tiêu.`,
      detail: [d.soAi.viSao] }));
  }
  if (d.soAi && !d.soAi.docDuoc) {
    kh.push(canhBao({ level: 'info', title: 'Chưa đối chiếu được với sổ chi phí của v3', detail: [d.soAi.noi] }));
  }
  $('#bang-tin').innerHTML = kh.length ? `<div class="duoi-5">${kh.join('')}</div>` : '';
}

function veDem(d) {
  const t = d.tong;
  // VE6b · bản vẽ 3b. «Token mỗi lượt» và «Trúng cache» tính trên TỔNG TOÀN HỆ của cầu (dòng page không tách token đọc lại cache) —
  // nhãn nói «toàn hệ». Trúng cache = đọc lại ÷ (vào + đọc lại): đúng định nghĩa cho ra 73,3% từ hồ sơ đo thật 3.053 · 8.390 của bản vẽ.
  const h = d.toanHe || {};
  const moiLuot = (x) => (h.soLuotDoThat > 0 && x != null ? Math.round(x / h.soLuotDoThat) : null);
  const [vao, docLai, ra] = [moiLuot(h.tokenVao), moiLuot(h.tokenDocLai), moiLuot(h.tokenRa)];
  const mau = (h.tokenVao ?? 0) + (h.tokenDocLai ?? 0);
  const trung = h.tokenVao != null && h.tokenDocLai != null && mau > 0 ? h.tokenDocLai / mau : null;
  $('#dem').innerHTML = metricRow([
    { label: 'Mỗi đơn ra được', value: dong(t.vndMoiDon),
      hint: t.tinMoiDon != null ? `${String(t.tinMoiDon).replace('.', ',')} tin cho một đơn` : '' },
    { label: 'Mỗi tin trả lời', value: dong(t.vndMoiTin),
      hint: (t.tiLeDoThat != null ? `${t.tiLeDoThat}% lượt có token đo thật` : 'Chưa có lượt nào đo thật') + ` · đích phiếu BH8: ≤ ${formatVnd(50)}` },
    { label: 'Token mỗi lượt · toàn hệ', value: vao == null ? '—' : `${d0(vao)} · ${d0(docLai)} · ${d0(ra)}`,
      hint: 'vào · đọc lại cache · ra — trên lượt đo thật' },
    { label: 'Trúng cache · toàn hệ', value: trung == null ? '—' : `${(trung * 100).toFixed(1).replace('.', ',')}%`,
      hint: 'đọc lại ÷ (vào + đọc lại)' },
  ]);
  // Lời khai nguồn (luật 8) xuống ô gập — mặt màn giữ đúng con số và câu người dùng cần.
  $('#nguon').innerHTML = nguonSo({
    dong: [
      { ten: 'Tiền model', tu: `đo tại tiến trình bot${d.nhaCungCap ? ` · nhà model: ${esc(d.nhaCungCap)}` : ''}` },
      { ten: 'Lượt không đo được token', tu: 'ước từ độ dài chữ, không phải số đo của nhà model' },
      { ten: 'Sổ tiền của cơ sở dữ liệu', tu: d.soAi && d.soAi.noi ? d.soAi.noi : 'chưa đối chiếu được' },
    ],
    chuY: d.khoang && d.khoang.canhBao ? d.khoang.canhBao : null,
  });
}

function veBang(d) {
  const ds = d.page.filter((p) => p.soLuot > 0);
  // VE6b: tổng tiền · lượt · đơn của TEAM (bốn ô trên nay theo bản vẽ) — không mất số nào của bản cũ.
  $('#hSo').innerHTML = `${esc(formatNumber(ds.length))} page có tiêu · nhiều tiền nhất lên trước · tổng ${esc(dong(d.tong.tienVnd))} · `
    + `${esc(d0(d.tong.soLuot))} lượt · ${esc(d0(d.tong.soDon))} đơn`
    + (d.tong.soDon === 0 ? ` ${statusBadge('blocked', { label: 'Chưa ra đơn nào' })}` : '');
  if (!ds.length) {
    $('#bang').innerHTML = emptyState({ icon: 'inbox', title: d.trong ? d.trong.noi : 'Chưa có lượt gọi model nào',
      body: d.trong && d.trong.diTiep ? d.trong.diTiep : '' });
    return;
  }
  $('#bang').innerHTML = `<table class="data-table"><thead><tr>
      <th scope="col">Page</th><th scope="col" class="num">Tiền</th><th scope="col" class="num">Tin</th>
      <th scope="col" class="num">Đơn</th><th scope="col" class="num">Mỗi tin</th><th scope="col" class="num">Mỗi đơn</th>
      <th scope="col" class="num">Đo thật</th><th scope="col">Marketer</th>
    </tr></thead><tbody>${ds.map((p) => `
    <tr>
      <td><div class="page-identity-name">${esc(p.ten)}</div>
        <div class="page-identity-sub">${esc(p.pageId)}${p.dotTienKhongRaDon ? ` · ${statusBadge('needs_attention', { label: 'Tiêu tiền, 0 đơn' })}` : ''}</div></td>
      <td class="num manh">${dong(p.tienVnd)}</td>
      <td class="num">${d0(p.soLuot)}</td>
      <td class="num">${d0(p.soDon)}</td>
      <td class="num">${dong(p.vndMoiTin)}</td>
      <td class="num">${p.soDon ? dong(p.vndMoiDon) : '—'}</td>
      <td class="num">${p.tiLeDoThat == null ? '—'
        : p.tiLeDoThat >= 80 ? `${p.tiLeDoThat}%`
        : `<span class="badge" data-variant="warning" title="Dưới 80% lượt có token đo thật — phần còn lại là ước lượng">${p.tiLeDoThat}% · ước</span>`}</td>
      <td>${p.marketer ? esc(p.marketer) : '<span class="text-muted">Chưa gán</span>'}</td>
    </tr>`).join('')}</tbody></table>
    <p class="field-hint tren-3">«Chặn bằng trả lời sẵn» theo page (bản vẽ): chưa có nguồn — mẫu trả lời sẵn chưa ghi page.</p>`;
}

/* ═══ VE6b · tab Theo model (bản vẽ 3b) — nói đúng cái đang có, không bịa bảng ═══ */
function veTheoModel(d) {
  $('#theoModel').innerHTML = `<div class="panel">
    <div class="feature-row" data-state="on"><div><div class="feature-name">Nhà model đang tính tiền</div>
      <div class="feature-desc">${d.nhaCungCap ? esc(d.nhaCungCap) : 'Cầu không nói tên nhà model.'} — toàn bộ tiền ở màn này đo tại tiến trình bot.</div></div>
      ${statusBadge(d.nhaCungCap ? 'ready' : 'unknown', { label: d.nhaCungCap ? 'Đang dùng' : 'Chưa rõ' })}</div>
    <div class="feature-row" data-state="off"><div><div class="feature-name">Lượt và tiền theo từng model</div>
      <div class="feature-desc">Chưa có nguồn — sổ tiền của tiến trình bot không tách theo model; sổ v3 có cột model nhưng chưa có đường gom.</div></div>
      ${statusBadge('unknown', { label: 'Chưa có nguồn' })}</div>
    <div class="feature-row" data-state="off"><div><div class="feature-name">Dự phòng khác nhà</div>
      <div class="feature-desc">Chưa chạy trên đường chat — chưa lượt nào chuyển sang model dự phòng, nên chưa có tiền để đếm.</div></div>
      ${statusBadge('unknown', { label: 'Chưa chạy' })}</div>
  </div>${CUA.model ? '<p class="page-note tren-3"><a href="/model-ai">Cấu hình model chính · dự phòng · bảng giá →</a></p>' : ''}`;
}

/* ═══ VE6b · tab Từng tin — sổ `so_ai` của v3 qua cửa của Vận hành (quản trị · quản lý). Máy chủ trả 100 lượt MỚI NHẤT;
   màn xếp ĐẮT NHẤT lên đầu TRONG 100 lượt ấy và nói rõ vậy. Sổ rỗng ⇒ nói vì sao, không hiện như «không tốn đồng nào». ═══ */
async function taiTungTin() {
  let d;
  try { d = await goi('/api/van-hanh/chi-phi-tin'); } catch (e) {
    $('#bangTin').innerHTML = canhBao({ level: 'warning', title: 'Chưa đọc được chi phí từng tin', body: e.message }); return;
  }
  const ds = [...(d && d.items) || []].sort((a, b) => (b.vnd ?? -1) - (a.vnd ?? -1));
  $('#hTin').textContent = ds.length ? `${formatNumber(ds.length)} lượt mới nhất · xếp đắt nhất lên đầu` : '';
  if (!ds.length) {
    $('#bangTin').innerHTML = emptyState({ icon: 'inbox', title: 'Sổ chi phí của v3 chưa ghi lượt nào',
      body: 'Lượt được ghi ở đây khi bot v3 trả lời khách. Tiền của bot đang chạy nằm ở bốn ô trên và tab Theo page.' });
    return;
  }
  $('#bangTin').innerHTML = `<table class="data-table"><thead><tr><th scope="col">Lúc</th><th scope="col">Page</th>
      <th scope="col">Khách nhắn</th><th scope="col">Model</th><th scope="col" class="num">Token vào / ra</th>
      <th scope="col" class="num">Tiền</th><th scope="col">Hội thoại</th></tr></thead><tbody>${ds.map((x) => `<tr>
      <td class="mono">${esc(x.luc ? new Date(x.luc).toLocaleString('vi-VN', { hour12: false }) : '—')}</td>
      <td>${esc(x.pageTen || x.pageId || '')}</td>
      <td>${x.tinKhach ? esc(x.tinKhach.slice(0, 80)) : '<span class="text-muted" title="Lượt này không nối được về tin khách">—</span>'}</td>
      <td class="mono">${esc(x.maModel || '—')}</td>
      <td class="num">${d0(x.token && x.token.vao)} / ${d0(x.token && x.token.ra)}${x.doThat ? '' : ' <span class="meta">ước</span>'}</td>
      <td class="num manh">${dong(x.vnd)}</td>
      <td>${x.psid ? `<a class="lien-ke" href="/ho-so-khach?q=${encodeURIComponent(x.psid)}">Tìm hội thoại →</a>` : '—'}</td>
    </tr>`).join('')}</tbody></table>`;
}

/* Tab + vai: «Từng tin» chỉ hiện khi vai vào được màn Vận hành (cửa của nó CÙNG hằng vai) — hỏi menu, không gọi rồi ăn 403. */
let CUA = { tin: false, model: false };
function moTab(ma) {
  document.querySelectorAll('#thanhTab [data-tab]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === ma)));
  for (const k of ['tin', 'page', 'model']) $('#tab-' + k).hidden = k !== ma;
  const u = new URL(location.href); if (ma === 'page') u.searchParams.delete('tab'); else u.searchParams.set('tab', ma);
  history.replaceState(null, '', u);
}
async function napCua() {
  try {
    const d = await goi('/api/dieu-huong');
    const co = (duong) => (d.nhom || []).some((n) => (n.man || []).some((m) => m.duong === duong));
    CUA = { tin: co('/van-hanh-v3'), model: co('/model-ai') };
  } catch { CUA = { tin: false, model: false }; }
  $('#t-tin').hidden = !CUA.tin;
  document.querySelectorAll('#thanhTab [data-tab]').forEach((b) => b.addEventListener('click', () => moTab(b.dataset.tab)));
  const muon = new URLSearchParams(location.search).get('tab');
  moTab(muon === 'model' || (muon === 'tin' && CUA.tin) ? muon : 'page');
  if (CUA.tin) taiTungTin();
}

async function tai() {
  try {
    const d = await goi('/api/chi-phi');
    if (!d) return;
    if (d.khoang) $('#khoangDau').innerHTML = `<span class="badge" title="${esc(d.khoang.noi || '')}">Khoảng đo: ${esc(d.khoang.chu)}</span>`;
    if (!d.tong) {
      $('#dem').innerHTML = '';
      $('#bang-tin').innerHTML = `<div class="duoi-5">${canhBao({ level: 'warning', title: 'Chưa đọc được chi phí',
        body: 'v3 chưa được nối sang tiến trình bot. Nhờ người quản trị hệ thống cấu hình kết nối.',
        detail: d.trong ? [d.trong.noi, d.trong.diTiep] : [] })}</div>`;
      $('#bang').innerHTML = emptyState({ icon: 'circle-alert', title: 'Chưa có số liệu chi phí',
        body: 'Màn này không hiện 0 khi chưa đọc được — 0 đồng ở đây sẽ là con số sai.' });
      return;
    }
    veBangTin(d); veDem(d); veBang(d); veTheoModel(d);
  } catch (e) {
    $('#dem').innerHTML = '';
    $('#bang-tin').innerHTML = `<div class="duoi-5">${canhBao({ level: 'error', title: 'Không đọc được chi phí',
      body: 'Chưa lấy được số từ tiến trình bot. Nếu lỗi còn lặp lại, gửi dòng chi tiết bên dưới cho người quản trị hệ thống.',
      detail: [e.message] })}</div>`;
    $('#bang').innerHTML = emptyState({ icon: 'circle-alert', title: 'Chưa có số liệu chi phí',
      body: 'Tải lại trang sau ít phút.' });
  }
}

napCua().then(tai);
</script>
<script src="/chung/dieu-huong.js"></script>
</body>
</html>
