<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chi phí AI — AI Closer v3</title>
<style>
  :root{
    --bg:#f5f7f9; --panel:#fff; --ink:#101828; --muted:#667085; --line:#e4e9ee;
    --pri:#0e7c86; --priDark:#0b646d; --priSoft:#e6f4f5;
    --ok:#16a34a; --okSoft:#e8f7ee; --bad:#dc2626; --badSoft:#fdecec;
    --warn:#b45309; --warnSoft:#fdf3e3; --xam:#8b95a1;
    --side:#0b2125; --sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06); --r:12px;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:-apple-system,"SF Pro Text",Segoe UI,Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);font-size:13.5px;-webkit-font-smoothing:antialiased}
  header{background:var(--side);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:700}
  header .sub{font-size:11.5px;color:#7fa3a8}
  header .sp{flex:1}
  header a{color:#9fd3d8;text-decoration:none;font-size:12px;font-weight:600}
  main{padding:16px 22px 60px;max-width:1140px;margin:0 auto}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:16px;overflow:hidden}
  .panel h2{font-size:13px;margin:0;padding:11px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .panel h2 .hint{font-weight:400;color:var(--muted);font-size:11.5px}
  .panel h2 .sp{flex:1}
  .than{padding:14px 15px}

  .o{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .o .k{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;box-shadow:var(--sh)}
  .o .k .n{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
  .o .k .n small{font-size:13px;font-weight:600;color:var(--muted)}
  .o .k .c{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}
  .o .k.xau .n{color:var(--bad)} .o .k.tot .n{color:var(--ok)}

  .nguy{background:#fff4f4;border:1px solid #f0c2c2;border-left:4px solid var(--bad);
        border-radius:var(--r);padding:12px 15px;margin-bottom:14px;line-height:1.6}
  .nguy b{color:#991b1b}
  .nguon{background:var(--priSoft);border:1px solid #b8dde0;color:#0b4a52;border-radius:var(--r);
         padding:11px 14px;margin-bottom:14px;line-height:1.6;font-size:12.5px}
  .canh{background:var(--warnSoft);border:1px solid #f0d3a4;color:#8a4a06;border-radius:var(--r);
        padding:11px 14px;margin-bottom:14px;line-height:1.6;font-size:12.5px}

  table{width:100%;border-collapse:collapse}
  th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;background:#fafbfc}
  th.p,td.p{text-align:right;font-variant-numeric:tabular-nums}
  tbody tr:last-child td{border-bottom:0}
  tbody tr.dot{background:#fffafa}
  .bao{display:block;overflow-x:auto}

  .the{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
  .the.dot{background:var(--badSoft);color:#991b1b}
  .the.uoc{background:var(--warnSoft);color:#8a4a06}
  .the.that{background:var(--okSoft);color:#166534}

  .trong{padding:34px 20px;text-align:center;color:var(--muted);line-height:1.6}
  .trong .ti{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:6px}
  .trong .di{margin-top:10px;font-size:12px;background:var(--priSoft);color:#0b4a52;
             display:inline-block;padding:9px 13px;border-radius:9px;text-align:left;max-width:540px}
  .nho{color:var(--muted);font-size:11.5px;line-height:1.5}
  code{background:#f1f3f5;padding:1px 5px;border-radius:4px;font-size:11.5px;
       font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  @media (max-width:720px){
    header{padding:12px 14px} main{padding:12px 14px 50px}
    .than{padding:12px} th,td{padding:8px 9px}
    .o{grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px}
    .o .k{padding:11px 12px} .o .k .n{font-size:19px}
  }
</style>
</head>
<body>
<header>
  <h1>Chi phí AI</h1>
  <span class="sub" id="hTeam">…</span>
  <span class="sp"></span>
  <a href="/san-sang">Cửa kiểm →</a>
  <a href="/trang-chu">← Trang chủ</a>
</header>

<main>
  <div id="dai"></div>
  <div class="o" id="dem"></div>

  <div class="panel">
    <h2>Chi phí theo page <span class="hint" id="hSo"></span>
      <span class="sp"></span><span class="hint">xếp theo tiền, nhiều nhất lên trước</span></h2>
    <div id="bang"><div class="than nho">Đang tải…</div></div>
  </div>
</main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const d0 = (n) => (n == null ? '—' : Number(n).toLocaleString('vi-VN'));

async function goi(u) {
  const r = await fetch(u, { credentials: 'same-origin' });
  const j = await r.json().catch(() => null);
  if (!r.ok || !j || j.ok === false) throw new Error((j && j.thongDiep) || 'Lỗi ' + r.status);
  return j;
}

function veDai(d) {
  let h = '';
  // ① Con số này đo ở đâu — hiện TRƯỚC con số, không phải chú thích cuối trang.
  h += `<div class="nguon">💰 Tiền đọc từ <b>tiến trình bot v1</b> — nơi lượt gọi model thật
    sự xảy ra. Nhà cung cấp: <code>${esc(d.nhaCungCap || '?')}</code>.
    ${d.tong.tiLeDoThat != null ? `<br><b>${d.tong.tiLeDoThat}%</b> số lượt có token đo thật
      từ nhà cung cấp; phần còn lại ước từ độ dài chữ.` : ''}</div>`;

  // ② Hai sổ lệch nhau — nói ra, kèm số.
  if (d.soAi && d.soAi.docDuoc && d.soAi.coLech) {
    h += `<div class="canh">📒 <b>Hai cuốn sổ đang nói khác nhau.</b><br>
      ${esc(d.soAi.noi.replace(/\*\*/g, ''))}
      ${d.soAi.viSao ? `<br><span class="nho" style="color:#8a4a06">${esc(d.soAi.viSao)}</span>` : ''}</div>`;
  }
  if (d.soAi && !d.soAi.docDuoc) {
    h += `<div class="canh">📒 ${esc(d.soAi.noi)}</div>`;
  }

  // ③ Đốt tiền không ra đơn — cảnh báo chính của màn.
  if (d.dotTien && d.dotTien.so) {
    h += `<div class="nguy"><b>${d.dotTien.so} page tiêu tiền mà KHÔNG ra đơn nào</b> —
      tổng <b>${d0(d.dotTien.tien)} đ</b>.
      <div class="nho" style="margin-top:6px;color:#7f1d1d">${d.dotTien.ds.map((p) =>
        `${esc(p.ten)} (${d0(p.tienVnd)} đ · ${d0(p.soLuot)} tin)`).join(' · ')}</div></div>`;
  }
  $('#dai').innerHTML = h;
}

function veDem(t) {
  $('#dem').innerHTML = [
    { n: d0(t.tienVnd) + ' <small>đ</small>', c: 'tổng tiền model của team', l: '' },
    { n: d0(t.vndMoiTin) + ' <small>đ</small>', c: 'mỗi tin trả lời', l: '' },
    { n: d0(t.vndMoiDon) + ' <small>đ</small>', c: 'mỗi đơn ra được', l: t.vndMoiDon ? '' : 'xau' },
    { n: t.tinMoiDon == null ? '—' : t.tinMoiDon, c: 'tin cho một đơn', l: '' },
    { n: d0(t.soLuot), c: 'lượt trả lời', l: '' },
    { n: d0(t.soDon), c: 'đơn', l: t.soDon ? 'tot' : 'xau' },
  ].map((x) => `<div class="k ${x.l}"><div class="n">${x.n}</div><div class="c">${x.c}</div></div>`).join('');
}

function veBang(d) {
  const ds = d.page.filter((p) => p.soLuot > 0);
  $('#hSo').textContent = `${ds.length} page có tiêu`;
  const b = $('#bang');
  if (!ds.length) {
    b.innerHTML = `<div class="trong"><div class="ti">${esc(d.trong ? d.trong.noi : 'Chưa có lượt gọi nào')}</div>
      ${d.trong && d.trong.diTiep ? `<div class="di">👉 ${esc(d.trong.diTiep)}</div>` : ''}</div>`;
    return;
  }
  b.innerHTML = `<div class="bao"><table>
    <thead><tr><th>Page</th><th class="p">Tiền</th><th class="p">Tin</th><th class="p">Đơn</th>
      <th class="p">đ/tin</th><th class="p">đ/đơn</th><th>Đo thật</th><th>Marketer</th></tr></thead>
    <tbody>${ds.map((p) => `
      <tr class="${p.dotTienKhongRaDon ? 'dot' : ''}">
        <td><b>${esc(p.ten)}</b><div class="nho">${esc(p.pageId)}</div>
          ${p.dotTienKhongRaDon ? '<span class="the dot">đốt tiền, 0 đơn</span>' : ''}</td>
        <td class="p"><b>${d0(p.tienVnd)}</b></td>
        <td class="p">${d0(p.soLuot)}</td>
        <td class="p">${d0(p.soDon)}</td>
        <td class="p">${d0(p.vndMoiTin)}</td>
        <td class="p">${p.soDon ? d0(p.vndMoiDon) : '—'}</td>
        <td><span class="the ${p.tiLeDoThat >= 80 ? 'that' : 'uoc'}">${p.tiLeDoThat == null ? '—' : p.tiLeDoThat + '%'}</span></td>
        <td class="nho">${esc(p.marketer) || '<i>chưa gán</i>'}</td>
      </tr>`).join('')}</tbody></table></div>`;
}

async function tai() {
  try {
    const d = await goi('/api/chi-phi');
    $('#hTeam').textContent = 'team ' + (d.teamId || '?');
    if (!d.tong) {
      $('#bang').innerHTML = `<div class="trong"><div class="ti">${esc(d.trong.noi)}</div>
        <div class="di">👉 ${esc(d.trong.diTiep)}</div></div>`;
      return;
    }
    veDai(d); veDem(d.tong); veBang(d);
  } catch (e) {
    $('#bang').innerHTML = `<div class="than"><div class="nguy" style="margin:0">
      <b>Không đọc được chi phí:</b> ${esc(e.message)}</div></div>`;
    $('#dem').innerHTML = '';
  }
}

tai();
</script>
<script src="/chung/dieu-huong.js"></script>
</body>
</html>
