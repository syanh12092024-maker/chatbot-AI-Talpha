<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#ffffff">
<title>Tất cả page — AI Closer</title>
<!-- Màn thứ HAI dùng trọn hệ kiểu (sau «Bắt đầu»), theo mục M2 của bản đặc tả vận hành.
     KHÔNG một dòng CSS riêng. Trước lượt này màn có 96 dòng CSS tự dựng, trong đó có lỗi
     TRÙNG TÊN LỚP làm ô «chưa gán» phình thành khối vàng cao 60px:
         .o-mkt.trong { background: … }   ← «trong» = ô marketer còn trống
         .trong { padding: 20px 15px }     ← «trong» = khối trạng thái rỗng
     Ô nhập ăn cả hai. Nay mọi thứ đi qua `chung/kieu.css` và `chung/ui.js`. -->
<link rel="stylesheet" href="/chung/kieu.css" data-ds="v3">
<!-- Hàm dựng thành phần (window.UI). ĐỒNG BỘ, KHÔNG `defer`: khung ứng dụng ở cuối trang
     lấy biểu tượng từ đây — `defer` chạy SAU script cuối trang, khung sẽ mất biểu tượng. -->
<script src="/chung/ui.js"></script>
</head>
<body>
<header class="an-tieu-de">
  <h1>Tất cả page</h1>
</header>
<!-- VE2b · 30/09 (người quyết, ảnh khoanh đỏ: «màn tất cả page bỏ phần khoanh đỏ này … vào danh sách page luôn»): đầu
     trang ẨN — tên giữ cho trình đọc màn hình và luật HK10 (tên đầu trang = tên menu); thanh tab «Tất cả page | Kịch bản»
     tự mất vì Kịch bản gộp vào trang một page (cụm còn một tab). Nút Quét xuống hàng ô tìm. -->
<!-- VE3 · 29/09 (CR-28-09c): theo bản vẽ 2b — viên «Lọc nhanh» có số đếm thay ô chọn; nút Quét lên đầu trang; chọn
     nhiều page + thao tác hàng loạt (gắn sản phẩm · bật bot tối đa 10, có xác nhận) đi LẦN LƯỢT qua ĐÚNG cửa ghi
     từng page đã có (mỗi lượt vẫn ghi nhật ký trước/sau) — không mở cửa ghi hàng loạt mới ở máy chủ. -->

<main>
  <div id="bang-tin" aria-live="polite"></div>

  <div class="hang-vien duoi-4" role="tablist" aria-label="Lọc nhanh" id="thanhLoc"></div>
  <section class="table-wrap" aria-labelledby="tieu-bang">
    <h2 id="tieu-bang" class="sr-only">Danh sách page</h2>
    <div class="table-toolbar">
      <label for="oTim" class="sr-only">Tìm page</label>
      <input id="oTim" type="search" placeholder="Tên page, mã page Facebook, thị trường, marketer…" autocomplete="off" spellcheck="false">
      <!-- VE2b: công tắc bot khoá ⇒ MỘT dòng nhỏ ở đây (lý do đủ trong title), thay hộp cảnh báo chiếm đầu trang. -->
      <span class="field-hint" id="khoaBot" hidden></span>
      <span class="table-count" id="tomTat" aria-live="polite"></span>
      <button type="button" class="btn" data-size="sm" id="nutQuet"
        title="Hỏi Pancake bằng kho token đang có, cập nhật danh mục page"><span>Quét Pancake tìm page mới</span></button>
    </div>
    <div class="thanh-chon" id="thanhChon" hidden aria-live="polite"></div>
    <div id="bang"></div>
    <div id="phanTrang"></div>
  </section>
  <p class="field-hint tren-3">Thị trường hôm nay còn GÕ TAY theo page — suy từ shop POS của sản phẩm page bán ở phiếu LL16. Marketer hôm nay theo
    page — lấy theo sản phẩm × thị trường từ hồ sơ HRM ở phiếu LL15. Bật bot hàng loạt có trần 10 page một lượt và hộp xác nhận.</p>
</main>

<script>
const { esc, statusBadge, button, alert: canhBao, emptyState, toast, confirmDialog,
        formatNumber } = window.UI;
const $ = (s) => document.querySelector(s);
const so = (n) => formatNumber(n);

// Trạng thái lọc nằm trong URL (mục J) — chia sẻ được đường dẫn, F5 không mất chỗ đang xem.
const qs = new URLSearchParams(location.search);
let TRANG = Math.max(0, Number(qs.get('trang')) || 0);
let LOC = qs.get('loc') || 'tat_ca';
let TIM = qs.get('tim') || '';
let SUA = false, CUA = { mo: false, thieu: [] }, CAU_DAO = { mo: false };

function ghiUrl() {
  const u = new URL(location.href);
  LOC && LOC !== 'tat_ca' ? u.searchParams.set('loc', LOC) : u.searchParams.delete('loc');
  TIM ? u.searchParams.set('tim', TIM) : u.searchParams.delete('tim');
  TRANG ? u.searchParams.set('trang', String(TRANG)) : u.searchParams.delete('trang');
  history.replaceState(null, '', u);
}

// VE2b · 30/09: bấm tên page mang theo bộ lọc · ô tìm · trang — trang một page lọc cột trái y như thế và lối «← Tất cả
// page» trả về ĐÚNG chỗ này (người quyết: «ấn vào chi tiết chuyển sang id tương ứng. có phần trở lại»).
function thamSoDanhSach() {
  const u = new URLSearchParams();
  if (LOC && LOC !== 'tat_ca') u.set('loc', LOC);
  if (TIM) u.set('tim', TIM);
  if (TRANG) u.set('trang', String(TRANG));
  const chuoi = u.toString();
  return chuoi ? '?' + chuoi : '';
}

// Vì sao công tắc bot khoá — MỘT câu cho cả dòng nhỏ ở hàng tìm lẫn title trên từng công tắc (VE2b: thay hộp cảnh báo).
function lyDoKhoa() {
  if (!SUA) return 'Cần vai Quản trị để bật tắt bot.';
  return 'Chưa bật tắt bot được từ màn này: máy chủ này chưa được phép ghi sang tiến trình bot, vì công tắc chạm khách thật. '
    + 'Nhờ người quản trị hệ thống mở cửa ghi.' + ((CUA.thieu || []).length ? ` (${CUA.thieu.join(' · ')})` : '');
}
function veKhoaBot() {
  const o = $('#khoaBot');
  if (SUA && CUA.mo) { o.hidden = true; o.textContent = ''; return; }
  o.hidden = false;
  o.textContent = SUA ? 'Công tắc bot đang khoá' : 'Chỉ quản trị bật tắt bot';
  o.title = lyDoKhoa();
}

// Lỗi thao tác: băng tin, KHÔNG toast — mục H10: toast không dùng cho lỗi phức tạp.
function baoLoi(title, body) {
  $('#bang-tin').dataset.loi = '1';
  veBangTin(null, { title, body });
}

async function goi(duong, tuyChon) {
  const r = await fetch(duong, { headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' }, ...tuyChon });
  if (r.status === 401) { location.href = '/dang-nhap?tiep=' + encodeURIComponent(location.pathname); return null; }
  let d = null;
  try { d = await r.json(); } catch { /* null */ }
  if (!r.ok || !d || d.ok === false) throw new Error((d && d.thongDiep) || ('Máy chủ trả ' + r.status + '.'));
  return d;
}

// ── BĂNG TIN — cảnh báo phải nói được việc tiếp theo (mục H9) ──────────────────────
let _canhBaoCuoi = [];
function veBangTin(d, loi) {
  if (d) {
    const kh = [];
    // VE2b · 30/09: cửa ghi sang bot đóng KHÔNG còn là hộp cảnh báo ở đầu trang (người quyết khoanh đỏ) — nó là một dòng
    // nhỏ ở hàng ô tìm + title trên từng công tắc khoá (`veKhoaBot`). Dòng đếm page thiếu người phụ trách cũng bỏ: số đó
    // đã ở viên «Chưa có marketer». Cảnh báo dưới đây là lỗi ĐO THẬT (không đọc được) — giữ, chỉ hiện khi xảy ra.
    veKhoaBot();
    if (d.loiBotViSao) {
      kh.push(canhBao({ level: 'warning', title: 'Chưa đọc được kịch bản của các page',
        body: `Viên «Chưa có lời bot riêng» đang KHÔNG ĐO ĐƯỢC — không có nghĩa là page nào cũng có. ${d.loiBotViSao}` }));
    }
    if (d.cuaKiemDocDuoc === false) {
      kh.push(canhBao({
        level: 'warning',
        title: 'Chưa đọc được điều kiện sẵn sàng',
        body: `Cột «Còn thiếu gì» đang không biết cho MỌI page — không có nghĩa là page nào cũng ổn. ${d.cuaKiemViSao || ''}`,
      }));
    }
    _canhBaoCuoi = kh;
  }
  const dauLoi = loi ? canhBao({ level: 'error', title: loi.title, body: loi.body }) : '';
  $('#bang-tin').innerHTML = (dauLoi || _canhBaoCuoi.length)
    ? `<div class="duoi-4">${dauLoi}${_canhBaoCuoi.join('')}</div>` : '';
}

// ── BỘ LỌC — viên «Lọc nhanh» có số đếm (bản vẽ 2b · VE3). Trước VE3 là một ô chọn (mục J: một dòng, vẫn thấy số);
//    bản vẽ đặt lại viên để lọc là MỘT chạm và thấy mọi số cùng lúc. Vẫn MỘT dòng — cuộn ngang khi hẹp.
function veThanhLoc(d) {
  $('#thanhLoc').innerHTML = Object.entries(d.chuLoc).map(([ma, chu]) => {
    const n = ma === 'tat_ca' ? d.soTong : d.dem[ma];
    // `null` = KHÔNG ĐO ĐƯỢC (VE2b: bảng kịch bản đọc hỏng) — «—», không «0» (0 là lời khai «không page nào»).
    return `<button type="button" class="vien" role="tab" data-loc="${esc(ma)}" aria-selected="${ma === LOC}">${esc(chu)} <span class="phu">${n == null ? '—' : so(n)}</span></button>`;
  }).join('');
  $('#thanhLoc').querySelectorAll('[data-loc]').forEach((b) => b.addEventListener('click', () => { LOC = b.dataset.loc; TRANG = 0; nap(); }));
}

/* ── CHỌN NHIỀU + THAO TÁC HÀNG LOẠT (VE3 · bản vẽ 2b) ─────────────────────────────────────────────────────────
 * Đi LẦN LƯỢT qua ĐÚNG cửa ghi từng page (`/api/page-bot/:id/san-pham-goc` · `/bot`) — mỗi lượt vẫn qua cửa kiểm và
 * nhật ký trước/sau như bấm tay; KHÔNG có cửa ghi hàng loạt ở máy chủ. Bật bot chạm KHÁCH THẬT: trần GIOI_HAN_BAT page
 * một lượt, hộp xác nhận liệt kê tên, gặp lỗi đầu tiên thì DỪNG và nói page nào đã đổi, page nào chưa. */
const GIOI_HAN_BAT = 10;
let CHON = new Set();
let DONG = [];   // page của trang đang xem (để biết tên + khoá bot từng page)
function khoaBotCua(p) { return p.runtime === 'v3' ? !SUA : !(SUA && CUA.mo); }
function veThanhChon() {
  const o = $('#thanhChon');
  if (!CHON.size) { o.hidden = true; o.innerHTML = ''; return; }
  const chon = DONG.filter((p) => CHON.has(p.id));
  const batDuoc = chon.filter((p) => !p.botAiBat && !khoaBotCua(p));
  const lyDoBat = !SUA ? 'Cần vai Quản trị để bật bot'
    : CHON.size > GIOI_HAN_BAT ? `Tối đa ${GIOI_HAN_BAT} page một lượt — bỏ bớt chọn`
    : !batDuoc.length ? (CUA.mo ? 'Các page đã chọn đều đang bật' : lyDoKhoa()) : '';
  o.hidden = false;
  o.innerHTML = `<b>Đã chọn ${so(CHON.size)} page</b>
    ${SUA && SPG_AP && SPG_CHON.length ? `<label class="sr-only" for="spgHangLoat">Sản phẩm để gắn</label>
      <select id="spgHangLoat"><option value="">— chọn sản phẩm —</option>${SPG_CHON.map((g) => `<option value="${esc(g.maGoc)}">${esc(g.ten)}</option>`).join('')}</select>
      ${button('Gắn vào sản phẩm', { size: 'sm', id: 'nutGanLoat' })}` : ''}
    ${button(`Bật bot (tối đa ${GIOI_HAN_BAT} · có xác nhận)`, { size: 'sm', variant: 'primary', id: 'nutBatLoat', disabled: !!lyDoBat, title: lyDoBat })}
    ${button('Bỏ chọn', { size: 'sm', variant: 'ghost', id: 'nutBoChon' })}
    ${lyDoBat ? `<span class="field-hint">${esc(lyDoBat)}</span>` : ''}`;
  $('#nutBoChon').onclick = () => { CHON.clear(); document.querySelectorAll('[data-chon]').forEach((c) => { c.checked = false; }); veThanhChon(); };
  if ($('#nutGanLoat')) $('#nutGanLoat').onclick = ganLoat;
  if ($('#nutBatLoat')) $('#nutBatLoat').onclick = () => batLoat(batDuoc);
}
async function ganLoat() {
  const maGoc = $('#spgHangLoat').value;
  if (!maGoc) { baoLoi('Chưa chọn sản phẩm', 'Chọn sản phẩm ở ô bên cạnh rồi bấm «Gắn vào sản phẩm».'); return; }
  const ds = DONG.filter((p) => CHON.has(p.id));
  const tenSp = (SPG_CHON.find((g) => g.maGoc === maGoc) || {}).ten || maGoc;
  if (!(await confirmDialog({ title: `Gắn ${ds.length} page vào «${tenSp}»?`,
    body: `${ds.map((p) => p.ten || p.pageId).join(' · ')}. Page nhận kịch bản tầng sản phẩm của «${tenSp}».`, confirmLabel: 'Gắn' }))) return;
  await chayLoat(ds, (p) => goi(`/api/page-bot/${encodeURIComponent(p.id)}/san-pham-goc`, { method: 'POST', body: JSON.stringify({ maGoc }) }), 'gắn sản phẩm');
}
async function batLoat(ds) {
  if (!ds.length || ds.length > GIOI_HAN_BAT) return;
  if (!(await confirmDialog({ title: `Bật bot cho ${ds.length} page?`,
    body: `Bot sẽ bắt đầu tự trả lời KHÁCH THẬT của: ${ds.map((p) => p.ten || p.pageId).join(' · ')}.`, confirmLabel: `Bật bot ${ds.length} page` }))) return;
  await chayLoat(ds, (p) => goi(`/api/page-bot/${encodeURIComponent(p.id)}/bot`, { method: 'POST', body: JSON.stringify({ bat: true }) }), 'bật bot');
}
async function chayLoat(ds, lam, viec) {
  const xong = [];
  for (const p of ds) {
    try { await lam(p); xong.push(p.ten || p.pageId); }
    catch (e) {
      baoLoi(`Dừng ${viec} ở «${p.ten || p.pageId}»`, `${e.message} — đã xong ${xong.length}/${ds.length}: ${xong.join(' · ') || 'chưa page nào'}. Các page sau chưa đổi.`);
      CHON.clear(); await nap(); return;
    }
  }
  toast(`Đã ${viec} cho ${xong.length}/${ds.length} page.`);
  CHON.clear(); await nap();
}

// ── CỘT «CÒN THIẾU GÌ» — màu do ánh xạ tập trung, trang chỉ nói nghĩa (mục H8) ──────
// Chưa đọc được thì nói «chưa đọc được» — ô trống trông y hệt «không thiếu gì», và đó là
// kết luận ngược hẳn sự thật.
function veCuaKiem(c) {
  if (!c) return statusBadge('unknown', { label: 'Chưa đọc được' });
  if (c.muc === 'chan') return statusBadge('blocked', { label: c.ten });
  if (c.muc === 'nhac') return statusBadge('needs_attention', { label: c.ten });
  return statusBadge('ready', { label: c.ten });
}

function veTrong(t) {
  const ic = t.vi === 'chua_cai_dat' ? 'triangle-alert' : t.vi === 'xong' ? 'circle-check' : 'search';
  const hanh = t.diTiep ? button(t.diTiep.chu, { href: t.diTiep.duong || '#', size: 'sm' }) : '';
  return emptyState({ icon: ic, title: t.noi, actionsHtml: hanh });
}

function veBang(d) {
  $('#tomTat').textContent = d.soKhop === d.soTong
    ? `${so(d.soTong)} page` : `${so(d.soKhop)}/${so(d.soTong)} page khớp`;

  if (d.trong) { $('#bang').innerHTML = veTrong(d.trong); $('#phanTrang').innerHTML = ''; return; }

  const khoaBot = !(SUA && CUA.mo);
  const lyDoKhoaBot = lyDoKhoa();

  // `data-hep="the"`: dưới 720px mỗi page thành một thẻ, ô «Còn thiếu gì» nhảy lên góc phải
  // (`c-dem`). Trước 28/09 bảng tám cột cuộn ngang trên điện thoại và cột Bot, Còn thiếu gì
  // — hai thứ người ta mở màn này để xem — nằm ngoài màn hình (audit ui-taste).
  DONG = d.page;
  // Chỉ giữ dòng CÒN HIỆN: đổi bộ lọc/trang thì thao tác hàng loạt không được chạm page người dùng không nhìn thấy.
  CHON = new Set([...CHON].filter((id) => d.page.some((p) => p.id === id)));
  $('#bang').innerHTML = `<table class="data-table" data-hep="the"><thead><tr>
      <th scope="col"><input type="checkbox" id="chonHet" aria-label="Chọn mọi page của trang này"></th>
      <th scope="col">Page</th><th scope="col">Thị trường · ngành hàng</th><th scope="col">Marketer</th>
      <th scope="col">Bot</th><th scope="col">Còn thiếu gì</th>
      <th scope="col">Sản phẩm gốc</th><th scope="col">Trọng điểm</th>
      <th scope="col" title="Đã tắt Botcake cho page này (lời khai, không phải công tắc)"><span aria-hidden="true">Botcake</span><span class="sr-only">Đã tắt Botcake</span></th>
    </tr></thead><tbody>${d.page.map((p) => {
      const khoaBotDong = p.runtime === 'v3' ? !SUA : khoaBot;
      const ten = p.ten || '(chưa có tên)';
      return `
    <tr>
      <td data-nhan="Chọn"><input type="checkbox" data-chon="${esc(p.id)}" aria-label="Chọn ${esc(ten)}" ${CHON.has(p.id) ? 'checked' : ''}></td>
      <td>
        <div class="page-identity">
          <span class="page-avatar" aria-hidden="true">${esc((ten.trim()[0] || '?').toUpperCase())}</span>
          <div class="page-identity-text">
            <div class="page-identity-name ten"><a href="/page/${esc(p.id)}${esc(thamSoDanhSach())}">${esc(ten)}</a></div>
            <div class="page-identity-sub">${esc(p.pageId)} · ${veChuBot(p)}${p.matDau ? ' · ' + statusBadge('order_error', { label: 'Mất dấu' }) : ''}</div>
          </div>
        </div>
      </td>
      <td data-nhan="Thị trường · ngành hàng">
        <label class="sr-only" for="tt-${esc(p.id)}">Thị trường của ${esc(ten)}</label>
        <input type="text" class="cell-input" id="tt-${esc(p.id)}" data-tt="${esc(p.id)}" value="${esc(p.thiTruong)}"
               placeholder="Chưa có" ${SUA ? '' : 'disabled'} autocomplete="off" spellcheck="false">
        <label class="sr-only" for="nh-${esc(p.id)}">Ngành hàng của ${esc(ten)}</label>
        <input type="text" class="cell-input meta" id="nh-${esc(p.id)}" data-nh="${esc(p.id)}" value="${esc(p.nganhHang)}"
               placeholder="Ngành hàng" ${SUA ? '' : 'disabled'} autocomplete="off" spellcheck="false">
      </td>
      <td class="meta" data-nhan="Marketer">${p.marketer ? esc(p.marketer) : '<span class="text-muted">Chưa gán</span>'}</td>
      <td data-nhan="Bot">
        <label class="switch cell-control" ${khoaBotDong ? `title="${esc(lyDoKhoaBot)}"` : ''}>
          <input type="checkbox" role="switch" data-bot="${esc(p.id)}" aria-label="Bot của ${esc(ten)}"
                 ${p.botAiBat ? 'checked' : ''} ${khoaBotDong ? 'disabled' : ''}>
          <span>${p.botAiBat ? 'Đang chạy' : 'Tắt'}</span>
        </label>
      </td>
      <td class="c-dem">${veCuaKiem(p.cuaKiem)}</td>
      <td data-nhan="Sản phẩm gốc">${veSanPhamGoc(p)}</td>
      <td data-nhan="Trọng điểm">
        <label class="switch" ${SUA ? '' : 'title="Cần vai Quản trị"'}>
          <input type="checkbox" role="switch" data-td="${esc(p.id)}" aria-label="Page trọng điểm: ${esc(ten)}"
                 ${p.trongDiem ? 'checked' : ''} ${SUA ? '' : 'disabled'}>
        </label>
      </td>
      <td data-nhan="Đã tắt Botcake">
        <label class="switch" title="LỜI KHAI, không phải công tắc: đánh dấu ở đây KHÔNG tắt Botcake. Botcake tắt bằng tay trong giao diện Botcake.">
          <input type="checkbox" role="switch" data-bc="${esc(p.id)}" aria-label="Đã tắt Botcake cho ${esc(ten)}"
                 ${p.botcakeTat ? 'checked' : ''} ${SUA ? '' : 'disabled'}>
        </label>
      </td>
    </tr>`; }).join('')}</tbody></table>`;

  $('#phanTrang').innerHTML = d.soTrang > 1 ? `<div class="pagination">
      <span>Trang ${d.trang + 1} / ${d.soTrang}</span>
      <span class="hang">${button('Trước', { size: 'sm', id: 'lui', disabled: d.trang === 0 })}
        ${button('Sau', { size: 'sm', id: 'toi', disabled: d.trang >= d.soTrang - 1 })}</span>
    </div>` : '';
  if (d.soTrang > 1) {
    $('#lui').addEventListener('click', () => { TRANG = Math.max(0, TRANG - 1); nap(); });
    $('#toi').addEventListener('click', () => { TRANG = TRANG + 1; nap(); });
  }

  document.querySelectorAll('[data-chon]').forEach((el) => el.addEventListener('change', () => {
    if (el.checked) CHON.add(el.dataset.chon); else CHON.delete(el.dataset.chon); veThanhChon();
  }));
  const chonHet = document.querySelector('#chonHet');
  if (chonHet) chonHet.addEventListener('change', () => {
    document.querySelectorAll('[data-chon]').forEach((el) => { el.checked = chonHet.checked; if (chonHet.checked) CHON.add(el.dataset.chon); else CHON.delete(el.dataset.chon); });
    veThanhChon();
  });
  veThanhChon();
  document.querySelectorAll('[data-bot]').forEach((el) => el.addEventListener('change', () => gatBot(el)));
  document.querySelectorAll('[data-giao]').forEach((el) => el.addEventListener('click', () => doiChuBot(el)));
  document.querySelectorAll('[data-td]').forEach((el) => el.addEventListener('change', () => gatTrongDiem(el)));
  document.querySelectorAll('[data-bc]').forEach((el) => el.addEventListener('change', () => gatBotcake(el)));
  document.querySelectorAll('[data-spg]').forEach((el) => el.addEventListener('change', () => luuSanPhamGoc(el)));
  for (const [thuoc, duong, ten, khoa] of [
    ['data-tt', 'thi-truong', 'thị trường', 'thiTruong'],
    ['data-nh', 'nganh-hang', 'ngành hàng', 'nganhHang'],
  ]) {
    document.querySelectorAll(`[${thuoc}]`).forEach((el) => {
      el.addEventListener('blur', () => luuNhan(el, { duong, ten, khoa }));
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter') el.blur(); });
    });
  }
}

// ── CHỦ SỞ HỮU PAGE: bot cũ hay bot mới, và đổi được ngay tại chỗ nói ra điều đó ──────
//
// Cầu dao đóng ⇒ chỉ là chữ. Bày một cái nút mà bấm vào trả 409 còn tệ hơn không có nút:
// người ta bấm, bị từ chối, rồi không biết đi đâu.
function veChuBot(p) {
  const chu = p.runtime === 'v3' ? 'bot mới' : 'bot cũ';
  if (!CAU_DAO.mo || !SUA) return esc(chu);
  const sang = p.runtime === 'v3' ? 'cu' : 'moi';
  return `${esc(chu)} ${button(sang === 'moi' ? 'Giao sang bot mới' : 'Trả về bot cũ',
    { size: 'sm', variant: 'ghost', data: { giao: p.id, sang } })}`;
}

// ── GHI · ĐỔI CHỦ page. Hỏi lại bằng đúng cái giá phải trả, không bằng chữ «bạn có chắc» ──
async function doiChuBot(el) {
  const sangMoi = el.dataset.sang === 'moi';
  const ten = el.closest('tr').querySelector('.ten').textContent.trim();
  const dongY = await confirmDialog({
    title: sangMoi ? `Giao «${ten}» sang bot mới?` : `Trả «${ten}» về bot cũ?`,
    body: sangMoi
      ? 'Bot cũ sẽ được TẮT cho page này trước, và chỉ khi nó xác nhận đã tắt thì page mới '
        + 'đổi chủ. Sau đó chưa con bot nào trả lời page này cho tới khi bạn bấm Bật.'
      : 'Bot mới buông page này. Bot cũ vẫn đang TẮT — bấm Bật nếu muốn nó trả lời lại.',
    confirmLabel: sangMoi ? 'Giao sang bot mới' : 'Trả về bot cũ',
    danger: true,
  });
  if (!dongY) return;
  el.disabled = true;
  try {
    const kq = await goi(`/api/page-bot/${encodeURIComponent(el.dataset.giao)}/giao`,
      { method: 'POST', body: JSON.stringify({ giao: sangMoi }) });
    toast(kq.buocTiep || 'Đã đổi chủ page.');
    await nap();
  } catch (e) { baoLoi('Không đổi chủ được page này', e.message); }
  finally { el.disabled = false; }
}

// ── GHI · bật tắt bot — chạm KHÁCH THẬT, nên hỏi lại có tiêu đề và hệ quả (mục L) ─────
async function gatBot(el) {
  const bat = el.checked;
  const ten = el.closest('tr').querySelector('.ten').textContent.trim();
  const dongY = await confirmDialog({
    title: `${bat ? 'Bật' : 'Tắt'} bot cho «${ten}»?`,
    body: bat ? 'Bot sẽ bắt đầu tự trả lời khách thật của page này.'
              : 'Bot sẽ ngừng trả lời. Khách của page này phải có người trực.',
    confirmLabel: bat ? 'Bật bot' : 'Tắt bot',
    danger: !bat,
  });
  if (!dongY) { el.checked = !bat; return; }
  el.disabled = true;
  try {
    const kq = await goi(`/api/page-bot/${encodeURIComponent(el.dataset.bot)}/bot`,
      { method: 'POST', body: JSON.stringify({ bat }) });
    toast(`Đã ${kq.botAiBat ? 'bật' : 'tắt'} bot cho «${ten}».`);
    await nap();
  } catch (e) { el.checked = !bat; baoLoi('Không thể đổi trạng thái bot', e.message); }
  finally { el.disabled = false; }
}

// ── GHI · cờ trọng điểm ────────────────────────────────────────────────────────────
async function gatTrongDiem(el) {
  el.disabled = true;
  try {
    await goi(`/api/page-bot/${encodeURIComponent(el.dataset.td)}/trong-diem`,
      { method: 'POST', body: JSON.stringify({ bat: el.checked }) });
    toast(el.checked ? 'Đã đánh dấu page trọng điểm.' : 'Đã bỏ đánh dấu trọng điểm.');
    await nap();
  } catch (e) { el.checked = !el.checked; baoLoi('Không lưu được cờ trọng điểm', e.message); }
  finally { el.disabled = false; }
}

// ── marketer: CHỈ ĐỌC trên màn này từ 15/09 ───────────────────────────────────────
// Người quyết chốt: giữ cột và giữ bản tin cắt theo marketer trong `src/readiness.js`,
// nhưng bỏ ô nhập ở đây. Hàm `luuMarketer` đi theo ô — để lại một hàm không ai gọi là để
// lại một cái bẫy cho người đọc sau. Cửa `POST /api/page-bot/:id/marketer` VẪN CÒN và vẫn
// có ca test: nó là đường lập trình, đã ghi §9 để lượt «soi cửa ghi» sau không báo nhầm
// nó là cửa mồ côi.

// ── GHI · thị trường / ngành hàng — cùng khuôn với marketer ────────────────────────
// Hai cột này ĐƯỢC BẢO VỆ khỏi lượt «Kéo dữ liệu về» từ 15/09 (nhánh CASE trong
// `db/di-tru/nap.js`). Trước đó gõ vào đây là gõ lên cát.
async function luuNhan(el, { duong, ten, khoa }) {
  const moi = el.value.trim();
  if (moi === (el.defaultValue || '').trim()) return;
  const id = el.dataset.tt || el.dataset.nh;
  try {
    await goi(`/api/page-bot/${encodeURIComponent(id)}/${duong}`,
      { method: 'POST', body: JSON.stringify({ [khoa]: moi }) });
    el.defaultValue = moi;
    toast(moi ? `Đã lưu ${ten}.` : `Đã xoá ${ten}.`);
    await napNhe();
  } catch (e) { el.value = el.defaultValue || ''; baoLoi(`Không lưu được ${ten}`, e.message); }
}

// ── SẢN PHẨM GỐC (CR-15/09) ───────────────────────────────────────────────────────
// Cột này là thứ làm kịch bản dùng chung được cho nhiều thị trường: hai page bán cùng một
// sản phẩm gốc thì đọc CÙNG một bản kịch bản, không phải chép tay hai lần.
let SPG_CHON = [];
let SPG_AP = null;   // null = chưa biết · false = bảng chưa có (migration 014 chưa áp)

function veSanPhamGoc(p) {
  const ten = p.sanPhamGocTen;
  if (!SUA) return ten ? esc(ten) : '<span class="text-muted">—</span>';
  if (SPG_AP === false) {
    // «Chưa áp migration» KHÁC «chưa ai soát gộp» KHÁC «page chưa gán». Ba câu, ba việc khác
    // nhau — nói đúng câu, kẻo người vận hành đi làm việc thứ ba trong khi việc thật là thứ nhất.
    return '<span class="text-muted" title="Chạy npm run migrate trên máy chủ">chưa áp migration</span>';
  }
  if (!SPG_CHON.length) {
    // Ngắn: câu cũ «chưa có sản phẩm gốc nào» lặp ba dòng trên MỖI hàng và đẩy cột cuối
    // ra ngoài khung ở 1440px. Câu đủ nằm ở `title`.
    return '<span class="text-muted" title="Team chưa có sản phẩm gốc nào — chạy ops/bin/goi-y-gop-san-pham.mjs rồi soát">'
      + 'Chưa có</span>';
  }
  const dangChon = p.sanPhamGocMa || '';
  return `<select class="cell-input" data-spg="${esc(p.id)}" data-truoc="${esc(dangChon)}">
    <option value="">— chưa gán —</option>
    ${SPG_CHON.map((g) => `<option value="${esc(g.maGoc)}"${g.maGoc === dangChon ? ' selected' : ''}>${esc(g.ten)}${g.soHieu ? ' · ' + esc(g.soHieu) : ''}</option>`).join('')}
  </select>`;
}

async function luuSanPhamGoc(el) {
  const truoc = el.dataset.truoc || '';
  el.disabled = true;
  try {
    const kq = await goi(`/api/page-bot/${encodeURIComponent(el.dataset.spg)}/san-pham-goc`,
      { method: 'POST', body: JSON.stringify({ maGoc: el.value }) });
    el.dataset.truoc = el.value;
    toast(kq.maGoc
      ? 'Đã khai page này bán sản phẩm đó — kịch bản tầng sản phẩm bắt đầu áp.'
      : 'Đã bỏ khai — page mất kế thừa kịch bản tầng trên.');
    await napNhe();
  } catch (e) { el.value = truoc; baoLoi('Không gán được sản phẩm gốc', e.message); }
  finally { el.disabled = false; }
}

// ── GHI · lời khai «đã tắt Botcake» ────────────────────────────────────────────────
async function gatBotcake(el) {
  el.disabled = true;
  try {
    await goi(`/api/page-bot/${encodeURIComponent(el.dataset.bc)}/botcake`,
      { method: 'POST', body: JSON.stringify({ bat: el.checked }) });
    // Nói lại nghĩa mỗi lần bấm — một ô tick trông y hệt một công tắc, và nhầm chỗ này
    // nghĩa là tưởng đã tắt Botcake trong khi Botcake vẫn đang cướp khách.
    toast(el.checked
      ? 'Đã ghi nhận «page này đã tắt Botcake». Việc tắt thật làm trong giao diện Botcake.'
      : 'Đã bỏ ghi nhận đã tắt Botcake.');
    await napNhe();
  } catch (e) { el.checked = !el.checked; baoLoi('Không lưu được ghi nhận Botcake', e.message); }
  finally { el.disabled = false; }
}

/** Nạp lại số đếm mà KHÔNG vẽ lại bảng — để con trỏ không nhảy khỏi ô đang gõ. */
/* ── QUÉT PANCAKE → BẢNG page ────────────────────────────────────────────────────────
 * Đây là đường DUY NHẤT đưa page vào hệ mà không cần tệp `pages.json` của tiến trình bot
 * v1. Nút nằm cạnh bộ lọc vì nó trả lời đúng câu người ta hỏi khi thấy bảng rỗng: «page
 * của tôi đâu?».
 *
 * KHÔNG hỏi xác nhận: lượt quét chỉ THÊM và cập nhật TÊN, không xoá và không đụng công
 * tắc. Hộp xác nhận cho một thao tác an toàn chỉ dạy người ta bấm OK theo phản xạ.
 */
async function quetPancake() {
  const nut = document.querySelector('#nutQuet');
  if (!nut) return;
  nut.disabled = true;
  try {
    const kq = await goi('/api/page-bot/quet', { method: 'POST', body: JSON.stringify({}) });
    if (kq.rong) {
      // HAI CẢNH KHÁC NHAU, HAI CÂU KHÁC NHAU. Gộp chúng lại là chỉ người đi kiểm sai chỗ:
      // 17/09 màn bảo «kiểm kho token» trong khi kho token đúng, lỗi nằm ở dây nối máy chủ.
      baoLoi('Quét xong nhưng không thấy page nào', kq.soToken === 0
        ? 'Tiến trình này KHÔNG thấy token Pancake nào. Thêm token ở màn «Kết nối & token»; nếu ở đó đã có token thì đây là lỗi nối dây của máy chủ, xem log khởi động dịch vụ v3.'
        : `Có ${formatNumber(kq.soToken)} token nhưng không token nào trả về page — token hết hạn hoặc mất quyền trên mọi page đều ra kết quả này. Danh mục page trong CSDL giữ nguyên.`);
    } else {
      toast(`Quét xong: ${formatNumber(kq.nguon)} page · ${formatNumber(kq.them)} mới · ${formatNumber(kq.capNhat)} cập nhật`
        + (kq.khongThay ? ` · ${formatNumber(kq.khongThay)} page trong CSDL không thấy ở lượt này` : ''));
      await nap();
    }
  } catch (e) { baoLoi('Không quét được Pancake', e.message); }
  finally { nut.disabled = false; }
}

async function napNhe() {
  const d = await goi(`/api/page-bot/danh-sach?loc=${encodeURIComponent(LOC)}&tim=${encodeURIComponent(TIM)}&trang=${TRANG}`);
  if (!d) return;
  CUA = d.cuaBot; CAU_DAO = d.cauDaoGiao || { mo: false }; veBangTin(d); veThanhLoc(d);
}

async function nap() {
  try {
    const d = await goi(`/api/page-bot/danh-sach?loc=${encodeURIComponent(LOC)}&tim=${encodeURIComponent(TIM)}&trang=${TRANG}`);
    if (!d) return;
    SUA = d.suaDuoc; CUA = d.cuaBot; CAU_DAO = d.cauDaoGiao || { mo: false }; TRANG = d.trang;
    SPG_CHON = d.sanPhamGocChonDuoc || [];
    SPG_AP = d.sanPhamGocApDuoc !== false;
    ghiUrl();
    veBangTin(d); veThanhLoc(d); veBang(d);
  } catch (e) {
    baoLoi('Không tải được danh sách page', e.message);
    $('#bang').innerHTML = emptyState({ icon: 'circle-alert', title: 'Không tải được danh sách',
      body: 'Kiểm kết nối rồi tải lại trang.' });
  }
}

let hen = null;
$('#oTim').value = TIM;
$('#oTim').addEventListener('input', (e) => {
  clearTimeout(hen);
  hen = setTimeout(() => { TIM = e.target.value.trim(); TRANG = 0; nap(); }, 250);
});
$('#nutQuet').addEventListener('click', quetPancake);

$('#bang').innerHTML = '<div class="empty-state"><span class="skeleton"></span></div>';
nap();
</script>
<script src="/chung/dieu-huong.js"></script>
</body>
