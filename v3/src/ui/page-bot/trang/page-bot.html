<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#ffffff">
<title>Công tắc từng page — AI Closer</title>
<!-- Màn thứ HAI dùng trọn hệ kiểu (sau «Bắt đầu»), theo mục M2 của bản đặc tả vận hành.
     KHÔNG một dòng CSS riêng. Trước lượt này màn có 96 dòng CSS tự dựng, trong đó có lỗi
     TRÙNG TÊN LỚP làm ô «chưa gán» phình thành khối vàng cao 60px:
         .o-mkt.trong { background: … }   ← «trong» = ô marketer còn trống
         .trong { padding: 20px 15px }     ← «trong» = khối trạng thái rỗng
     Ô nhập ăn cả hai. Nay mọi thứ đi qua `chung/kieu.css` và `chung/ui.js`. -->
<link rel="stylesheet" href="/chung/kieu.css" data-ds="v3">
<!-- Hàm dựng thành phần (window.UI). ĐỒNG BỘ, KHÔNG `defer`: khung ứng dụng ở cuối trang
     lấy biểu tượng từ đây — `defer` chạy SAU script cuối trang, khung sẽ mất biểu tượng. -->
<script src="/chung/ui.js"></script>
</head>
<body>
<header>
  <h1>Công tắc từng page</h1>
  <span class="sub">Bật tắt bot và gán người phụ trách cho từng page.</span>
</header>

<main>
  <div id="bang-tin" aria-live="polite"></div>

  <section class="table-wrap" aria-labelledby="tieu-bang">
    <h2 id="tieu-bang" class="sr-only">Danh sách page</h2>
    <div class="table-toolbar">
      <label for="oTim" class="sr-only">Tìm page</label>
      <input id="oTim" type="search" placeholder="Tìm page, id, thị trường, marketer…" autocomplete="off" spellcheck="false">
      <label for="oLoc" class="sr-only">Lọc page</label>
      <select id="oLoc"></select>
      <span class="table-count" id="tomTat" aria-live="polite"></span>
    </div>
    <div id="bang"></div>
    <div id="phanTrang"></div>
  </section>
</main>

<script>
const { esc, statusBadge, button, alert: canhBao, emptyState, toast, confirmDialog,
        formatNumber } = window.UI;
const $ = (s) => document.querySelector(s);
const so = (n) => formatNumber(n);

// Trạng thái lọc nằm trong URL (mục J) — chia sẻ được đường dẫn, F5 không mất chỗ đang xem.
const qs = new URLSearchParams(location.search);
let TRANG = Math.max(0, Number(qs.get('trang')) || 0);
let LOC = qs.get('loc') || 'tat_ca';
let TIM = qs.get('tim') || '';
let SUA = false, CUA = { mo: false, thieu: [] };

function ghiUrl() {
  const u = new URL(location.href);
  LOC && LOC !== 'tat_ca' ? u.searchParams.set('loc', LOC) : u.searchParams.delete('loc');
  TIM ? u.searchParams.set('tim', TIM) : u.searchParams.delete('tim');
  TRANG ? u.searchParams.set('trang', String(TRANG)) : u.searchParams.delete('trang');
  history.replaceState(null, '', u);
}

// Lỗi thao tác: băng tin, KHÔNG toast — mục H10: toast không dùng cho lỗi phức tạp.
function baoLoi(title, body) {
  $('#bang-tin').dataset.loi = '1';
  veBangTin(null, { title, body });
}

async function goi(duong, tuyChon) {
  const r = await fetch(duong, { headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' }, ...tuyChon });
  if (r.status === 401) { location.href = '/dang-nhap?tiep=' + encodeURIComponent(location.pathname); return null; }
  let d = null;
  try { d = await r.json(); } catch { /* null */ }
  if (!r.ok || !d || d.ok === false) throw new Error((d && d.thongDiep) || ('Máy chủ trả ' + r.status + '.'));
  return d;
}

// ── BĂNG TIN — cảnh báo phải nói được việc tiếp theo (mục H9) ──────────────────────
let _canhBaoCuoi = [];
function veBangTin(d, loi) {
  if (d) {
    const kh = [];
    if (!CUA.mo) {
      kh.push(canhBao({
        level: 'warning',
        title: 'Chưa bật tắt bot được từ màn này',
        body: 'Máy chủ này chưa được phép ghi sang tiến trình bot, vì công tắc chạm khách thật. '
          + 'Nhờ người quản trị hệ thống mở cửa ghi.',
        detail: CUA.thieu || [],
      }));
    }
    if (d.dem && d.dem.thieu_marketer > 0) {
      kh.push(canhBao({
        level: 'warning',
        title: `${so(d.dem.thieu_marketer)}/${so(d.soTong)} page chưa có người phụ trách`,
        body: 'Báo cáo cắt theo marketer sẽ trống với những page đó. Gán ngay trong cột Marketer.',
      }));
    }
    if (d.cuaKiemDocDuoc === false) {
      kh.push(canhBao({
        level: 'warning',
        title: 'Chưa đọc được điều kiện sẵn sàng',
        body: `Cột «Còn thiếu gì» đang không biết cho MỌI page — không có nghĩa là page nào cũng ổn. ${d.cuaKiemViSao || ''}`,
      }));
    }
    _canhBaoCuoi = kh;
  }
  const dauLoi = loi ? canhBao({ level: 'error', title: loi.title, body: loi.body }) : '';
  $('#bang-tin').innerHTML = (dauLoi || _canhBaoCuoi.length)
    ? `<div class="duoi-4">${dauLoi}${_canhBaoCuoi.join('')}</div>` : '';
}

// ── BỘ LỌC — một ô chọn thay cho bảy chip: một dòng, vẫn thấy số đếm (mục J) ─────────
function veThanhLoc(d) {
  const o = $('#oLoc');
  o.innerHTML = Object.entries(d.chuLoc).map(([ma, chu]) => {
    const n = ma === 'tat_ca' ? d.soTong : (d.dem[ma] || 0);
    return `<option value="${esc(ma)}" ${ma === LOC ? 'selected' : ''}>${esc(chu)} (${so(n)})</option>`;
  }).join('');
}

// ── CỘT «CÒN THIẾU GÌ» — màu do ánh xạ tập trung, trang chỉ nói nghĩa (mục H8) ──────
// Chưa đọc được thì nói «chưa đọc được» — ô trống trông y hệt «không thiếu gì», và đó là
// kết luận ngược hẳn sự thật.
function veCuaKiem(c) {
  if (!c) return statusBadge('unknown', { label: 'Chưa đọc được' });
  if (c.muc === 'chan') return statusBadge('blocked', { label: c.ten });
  if (c.muc === 'nhac') return statusBadge('needs_attention', { label: c.ten });
  return statusBadge('ready', { label: c.ten });
}

function veTrong(t) {
  const ic = t.vi === 'chua_cai_dat' ? 'triangle-alert' : t.vi === 'xong' ? 'circle-check' : 'search';
  const hanh = t.diTiep ? button(t.diTiep.chu, { href: t.diTiep.duong || '#', size: 'sm' }) : '';
  return emptyState({ icon: ic, title: t.noi, actionsHtml: hanh });
}

function veBang(d) {
  $('#tomTat').textContent = d.soKhop === d.soTong
    ? `${so(d.soTong)} page` : `${so(d.soKhop)}/${so(d.soTong)} page khớp`;

  if (d.trong) { $('#bang').innerHTML = veTrong(d.trong); $('#phanTrang').innerHTML = ''; return; }

  const khoaBot = !(SUA && CUA.mo);
  const lyDoKhoaBot = !SUA ? 'Cần vai Quản trị để bật tắt bot' : 'Cửa ghi đang khoá — xem cảnh báo phía trên';

  $('#bang').innerHTML = `<table class="data-table"><thead><tr>
      <th scope="col">Page</th><th scope="col">Thị trường</th><th scope="col">Marketer</th>
      <th scope="col">Bot</th><th scope="col">Còn thiếu gì</th><th scope="col">Trọng điểm</th>
    </tr></thead><tbody>${d.page.map((p) => {
      const ten = p.ten || '(chưa có tên)';
      return `
    <tr>
      <td>
        <div class="page-identity">
          <span class="page-avatar" aria-hidden="true">${esc((ten.trim()[0] || '?').toUpperCase())}</span>
          <div class="page-identity-text">
            <div class="page-identity-name ten">${esc(ten)}</div>
            <div class="page-identity-sub">${esc(p.pageId)}${p.matDau ? ' · ' + statusBadge('order_error', { label: 'Mất dấu' }) : ''}</div>
          </div>
        </div>
      </td>
      <td class="meta">${esc(p.thiTruong || '—')}${p.nganhHang ? ' · ' + esc(p.nganhHang) : ''}</td>
      <td>
        <label class="sr-only" for="mkt-${esc(p.id)}">Marketer của ${esc(ten)}</label>
        <input type="text" class="cell-input" id="mkt-${esc(p.id)}" data-mkt="${esc(p.id)}" value="${esc(p.marketer)}"
               placeholder="Chưa gán" ${SUA ? '' : 'disabled'} autocomplete="off">
      </td>
      <td>
        <label class="switch cell-control" ${khoaBot ? `title="${esc(lyDoKhoaBot)}"` : ''}>
          <input type="checkbox" role="switch" data-bot="${esc(p.id)}" aria-label="Bot của ${esc(ten)}"
                 ${p.botAiBat ? 'checked' : ''} ${khoaBot ? 'disabled' : ''}>
          <span>${p.botAiBat ? 'Đang chạy' : 'Tắt'}</span>
        </label>
      </td>
      <td>${veCuaKiem(p.cuaKiem)}</td>
      <td>
        <label class="switch" ${SUA ? '' : 'title="Cần vai Quản trị"'}>
          <input type="checkbox" role="switch" data-td="${esc(p.id)}" aria-label="Page trọng điểm: ${esc(ten)}"
                 ${p.trongDiem ? 'checked' : ''} ${SUA ? '' : 'disabled'}>
        </label>
      </td>
    </tr>`; }).join('')}</tbody></table>`;

  $('#phanTrang').innerHTML = d.soTrang > 1 ? `<div class="pagination">
      <span>Trang ${d.trang + 1} / ${d.soTrang}</span>
      <span class="hang">${button('Trước', { size: 'sm', id: 'lui', disabled: d.trang === 0 })}
        ${button('Sau', { size: 'sm', id: 'toi', disabled: d.trang >= d.soTrang - 1 })}</span>
    </div>` : '';
  if (d.soTrang > 1) {
    $('#lui').addEventListener('click', () => { TRANG = Math.max(0, TRANG - 1); nap(); });
    $('#toi').addEventListener('click', () => { TRANG = TRANG + 1; nap(); });
  }

  document.querySelectorAll('[data-bot]').forEach((el) => el.addEventListener('change', () => gatBot(el)));
  document.querySelectorAll('[data-td]').forEach((el) => el.addEventListener('change', () => gatTrongDiem(el)));
  document.querySelectorAll('[data-mkt]').forEach((el) => {
    el.addEventListener('blur', () => luuMarketer(el));
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter') el.blur(); });
  });
}

// ── GHI · bật tắt bot — chạm KHÁCH THẬT, nên hỏi lại có tiêu đề và hệ quả (mục L) ─────
async function gatBot(el) {
  const bat = el.checked;
  const ten = el.closest('tr').querySelector('.ten').textContent.trim();
  const dongY = await confirmDialog({
    title: `${bat ? 'Bật' : 'Tắt'} bot cho «${ten}»?`,
    body: bat ? 'Bot sẽ bắt đầu tự trả lời khách thật của page này.'
              : 'Bot sẽ ngừng trả lời. Khách của page này phải có người trực.',
    confirmLabel: bat ? 'Bật bot' : 'Tắt bot',
    danger: !bat,
  });
  if (!dongY) { el.checked = !bat; return; }
  el.disabled = true;
  try {
    const kq = await goi(`/api/page-bot/${encodeURIComponent(el.dataset.bot)}/bot`,
      { method: 'POST', body: JSON.stringify({ bat }) });
    toast(`Đã ${kq.botAiBat ? 'bật' : 'tắt'} bot cho «${ten}».`);
    await nap();
  } catch (e) { el.checked = !bat; baoLoi('Không thể đổi trạng thái bot', e.message); }
  finally { el.disabled = false; }
}

// ── GHI · cờ trọng điểm ────────────────────────────────────────────────────────────
async function gatTrongDiem(el) {
  el.disabled = true;
  try {
    await goi(`/api/page-bot/${encodeURIComponent(el.dataset.td)}/trong-diem`,
      { method: 'POST', body: JSON.stringify({ bat: el.checked }) });
    toast(el.checked ? 'Đã đánh dấu page trọng điểm.' : 'Đã bỏ đánh dấu trọng điểm.');
    await nap();
  } catch (e) { el.checked = !el.checked; baoLoi('Không lưu được cờ trọng điểm', e.message); }
  finally { el.disabled = false; }
}

// ── GHI · marketer — lưu khi rời ô hoặc bấm Enter ──────────────────────────────────
async function luuMarketer(el) {
  const moi = el.value.trim();
  if (moi === (el.defaultValue || '').trim()) return;
  try {
    const kq = await goi(`/api/page-bot/${encodeURIComponent(el.dataset.mkt)}/marketer`,
      { method: 'POST', body: JSON.stringify({ marketer: moi }) });
    el.defaultValue = moi;
    toast(moi ? 'Đã lưu người phụ trách.' : 'Đã bỏ người phụ trách.');
    if (kq.canhBao) baoLoi('Đã lưu, nhưng cần để ý', kq.canhBao);
    await napNhe();
  } catch (e) { el.value = el.defaultValue || ''; baoLoi('Không lưu được người phụ trách', e.message); }
}

/** Nạp lại số đếm mà KHÔNG vẽ lại bảng — để con trỏ không nhảy khỏi ô đang gõ. */
async function napNhe() {
  const d = await goi(`/api/page-bot/danh-sach?loc=${encodeURIComponent(LOC)}&tim=${encodeURIComponent(TIM)}&trang=${TRANG}`);
  if (!d) return;
  CUA = d.cuaBot; veBangTin(d); veThanhLoc(d);
}

async function nap() {
  try {
    const d = await goi(`/api/page-bot/danh-sach?loc=${encodeURIComponent(LOC)}&tim=${encodeURIComponent(TIM)}&trang=${TRANG}`);
    if (!d) return;
    SUA = d.suaDuoc; CUA = d.cuaBot; TRANG = d.trang;
    ghiUrl();
    veBangTin(d); veThanhLoc(d); veBang(d);
  } catch (e) {
    baoLoi('Không tải được danh sách page', e.message);
    $('#bang').innerHTML = emptyState({ icon: 'circle-alert', title: 'Không tải được danh sách',
      body: 'Kiểm kết nối rồi tải lại trang.' });
  }
}

let hen = null;
$('#oTim').value = TIM;
$('#oTim').addEventListener('input', (e) => {
  clearTimeout(hen);
  hen = setTimeout(() => { TIM = e.target.value.trim(); TRANG = 0; nap(); }, 250);
});
$('#oLoc').addEventListener('change', (e) => { LOC = e.target.value; TRANG = 0; nap(); });

$('#bang').innerHTML = '<div class="empty-state"><span class="skeleton"></span></div>';
nap();
</script>
<script src="/chung/dieu-huong.js"></script>
</body>
</html>
