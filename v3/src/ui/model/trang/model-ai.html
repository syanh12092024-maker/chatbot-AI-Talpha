<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Model AI &amp; khoá — AI Closer</title>
<!-- Dựng trên hệ kiểu (mục M12). KHÔNG CSS riêng — trước lượt này là 60 dòng. Ba thẻ nền vàng
     cạnh nhau (chính · dự phòng · việc nền) → ba HÀNG CÀI ĐẶT cùng một đường căn, hàng nào
     hỏng thì hỏng ngay tại hàng đó bằng chữ lỗi dưới ô chọn, không phải cả ba cùng vàng.
     Khoá API và bảng giá thành bảng dữ liệu. -->
<link rel="stylesheet" href="/chung/kieu.css" data-ds="v3">
<!-- Hàm dựng thành phần (window.UI). ĐỒNG BỘ, KHÔNG `defer`: khung ứng dụng ở cuối trang
     lấy biểu tượng từ đây — `defer` chạy SAU script cuối trang, khung sẽ mất biểu tượng. -->
<script src="/chung/ui.js"></script>
</head>
<body>
<header>
  <h1>Model AI &amp; khoá</h1>
  <span class="sub">Model nào trả lời khách, model nào đỡ khi nhà chính hỏng, và giá mỗi đơn.</span>
  <span class="sp"></span>
  <span id="dauPhai"></span>
</header>

<main>
  <div id="bang-tin" aria-live="polite"></div>

  <section class="section panel" aria-labelledby="tieu-model">
    <div class="section-header"><div>
      <h2 id="tieu-model">Model đang dùng</h2>
      <div class="section-desc">Lưu xong là lượt chat kế tiếp đi model mới — không cần khởi động lại.</div>
    </div></div>
    <div class="setting-list" id="baVai"><span class="skeleton"></span></div>
    <div class="form-actions">
      <button type="button" class="btn" data-variant="primary" data-size="md" id="nutLuu"><span>Lưu cấu hình</span></button>
      <span class="text-muted" id="ghiChuLuu"></span>
    </div>
  </section>

  <section class="section table-wrap" aria-labelledby="tieu-khoa">
    <div class="table-toolbar"><h2 id="tieu-khoa">Khoá API của bốn nhà</h2>
      <span class="table-count">Dán vào được, không đọc ra được</span></div>
    <div id="bangKhoa"></div>
  </section>

  <section class="section table-wrap" aria-labelledby="tieu-gia">
    <div class="table-toolbar"><h2 id="tieu-gia">Quy giá ra tiền thật</h2>
      <span class="table-count" id="giaiThichGia"></span></div>
    <div id="bangGia"></div>
    <div class="table-note" id="ghiChuGia"></div>
  </section>
</main>

<script>
const { esc, statusBadge, button, setBusy, alert: canhBao, emptyState, toast, formatNumber, formatVnd } = window.UI;
const $ = (s) => document.querySelector(s);
const so = (n) => formatNumber(n);
const so1 = (n) => Number(n || 0).toLocaleString('vi-VN', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

let D = null, SUA = false;
const LOI = {};

async function goi(duong, tuyChon) {
  const r = await fetch(duong, { headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' }, ...tuyChon });
  if (r.status === 401) { location.href = '/dang-nhap?tiep=' + encodeURIComponent(location.pathname); return null; }
  let d = null;
  try { d = await r.json(); } catch { /* null */ }
  if (!r.ok || !d || d.ok === false) throw new Error((d && d.thongDiep) || ('Máy chủ trả ' + r.status + '.'));
  return d;
}

function veBangTin() {
  const kh = Object.entries(LOI).map(([k, m]) => canhBao({ level: 'error', title: k, body: m }));
  for (const c of (D && D.canhBao) || []) {
    kh.push(canhBao({ level: c.muc === 'do' ? 'error' : c.muc === 'vang' ? 'warning' : 'info', body: c.chu }));
  }
  $('#bang-tin').innerHTML = kh.length ? `<div class="duoi-5">${kh.join('')}</div>` : '';
}

/** Một vai trò model = một hàng cài đặt: nhãn + giải thích bên trái, ô chọn + giá bên phải. */
function hangVai(khoa, nhan, giaiThich, dangChon) {
  const coKhoa = (nha) => !!(D.khoa[nha] && D.khoa[nha].daCo);
  const chonDuoc = D.bangGia.filter((m) => coKhoa(m.nha) || m.ma === dangChon.ma); // đang chọn thì luôn hiện, dù mất khoá
  const gia = D.bangGia.find((m) => m.ma === dangChon.ma);
  const thieu = !coKhoa(dangChon.nha);
  return `<div class="setting-row">
    <div><div class="setting-name">${esc(nhan)}</div><div class="setting-desc">${esc(giaiThich)}</div></div>
    <div class="setting-control">
      <label class="sr-only" for="vai-${esc(khoa)}">${esc(nhan)}</label>
      <select id="vai-${esc(khoa)}" data-vai="${esc(khoa)}" ${SUA ? '' : 'disabled'} ${thieu ? 'aria-invalid="true"' : ''}>
        ${chonDuoc.map((m) => `<option value="${esc(m.ma)}" ${m.ma === dangChon.ma ? 'selected' : ''}>${esc(m.ma)} — ${esc(m.tenNha)}${coKhoa(m.nha) ? '' : ' (chưa có khoá)'}</option>`).join('')}
      </select>
      ${thieu
        ? `<div class="field-error">Nhà ${esc(dangChon.tenNha)} chưa có khoá API — model này không chạy được. Dán khoá ở bảng bên dưới.</div>`
        : gia ? `<div class="field-hint">${so1(gia.dTin)} đ/tin · ${so(gia.dDon)} đ/đơn${gia.giaChacChan ? '' : ' · giá suy ngược'}</div>` : ''}
    </div>
  </div>`;
}

function veCauHinh() {
  $('#dauPhai').innerHTML = D.macDinh
    ? statusBadge('blocked', { label: 'Chưa cấu hình — đang chạy bộ mặc định' })
    : `<span class="text-muted text-sm">Sửa lần cuối ${D.suaLuc ? esc(new Date(D.suaLuc).toLocaleString('vi-VN')) : '—'}</span>`;
  $('#ghiChuLuu').textContent = SUA ? '' : 'Vai của bạn chỉ xem được.';
  $('#nutLuu').disabled = !SUA;

  $('#baVai').innerHTML =
    hangVai('chinh', D.tenVaiTro.chinh, D.giaiThichVaiTro.chinh, D.dangDung.chinh)
    + hangVai('duPhong', D.tenVaiTro.du_phong, D.giaiThichVaiTro.du_phong, D.dangDung.duPhong)
    + hangVai('nen', D.tenVaiTro.nen, D.giaiThichVaiTro.nen, D.dangDung.nen)
    + hangNgauNhien('nn', 'Độ ngẫu nhiên — model chính', '0 = trả lời ổn định, giống nhau mỗi lần. 1 = nói đa dạng hơn nhưng khó lường.', D.doNgauNhien)
    + hangNgauNhien('nnn', 'Độ ngẫu nhiên — việc nền', 'Việc nền là phân loại và tóm tắt — nên để thấp cho kết quả lặp lại được.', D.doNgauNhienNen);

  for (const id of ['nn', 'nnn']) {
    const o = $('#' + id);
    if (o) o.addEventListener('input', (e) => { document.querySelector(`output[for="${id}"]`).textContent = e.target.value; });
  }
}

function hangNgauNhien(id, nhan, giaiThich, giaTri) {
  return `<div class="setting-row">
    <div><div class="setting-name">${esc(nhan)}</div><div class="setting-desc">${esc(giaiThich)}</div></div>
    <div class="setting-control"><div class="range-row">
      <input type="range" id="${id}" min="0" max="1" step="0.05" value="${esc(giaTri)}" ${SUA ? '' : 'disabled'}
             aria-label="${esc(nhan)}">
      <output for="${id}">${esc(giaTri)}</output>
    </div></div>
  </div>`;
}

/* ─── khoá API ─── */
function veKhoa() {
  $('#bangKhoa').innerHTML = `<table class="data-table"><thead><tr>
      <th scope="col">Nhà model</th><th scope="col">Khoá</th>
      ${SUA ? '<th scope="col">Dán khoá mới</th><th scope="col" class="actions"><span class="sr-only">Lưu</span></th>' : ''}
    </tr></thead><tbody>${D.nha.map((n) => {
      const k = D.khoa[n.ma] || {};
      return `<tr>
      <td class="manh">${esc(n.ten)}</td>
      <td>${k.daCo
        ? statusBadge(k.tuEnv ? 'feature_on' : 'ready', { label: k.tuEnv ? 'Khoá từ cấu hình máy chủ' : 'Khoá riêng của team' })
        : statusBadge('blocked', { label: 'Chưa có khoá' })}
        ${k.daCo ? '' : '<div class="meta">Chưa dán thì không chọn được model của nhà này.</div>'}</td>
      ${SUA ? `<td><label class="sr-only" for="k-${esc(n.ma)}">Khoá API của ${esc(n.ten)}</label>
        <input type="password" class="cell-input" id="k-${esc(n.ma)}" data-khoa="${esc(n.ma)}" placeholder="Dán khoá API…" autocomplete="off" spellcheck="false"></td>
        <td class="actions">${button('Lưu', { size: 'sm', data: { luukhoa: n.ma } })}</td>` : ''}
    </tr>`; }).join('')}</tbody></table>`;
  document.querySelectorAll('[data-luukhoa]').forEach((b) => b.addEventListener('click', () => luuKhoa(b.dataset.luukhoa, b)));
}

/* ─── bảng giá ─── */
function veBangGia() {
  $('#giaiThichGia').textContent = `${so1(D.tinMoiDon)} tin mỗi đơn · tỉ giá ${so(D.usdVnd)} đ/USD`;
  $('#bangGia').innerHTML = `<table class="data-table"><thead><tr>
      <th scope="col">Model</th><th scope="col">Nhà</th><th scope="col" class="num">Mỗi tin</th>
      <th scope="col" class="num">Mỗi đơn</th><th scope="col" class="num">So với đang dùng</th>
    </tr></thead><tbody>${D.bangGia.map((m) => `
    <tr ${m.laDangDung ? 'aria-selected="true"' : ''}>
      <td><span class="manh">${esc(m.ma)}</span>${m.laDangDung ? ' <span class="badge" data-variant="info">Đang dùng</span>' : ''}
        ${m.giaChacChan ? '' : '<div class="meta" title="Chưa ai mở tài khoản nhà này — đơn giá giải ngược từ bảng đ/tin">Giá suy ngược</div>'}</td>
      <td class="meta">${esc(m.tenNha)}</td>
      <td class="num">${so1(m.dTin)} đ</td>
      <td class="num manh">${so(m.dDon)} đ</td>
      <td class="num">${m.soVoiDangDung == null ? '—'
        : `<span class="badge"${m.soVoiDangDung < 1 ? ' data-variant="success"' : m.soVoiDangDung > 1.5 ? ' data-variant="danger"' : ''}>${String(m.soVoiDangDung).replace('.', ',')}×</span>`}</td>
    </tr>`).join('')}</tbody></table>`;
  $('#ghiChuGia').innerHTML = `Đo bằng tiền <b>mỗi đơn</b>, không phải mỗi tin: model thông minh hơn chốt bằng ít tin hơn, `
    + `nên có thể đắt mỗi tin mà rẻ mỗi đơn. Cột «mỗi đơn» là <b>phóng chiếu</b> (đ/tin × ${so1(D.tinMoiDon)} tin/đơn đo được), `
    + 'không phải một phép đo mới — muốn biết chắc thì phải chạy A/B.';
}

/* ─── ghi ─── */
async function luuKhoa(nha, nut) {
  const o = document.querySelector(`[data-khoa="${nha}"]`);
  const v = (o.value || '').trim();
  if (!v) {
    o.setAttribute('aria-invalid', 'true');
    o.focus();
    LOI['Chưa dán khoá nào'] = 'Ô trống nghĩa là «giữ nguyên», không phải «xoá khoá».';
    veBangTin();
    return;
  }
  setBusy(nut, true);
  try {
    await goi('/api/model/khoa', { method: 'POST', body: JSON.stringify({ nha, khoa: v }) });
    o.value = '';
    delete LOI['Không lưu được khoá']; delete LOI['Chưa dán khoá nào'];
    toast(`Đã lưu khoá cho ${nha}. Lượt chat kế tiếp dùng khoá mới.`);
    await nap();
  } catch (e) { LOI['Không lưu được khoá'] = e.message; veBangTin(); setBusy(nut, false); }
}

$('#nutLuu').addEventListener('click', async () => {
  const lay = (v) => document.querySelector(`[data-vai="${v}"]`).value;
  const than = {
    chinh: lay('chinh'), duPhong: lay('duPhong'), nen: lay('nen'),
    doNgauNhien: Number($('#nn').value), doNgauNhienNen: Number($('#nnn').value),
  };
  const nut = $('#nutLuu');
  setBusy(nut, true);
  try {
    await goi('/api/model/cau-hinh', { method: 'POST', body: JSON.stringify(than) });
    delete LOI['Không lưu được cấu hình'];
    toast('Đã lưu. Lượt chat kế tiếp đi model mới.');
    await nap();
  } catch (e) { LOI['Không lưu được cấu hình'] = e.message; veBangTin(); }
  finally { setBusy(nut, false); nut.disabled = !SUA; }
});

async function nap() {
  try {
    const d = await goi('/api/model/cau-hinh');
    if (!d) return;
    D = d; SUA = !!d.suaDuoc;
    delete LOI['Không tải được cấu hình model'];
    veCauHinh(); veKhoa(); veBangGia(); veBangTin();
  } catch (e) {
    LOI['Không tải được cấu hình model'] = e.message; veBangTin();
    $('#baVai').innerHTML = emptyState({ icon: 'circle-alert', title: 'Không tải được', body: 'Kiểm kết nối rồi tải lại trang.' });
  }
}
nap();
</script>
<script src="/chung/dieu-huong.js"></script>
</body>
</html>
