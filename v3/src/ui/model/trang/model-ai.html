<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Model AI &amp; khoá — AI Closer</title>
<!-- VE7c · 30/09 (bản vẽ 4 › Model AI): ba THẺ theo VAI — Trả lời khách · Dự phòng · Việc nền (ẩn tới khi có việc đầu
     tiên dùng) — mỗi thẻ mang model, khoá của ĐÚNG nhà đó, và trạng thái ĐO ĐƯỢC: đường dùng thật (LL6) + lượt thử gần nhất.
     «Thay khoá và thử một lượt» gọi đúng model + khoá của vai một lần — trước lượt này không nơi nào biết khoá còn dùng
     được. Không CSS riêng (HK15): lưới thẻ là `.luoi-the-model` trong `chung/kieu.css`. -->
<link rel="stylesheet" href="/chung/kieu.css" data-ds="v3">
<!-- Hàm dựng thành phần (window.UI). ĐỒNG BỘ, KHÔNG `defer`: khung ứng dụng ở cuối trang
     lấy biểu tượng từ đây — `defer` chạy SAU script cuối trang, khung sẽ mất biểu tượng. -->
<script src="/chung/ui.js"></script>
</head>
<body>
<header>
  <h1>Model AI &amp; khoá</h1>
  <span class="sub">Model nào trả lời khách, model nào đỡ khi nhà chính hỏng — và khoá của đúng nhà đó.</span>
  <span class="sp"></span>
  <span id="dauPhai"></span>
</header>

<main>
  <div id="bang-tin" aria-live="polite"></div>
  <div class="o-luu-y duoi-5" id="suThat"></div>
  <div class="luoi-the-model" id="baThe"><span class="skeleton"></span></div>
  <p class="table-note" id="ghiChuNen" hidden></p>
  <div class="form-actions">
    <button type="button" class="btn" data-variant="primary" data-size="md" id="nutLuu"><span>Lưu cấu hình</span></button>
    <span class="text-muted" id="ghiChuLuu"></span>
  </div>
  <details class="section tren-5" id="khungGia">
    <summary><b>Bảng giá bảy model</b> <span class="text-muted" id="giaiThichGia"></span></summary>
    <div class="table-wrap tren-3"><div id="bangGia"></div></div>
    <div class="table-note" id="ghiChuGia"></div>
  </details>
</main>

<script>
const { esc, statusBadge, button, setBusy, alert: canhBao, emptyState, toast, formatNumber } = window.UI;
const $ = (s) => document.querySelector(s);
const so = (n) => formatNumber(n);
const so1 = (n) => Number(n || 0).toLocaleString('vi-VN', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

let D = null, SUA = false;
const LOI = {};

async function goi(duong, tuyChon) {
  const r = await fetch(duong, { headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' }, ...tuyChon });
  if (r.status === 401) { location.href = '/dang-nhap?tiep=' + encodeURIComponent(location.pathname); return null; }
  let d = null;
  try { d = await r.json(); } catch { /* null */ }
  if (!r.ok || !d || d.ok === false) throw new Error((d && d.thongDiep) || ('Máy chủ trả ' + r.status + '.'));
  return d;
}

// GỘP cảnh báo trùng ý (audit 28/09): chưa dán khoá từng ra MỘT nhãn đỏ ở đầu trang, BA hộp đỏ, BA dòng lỗi dưới ô chọn và
// BỐN nhãn đỏ ở bảng khoá — mười một chỗ đỏ cho một việc. Dữ liệu cảnh báo phía máy chủ giữ nguyên (có bài test khoá); chỉ
// cách HIỆN là gộp.
// VE7c · 30/09: cảnh «thiếu khoá» của lớp model đọc khoá env TÊN KHÁC với bot (`V3_KHOA_<NHÀ>` ≠ `KIMI_API_KEY`) — đo trên
// prod: báo «chưa có khoá» cho một bot đang chạy. Nên vai trả lời khách nói theo ĐƯỜNG BOT (`D.botDung`); còn «dự phòng
// thiếu khoá» chỉ hiện khi dự phòng ĐÃ nối vào đường trả lời — hôm nay có khoá hay không cũng không nhà nào đỡ, thẻ Dự
// phòng tự nói trạng thái khoá của nó.
function veBangTin() {
  const kh = Object.entries(LOI).map(([k, m]) => canhBao({ level: 'error', title: k, body: m }));
  const ds = (D && D.canhBao) || [];
  const dd = (D && D.duongDung) || {};
  const b = D && D.botDung;
  if (b ? !!b.loi : ds.some((c) => c.ma === 'chinh_khong_khoa')) {
    kh.push(canhBao({
      level: 'error',
      title: 'Bot không gọi được model trả lời khách',
      body: !b ? `Model chính (${D.dangDung.chinh.ma}) chưa có khoá.`
        : b.lyDo === 'thieu_khoa' ? `${D.dangDung.chinh.ma} (${D.dangDung.chinh.tenNha}) chưa có khoá — mọi lượt trả lời khách của bot sẽ hỏng.`
          : `${b.loi}.`,
      actionsHtml: SUA ? button('Dán khoá', { size: 'sm', data: { 'toi-khoa': '1' } }) : '',
    }));
  }
  for (const c of ds) {
    if (c.ma === 'chua_cau_hinh' || c.ma === 'chinh_khong_khoa') continue;
    if (c.ma === 'du_phong_khong_khoa' && !(dd.du_phong && dd.du_phong.dung)) continue;
    // «chưa có khoá thì không chọn được model của nhà đó» — sai: chọn được, chỉ là không gọi được; ô chọn của từng thẻ đã
    // ghi «(chưa có khoá)» theo ĐÚNG luật của thẻ đó (bot · lớp v3), hộp này đếm theo một luật cho cả hai.
    if (c.ma === 'con_nha_chua_khoa') continue;
    kh.push(canhBao({ level: c.muc === 'do' ? 'error' : c.muc === 'vang' ? 'warning' : 'info', body: c.chu }));
  }
  $('#bang-tin').innerHTML = kh.length ? `<div class="duoi-5">${kh.join('')}</div>` : '';
  const toi = document.querySelector('[data-toi-khoa]');
  if (toi) toi.addEventListener('click', () => {
    const o = document.querySelector('[data-khoa-vai]');
    if (o) { o.scrollIntoView({ behavior: 'smooth', block: 'center' }); o.focus({ preventScroll: true }); }
  });
}

/* ── «Màn chỉ hiện thứ bot THẬT SỰ dùng» — ba sự thật đo được (máy chủ đếm page bot mới xử bằng luật của worker) ── */
function veSuThat() {
  const b = D.botMoi || {};
  const botMoi = b.soPage == null
    ? `Bot đọc đúng cấu hình ở đây — số page nó đang xử: chưa đo (${b.viSao || 'không rõ vì sao'}).`
    : b.soPage
      ? `Bot đọc đúng cấu hình ở đây và đang xử ${so(b.soPage)}/${so(b.tong)} page của team.`
      : `Bot đọc đúng cấu hình ở đây nhưng CHƯA xử page nào (0/${so(b.tong)} page của team).`;
  $('#suThat').innerHTML = `<b>Màn chỉ hiện thứ bot THẬT SỰ dùng.</b> ${esc(botMoi)}`
    + ' «Dự phòng» và «việc nền» chưa nối vào đường trả lời nào.';
}

/* ── BA THẺ THEO VAI ─────────────────────────────────────────────────────────────────── */
const TEN_THE = { chinh: 'Trả lời khách', duPhong: 'Dự phòng', nen: 'Việc nền' };
const KHOA_TEN = { chinh: 'chinh', duPhong: 'du_phong', nen: 'nen' };   // khoá của tenVaiTro / giaiThichVaiTro
const gioThu = (ms) => new Date(ms).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
const chuThu = (t) => `Lượt thử lúc ${gioThu(t.luc)} · ${t.maModel}: ${t.chu}`;
// Nguồn khoá THEO ĐƯỜNG DÙNG thẻ đó — hai luật khác nhau thật, màn nói đúng từng cái:
//   «Trả lời khách» theo BOT (`src/chat/model.js#khoaCuaBot`): khoá team → khoá máy chủ (KIMI_API_KEY/ANTHROPIC_API_KEY) CHỈ
//   cho nhà trùng AI_PROVIDER; «Dự phòng» theo LỚP V3 (`docCauHinh`): khoá team → V3_KHOA_<NHÀ>.
function khoaCua(vai, nha) {
  if (vai === 'chinh') {
    const k = (D.khoaBot || {})[nha];
    if (!k || k.chuaDo) return { co: null, chu: 'chưa đo được bot dùng khoá nào' };
    if (k.nguonKhoa === 'team') return { co: true, chu: 'khoá riêng của team' };
    if (k.nguonKhoa === 'may_chu') return { co: true, chu: `khoá chung của máy chủ · ${k.bienMayChu}` };
    return { co: false, chu: 'chưa có khoá — bot sẽ KHÔNG gọi được' };
  }
  const k = D.khoa[nha] || {};
  if (!k.daCo) return { co: false, chu: 'chưa có khoá' };
  return { co: true, chu: k.tuEnv ? `khoá chung của máy chủ · V3_KHOA_${String(nha).toUpperCase()}` : 'khoá riêng của team' };
}
// Bot THẬT SỰ đang gọi gì cho vai trả lời khách — đọc bằng đường chọn của chính bot (máy chủ), không suy từ ô chọn.
function cauBotDung() {
  const b = D.botDung;
  if (!b) return { muc: 'info', chu: 'Chưa đo được bot đang gọi model nào — máy chủ chưa nối đường chọn model của bot.' };
  if (b.chuaDo) return { muc: 'warning', chu: `Chưa đo được bot đang gọi model nào (${b.chuaDo}).` };
  if (b.loi) return { muc: 'error', chu: b.lyDo === 'thieu_khoa' ? `Bot KHÔNG gọi được: ${D.dangDung.chinh.ma} chưa có khoá. Dán khoá bên dưới.` : `Bot KHÔNG gọi được: ${b.loi}.` };
  const nn = b.doNgauNhien == null ? 'KHÔNG gửi độ ngẫu nhiên' : `độ ngẫu nhiên ${String(b.doNgauNhien).replace('.', ',')}`;
  const khoa = b.nguonKhoa === 'team' ? 'khoá riêng của team' : `khoá chung của máy chủ (${b.bienMayChu})`;
  if (b.nguon === 'config') {
    return { muc: 'info', chu: `Bot đang gọi ${b.maModel} — model của MÁY CHỦ (MODEL_CLOSER), ${khoa}, ${nn}. Team chưa lưu cấu hình `
      + 'riêng: bấm «Lưu cấu hình» hoặc dán khoá ở đây là bot chuyển sang dùng lựa chọn bên dưới.' };
  }
  return { muc: 'success', chu: `Bot đang gọi ${b.maModel} · ${khoa} · ${nn}.` };
}
function tenNhaCua(ma) { const m = D.bangGia.find((x) => x.ma === ma); return m ? { nha: m.nha, ten: m.tenNha } : { nha: '', ten: '' }; }
function thanhNgauNhien(id, nhan, giaiThich, giaTri) {
  return `<div class="field"><label class="field-label" for="${id}">${esc(nhan)} · <output for="${id}">${esc(String(giaTri).replace('.', ','))}</output></label>
    <input type="range" id="${id}" min="0" max="1" step="0.05" value="${esc(giaTri)}" ${SUA ? '' : 'disabled'}>
    <span class="field-hint">${esc(giaiThich)}</span></div>`;
}
function veThe(vai, dangChon, duongDung) {
  const thu = (D.thuGanNhat || {})[vai] || null;
  const gia = D.bangGia.find((m) => m.ma === dangChon.ma);
  const k = khoaCua(vai, dangChon.nha);
  const bot = vai === 'chinh' ? cauBotDung() : null;
  const nhan = (duongDung ? statusBadge(duongDung.dung ? 'ready' : 'needs_attention', { label: duongDung.chu }) : '')
    + (thu ? ' ' + statusBadge(thu.ok ? 'ready' : 'blocked', { label: thu.ok ? 'Khoá dùng được' : thu.chu }) : '');
  return `<section class="section panel" aria-labelledby="the-${vai}" data-the="${vai}">
    <div class="section-header"><div><h2 id="the-${vai}">${TEN_THE[vai]}</h2>
      <div class="section-desc">${esc(D.giaiThichVaiTro[KHOA_TEN[vai]] || '')}</div></div><div>${nhan}</div></div>
    ${bot ? `<div class="duoi-3" data-bot-dung>${canhBao({ level: bot.muc, body: bot.chu })}</div>` : ''}
    <div class="form-stack">
      <div class="field"><label class="field-label" for="vai-${vai}">Model${vai === 'duPhong' ? ' (khác nhà với model chính)' : ''}</label>
        <select id="vai-${vai}" data-vai="${vai}" ${SUA ? '' : 'disabled'}>${D.bangGia.map((m) => `<option value="${esc(m.ma)}"`
          + `${m.ma === dangChon.ma ? ' selected' : ''}>${esc(m.ma)} — ${esc(m.tenNha)}${khoaCua(vai, m.nha).co === false ? ' (chưa có khoá)' : ''}</option>`).join('')}</select>
        <span class="field-hint">${gia ? `${so1(gia.dTin)} đ/tin · ${so(gia.dDon)} đ/đơn${gia.giaChacChan ? '' : ' · giá suy ngược'}` : ''}</span></div>
      <div class="field"><label class="field-label" for="khoa-${vai}">Khoá API · <span data-ten-nha="${vai}">${esc(dangChon.tenNha)}</span>
        <span class="meta" data-tt-khoa="${vai}">(${esc(k.chu)})</span></label>
        <input type="password" id="khoa-${vai}" data-khoa-vai="${vai}" data-khoa-nha="${esc(dangChon.nha)}" autocomplete="off" spellcheck="false"
          placeholder="${k.co ? 'Để trống = giữ khoá đang có' : 'Dán khoá API…'}" ${SUA ? '' : 'disabled'}></div>
      ${vai === 'chinh' ? thanhNgauNhien('nn', 'Độ ngẫu nhiên', 'Gửi kèm MỖI lượt gọi của bot. 0 = ổn định, giống nhau mỗi lần; 1 = đa dạng nhưng khó lường.', D.doNgauNhien) : ''}
      ${vai === 'nen' ? thanhNgauNhien('nnn', 'Độ ngẫu nhiên — việc nền', 'Nên để thấp để kết quả lặp lại được.', D.doNgauNhienNen) : ''}
      ${duongDung && !(bot && D.botDung) ? `<div class="field-hint">${esc(duongDung.noi)}</div>` : ''}
    </div>
    ${SUA && vai !== 'nen'
      ? `<div class="form-actions">${button('Thay khoá và thử một lượt', { size: 'sm', data: { thu: vai } })}`
        + `<span class="field-hint" data-ket-thu="${vai}" aria-live="polite">${thu ? esc(chuThu(thu)) : 'Chưa thử — bấm để gọi đúng model + khoá này MỘT lần (để trống ô khoá là thử khoá đang có).'}</span></div>`
      : (thu ? `<div class="field-hint">${esc(chuThu(thu))}</div>` : '')}
  </section>`;
}

function veCauHinh() {
  // VE7c: team chưa có dòng cấu hình thì bot KHÔNG chạy «bộ mặc định» của lớp v3 — nó gọi model của máy chủ (đường chọn của bot).
  $('#dauPhai').innerHTML = D.botDung && D.botDung.nguon === 'config'
    ? statusBadge('needs_attention', { label: 'Chưa lưu cấu hình riêng — bot dùng model của máy chủ' })
    : D.macDinh ? statusBadge('needs_attention', { label: 'Chưa lưu cấu hình riêng' })
      : `<span class="text-muted text-sm">Sửa lần cuối ${D.suaLuc ? esc(new Date(D.suaLuc).toLocaleString('vi-VN')) : '—'}</span>`;
  $('#ghiChuLuu').textContent = SUA ? 'Lưu model + độ ngẫu nhiên; khoá lưu bằng nút «Thay khoá và thử một lượt» của từng thẻ.' : 'Vai của bạn chỉ xem được.';
  $('#nutLuu').disabled = !SUA;
  // LL6: trạng thái THẬT của từng vai (máy có đọc ô này không) — không hứa theo tên vai.
  const dd = { chinh: (D.duongDung || {}).chinh, duPhong: (D.duongDung || {}).du_phong, nen: (D.duongDung || {}).nen };
  // Việc nền: bản vẽ — «hiện ô này khi có việc nền đầu tiên nối vào, trước đó ẩn».
  const hienNen = !!(dd.nen && dd.nen.dung);
  $('#baThe').innerHTML = veThe('chinh', D.dangDung.chinh, dd.chinh) + veThe('duPhong', D.dangDung.duPhong, dd.duPhong)
    + (hienNen ? veThe('nen', D.dangDung.nen, dd.nen) : '');
  $('#ghiChuNen').hidden = hienNen;
  $('#ghiChuNen').textContent = hienNen ? '' : `Việc nền: ${dd.nen ? dd.nen.chu.toLowerCase() : 'chưa đo'} — ô này ẩn tới khi có việc đầu tiên nối vào. `
    + `Đang lưu: ${D.dangDung.nen.ma} · độ ngẫu nhiên ${String(D.doNgauNhienNen).replace('.', ',')}.`;
  for (const id of ['nn', 'nnn']) {
    const o = $('#' + id);
    if (o) o.addEventListener('input', (e) => { document.querySelector(`output[for="${id}"]`).textContent = String(e.target.value).replace('.', ','); });
  }
  // Đổi model trong ô chọn ⇒ ô khoá đi theo NHÀ của model mới (dán khoá đúng nhà).
  document.querySelectorAll('[data-vai]').forEach((s) => s.addEventListener('change', () => {
    const { nha, ten } = tenNhaCua(s.value);
    const vai = s.dataset.vai;
    const o = document.querySelector(`[data-khoa-vai="${vai}"]`);
    const kc = khoaCua(vai, nha);
    if (o) { o.dataset.khoaNha = nha; o.placeholder = kc.co ? 'Để trống = giữ khoá đang có' : 'Dán khoá API…'; }
    const t = document.querySelector(`[data-ten-nha="${vai}"]`); if (t) t.textContent = ten;
    const k = document.querySelector(`[data-tt-khoa="${vai}"]`); if (k) k.textContent = `(${kc.chu})`;
  }));
  document.querySelectorAll('[data-thu]').forEach((b) => b.addEventListener('click', () => thuVai(b.dataset.thu, b)));
}

/* ── «Thay khoá và thử một lượt»: dán khoá (nếu có) rồi gọi ĐÚNG model đang LƯU của vai một lần ── */
async function thuVai(vai, nut) {
  const ket = document.querySelector(`[data-ket-thu="${vai}"]`);
  const chon = document.querySelector(`[data-vai="${vai}"]`);
  const dangLuu = vai === 'chinh' ? D.dangDung.chinh.ma : D.dangDung.duPhong.ma;
  if (chon && chon.value !== dangLuu) {
    ket.textContent = `Bạn vừa đổi sang ${chon.value} mà chưa lưu — bấm «Lưu cấu hình» trước rồi thử (lượt thử gọi model đang LƯU: ${dangLuu}).`;
    return;
  }
  const o = document.querySelector(`[data-khoa-vai="${vai}"]`);
  const khoa = (o && o.value || '').trim();
  setBusy(nut, true);
  try {
    if (khoa) {
      await goi('/api/model/khoa', { method: 'POST', body: JSON.stringify({ nha: o.dataset.khoaNha, khoa }) });
      o.value = '';
    }
    const d = await goi('/api/model/thu', { method: 'POST', body: JSON.stringify({ vai }) });
    if (!d) return;
    delete LOI['Không thử được model'];
    await nap();
    toast(d.ket.ok ? `${d.ket.maModel}: khoá dùng được.` : `${d.ket.maModel}: ${d.ket.chu}.`);
  } catch (e) {
    const k2 = document.querySelector(`[data-ket-thu="${vai}"]`);
    if (k2) k2.textContent = e.message; else { LOI['Không thử được model'] = e.message; veBangTin(); }
    setBusy(nut, false);
  }
}

/* ─── bảng giá (thu gọn — so bằng tiền MỖI ĐƠN) ─── */
function veBangGia() {
  $('#giaiThichGia').textContent = `· ${so1(D.tinMoiDon)} tin mỗi đơn · tỉ giá ${so(D.usdVnd)} đ/USD`;
  $('#bangGia').innerHTML = `<table class="data-table"><thead><tr>
      <th scope="col">Model</th><th scope="col">Nhà</th><th scope="col" class="num">Mỗi tin</th>
      <th scope="col" class="num">Mỗi đơn</th><th scope="col" class="num">So với đang dùng</th>
    </tr></thead><tbody>${D.bangGia.map((m) => `
    <tr ${m.laDangDung ? 'aria-selected="true"' : ''}>
      <td><span class="manh">${esc(m.ma)}</span>${m.laDangDung ? ' <span class="badge" data-variant="info">Đang dùng</span>' : ''}
        ${m.giaChacChan ? '' : '<div class="meta" title="Chưa ai mở tài khoản nhà này — đơn giá giải ngược từ bảng đ/tin">Giá suy ngược</div>'}</td>
      <td class="meta">${esc(m.tenNha)}</td>
      <td class="num">${so1(m.dTin)} đ</td>
      <td class="num manh">${so(m.dDon)} đ</td>
      <td class="num">${m.soVoiDangDung == null ? '—'
        : `<span class="badge"${m.soVoiDangDung < 1 ? ' data-variant="success"' : m.soVoiDangDung > 1.5 ? ' data-variant="danger"' : ''}>${String(m.soVoiDangDung).replace('.', ',')}×</span>`}</td>
    </tr>`).join('')}</tbody></table>`;
  $('#ghiChuGia').innerHTML = `So bằng tiền <b>mỗi đơn</b>, không phải mỗi tin: model khôn chốt bằng ít tin hơn. `
    + `Cột «mỗi đơn» ước từ ${so1(D.tinMoiDon)} tin/đơn đo được.`;
}

/* ─── lưu model + độ ngẫu nhiên ─── */
$('#nutLuu').addEventListener('click', async () => {
  const lay = (v, macDinh) => { const o = document.querySelector(`[data-vai="${v}"]`); return o ? o.value : macDinh; };
  const than = {
    chinh: lay('chinh', D.dangDung.chinh.ma), duPhong: lay('duPhong', D.dangDung.duPhong.ma), nen: lay('nen', D.dangDung.nen.ma),
    doNgauNhien: Number($('#nn') ? $('#nn').value : D.doNgauNhien), doNgauNhienNen: Number($('#nnn') ? $('#nnn').value : D.doNgauNhienNen),
  };
  const nut = $('#nutLuu');
  setBusy(nut, true);
  try {
    await goi('/api/model/cau-hinh', { method: 'POST', body: JSON.stringify(than) });
    delete LOI['Không lưu được cấu hình'];
    toast('Đã lưu. Lượt chat kế tiếp của bot đi model mới.');
    await nap();
  } catch (e) { LOI['Không lưu được cấu hình'] = e.message; veBangTin(); }
  finally { setBusy(nut, false); nut.disabled = !SUA; }
});

async function nap() {
  try {
    const d = await goi('/api/model/cau-hinh');
    if (!d) return;
    D = d; SUA = !!d.suaDuoc;
    delete LOI['Không tải được cấu hình model'];
    veSuThat(); veCauHinh(); veBangGia(); veBangTin();
  } catch (e) {
    LOI['Không tải được cấu hình model'] = e.message; veBangTin();
    $('#baThe').innerHTML = emptyState({ icon: 'circle-alert', title: 'Không tải được', body: 'Kiểm kết nối rồi tải lại trang.' });
  }
}
nap();
</script>
<script src="/chung/dieu-huong.js"></script>
