<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Câu trả lời sẵn — AI Closer</title>
<!-- Dựng trên hệ kiểu (mục M9). KHÔNG CSS riêng — trước lượt này là 39 dòng, trong đó hai
     thẻ số viền trên màu «tím» (một trạng thái hệ kiểu không có) và hai màu chữ gõ tay.
     Tiền tiết kiệm nay là một hàng chỉ số; đối chiếu Botcake là tính năng CHƯA CÓ nên vẽ
     theo mục O («chưa khả dụng» không được trông như đang chạy). -->
<link rel="stylesheet" href="/chung/kieu.css" data-ds="v3">
<!-- Hàm dựng thành phần (window.UI). ĐỒNG BỘ, KHÔNG `defer`: khung ứng dụng ở cuối trang
     lấy biểu tượng từ đây — `defer` chạy SAU script cuối trang, khung sẽ mất biểu tượng. -->
<script src="/chung/ui.js"></script>
</head>
<body>
<header>
  <h1>Câu trả lời sẵn</h1>
  <span class="sub">Câu hỏi khớp từ khoá được trả lời bằng mẫu có sẵn — không gọi model, không tốn tiền.</span>
</header>

<main>
  <div id="bang-tin" aria-live="polite"></div>

  <section class="section" aria-label="Hiệu quả">
    <div id="dem"><div class="metric-row"><div class="metric"><span class="skeleton"></span></div></div></div>
  </section>

  <section class="section table-wrap" aria-labelledby="tieu-mau">
    <div class="table-toolbar"><h2 id="tieu-mau">Mẫu trả lời</h2>
      <span class="table-count" id="hSo"></span></div>
    <div id="bang"></div>
  </section>

  <section class="section" aria-labelledby="tieu-bc">
    <div class="section-header"><h2 id="tieu-bc">Tính năng liên quan</h2></div>
    <div class="panel" id="botcake"></div>
  </section>
</main>

<script>
const { esc, text, statusBadge, alert: canhBao, emptyState, metricRow, formatNumber, formatVnd } = window.UI;
const $ = (s) => document.querySelector(s);
// Số CHƯA ĐẾM ĐƯỢC hiện «—», không hiện 0 — 0 là «đếm rồi, không có».
const d0 = (n) => (n == null ? '—' : formatNumber(n));
const boMa = (s) => String(s == null ? '' : s).replace(/`/g, '');

async function tai() {
  try {
    const r = await fetch('/api/lop-0-dong', { credentials: 'same-origin', headers: { Accept: 'application/json' } });
    if (r.status === 401) { location.href = '/dang-nhap?tiep=' + encodeURIComponent(location.pathname); return; }
    const d = await r.json();
    if (!r.ok || d.ok === false) throw new Error(d.thongDiep || 'Máy chủ trả ' + r.status + '.');
    const k = d.dem;

    $('#dem').innerHTML = metricRow([
      { label: 'Lượt không phải gọi model', value: d0(k.tongChan), hint: 'Mỗi lượt khớp một mẫu là một lượt model không chạy.' },
      { label: 'Tiền tiết kiệm', value: k.tienTietKiem == null ? '—' : formatVnd(k.tienTietKiem),
        hint: `${d0(k.tongChan)} lượt × ${d0(k.vndMoiTin)} đ/tin, theo giá ở màn Chi phí AI` },
      { label: 'Mẫu đang bật', value: `${d0(k.dangBat)}/${d0(k.tongMau)}` },
      { label: 'Bật mà chưa khớp lần nào', value: d0(k.soMauChuaChanLanNao),
        statusHtml: k.soMauChuaChanLanNao ? statusBadge('needs_attention', { label: 'Xem lại từ khoá' }) : '' },
    ]);

    const kh = [];
    if (k.soMauChuaChanLanNao) {
      kh.push(canhBao({ level: 'warning', title: `${formatNumber(k.soMauChuaChanLanNao)} mẫu đang bật nhưng chưa khớp lần nào`,
        body: 'Từ khoá có thể không khớp cách khách thật sự gõ. Thử đọc vài hội thoại thật rồi thêm từ khoá.' }));
    }
    if (k.soMauKhongDemDuoc) {
      kh.push(canhBao({ level: 'info', title: `${formatNumber(k.soMauKhongDemDuoc)} mẫu chưa đếm được số lần khớp`,
        body: 'Cột «Đã khớp» của những mẫu này hiện «—». Đó là chưa biết, không phải bằng 0.' }));
    }
    $('#bang-tin').innerHTML = kh.length ? `<div class="duoi-5">${kh.join('')}</div>` : '';

    $('#hSo').textContent = `${d0(k.dangBat)}/${d0(k.tongMau)} mẫu đang bật`;
    if (!d.mau.length) {
      // Tiêu đề nói bằng lời người dùng; câu của kho (có tên bảng) là chi tiết cho người quản trị.
      $('#bang').innerHTML = emptyState({ icon: 'inbox', title: 'Chưa có mẫu trả lời nào',
        body: d.trong ? `${boMa(d.trong.diTiep)} (${boMa(d.trong.noi)})` : '' });
    } else {
      $('#bang').innerHTML = `<table class="data-table"><thead><tr>
          <th scope="col">Mã</th><th scope="col">Tên</th><th scope="col">Từ khoá</th>
          <th scope="col" class="num">Đã khớp</th><th scope="col">Trạng thái</th>
        </tr></thead><tbody>${d.mau.map((m) => `
        <tr>
          <td><code>${esc(m.ma)}</code></td>
          <td>${esc(m.ten)}</td>
          <td class="meta">${m.tuKhoa.slice(0, 6).map(esc).join(' · ')}${m.tuKhoa.length > 6 ? ` · +${formatNumber(m.tuKhoa.length - 6)}` : ''}</td>
          <td class="num" ${m.soLanChan == null ? 'title="Chưa đếm được"' : ''}>${d0(m.soLanChan)}</td>
          <td>${statusBadge(m.bat ? 'feature_on' : 'feature_off', { label: m.bat ? 'Đang bật' : 'Tắt' })}</td>
        </tr>`).join('')}</tbody></table>`;
    }

    const bc = d.botcake || {};
    $('#botcake').innerHTML = `<div class="feature-row" data-state="${bc.doiChieuDuoc ? 'on' : 'off'}">
      <div>
        <div class="feature-name">Đối chiếu với bộ từ khoá Botcake</div>
        <div class="feature-desc">${text(bc.viSaoCan || '')}</div>
        ${bc.noi ? `<div class="feature-reason">${text(bc.noi)}</div>` : ''}
      </div>
      ${statusBadge(bc.doiChieuDuoc ? 'feature_on' : 'feature_unavailable', { label: bc.doiChieuDuoc ? 'Đã đối chiếu' : 'Chưa khả dụng' })}
    </div>`;
  } catch (e) {
    $('#bang-tin').innerHTML = `<div class="duoi-5">${canhBao({ level: 'error', title: 'Không tải được câu trả lời sẵn', body: e.message })}</div>`;
    $('#bang').innerHTML = emptyState({ icon: 'circle-alert', title: 'Không tải được', body: 'Kiểm kết nối rồi tải lại trang.' });
  }
}
tai();
</script>
<script src="/chung/dieu-huong.js"></script>
</body>
</html>
