<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quy tắc chung mọi page — AI Closer</title>
<!-- Dựng trên hệ kiểu (mục M9 của bản đặc tả: luật AI là thứ rủi ro cao — phạm vi ảnh hưởng
     phải thấy TRƯỚC khi bấm). KHÔNG CSS riêng — trước lượt này là 66 dòng. Phạm vi ảnh hưởng
     là một hàng chỉ số thường trực; so sánh và áp nằm trong ngăn kéo phải, nên danh sách
     phiên bản không bị đẩy đi mỗi lần mở một bản. -->
<link rel="stylesheet" href="/chung/kieu.css" data-ds="v3">
<!-- Hàm dựng thành phần (window.UI). ĐỒNG BỘ, KHÔNG `defer`: khung ứng dụng ở cuối trang
     lấy biểu tượng từ đây — `defer` chạy SAU script cuối trang, khung sẽ mất biểu tượng. -->
<script src="/chung/ui.js"></script>
</head>
<body>
<header>
  <h1>Quy tắc chung mọi page</h1>
  <span class="sub">Luật mọi page trong team cùng dùng. Áp một bản là cả team đổi cách nói với khách.</span>
</header>

<main>
  <div id="bang-tin" aria-live="polite"></div>
  <div class="page-note" id="ghi-chu-ban"></div>

  <section class="section" aria-label="Phạm vi ảnh hưởng">
    <div id="anhHuong"><div class="metric-row"><div class="metric"><span class="skeleton"></span></div></div></div>
    <div id="nguonSo" class="tren-3"></div>
  </section>

  <section class="section table-wrap" aria-labelledby="tieu-ban">
    <div class="table-toolbar"><h2 id="tieu-ban">Các phiên bản</h2>
      <span class="table-count" id="tomTatBan"></span></div>
    <div id="bangBan"></div>
  </section>

  <section class="section panel" aria-labelledby="tieu-soan">
    <div class="section-header"><div>
      <h2 id="tieu-soan">Soạn bản mới</h2>
      <div class="section-desc">Lưu xong chưa có hiệu lực. Mở «So sánh» ở bảng phiên bản để xem khác gì rồi mới áp.</div>
    </div></div>
    <div class="field">
      <label class="sr-only" for="oNoiDung">Nội dung bộ quy tắc</label>
      <textarea id="oNoiDung" class="mono" rows="14" spellcheck="false" placeholder="Nội dung bộ quy tắc chung…"></textarea>
      <div class="field-hint tabular" id="demChu"></div>
    </div>
    <div class="form-actions">
      <button type="button" class="btn" data-variant="primary" data-size="md" id="nutLuu"><span>Lưu bản nháp</span></button>
      <button type="button" class="btn" data-variant="outline" data-size="md" id="nutChep"><span>Chép bản đang áp vào ô</span></button>
      <span class="text-muted" id="ghiChuSoan"></span>
    </div>
  </section>
</main>

<dialog class="drawer" data-size="lg" id="ngan" aria-labelledby="ngan-tieu">
  <div class="drawer-header">
    <div class="gian"><h2 id="ngan-tieu">So sánh</h2><div class="hang tren-1" id="ngan-tom"></div></div>
    <button type="button" class="icon-btn" id="ngan-dong" aria-label="Đóng"></button>
  </div>
  <div class="drawer-body"><div class="diff-view" id="diff" role="region" aria-label="Các dòng khác nhau"></div></div>
  <div class="drawer-footer" id="nutAp"></div>
</dialog>

<script>
const { esc, text, icon, statusBadge, button, setBusy, alert: canhBao, emptyState, metricRow, toast,
        confirmDialog, formatNumber: so, nguonSo } = window.UI;
const $ = (s) => document.querySelector(s);

let D = null, SUA = false, LOI = null;

async function goi(duong, tuyChon) {
  const r = await fetch(duong, { headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' }, ...tuyChon });
  if (r.status === 401) { location.href = '/dang-nhap?tiep=' + encodeURIComponent(location.pathname); return null; }
  let d = null;
  try { d = await r.json(); } catch { /* null */ }
  if (!r.ok || !d || d.ok === false) throw new Error((d && d.thongDiep) || ('Máy chủ trả ' + r.status + '.'));
  return d;
}

function baoLoi(title, body) { LOI = { title, body }; veBangTin(); }

const MA_TRANG_THAI = {
  dang_ap: 'rule_active', cho_duyet: 'rule_draft', da_duyet: 'rule_approved',
  ai_chua_duyet: 'rule_ai_unreviewed', ke_thua: 'rule_inherited',
};
const trangThai = (b) => statusBadge(MA_TRANG_THAI[b.trangThai] || b.trangThai,
  { label: (D.chuTrangThai && D.chuTrangThai[b.trangThai]) || undefined });

// ── PHẠM VI ẢNH HƯỞNG — hiện thường trực, không đợi lúc bấm áp ───────────────────────
function veAnhHuong() {
  const a = D.anhHuong;
  const cho = D.ban.filter((b) => b.trangThai === 'cho_duyet' || b.trangThai === 'ai_chua_duyet').length;
  $('#anhHuong').innerHTML = metricRow([
    { label: 'Page dùng bộ quy tắc này', value: a.tongPage },
    { label: 'Trong đó đang bật bot', value: a.dangBatBot,
      hint: a.tenVaiPage.length ? `Ví dụ: ${a.tenVaiPage.join(' · ')}${a.dangBatBot > a.tenVaiPage.length ? ' …' : ''}` : '' },
    { label: 'Bản đang áp', value: D.dangAp ? `v${D.dangAp.phienBan}` : '—',
      statusHtml: D.dangAp ? '' : statusBadge('blocked', { label: 'Không có bản nào' }),
      hint: D.dangAp ? `≈ ${so(D.dangAp.uocToken)} token mỗi lượt chat` : '' },
    { label: 'Chờ duyệt hoặc chưa áp', value: cho },
  ]);

  // CON SỐ NÀY LẤY TỪ ĐÂU — người ta bấm ÁP dựa trên nó, nên «đáng tin tới đâu» là một phần
  // của con số. B-Y7: cột `page.bot_ai_bat` từng lệch 50 page so với `ai-enabled.json`.
  if (!a.nguon) { $('#nguonSo').innerHTML = ''; return; }
  const that = a.nguon !== 'cot_csdl';
  const lech = a.lech && a.lech.co;
  // Lời khai nguồn (luật 8) xuống ô gập; chỉ giữ hộp cảnh báo khi hai nguồn ĐANG LỆCH —
  // lệch là có việc phải làm, còn «đọc từ bản sao» chỉ là điều người đọc cần biết.
  $('#nguonSo').innerHTML = (lech ? canhBao({
    level: 'warning',
    title: 'Số page đang bật bot lệch với cơ sở dữ liệu',
    body: 'Số đúng là số của tiến trình bot. Mở màn Công tắc từng page để xem page nào lệch.',
  }) : '') + nguonSo({
    dong: [
      { ten: 'Số page dùng bộ quy tắc này', tu: 'đếm page của team đang mở' },
      { ten: 'Số page đang bật bot', tu: that
        ? `đọc thẳng từ tiến trình bot (${a.nguon})`
        : 'đếm từ một BẢN SAO trong cơ sở dữ liệu, không phải từ tiến trình bot — đã có lần lệch 50 page' },
      { ten: 'Cỡ bộ quy tắc', tu: 'ước theo số ký tự, không phải số đo của nhà model' },
    ],
    chuY: a.lech && a.lech.viSao ? a.lech.viSao : null,
  });
}

function veBangTin() {
  const kh = [];
  if (LOI) kh.push(canhBao({ level: 'error', title: LOI.title, body: LOI.body }));
  if (D && !D.dangAp) {
    kh.push(canhBao({ level: 'error', title: 'Không có bản nào đang áp',
      body: 'Bot đang trả lời khách mà không có quy tắc chung nào. Áp một bản ở bảng phiên bản.' }));
  }
  if (D) {
    // CHỈ đếm bản của team — bản toàn hệ mang trạng thái 'ke_thua', không phải chờ duyệt.
    // Bản AI chưa duyệt là cảnh RIÊNG và nặng hơn: `apBoLuat` TỪ CHỐI áp nó (01-QUYET-DINH §9).
    const aiCho = D.ban.filter((b) => b.trangThai === 'ai_chua_duyet').length;
    if (aiCho) {
      kh.push(canhBao({ level: 'warning', title: `${so(aiCho)} bản do AI đề xuất chưa ai duyệt`,
        body: 'Không áp được cho tới khi có người duyệt. Người viết áp thẳng được; đề xuất của AI phải qua người.' }));
    }
    const cho = D.ban.filter((b) => b.trangThai === 'cho_duyet').length;
    // Bản nháp chưa áp KHÔNG đòi ai làm gì — nói ở chú thích của bảng phiên bản là đủ.
    $('#ghi-chu-ban').innerHTML = cho
      ? `<div>${so(cho)} bản nháp chưa áp — chưa ảnh hưởng gì tới bot. Mở «So sánh» rồi bấm áp thì mới có hiệu lực.</div>`
      : '';
    if (D.keThua) {
      kh.push(canhBao({ level: 'info', title: 'Team này chưa có bộ quy tắc riêng',
        body: 'Đang kế thừa bản toàn hệ dùng chung mọi team. Soạn một bản bên dưới là team có bản riêng, và bản riêng sẽ thắng bản kế thừa.' }));
    }
  }
  $('#bang-tin').innerHTML = kh.length ? `<div class="duoi-5">${kh.join('')}</div>` : '';
}

function veBang() {
  $('#tomTatBan').textContent = `${so(D.soBanCuaTeam)} bản của team · ${so(D.soBanToanHe)} bản toàn hệ`;
  if (D.trong) { $('#bangBan').innerHTML = emptyState({ icon: 'triangle-alert', title: D.trong.noi }); return; }
  $('#bangBan').innerHTML = `<table class="data-table"><thead><tr>
      <th scope="col">Phiên bản</th><th scope="col">Trạng thái</th><th scope="col" class="num">Cỡ</th>
      <th scope="col">Người sửa</th><th scope="col">Lúc</th>
      <th scope="col" class="actions"><span class="sr-only">Thao tác</span></th>
    </tr></thead><tbody>${D.ban.map((b) => `
    <tr ${b.dangDung ? 'aria-selected="true"' : ''}>
      <td><span class="manh">v${b.phienBan}</span>
        ${b.toanHe ? ' <span class="badge">Toàn hệ</span>' : ''}${b.nguon === 'ai' ? ' <span class="badge" data-variant="info">AI đề xuất</span>' : ''}</td>
      <td>${trangThai(b)}</td>
      <td class="num">${so(b.soKyTu)} ký tự <span class="meta">· ≈ ${so(b.uocToken)} token</span></td>
      <td>${esc(b.nguoiSua || '—')}</td>
      <td class="meta tabular">${b.suaLuc ? esc(new Date(b.suaLuc).toLocaleString('vi-VN')) : '—'}</td>
      <td class="actions">${button('So sánh', { size: 'sm', data: { so: b.id } })}</td>
    </tr>`).join('')}</tbody></table>`;
  document.querySelectorAll('[data-so]').forEach((b) => b.addEventListener('click', () => xemSoSanh(b.dataset.so, b)));
}

// ── SO SÁNH · ÁP — trong ngăn kéo, luôn kèm phạm vi ảnh hưởng ─────────────────────────
async function xemSoSanh(id, nut) {
  LOI = null; veBangTin();
  setBusy(nut, true);
  try {
    const d = await goi('/api/bo-luat/' + encodeURIComponent(id) + '/so-sanh');
    if (!d) return;
    const t = d.tomTat, b = d.ban;
    $('#ngan-tieu').textContent = d.dangAp ? `v${b.phienBan} so với v${d.dangAp.phienBan} đang áp` : `v${b.phienBan}`;
    $('#ngan-tom').innerHTML = d.dangAp
      ? `<span class="badge" data-variant="success">+${so(t.them)} dòng</span>
         <span class="badge" data-variant="danger">−${so(t.bo)} dòng</span>
         <span class="badge">${t.tokenChenh >= 0 ? '+' : '−'}${so(Math.abs(t.tokenChenh))} token</span>`
      : '<span class="text-muted text-sm">Chưa có bản nào đang áp để so.</span>';
    $('#diff').innerHTML = d.dong.map((x) =>
      `<div class="diff-line" data-kind="${esc(x.loai)}">${esc(x.chu) || ' '}</div>`).join('');

    // Nút áp chỉ hiện khi ĐƯỢC PHÉP và bản đó áp được — và luôn kèm con số ảnh hưởng.
    const a = D.anhHuong;
    let chan, lui = false;
    if (!SUA) {
      chan = '<span class="text-muted text-sm">Vai của bạn chỉ xem được.</span>';
    } else if (b.toanHe) {
      chan = '<span class="text-muted text-sm">Bản toàn hệ dùng chung mọi team — màn này không sửa và không áp nó được. Soạn một bản riêng của team.</span>';
    } else if (b.dangDung) {
      chan = statusBadge('rule_active', { label: 'Bản này đang áp' });
    } else if (b.trangThai === 'ai_chua_duyet') {
      chan = `<span class="text-muted text-sm gian">Bản do AI đề xuất phải có người duyệt mới áp được.</span>
        ${button(`Duyệt bản v${b.phienBan}`, { variant: 'primary', id: 'btDuyet' })}`;
    } else {
      lui = !!(d.dangAp && b.phienBan < d.dangAp.phienBan);
      chan = `<span class="text-muted text-sm gian">Đổi cách nói của ${so(a.tongPage)} page, trong đó ${so(a.dangBatBot)} page đang bật bot.</span>
        ${button(lui ? `Lùi về bản v${b.phienBan}` : `Áp bản v${b.phienBan}`, { variant: 'primary', id: 'btAp' })}`;
    }
    $('#nutAp').innerHTML = chan;
    if ($('#btAp')) $('#btAp').addEventListener('click', () => ap(b, lui));
    if ($('#btDuyet')) $('#btDuyet').addEventListener('click', () => duyet(b));
    $('#ngan').showModal();
  } catch (e) { baoLoi('Không so sánh được', e.message); }
  finally { setBusy(nut, false); }
}

async function ap(b, lui) {
  const a = D.anhHuong;
  const dongY = await confirmDialog({
    title: `${lui ? 'Lùi về' : 'Áp'} bản v${b.phienBan}?`,
    body: `${so(a.tongPage)} page sẽ đổi cách nói với khách, trong đó ${so(a.dangBatBot)} page đang bật bot và đang nói chuyện với khách thật. Có hiệu lực ngay ở lượt chat kế tiếp.`,
    confirmLabel: lui ? 'Lùi về bản này' : 'Áp bản này',
    danger: true,
  });
  if (!dongY) return;
  const nut = $('#btAp');
  setBusy(nut, true);
  try {
    const kq = await goi('/api/bo-luat/' + encodeURIComponent(b.id) + '/ap', { method: 'POST', body: JSON.stringify({}) });
    $('#ngan').close();
    toast(`Đã ${kq.laLui ? 'lùi về' : 'áp'} bản v${kq.phienBan}. ${so(kq.anhHuong.tongPage)} page dùng bản này từ lượt chat kế tiếp.`);
    await nap();
  } catch (e) { $('#ngan').close(); baoLoi('Không áp được bản này', e.message); }
  finally { setBusy(nut, false); }
}

async function duyet(b) {
  const dongY = await confirmDialog({
    title: `Duyệt bản v${b.phienBan} do AI đề xuất?`,
    body: 'Duyệt KHÔNG phải là áp. Duyệt xong mới áp được, và lúc áp sẽ hỏi lại số page bị ảnh hưởng.',
    confirmLabel: 'Duyệt',
  });
  if (!dongY) return;
  const nut = $('#btDuyet');
  setBusy(nut, true);
  try {
    await goi('/api/bo-luat/' + encodeURIComponent(b.id) + '/duyet', { method: 'POST', body: JSON.stringify({}) });
    $('#ngan').close();
    toast(`Đã duyệt v${b.phienBan}. Chưa áp — mở «So sánh» rồi áp.`);
    await nap();
  } catch (e) { $('#ngan').close(); baoLoi('Không duyệt được bản này', e.message); }
  finally { setBusy(nut, false); }
}

$('#ngan-dong').innerHTML = icon('x');
$('#ngan-dong').addEventListener('click', () => $('#ngan').close());

// ── SOẠN ─────────────────────────────────────────────────────────────────────────────
$('#nutChep').addEventListener('click', () => {
  if (!D.dangAp) { baoLoi('Chưa có bản nào đang áp để chép', 'Soạn từ đầu trong ô bên trên.'); return; }
  $('#oNoiDung').value = D.dangAp.noiDung;
  demChu();
});

function demChu() {
  const n = $('#oNoiDung').value.length;
  const tk = Math.round(n / D.kyTuMoiToken);
  const goc = D.dangAp ? D.dangAp.soKyTu : 0;
  $('#demChu').textContent = `${so(n)} ký tự · ≈ ${so(tk)} token (ước lượng)`
    + (goc ? ` · bản đang áp ${so(goc)} ký tự` : '');
}
$('#oNoiDung').addEventListener('input', () => { $('#oNoiDung').removeAttribute('aria-invalid'); demChu(); });

$('#nutLuu').addEventListener('click', async () => {
  const noiDung = $('#oNoiDung').value;
  if (!noiDung.trim()) {
    $('#oNoiDung').setAttribute('aria-invalid', 'true');
    $('#demChu').textContent = 'Ô soạn đang trống.';
    $('#oNoiDung').focus();
    return;
  }
  LOI = null; veBangTin();
  const nut = $('#nutLuu');
  setBusy(nut, true);
  try {
    const kq = await goi('/api/bo-luat/nhap', { method: 'POST', body: JSON.stringify({ noiDung }) });
    toast(`Đã lưu bản nháp v${kq.phienBan}. Chưa áp — bot vẫn chạy bản cũ.`);
    await nap();
  } catch (e) { baoLoi('Không lưu được bản nháp', e.message); }
  finally { setBusy(nut, false); nut.disabled = !SUA; }
});

async function nap() {
  try {
    const d = await goi('/api/bo-luat');
    if (!d) return;
    D = d; SUA = !!d.suaDuoc;
    $('#nutLuu').disabled = !SUA;
    $('#oNoiDung').disabled = !SUA;
    $('#nutChep').disabled = !SUA;
    $('#ghiChuSoan').textContent = SUA ? '' : 'Vai của bạn chỉ xem được — không soạn và không áp được.';
    veAnhHuong(); veBangTin(); veBang(); demChu();
  } catch (e) {
    baoLoi('Không tải được bộ quy tắc', e.message);
    $('#bangBan').innerHTML = emptyState({ icon: 'circle-alert', title: 'Không tải được', body: 'Kiểm kết nối rồi tải lại trang.' });
  }
}
nap();
</script>
<script src="/chung/dieu-huong.js"></script>
</body>
</html>
