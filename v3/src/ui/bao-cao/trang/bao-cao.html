<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Đơn và tỉ lệ chốt — AI Closer</title>
<!-- Dựng trên hệ kiểu. KHÔNG CSS riêng — trước lượt này là 42 dòng.
     ⚠️ LUẬT RIÊNG CỦA MÀN NÀY: ba con số Messenger KHÔNG được xếp ngang cạnh nhau — xếp
        ngang là mời người ta cộng lại, mà cộng ba thước đo ba thứ khác nhau thì ra một số
        vô nghĩa. Nên chúng dùng `.item-list` (một cột theo cấu tạo), KHÔNG dùng `.metric-row`.
        Ca ①c của `bao-cao.test.mjs` canh đúng điều đó. -->
<link rel="stylesheet" href="/chung/kieu.css" data-ds="v3">
<!-- Hàm dựng thành phần (window.UI). ĐỒNG BỘ, KHÔNG `defer`: khung ứng dụng ở cuối trang
     lấy biểu tượng từ đây — `defer` chạy SAU script cuối trang, khung sẽ mất biểu tượng. -->
<script src="/chung/ui.js"></script>
</head>
<body>
<header>
  <h1>Đơn và tỉ lệ chốt</h1>
  <span class="sub">Hai luồng bán tách hẳn nhau, và ba thước của luồng Messenger đo ba thứ khác nhau.</span>
  <span class="sp"></span>
  <span class="text-muted text-sm" id="hQuet"></span>
</header>

<main>
  <div id="bang-tin" aria-live="polite"></div>

  <section class="section" aria-labelledby="tieu-mess">
    <div class="section-header"><div>
      <h2 id="tieu-mess">Luồng Messenger</h2>
      <div class="section-desc">Khách nhắn trước, bot trả lời, rồi mới thành đơn.</div>
    </div></div>
    <ul class="item-list" id="thuoc"><li class="item"><div><span class="skeleton"></span></div></li></ul>
    <div id="canh" class="tren-3"></div>
  </section>

  <section class="section" aria-labelledby="tieu-tbh">
    <div class="section-header"><div>
      <h2 id="tieu-tbh">Luồng trang bán hàng</h2>
      <div class="section-desc">Đơn có trước, rồi mới hỏi khách — thước khác hẳn luồng Messenger.</div>
    </div></div>
    <div id="tbh"></div>
  </section>

  <section class="section table-wrap" aria-labelledby="tieu-page">
    <div class="table-toolbar"><h2 id="tieu-page">Theo page</h2>
      <span class="table-count" id="hSo"></span></div>
    <div id="bang"></div>
  </section>
</main>

<script>
const { esc, text, statusBadge, button, alert: canhBao, emptyState, formatNumber } = window.UI;
const $ = (s) => document.querySelector(s);
const d0 = (n) => (n == null ? '—' : formatNumber(n));

async function goi(u) {
  const r = await fetch(u, { credentials: 'same-origin', headers: { Accept: 'application/json' } });
  if (r.status === 401) { location.href = '/dang-nhap?tiep=' + encodeURIComponent(location.pathname); return null; }
  const j = await r.json().catch(() => null);
  if (!r.ok || !j || j.ok === false) throw new Error((j && j.thongDiep) || 'Máy chủ trả ' + r.status + '.');
  return j;
}

/** Ba thước xếp DỌC, không xếp ngang: xếp ngang là mời người ta cộng lại. */
function veThuoc(m, T) {
  const hang = [
    { k: T.POS_QUY_CHO_AI, v: m.posQuyChoAi },
    { k: T.BOT_TU_TAO, v: m.botTuTao },
    { k: T.HOI_THOAI_CO_DON, v: m.hoiThoaiCoDon },
  ];
  $('#thuoc').innerHTML = hang.map((x) => `<li class="item">
    <div class="item-lead"${x.v == null ? ' data-muted' : ''}>${d0(x.v)}</div>
    <div>
      <div class="item-title">${esc(x.k.ten)}</div>
      <div class="item-desc">${esc(x.k.doGi)}</div>
      <div class="item-detail">Khoảng đo: ${esc(x.k.khoang)} · nguồn: ${text(x.k.nguon)}</div>
    </div>
    <div class="item-trail">${x.v == null ? statusBadge('unknown', { label: 'Chưa đo được' }) : ''}</div>
  </li>`).join('');
}

function veCanh(m) {
  const kh = [];
  if (m.thieu && m.thieu.co) kh.push(canhBao({ level: 'warning', body: m.thieu.noi }));
  if (m.soCu) kh.push(canhBao({ level: 'info', body: m.soCu.noi }));
  $('#canh').innerHTML = kh.join('');
}

function veBang(d) {
  const ds = d.messenger ? d.messenger.page.filter((p) => p.posQuyChoAi > 0 || p.hoiThoaiCoDon > 0) : [];
  $('#hSo').textContent = `${formatNumber(ds.length)} page có đơn · xếp theo đơn POS quy cho AI`;
  if (!ds.length) {
    $('#bang').innerHTML = emptyState({ icon: 'inbox', title: d.trong ? d.trong.noi : 'Chưa page nào có đơn',
      body: d.trong && d.trong.diTiep ? d.trong.diTiep : '' });
    return;
  }
  $('#bang').innerHTML = `<table class="data-table"><thead><tr>
      <th scope="col">Page</th><th scope="col" class="num">Đơn POS quy cho AI</th>
      <th scope="col" class="num">Hội thoại có đơn</th><th scope="col">Marketer</th>
    </tr></thead><tbody>${ds.map((p) => `
    <tr>
      <td><div class="page-identity-name">${esc(p.ten)}</div>
        <div class="page-identity-sub">${esc(p.pageId)}${p.soCu ? ' · <span class="meta">số lần quét trước</span>' : ''}</div></td>
      <td class="num manh">${d0(p.posQuyChoAi)}</td>
      <td class="num">${d0(p.hoiThoaiCoDon)}</td>
      <td>${p.marketer ? esc(p.marketer) : '<span class="text-muted">Chưa gán</span>'}</td>
    </tr>`).join('')}</tbody></table>`;
}

function veTrangBanHang(t) {
  if (t.coNguon) {
    $('#tbh').innerHTML = `<ul class="item-list"><li class="item">
        <div class="item-lead">${d0(t.soDon)}</div>
        <div><div class="item-title">Đơn từ trang bán hàng</div>
          <div class="item-desc">${d0(t.soDonCoTien)} đơn có tổng tiền · nguồn: đơn hàng có nguồn «trang bán hàng»</div></div>
        <div class="item-trail"></div>
      </li></ul>`
      + (t.canhBao ? `<div class="tren-3">${canhBao({ level: 'warning', body: t.canhBao })}</div>` : '');
    return;
  }
  // Chưa có nguồn: KHÔNG hiện 0. «0 đơn» ở đây đọc ra là «bán không được đơn nào» (mục O).
  $('#tbh').innerHTML = `<div class="panel"><div class="feature-row" data-state="off">
    <div><div class="feature-name">Chưa đo được luồng trang bán hàng</div>
      <div class="feature-desc">${text(t.noi)}</div>
      <div class="feature-reason">${text(t.diTiep)}</div></div>
    ${statusBadge('unknown', { label: 'Chưa đo được' })}
  </div></div>`;
}

async function tai() {
  try {
    const d = await goi('/api/bao-cao');
    if (!d) return;

    const kh = [canhBao({ level: 'info', title: 'Màn này không cộng ba con số lại', body: d.viSaoKhongCong })];
    $('#bang-tin').innerHTML = `<div class="duoi-5">${kh.join('')}</div>`;

    veTrangBanHang(d.trangBanHang);

    if (!d.messenger) {
      $('#thuoc').innerHTML = `<li class="item"><div>
        <div class="item-title">${esc(d.trong ? d.trong.noi : 'Chưa đo được luồng Messenger')}</div>
        <div class="item-desc">${esc(d.trong ? d.trong.diTiep : '')}</div></div>
        <div class="item-trail">${statusBadge('unknown', { label: 'Chưa đo được' })}</div></li>`;
      $('#bang').innerHTML = emptyState({ icon: 'circle-alert', title: 'Chưa có số theo page',
        body: 'Chưa đọc được đơn của luồng Messenger.' });
      return;
    }
    if (d.messenger.quetLuc) {
      $('#hQuet').textContent = 'Quét POS lúc ' + new Date(d.messenger.quetLuc).toLocaleString('vi-VN', { hour12: false });
    }
    veThuoc(d.messenger, d.thuoc);
    veCanh(d.messenger);
    veBang(d);
  } catch (e) {
    $('#bang-tin').innerHTML = `<div class="duoi-5">${canhBao({ level: 'error', title: 'Không đọc được báo cáo',
      body: 'Màn này TỪ CHỐI hiện 0 khi chưa đọc được — «0 đơn» là câu dễ tin nhất và sai nhất.',
      detail: [e.message] })}</div>`;
    $('#thuoc').innerHTML = '';
    $('#bang').innerHTML = emptyState({ icon: 'circle-alert', title: 'Chưa có số liệu', body: 'Kiểm kết nối sang tiến trình bot rồi tải lại trang.' });
  }
}

tai();
</script>
<script src="/chung/dieu-huong.js"></script>
</body>
</html>
