<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Đưa sản phẩm lên chạy — AI Closer</title>
<!-- Dựng trên hệ kiểu. KHÔNG CSS riêng — trước lượt này là 53 dòng.
     ⚠️ LUẬT RIÊNG: màn này CHỈ ĐỌC và tuyệt đối KHÔNG có ô nhập nào — ba chất liệu của chặng
        2 chưa có trường nào để chứa, nên vẽ một ô nhập là hứa một chỗ chứa không tồn tại:
        người ta gõ vào, bấm lưu, chữ đi vào hư không, rồi tưởng chặng 2 đã xong.
        Ca ①d của `len-chay.test.mjs` canh điều đó bằng cách soi CẢ TỆP, kể cả chú thích —
        nên ngay cả dòng này cũng không được gõ tên thẻ ô nhập ra. -->
<link rel="stylesheet" href="/chung/kieu.css" data-ds="v3">
<!-- Hàm dựng thành phần (window.UI). ĐỒNG BỘ, KHÔNG `defer`: khung ứng dụng ở cuối trang
     lấy biểu tượng từ đây — `defer` chạy SAU script cuối trang, khung sẽ mất biểu tượng. -->
<script src="/chung/ui.js"></script>
</head>
<body>
<header>
  <h1>Đưa sản phẩm lên chạy</h1>
  <span class="sub">Sáu chặng từ «có hàng» tới «bot bán được». Màn này chỉ đọc — mỗi chặng có màn riêng để làm.</span>
</header>

<main>
  <div id="bang-tin" aria-live="polite"></div>

  <section class="section panel" aria-labelledby="tieu-chon">
    <div class="section-header"><h2 id="tieu-chon">Chọn page</h2>
      <span class="text-muted text-sm" id="dungLai"></span></div>
    <label for="chon" class="sr-only">Page</label>
    <select id="chon"><option>Đang tải…</option></select>
  </section>

  <section class="section" aria-labelledby="tieuDe">
    <div class="section-header"><h2 id="tieuDe">Sáu chặng</h2>
      <span class="text-muted text-sm" id="toiChang"></span></div>
    <ul class="item-list" id="chang"><li class="item"><div class="item-desc">Chọn một page ở trên.</div></li></ul>
  </section>

  <section class="section table-wrap" aria-labelledby="tieu-cl">
    <div class="table-toolbar"><h2 id="tieu-cl">Năm chất liệu của chặng 2</h2>
      <span class="table-count">Chỗ nào có nhà, chỗ nào chưa</span></div>
    <div id="cl"></div>
  </section>
</main>

<script>
const { esc, text, statusBadge, button, alert: canhBao, emptyState, formatNumber } = window.UI;
const $ = (s) => document.querySelector(s);

// Năm trạng thái chặng → ánh xạ trạng thái tập trung. «Không có chỗ chứa» là CHẶN, không
// phải «chưa làm»: không ai làm được nó bằng cách cố gắng hơn.
const MA = { xong: 'check_done', 'dang-do': 'needs_attention', chua: 'unknown',
             'khong-co-o': 'blocked', 'khong-biet': 'unknown' };
const CHU = { xong: 'Xong', 'dang-do': 'Đang dở', chua: 'Chưa làm',
              'khong-co-o': 'Không có chỗ chứa', 'khong-biet': 'Chưa đọc được' };

let DL = null;

async function goi(d) {
  const r = await fetch(d, { credentials: 'same-origin', headers: { Accept: 'application/json' } });
  if (r.status === 401) { location.href = '/dang-nhap?tiep=' + encodeURIComponent(location.pathname); return null; }
  const j = await r.json().catch(() => null);
  if (!r.ok || !j || j.ok === false) throw new Error((j && j.thongDiep) || 'Máy chủ trả ' + r.status + '.');
  return j;
}

function veChatLieu(ds) {
  $('#cl').innerHTML = `<table class="data-table"><thead><tr>
      <th scope="col">Chất liệu</th><th scope="col">Chỗ chứa</th><th scope="col">Là gì</th>
    </tr></thead><tbody>${ds.map((x) => `
    <tr>
      <td class="manh">${esc(x.ten)}</td>
      <td>${x.o
        ? `<code>${esc(x.o)}</code>`
        : statusBadge('blocked', { label: 'Không có trường nào' })}</td>
      <td class="meta">${text(x.noi)}</td>
    </tr>`).join('')}</tbody></table>`;
}

function veChang(d) {
  $('#tieuDe').textContent = `Sáu chặng của ${d.ten}`;
  $('#toiChang').textContent = `Đi được tới chặng ${d.toiChang}/6`
    + (d.dungLaiO ? ` · dừng ở chặng ${d.dungLaiO.so}: ${d.dungLaiO.ten}` : '');

  $('#chang').innerHTML = d.chang.map((c) => `<li class="item">
    <div class="item-lead"${c.trangThai === 'xong' ? '' : ' data-muted'}>${c.so}</div>
    <div>
      <div class="item-title">${esc(c.ten)}${c.soDo != null ? ` <span class="meta">· ${formatNumber(c.soDo)} ${esc(c.donVi || '')}</span>` : ''}</div>
      <div class="item-desc">${text(c.noi)}</div>
      ${c.lam ? `<div class="item-detail">Việc cần làm: ${text(c.lam)}</div>` : ''}
    </div>
    <div class="item-trail">
      ${statusBadge(MA[c.trangThai] || 'unknown', { label: CHU[c.trangThai] || c.trangThai })}
      ${c.di ? button('Làm chặng này', { href: c.di, size: 'sm' }) : ''}
    </div>
  </li>`).join('');
}

async function moPage(id) {
  if (!id) return;
  $('#chang').innerHTML = '<li class="item"><div><span class="skeleton"></span></div></li>';
  try {
    const d = await goi('/api/len-chay/' + encodeURIComponent(id));
    if (d) veChang(d);
  } catch (e) {
    $('#chang').innerHTML = `<li class="item"><div>${emptyState({ icon: 'circle-alert',
      title: 'Không đọc được sáu chặng của page này', body: e.message })}</div></li>`;
  }
}

async function tai() {
  try {
    DL = await goi('/api/len-chay');
    if (!DL) return;

    if (DL.chan2) {
      $('#bang-tin').innerHTML = `<div class="duoi-5">${canhBao({ level: 'error',
        title: 'Mọi page đều dừng ở chặng 2, và không page nào tự gỡ được',
        body: DL.chan2.noi,
        detail: ['Đây KHÔNG phải ô để trống — là ô không tồn tại. Màn này cố ý không vẽ ô nhập cho «động cơ»: gõ vào một ô không có chỗ chứa thì chữ đi vào hư không.'] })}</div>`;
    }
    veChatLieu(DL.chatLieu || []);

    const s = $('#chon');
    if (!DL.page.length) {
      s.innerHTML = '<option>Chưa có page nào</option>';
      $('#chang').innerHTML = `<li class="item"><div>${emptyState({ icon: 'inbox',
        title: 'Team này chưa có page nào', body: DL.trong ? DL.trong.diTiep : '' })}</div></li>`;
      return;
    }
    s.innerHTML = '<option value="">— Chọn page —</option>'
      + DL.page.map((p) => `<option value="${esc(p.pageId)}">${esc(p.ten)}</option>`).join('');
    s.onchange = () => moPage(s.value);
  } catch (e) {
    $('#bang-tin').innerHTML = `<div class="duoi-5">${canhBao({ level: 'error', title: 'Không đọc được sáu chặng', body: e.message })}</div>`;
    $('#chang').innerHTML = `<li class="item"><div>${emptyState({ icon: 'circle-alert',
      title: 'Không tải được', body: 'Kiểm kết nối rồi tải lại trang.' })}</div></li>`;
  }
}

tai();
</script>
<script src="/chung/dieu-huong.js"></script>
</body>
</html>
