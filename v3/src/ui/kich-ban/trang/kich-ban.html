<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kịch bản — AI Closer v3</title>
<style>
  :root{
    --bg:#f5f7f9; --panel:#fff; --ink:#101828; --muted:#667085; --line:#e4e9ee;
    --pri:#0e7c86; --priDark:#0b646d; --priSoft:#e6f4f5;
    --ok:#16a34a; --okSoft:#e8f7ee; --bad:#dc2626; --badSoft:#fdecec;
    --warn:#b45309; --warnSoft:#fdf3e3;
    --side:#0b2125; --sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06); --r:12px;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:-apple-system,"SF Pro Text",Segoe UI,Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);font-size:13.5px;-webkit-font-smoothing:antialiased}
  header{background:var(--side);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:700}
  header .sub{font-size:11.5px;color:#7fa3a8}
  header .sp{flex:1}
  header a{color:#9fd3d8;text-decoration:none;font-size:12px;font-weight:600}
  main{padding:16px 22px 60px;max-width:1160px;margin:0 auto}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:16px;overflow:hidden}
  .panel h2{font-size:13px;margin:0;padding:11px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .panel h2 .hint{font-weight:400;color:var(--muted);font-size:11.5px}
  .panel h2 .sp{flex:1}
  .than{padding:14px 15px}

  /* dải cảnh báo NGUY — màn này phải trông khác mọi màn khác */
  .nguy{background:#fff4f4;border:1px solid #f0c2c2;border-left:4px solid var(--bad);
        border-radius:var(--r);padding:12px 15px;margin-bottom:14px;line-height:1.6}
  .nguy b{color:#991b1b}
  .nguy .so{font-size:19px;font-weight:700;color:#991b1b;font-variant-numeric:tabular-nums}

  .banner{border-radius:var(--r);padding:11px 14px;margin-bottom:14px;line-height:1.55}
  .banner.o{background:var(--warnSoft);color:#8a4a06;border:1px solid #f0d3a4}
  .banner.i{background:var(--priSoft);color:#0b4a52;border:1px solid #b8dde0}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{padding:8px 9px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);font-weight:700;white-space:nowrap}
  tbody tr:last-child td{border-bottom:none}
  tbody tr.ap{background:var(--priSoft)}
  .num{font-variant-numeric:tabular-nums}
  .ten{font-weight:600;overflow-wrap:anywhere}
  .phu{font-size:11.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}

  .pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;margin:1px 3px 1px 0}
  .pill.g{background:var(--okSoft);color:var(--ok)}
  .pill.o{background:var(--warnSoft);color:var(--warn)}
  .pill.r{background:var(--badSoft);color:var(--bad)}
  .pill.m{background:#f1f1f1;color:#777}
  .pill.p{background:var(--priSoft);color:var(--priDark)}

  /* khối so sánh */
  .diff{border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:400px;background:#fcfdfd}
  .diff pre{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:1.6}
  .diff .d{padding:1px 10px;white-space:pre-wrap;overflow-wrap:anywhere;border-left:3px solid transparent}
  .diff .d.them{background:#e9f8ee;border-left-color:var(--ok)}
  .diff .d.bo{background:#fdecec;border-left-color:var(--bad);text-decoration:line-through;opacity:.8}
  .diff .d.giu{color:var(--muted)}

  textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 11px;font:inherit;
           font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:1.6;
           min-height:260px;resize:vertical}

  button{font:inherit}
  .nut{background:var(--pri);color:#fff;border:none;border-radius:8px;padding:7px 13px;font-weight:700;cursor:pointer}
  .nut:hover{background:var(--priDark)}
  .nut[disabled]{background:#c3cdd0;cursor:not-allowed}
  .nut.nho{padding:4px 10px;font-size:11.5px;font-weight:600}
  .nut.nguy{background:var(--bad)}
  .nut.nguy:hover{background:#b91c1c}
  .nut.phu{background:transparent;color:var(--priDark);border:1px solid var(--line)}
  .nut.phu:hover{background:var(--priSoft)}
  .hang{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

  .trong{padding:20px 15px;text-align:center;line-height:1.6}
  .trong .ic{font-size:20px;display:block;margin-bottom:6px}
  .trong.chua{color:#8a4a06;background:var(--warnSoft)}
  .loi{background:var(--badSoft);color:#991b1b;border:1px solid #f4bcbc;border-radius:8px;
       padding:9px 12px;margin:0 0 12px;display:none;line-height:1.5}
  .loi.hien{display:block}
  .ok{background:var(--okSoft);color:#14532d;border:1px solid #b7e4c7;border-radius:8px;
      padding:9px 12px;margin:0 0 12px;display:none;line-height:1.5}
  .ok.hien{display:block}

  @media (max-width:700px){
    header{padding:12px 14px} main{padding:12px 14px 48px}
    .panel h2{padding:10px 12px} .than{padding:12px}
    table,thead,tbody,th,td,tr{display:block}
    thead{display:none}
    tbody tr{border:1px solid var(--line);border-radius:10px;margin-bottom:9px;padding:10px 11px}
    tbody tr:last-child{margin-bottom:0}
    td{border:none;padding:4px 0}
    td[data-nhan]::before{content:attr(data-nhan);display:block;font-size:10px;text-transform:uppercase;
      letter-spacing:.4px;color:var(--muted);font-weight:700;margin-bottom:2px}
  }

  .cay{border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .nhanh > summary{padding:9px 13px;cursor:pointer;font-weight:600;background:#fcfdfd;
                   border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .nhanh > summary::-webkit-details-marker{display:none}
  .nhanh > summary::before{content:"▸";display:inline-block;transition:transform .12s;color:var(--muted)}
  .nhanh[open] > summary::before{transform:rotate(90deg)}
  .nhanh.chua > summary{background:#fffbf5}
  .la{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:7px 13px 7px 30px;
      border-bottom:1px solid var(--line);cursor:pointer}
  .la:last-child{border-bottom:none}
  .la:hover{background:var(--priSoft)}
  .la.chon{background:var(--priSoft)}
  .la .n{font-weight:600;overflow-wrap:anywhere;flex:1;min-width:120px}
  .o-truong{margin-bottom:11px}
  .o-truong label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:3px}
  .o-truong textarea{min-height:62px}
  .o-truong.dai textarea{min-height:130px}
  .may{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:1.6;
       background:#f7fafa;border:1px solid var(--line);border-radius:8px;padding:10px 12px;
       white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow:auto}
</style>
</head>
<body>
<header>
  <h1>Kịch bản</h1>
  <span class="sub" id="teamHien">…</span>
  <span class="sp"></span>

</header>

<main>
  <div class="loi" id="loi"></div>
  <div class="ok" id="baoOk"></div>
  <div id="canhBao"></div>

  <section class="panel">
    <h2>Cây kịch bản <span class="hint" id="tomTatCay"></span></h2>
    <div class="than">
      <input class="tim" id="oTim" type="search" placeholder="Lọc theo tên page, id Facebook, thị trường…"
             style="width:100%;max-width:340px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;margin-bottom:9px" />
      <div id="cay"><div class="trong"><span class="ic">⋯</span>đang đọc…</div></div>
    </div>
  </section>

  <section class="panel" id="soan" style="display:none">
    <h2 id="tieuDeSoan">Soạn kịch bản</h2>
    <div class="than" id="thanSoan"></div>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const so = (n) => Number(n || 0).toLocaleString('vi-VN');
function baoLoi(t){ const o=$('#loi'); o.textContent=t; o.classList.add('hien'); $('#baoOk').classList.remove('hien'); }
function baoOk(t){ const o=$('#baoOk'); o.textContent=t; o.classList.add('hien'); $('#loi').classList.remove('hien'); }
function xoaBao(){ $('#loi').classList.remove('hien'); $('#baoOk').classList.remove('hien'); }
async function goi(duong, tuyChon){
  const r = await fetch(duong, { headers:{'Accept':'application/json','Content-Type':'application/json'}, ...tuyChon });
  if (r.status === 401) { location.href = '/dang-nhap?tiep=' + encodeURIComponent(location.pathname); return null; }
  let d = null; try { d = await r.json(); } catch { /* null */ }
  if (!r.ok || !d || d.ok === false) throw new Error((d && d.thongDiep) || ('Máy chủ trả ' + r.status + '.'));
  return d;
}
function veTrong(t){
  if (!t) return '';
  const di = t.diTiep && t.diTiep.duong ? `<a class="di" href="${esc(t.diTiep.duong)}">${esc(t.diTiep.chu)}</a>` : '';
  return `<div class="trong chua"><span class="ic">⚠️</span><div>${esc(t.noi)}</div>${di}</div>`;
}


let D = null, P = null, TIM = '', SUA = false, DUYET = false;

function veCanhBao(){
  const kh = (D.tangTrong || []).map((t) => `<div class="banner o">${esc(t.chu)}</div>`);
  if (D.soThieuKichBan) {
    kh.unshift(`<div class="banner o"><b>${so(D.soThieuKichBan)}/${so(D.soPage)} page chưa có
      kịch bản riêng.</b> Bot của những page đó chạy bằng bộ luật chung + dữ liệu sản phẩm,
      KHÔNG có hướng dẫn riêng nào về giọng điệu, câu chào hay cách bán.</div>`);
  }
  $('#canhBao').innerHTML = kh.join('');
}

function veCay(){
  $('#teamHien').textContent = D.teamId ? `team #${D.teamId}` : '';
  $('#tomTatCay').textContent = `${so(D.soCoKichBan)}/${so(D.soPage)} page có kịch bản riêng`;
  if (D.trong) { $('#cay').innerHTML = veTrong(D.trong); return; }

  $('#cay').innerHTML = `<div class="cay">${D.nhanh.map((n) => `
    <details class="nhanh ${n.chuaPhanLoai ? 'chua' : ''}" ${D.nhanh.length <= 3 ? 'open' : ''}>
      <summary>${esc(n.nuoc)}
        <span class="phu">${so(n.soPage)} page · ${so(n.soCoKichBan)} có kịch bản · ${so(n.soBotBat)} bật bot</span>
      </summary>
      ${n.page.map((p) => `<div class="la" data-page="${esc(p.id)}">
        <span class="n">${esc(p.ten || '(chưa có tên)')}</span>
        ${p.botAiBat ? '<span class="pill g">bot BẬT</span>' : ''}
        ${p.coKichBan
          ? `<span class="pill p">v${p.phienBanLive} LIVE</span><span class="phu">≈ ${so(p.uocToken)} token</span>`
          : '<span class="pill o">chưa có kịch bản riêng</span>'}
        ${p.soBan > 1 ? `<span class="phu">${so(p.soBan)} bản</span>` : ''}
      </div>`).join('')}
    </details>`).join('')}</div>`;

  document.querySelectorAll('[data-page]').forEach((el) => el.addEventListener('click', () => moPage(el.dataset.page)));
}

async function moPage(id){
  xoaBao();
  try {
    const d = await goi('/api/kich-ban/page/' + encodeURIComponent(id));
    if (!d) return;
    P = d; SUA = !!d.suaDuoc; DUYET = !!d.duyetDuoc;
    veSoan();
    $('#soan').style.display = '';
    $('#soan').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  } catch (e) { baoLoi(e.message); }
}

function veSoan(){
  const g = P.live ? P.live.nguoi : {};
  $('#tieuDeSoan').innerHTML = `Soạn kịch bản — <b>${esc(P.page.ten || P.page.pageId)}</b>
    <span class="hint">${P.live ? `đang chạy v${P.live.phienBan}` : 'chưa có bản nào'}</span>`;

  $('#thanSoan').innerHTML = `
    ${P.trong ? veTrong(P.trong) : ''}
    <div class="banner i" style="margin-bottom:12px">Viết bằng <b>tiếng Việt cho người đọc</b>.
      Bấm lưu là hệ thống tự dựng <b>bản cho máy</b> và lưu cả hai — không sửa thẳng bản máy được.
      Ba trường đầu đi vào prompt (tốn token mỗi lượt chat); ba trường sau là câu trả lời có sẵn,
      <b>không tốn token</b>.</div>
    ${P.truong.map((k) => `<div class="o-truong ${k === 'salesPrompt' ? 'dai' : ''}">
      <label>${esc(P.nhanTruong[k])}${P.truongVaoPrompt.includes(k) ? ' · vào prompt' : ' · trả lời có sẵn, 0 token'}</label>
      <textarea data-t="${esc(k)}" ${SUA ? '' : 'disabled'}>${esc(g[k] || '')}</textarea>
    </div>`).join('')}
    <div class="hang" style="margin-top:4px">
      <button class="nut" id="nutLuu" ${SUA ? '' : 'disabled'}>Lưu bản nháp</button>
      <span class="phu">${SUA ? 'lưu xong CHƯA lên LIVE — bot vẫn chạy bản cũ' : 'vai của bạn chỉ xem được'}</span>
    </div>
    <div id="xemMay" style="margin-top:12px"></div>
    <h2 style="margin:16px -15px 0;padding:11px 15px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:13px">Các bản của page này</h2>
    ${P.ban.length ? `<table style="margin-top:0"><thead><tr>
        <th>Bản</th><th>Trạng thái</th><th>Người sửa</th><th></th></tr></thead><tbody>${P.ban.map((b) => `
      <tr class="${b.trangThai === 'LIVE' ? 'ap' : ''}">
        <td data-nhan="Bản"><span class="ten">v${b.phienBan}</span><div class="phu">≈ ${so(b.uocToken)} token</div></td>
        <td data-nhan="Trạng thái"><span class="pill ${b.trangThai === 'LIVE' ? 'g' : b.trangThai === 'DRAFT' ? 'o' : 'm'}">${esc(b.trangThai)}</span></td>
        <td data-nhan="Người sửa"><span class="phu">${esc(b.nguoiSua || '—')}<br>${b.suaLuc ? new Date(b.suaLuc).toLocaleString('vi-VN') : ''}</span></td>
        <td data-nhan="">${b.trangThai === 'LIVE' ? ''
          : (DUYET ? `<button class="nut nho" data-live="${esc(b.id)}">Đưa lên LIVE</button>`
                   : '<span class="phu">cần vai duyệt kịch bản</span>')}
          <button class="nut nho phu" data-chep="${esc(b.id)}">Chép vào ô soạn</button></td>
      </tr>`).join('')}</tbody></table>` : ''}`;

  if (SUA) $('#nutLuu').addEventListener('click', luu);
  document.querySelectorAll('[data-live]').forEach((b) => b.addEventListener('click', () => lenLive(b.dataset.live)));
  document.querySelectorAll('[data-chep]').forEach((b) => b.addEventListener('click', () => chep(b.dataset.chep)));
}

const layO = () => Object.fromEntries([...document.querySelectorAll('[data-t]')].map((o) => [o.dataset.t, o.value]));

function chep(id){
  const b = P.ban.find((x) => x.id === id);
  if (!b) return;
  for (const [k, v] of Object.entries(b.nguoi)) {
    const o = document.querySelector(`[data-t="${k}"]`);
    if (o) o.value = v || '';
  }
  baoOk(`Đã chép bản v${b.phienBan} vào ô soạn. Sửa rồi bấm lưu để tạo bản mới.`);
}

async function luu(){
  xoaBao();
  $('#nutLuu').disabled = true;
  try {
    const kq = await goi(`/api/kich-ban/page/${encodeURIComponent(P.page.id)}/nhap`,
      { method:'POST', body: JSON.stringify({ nguoi: layO() }) });
    baoOk(`Đã lưu bản nháp v${kq.phienBan} (≈ ${so(kq.uocToken)} token). CHƯA lên LIVE — bot vẫn chạy bản cũ.`);
    $('#xemMay').innerHTML = `<label class="phu" style="font-weight:700">Bản cho máy vừa dựng — không sửa thẳng được</label>
      <div class="may">${esc(kq.may) || '<i>(trống)</i>'}</div>`;
    await moPage(P.page.id);
    await nap();
  } catch (e) { baoLoi(e.message); }
  finally { const n = $('#nutLuu'); if (n) n.disabled = !SUA; }
}

async function lenLive(id){
  const b = P.ban.find((x) => x.id === id);
  if (!confirm(`Đưa bản v${b.phienBan} lên LIVE cho "${P.page.ten || P.page.pageId}"?\n\n`
    + (P.page.botAiBat
      ? 'Page này ĐANG BẬT BOT — bot sẽ nói theo bản này với khách thật, có hiệu lực trong ~60 giây.'
      : 'Page này đang tắt bot, nên chưa ảnh hưởng khách. Bật bot lên là bot dùng bản này.'))) return;
  xoaBao();
  try {
    const kq = await goi(`/api/kich-ban/page/${encodeURIComponent(P.page.id)}/live`,
      { method:'POST', body: JSON.stringify({ id }) });
    baoOk(`Đã đưa v${kq.phienBan} lên LIVE${kq.haBan ? ` (hạ v${kq.haBan})` : ''}.`);
    await moPage(P.page.id);
    await nap();
  } catch (e) { baoLoi(e.message); }
}

let hen = null;
$('#oTim').addEventListener('input', (e) => {
  clearTimeout(hen);
  hen = setTimeout(() => { TIM = e.target.value.trim(); nap(); }, 250);
});

async function nap(){
  try {
    const d = await goi('/api/kich-ban/cay?tim=' + encodeURIComponent(TIM));
    if (!d) return;
    D = d;
    veCanhBao(); veCay();
  } catch (e) { baoLoi(e.message); }
}
nap();
</script>
<script src="/chung/dieu-huong.js"></script>
</body>
</html>
