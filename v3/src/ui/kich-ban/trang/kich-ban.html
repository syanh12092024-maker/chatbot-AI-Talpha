<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kịch bản của page — AI Closer</title>
<!-- Dựng trên hệ kiểu (mục M8 của bản đặc tả: bản nháp và bản đang chạy tách bạch, đưa lên
     chạy phải xác nhận). KHÔNG CSS riêng — trước lượt này là 86 dòng. Bố cục danh sách ·
     chi tiết như màn «Bắt đầu»: chọn page bên trái, soạn bên phải. Trước đây khung soạn mở
     ở CUỐI trang, dưới cả cây page — bấm một page xong phải cuộn xuống tìm. -->
<link rel="stylesheet" href="/chung/kieu.css" data-ds="v3">
<!-- Hàm dựng thành phần (window.UI). ĐỒNG BỘ, KHÔNG `defer`: khung ứng dụng ở cuối trang
     lấy biểu tượng từ đây — `defer` chạy SAU script cuối trang, khung sẽ mất biểu tượng. -->
<script src="/chung/ui.js"></script>
</head>
<body>
<header>
  <h1>Kịch bản của page</h1>
  <span class="sub">Lời bot nói riêng trên từng page. Lưu là bản nháp; chỉ bản đưa lên chạy mới có hiệu lực.</span>
</header>

<main>
  <div id="bang-tin" aria-live="polite"></div>

  <div class="cot-ds">
    <section class="panel" aria-labelledby="tieu-cay">
      <div class="section-header">
        <h2 id="tieu-cay">Page</h2>
        <span class="text-muted text-sm tabular" id="tomTatCay"></span>
      </div>
      <label for="oTim" class="sr-only">Lọc page</label>
      <input id="oTim" type="search" placeholder="Tên page, id Facebook, thị trường…" autocomplete="off" spellcheck="false">
      <div id="cay" class="option-list tren-3 cuon-doc"><span class="skeleton"></span></div>
    </section>

    <section id="soan" aria-live="polite"></section>
  </div>
</main>

<dialog class="drawer" id="ngan" aria-labelledby="ngan-tieu">
  <div class="drawer-header">
    <div class="gian"><h2 id="ngan-tieu">Bản kịch bản</h2><div class="text-muted text-sm" id="ngan-phu"></div></div>
    <button type="button" class="icon-btn" id="ngan-dong" aria-label="Đóng"></button>
  </div>
  <div class="drawer-body" id="ngan-than"></div>
</dialog>

<script>
const { esc, text, icon, statusBadge, button, setBusy, alert: canhBao, emptyState, toast, confirmDialog,
        formatNumber: so } = window.UI;
const $ = (s) => document.querySelector(s);

let D = null, P = null, TIM = '', SUA = false, DUYET = false, KQ_LUU = null;
let CHON = new URLSearchParams(location.search).get('page') || null;

async function goi(duong, tuyChon) {
  const r = await fetch(duong, { headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' }, ...tuyChon });
  if (r.status === 401) { location.href = '/dang-nhap?tiep=' + encodeURIComponent(location.pathname); return null; }
  let d = null; try { d = await r.json(); } catch { /* null */ }
  if (!r.ok || !d || d.ok === false) throw new Error((d && d.thongDiep) || ('Máy chủ trả ' + r.status + '.'));
  return d;
}

// ── BĂNG TIN — cảnh báo của cả team + lỗi thao tác gần nhất ─────────────────────────
let LOI = null;
function baoLoi(title, body) { LOI = { title, body }; veBangTin(); }
function veBangTin() {
  const kh = [];
  if (LOI) kh.push(canhBao({ level: 'error', title: LOI.title, body: LOI.body }));
  if (D && D.soThieuKichBan) {
    kh.push(canhBao({ level: 'warning',
      title: `${so(D.soThieuKichBan)}/${so(D.soPage)} page chưa có kịch bản riêng`,
      body: 'Bot của những page đó chạy bằng quy tắc chung và dữ liệu sản phẩm, không có hướng dẫn riêng về giọng điệu, câu chào hay cách bán.' }));
  }
  for (const t of (D && D.tangTrong) || []) kh.push(canhBao({ level: 'info', body: t.chu }));
  $('#bang-tin').innerHTML = kh.length ? `<div class="duoi-4">${kh.join('')}</div>` : '';
}

function trangThaiBan(tt, label) {
  const ma = { LIVE: 'script_published', DRAFT: 'script_draft', REVIEW: 'script_review', ARCHIVED: 'script_archived' }[tt];
  const chu = { LIVE: 'Đang chạy', DRAFT: 'Bản nháp', REVIEW: 'Chờ duyệt', ARCHIVED: 'Đã lưu trữ' }[tt];
  return statusBadge(ma || tt, { label: label || chu || tt });
}

// ── CỘT TRÁI — page gom theo thị trường ──────────────────────────────────────────────
function veCay() {
  $('#tomTatCay').textContent = `${so(D.soCoKichBan)}/${so(D.soPage)} có kịch bản`;
  if (D.trong) {
    $('#cay').innerHTML = emptyState({ icon: 'triangle-alert', title: D.trong.noi,
      actionsHtml: D.trong.diTiep && D.trong.diTiep.duong ? button(D.trong.diTiep.chu, { href: D.trong.diTiep.duong, size: 'sm' }) : '' });
    return;
  }
  if (!D.nhanh.length) {
    $('#cay').innerHTML = emptyState({ icon: 'search', title: 'Không page nào khớp', body: 'Xoá chữ trong ô lọc để xem lại tất cả.' });
    return;
  }
  $('#cay').innerHTML = D.nhanh.map((n) => `
    <div class="option-group"><span>${esc(n.nuoc)}</span>
      <span class="meta">${so(n.soCoKichBan)}/${so(n.soPage)} có kịch bản</span></div>
    ${n.page.map((p) => `
      <button type="button" class="option" data-page="${esc(p.id)}" aria-current="${p.id === CHON ? 'true' : 'false'}">
        <span class="gian">
          <span class="option-title">${esc(p.ten || '(chưa có tên)')}</span>
          <span class="option-meta">${p.botAiBat ? 'Bot đang chạy' : 'Bot tắt'}${p.coKichBan ? ` · ≈ ${so(p.uocToken)} token` : ''}${p.soBan > 1 ? ` · ${so(p.soBan)} bản` : ''}</span>
        </span>
        ${p.coKichBan ? trangThaiBan('LIVE', `v${p.phienBanLive}`) : statusBadge('script_missing', { label: 'Chưa có' })}
      </button>`).join('')}`).join('');
  document.querySelectorAll('[data-page]').forEach((el) => el.addEventListener('click', () => moPage(el.dataset.page)));
}

// ── CỘT PHẢI — soạn và các bản ───────────────────────────────────────────────────────
async function moPage(id) {
  LOI = null; veBangTin();
  try {
    const d = await goi('/api/kich-ban/page/' + encodeURIComponent(id));
    if (!d) return;
    if (!P || P.page.id !== d.page.id) KQ_LUU = null;
    P = d; SUA = !!d.suaDuoc; DUYET = !!d.duyetDuoc; CHON = d.page.id;
    const u = new URL(location.href); u.searchParams.set('page', CHON); history.replaceState(null, '', u);
    document.querySelectorAll('[data-page]').forEach((el) => el.setAttribute('aria-current', String(el.dataset.page === CHON)));
    veSoan();
  } catch (e) { baoLoi('Không mở được kịch bản của page', e.message); }
}

function veSoanTrong() {
  $('#soan').innerHTML = `<div class="panel">${emptyState({ icon: 'inbox', title: 'Chưa chọn page nào',
    body: 'Bấm một page ở danh sách bên trái để xem bản đang chạy và soạn bản mới.' })}</div>`;
}

function veSoan() {
  const g = P.live ? P.live.nguoi : {};
  const ten = P.page.ten || P.page.pageId;
  const nhanTruong = (k) => P.truongVaoPrompt.includes(k)
    ? '<span class="meta">· đi vào prompt, tốn token mỗi lượt</span>'
    : '<span class="meta">· câu trả lời có sẵn, 0 token</span>';

  $('#soan').innerHTML = `
    <div class="detail-head">
      <div class="page-identity">
        <span class="page-avatar" aria-hidden="true">${esc((ten.trim()[0] || '?').toUpperCase())}</span>
        <div class="page-identity-text">
          <div class="page-identity-name">${esc(ten)}</div>
          <div class="page-identity-sub">${esc(P.page.pageId)}${P.page.thiTruong ? ' · ' + esc(P.page.thiTruong) : ''}</div>
        </div>
      </div>
      <div class="hang">
        ${P.live ? trangThaiBan('LIVE', `v${P.live.phienBan} đang chạy`) : statusBadge('script_missing', { label: 'Chưa có bản nào chạy' })}
        ${statusBadge(P.page.botAiBat ? 'bot_on' : 'bot_off', { label: P.page.botAiBat ? 'Bot đang chạy' : 'Bot tắt' })}
      </div>
    </div>

    <div class="stack">
      ${P.trong ? canhBao({ level: 'warning', body: P.trong.noi }) : ''}

      <section class="panel" aria-labelledby="tieu-soan">
        <div class="section-header"><div>
          <h2 id="tieu-soan">Soạn bản mới</h2>
          <div class="section-desc">Viết bằng tiếng Việt cho người đọc. Bấm lưu, hệ thống tự dựng bản cho máy và lưu cả hai.${P.live ? ` Ô soạn đang chứa nội dung bản v${P.live.phienBan}.` : ''}</div>
        </div></div>
        <div class="form-stack">
          ${P.truong.map((k) => `<div class="field">
            <label class="field-label" for="t-${esc(k)}">${esc(P.nhanTruong[k])} ${nhanTruong(k)}</label>
            <textarea id="t-${esc(k)}" data-t="${esc(k)}" ${k === 'salesPrompt' ? 'rows="8"' : 'rows="3"'} ${SUA ? '' : 'disabled'}>${esc(g[k] || '')}</textarea>
          </div>`).join('')}
        </div>
        <div class="form-actions">
          ${button('Lưu bản nháp', { variant: 'primary', id: 'nutLuu', disabled: !SUA })}
          <span class="text-muted">${SUA ? 'Bản nháp chưa có hiệu lực. Bot vẫn nói theo bản đang chạy.' : 'Vai của bạn chỉ xem được, không lưu được.'}</span>
        </div>
        <div id="ketQuaLuu">${veKetQuaLuu()}</div>
      </section>

      <section class="table-wrap" aria-labelledby="tieu-ban">
        <div class="table-toolbar"><h2 id="tieu-ban">Các bản của page này</h2>
          <span class="table-count">${so(P.ban.length)} bản</span></div>
        ${P.ban.length ? `<table class="data-table"><thead><tr>
            <th scope="col">Bản</th><th scope="col">Trạng thái</th><th scope="col">Người sửa</th>
            <th scope="col">Lúc</th><th scope="col" class="actions"><span class="sr-only">Thao tác</span></th>
          </tr></thead><tbody>${P.ban.map((b) => `
          <tr ${b.trangThai === 'LIVE' ? 'aria-selected="true"' : ''}>
            <td><span class="manh">v${b.phienBan}</span> <span class="meta">≈ ${so(b.uocToken)} token</span></td>
            <td>${trangThaiBan(b.trangThai)}</td>
            <td>${esc(b.nguoiSua || '—')}</td>
            <td class="meta tabular">${b.suaLuc ? esc(new Date(b.suaLuc).toLocaleString('vi-VN')) : '—'}</td>
            <td class="actions"><span class="row-actions">
              ${button('Xem', { size: 'sm', variant: 'ghost', data: { xem: b.id } })}
              ${button('Chép vào ô soạn', { size: 'sm', variant: 'ghost', disabled: !SUA, data: { chep: b.id } })}
              ${b.trangThai === 'LIVE' ? ''
                : DUYET ? button('Đưa lên chạy', { size: 'sm', data: { live: b.id } })
                        : '<span class="meta" title="Cần vai Người duyệt kịch bản">Cần vai duyệt</span>'}
            </span></td>
          </tr>`).join('')}</tbody></table>`
          : emptyState({ icon: 'inbox', title: 'Chưa có bản nào', body: 'Soạn ở khung phía trên rồi bấm Lưu bản nháp để tạo bản đầu tiên.' })}
      </section>
    </div>`;

  if (SUA) $('#nutLuu').addEventListener('click', luu);
  document.querySelectorAll('[data-live]').forEach((b) => b.addEventListener('click', () => lenLive(b.dataset.live, b)));
  document.querySelectorAll('[data-chep]').forEach((b) => b.addEventListener('click', () => chep(b.dataset.chep)));
  document.querySelectorAll('[data-xem]').forEach((b) => b.addEventListener('click', () => xemBan(b.dataset.xem)));
}

// Kết quả lưu ở LẠI trên màn (không toast): nó nói hai điều người ta phải biết — bản nháp
// CHƯA chạy, và máy sẽ đọc đúng đoạn nào. Bản cũ vẽ đoạn máy rồi gọi `moPage()` vẽ lại cả
// khung, nên đoạn máy biến mất ngay khi vừa hiện.
function veKetQuaLuu() {
  if (!KQ_LUU) return '';
  return `<div class="tren-4">${canhBao({ level: 'success',
      title: `Đã lưu bản nháp v${KQ_LUU.phienBan} (≈ ${so(KQ_LUU.uocToken)} token)`,
      body: 'Chưa có hiệu lực — bot vẫn nói theo bản đang chạy. Đưa lên chạy ở bảng «Các bản» bên dưới.' })}
    <div class="field tren-3"><span class="field-label">Bản cho máy vừa dựng <span class="meta">· không sửa thẳng được</span></span>
      <pre class="code-block">${esc(KQ_LUU.may) || '(trống)'}</pre></div></div>`;
}

const layO = () => Object.fromEntries([...document.querySelectorAll('[data-t]')].map((o) => [o.dataset.t, o.value]));

function chep(id) {
  const b = P.ban.find((x) => x.id === id);
  if (!b) return;
  for (const [k, v] of Object.entries(b.nguoi)) {
    const o = document.querySelector(`[data-t="${k}"]`);
    if (o) o.value = v || '';
  }
  toast(`Đã chép bản v${b.phienBan} vào ô soạn. Sửa rồi lưu để tạo bản mới.`);
  $('#tieu-soan').scrollIntoView({ block: 'start', behavior: 'smooth' });
}

function xemBan(id) {
  const b = P.ban.find((x) => x.id === id);
  if (!b) return;
  $('#ngan-tieu').textContent = `Bản v${b.phienBan}`;
  $('#ngan-phu').innerHTML = `${trangThaiBan(b.trangThai)} · ${esc(b.nguoiSua || '—')}${b.suaLuc ? ' · ' + esc(new Date(b.suaLuc).toLocaleString('vi-VN')) : ''}`;
  $('#ngan-than').innerHTML = `<div class="form-stack">
    ${P.truong.map((k) => `<div class="field"><span class="field-label">${esc(P.nhanTruong[k])}</span>
      <div class="text-sm be-chu">${b.nguoi[k] ? esc(b.nguoi[k]) : '<span class="text-muted">(trống)</span>'}</div></div>`).join('')}
    <div class="field"><span class="field-label">Bản cho máy <span class="meta">· ≈ ${so(b.uocToken)} token</span></span>
      <pre class="code-block">${esc(b.may) || '(trống)'}</pre></div>
  </div>`;
  $('#ngan').showModal();
}
$('#ngan-dong').innerHTML = icon('x');
$('#ngan-dong').addEventListener('click', () => $('#ngan').close());

async function luu() {
  const nut = $('#nutLuu');
  setBusy(nut, true);
  LOI = null; veBangTin();
  try {
    const kq = await goi(`/api/kich-ban/page/${encodeURIComponent(P.page.id)}/nhap`,
      { method: 'POST', body: JSON.stringify({ nguoi: layO() }) });
    KQ_LUU = kq;
    await moPage(P.page.id);
    await nap();
  } catch (e) { baoLoi('Không lưu được bản nháp', e.message); }
  finally { const n = $('#nutLuu'); if (n) { setBusy(n, false); n.disabled = !SUA; } }
}

async function lenLive(id, nut) {
  const b = P.ban.find((x) => x.id === id);
  const ten = P.page.ten || P.page.pageId;
  const dongY = await confirmDialog({
    title: `Đưa bản v${b.phienBan} lên chạy cho «${ten}»?`,
    body: P.page.botAiBat
      ? 'Page này đang bật bot: bot sẽ nói theo bản này với khách thật, có hiệu lực trong khoảng 60 giây. Bản đang chạy sẽ chuyển sang lưu trữ.'
      : 'Page này đang tắt bot nên chưa ảnh hưởng khách. Bật bot lên là bot dùng bản này.',
    confirmLabel: 'Đưa lên chạy',
  });
  if (!dongY) return;
  setBusy(nut, true);
  LOI = null; veBangTin();
  try {
    const kq = await goi(`/api/kich-ban/page/${encodeURIComponent(P.page.id)}/live`,
      { method: 'POST', body: JSON.stringify({ id }) });
    toast(`Đã đưa v${kq.phienBan} lên chạy${kq.haBan ? `, v${kq.haBan} chuyển sang lưu trữ` : ''}.`);
    KQ_LUU = null;
    await moPage(P.page.id);
    await nap();
  } catch (e) { setBusy(nut, false); baoLoi('Không đưa được bản lên chạy', e.message); }
}

let hen = null;
$('#oTim').addEventListener('input', (e) => {
  clearTimeout(hen);
  hen = setTimeout(() => { TIM = e.target.value.trim(); nap(); }, 250);
});

async function nap() {
  try {
    const d = await goi('/api/kich-ban/cay?tim=' + encodeURIComponent(TIM));
    if (!d) return;
    D = d;
    veBangTin(); veCay();
  } catch (e) {
    baoLoi('Không tải được danh sách page', e.message);
    $('#cay').innerHTML = emptyState({ icon: 'circle-alert', title: 'Không tải được', body: 'Kiểm kết nối rồi tải lại trang.' });
  }
}

veSoanTrong();
nap().then(() => { if (CHON) moPage(CHON); });
</script>
<script src="/chung/dieu-huong.js"></script>
</body>
</html>
