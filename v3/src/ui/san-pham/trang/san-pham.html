<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sản phẩm &amp; kho — AI Closer v3</title>
<style>
  :root{
    --bg:#f5f7f9; --panel:#fff; --ink:#101828; --muted:#667085; --line:#e4e9ee;
    --pri:#0e7c86; --priDark:#0b646d; --priSoft:#e6f4f5;
    --ok:#16a34a; --okSoft:#e8f7ee; --bad:#dc2626; --badSoft:#fdecec;
    --warn:#b45309; --warnSoft:#fdf3e3; --xam:#8b95a1;
    --side:#0b2125; --sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06); --r:12px;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:-apple-system,"SF Pro Text",Segoe UI,Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);font-size:13.5px;-webkit-font-smoothing:antialiased}
  header{background:var(--side);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:700}
  header .sub{font-size:11.5px;color:#7fa3a8}
  header .sp{flex:1}
  header a{color:#9fd3d8;text-decoration:none;font-size:12px;font-weight:600}
  main{padding:16px 22px 60px;max-width:1120px;margin:0 auto}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:16px;overflow:hidden}
  .panel h2{font-size:13px;margin:0;padding:11px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .panel h2 .hint{font-weight:400;color:var(--muted);font-size:11.5px}
  .panel h2 .sp{flex:1}
  .than{padding:14px 15px}

  .o{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
  .o .k{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh)}
  .o .k .n{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
  .o .k .c{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}
  .o .k.xau .n{color:var(--bad)} .o .k.tot .n{color:var(--ok)} .o .k.mu .n{color:var(--xam);font-size:17px}

  .nguy{background:#fff4f4;border:1px solid #f0c2c2;border-left:4px solid var(--bad);
        border-radius:var(--r);padding:12px 15px;margin-bottom:14px;line-height:1.6}
  .nguy b{color:#991b1b}
  .nguon{background:var(--priSoft);border:1px solid #b8dde0;color:#0b4a52;border-radius:var(--r);
         padding:11px 14px;margin-bottom:14px;line-height:1.6;font-size:12.5px}
  .canh{background:var(--warnSoft);border:1px solid #f0d3a4;color:#8a4a06;border-radius:var(--r);
        padding:11px 14px;margin-bottom:14px;line-height:1.6;font-size:12.5px}

  table{width:100%;border-collapse:collapse}
  th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;background:#fafbfc}
  tbody tr:last-child td{border-bottom:0}
  tbody tr.bam{cursor:pointer} tbody tr.bam:hover{background:#fafbfc}
  .bao{display:block;overflow-x:auto}

  .the{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
  .the.thieu{background:var(--badSoft);color:#991b1b}
  .the.ok{background:var(--okSoft);color:#166534}
  .the.mu{background:#f1f3f5;color:var(--muted)}
  .cham{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
  .cham.b{background:var(--ok)} .cham.t{background:#cfd6dd}

  .sp{display:grid;gap:10px}
  .sp .m{border:1px solid var(--line);border-radius:10px;padding:12px 13px;display:flex;gap:12px}
  .sp .m.thieu{border-left:4px solid var(--bad)}
  .sp .m img{width:64px;height:64px;object-fit:cover;border-radius:8px;background:#f1f3f5;flex:0 0 auto}
  .sp .m .t{flex:1;min-width:0}
  .sp .m .ten{font-weight:600;margin-bottom:3px}
  /* `khuyet`, KHÔNG đặt là `trong`: `.trong` đã là lớp của khung rỗng cả màn
     (padding 34px + text-align:center), nên tên sản phẩm sẽ ăn nguyên căn giữa của nó.
     Đây là lần THỨ HAI trùng tên lớp kiểu này — lần trước là `.v` ở Trang chủ. */
  .sp .m .ten.khuyet{color:var(--bad);font-style:italic;font-weight:500}
  .sp .m .gia{font-size:12px;color:var(--muted);line-height:1.6;margin-top:3px}
  .sp .m .gia b{color:var(--ink);font-variant-numeric:tabular-nums}

  .trong{padding:34px 20px;text-align:center;color:var(--muted);line-height:1.6}
  .trong .ti{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:6px}
  .trong .di{margin-top:10px;font-size:12px;background:var(--priSoft);color:#0b4a52;
             display:inline-block;padding:9px 13px;border-radius:9px;text-align:left;max-width:540px}
  .nho{color:var(--muted);font-size:11.5px;line-height:1.5}
  code{background:#f1f3f5;padding:1px 5px;border-radius:4px;font-size:11.5px;
       font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  button{font:inherit;border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600;
         background:#eef1f4;color:#344054}

  @media (max-width:720px){
    header{padding:12px 14px} main{padding:12px 14px 50px}
    .than{padding:12px} th,td{padding:8px 9px}
    .o{grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
    .o .k{padding:10px 11px} .o .k .n{font-size:19px}
    .sp .m img{width:52px;height:52px}
  }
</style>
</head>
<body>
<header>
  <h1>Sản phẩm &amp; kho</h1>
  <span class="sub" id="hTeam">…</span>
  <span class="sp"></span>
  <a href="/thu-vien-anh">Thư viện ảnh →</a>
  <a href="/san-sang">Cửa kiểm →</a>
  <a href="/trang-chu">← Trang chủ</a>
</header>

<main>
  <div id="dai"></div>
  <div class="o" id="dem"></div>

  <div class="panel">
    <h2 id="tieuDe">Page có sản phẩm <span class="hint" id="hSo"></span>
      <span class="sp"></span>
      <span class="hint">bấm một dòng để xem sản phẩm của page đó</span></h2>
    <div id="bang"><div class="than nho">Đang tải…</div></div>
  </div>
</main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const so = (n) => Number(n || 0).toLocaleString('vi-VN');

let DL = null;

async function goi(d) {
  const r = await fetch(d, { credentials: 'same-origin' });
  const j = await r.json().catch(() => null);
  if (!r.ok || !j || j.ok === false) throw new Error((j && j.thongDiep) || 'Lỗi ' + r.status);
  return j;
}

function veDem(k, d) {
  $('#dem').innerHTML = [
    { n: so(k.tongSanPham), c: 'sản phẩm bot đang bán', l: 'tot' },
    { n: so(k.coSanPham), c: 'page có sản phẩm', l: '' },
    { n: so(k.khongCoSanPham), c: 'page KHÔNG có sản phẩm — bot không chào bán được gì', l: k.khongCoSanPham ? 'xau' : '' },
    { n: '?', c: 'tồn kho — chưa có nguồn', l: 'mu' },
  ].map((x) => `<div class="k ${x.l}"><div class="n">${x.n}</div><div class="c">${x.c}</div></div>`).join('');
}

function veDai(d) {
  let h = '';
  if (d.nguon) {
    h += `<div class="nguon">📖 Số liệu màn này đọc từ <b>${esc(d.nguon.ten)}</b>,
      <b>không</b> từ ${esc(d.nguon.khongPhai)}.<br>${esc(d.nguon.viSao)}</div>`;
  }
  if (d.tonKho && !d.tonKho.co) {
    h += `<div class="canh">📦 <b>Cột tồn kho để trống, không hiện 0.</b> ${esc(d.tonKho.noi)}
      <br>${esc(d.tonKho.diTiep)}</div>`;
  }
  $('#dai').innerHTML = h;
}

function veBang(d) {
  const ds = d.page.filter((p) => p.soSanPham > 0);
  $('#hSo').textContent = `${ds.length}/${d.dem.tongPage}`;
  const b = $('#bang');
  if (!ds.length) {
    b.innerHTML = `<div class="trong"><div class="ti">${esc(d.trong ? d.trong.noi : 'Không có page nào')}</div>
      ${d.trong && d.trong.diTiep ? `<div class="di">👉 ${esc(d.trong.diTiep)}</div>` : ''}</div>`;
    return;
  }
  b.innerHTML = `<div class="bao"><table>
    <thead><tr><th>Page</th><th>Sản phẩm</th><th>Tồn kho</th><th>Bot</th><th>Thị trường</th><th>Marketer</th></tr></thead>
    <tbody>${ds.map((p) => `
      <tr class="bam" data-id="${esc(p.pageId)}">
        <td><b>${esc(p.ten)}</b><div class="nho">${esc(p.pageId)}</div></td>
        <td><b>${p.soSanPham}</b></td>
        <td><span class="the mu">chưa có nguồn</span></td>
        <td style="white-space:nowrap"><span class="cham ${p.botBat ? 'b' : 't'}"></span>${p.botBat ? 'bật' : 'tắt'}</td>
        <td class="nho">${esc(p.thiTruong) || '—'}</td>
        <td class="nho">${esc(p.marketer) || '<i>chưa gán</i>'}</td>
      </tr>`).join('')}</tbody></table></div>`;

  b.querySelectorAll('[data-id]').forEach((n) => { n.onclick = () => moPage(n.dataset.id); });
}

async function moPage(id) {
  $('#tieuDe').innerHTML = 'Đang mở page…';
  $('#bang').innerHTML = '<div class="than nho">Đang đọc sản phẩm…</div>';
  try {
    const d = await goi('/api/san-pham/' + encodeURIComponent(id));
    $('#tieuDe').innerHTML = `<b>${esc(d.tenPage)}</b>
      <span class="hint">${d.dem.tong} sản phẩm · ${d.dem.tongAnh} ảnh${d.dem.tienTe.length ? ' · ' + esc(d.dem.tienTe.join(', ')) : ''}</span>
      <span class="sp"></span><button id="ve">← Về danh sách</button>`;
    $('#ve') && ($('#ve').onclick = () => { veBangLai(); });

    if (!d.sanPham.length) {
      $('#bang').innerHTML = `<div class="trong"><div class="ti">${esc(d.trong.noi)}</div>
        <div class="di">👉 ${esc(d.trong.diTiep)}</div></div>`;
      return;
    }
    const canh = d.dem.thieuTen
      ? `<div class="nguy"><b>${d.dem.thieuTen}/${d.dem.tong} sản phẩm KHÔNG CÓ TÊN.</b>
         Bot chào bán được ảnh và giá, nhưng không gọi được tên món hàng.
         Tên phải lấy từ POS — màn này <b>không bịa tên thay</b>, vì bịa một cái tên là làm lỗ
         này biến mất khỏi màn trong khi khách vẫn thấy nguyên.</div>` : '';
    $('#bang').innerHTML = `<div class="than">${canh}<div class="sp">${d.sanPham.map((s) => `
      <div class="m ${s.thieuTen ? 'thieu' : ''}">
        ${s.anh.length ? `<img src="${esc(s.anh[0].duong)}" alt="" loading="lazy">` : '<img alt="">'}
        <div class="t">
          <div class="ten ${s.thieuTen ? 'khuyet' : ''}">${esc(s.goiLa)}</div>
          <div class="nho">mã <code>${esc(s.ma)}</code>${s.bienThe ? ' · ' + esc(s.bienThe) : ''} · ${s.soAnh} ảnh</div>
          <div class="gia">${s.bacGia.map((g) => `${esc(g.nhan)}: <b>${so(g.gia)} ${esc(s.tienTe)}</b>`).join('<br>') || '<i>chưa có bậc giá</i>'}</div>
        </div>
      </div>`).join('')}</div></div>`;
  } catch (e) {
    $('#bang').innerHTML = `<div class="than"><div class="canh" style="margin:0">${esc(e.message)}</div></div>`;
  }
}

function veBangLai() {
  $('#tieuDe').innerHTML = `Page có sản phẩm <span class="hint" id="hSo"></span>
    <span class="sp"></span><span class="hint">bấm một dòng để xem sản phẩm của page đó</span>`;
  veBang(DL);
}

async function tai() {
  try {
    DL = await goi('/api/san-pham');
    $('#hTeam').textContent = 'team ' + (DL.teamId || '?');
    veDai(DL); veDem(DL.dem, DL); veBang(DL);
  } catch (e) {
    $('#bang').innerHTML = `<div class="than"><div class="canh" style="margin:0">
      <b>Không đọc được kho sản phẩm:</b> ${esc(e.message)}</div></div>`;
    $('#dem').innerHTML = '';
  }
}

tai();
</script>
<script src="/chung/dieu-huong.js"></script>
</body>
</html>
