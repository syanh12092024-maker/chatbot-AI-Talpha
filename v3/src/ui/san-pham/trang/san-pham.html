<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sản phẩm &amp; kho — AI Closer</title>
<!-- VE1 · hai cột: sản phẩm của team bên trái, chi tiết hoặc việc chuyển page bên phải.
     GSP2 (CR-02-10b): bản sao trở thành danh sách việc chuyển tạm. Gắn page không xác nhận
     giá; phải đối soát từng bản sao cho đúng gốc × shop. Dùng hệ kiểu chung, không CSS riêng. -->
<link rel="stylesheet" href="/chung/kieu.css" data-ds="v3">
<!-- Hàm dựng thành phần (window.UI). ĐỒNG BỘ, KHÔNG `defer`: khung ứng dụng ở cuối trang
     lấy biểu tượng từ đây — `defer` chạy SAU script cuối trang, khung sẽ mất biểu tượng. -->
<script src="/chung/ui.js"></script>
</head>
<body>
<header class="an-tieu-de">
  <h1>Sản phẩm &amp; kho</h1>
  <span class="sub">Sản phẩm của team: chung · theo thị trường (shop POS) · page đang bán.</span>
</header>

<main class="chia-hai">
  <!-- TRÁI — danh sách sản phẩm của team -->
  <section class="chia-hai-trai" aria-label="Sản phẩm">
    <div class="chia-hai-dau">
      <div class="hang-giua"><b>Sản phẩm của team</b><span id="choNutThem"></span></div>
      <label class="field"><span class="sr-only">Tìm sản phẩm</span>
        <input type="search" id="tim" placeholder="Tìm sản phẩm…" autocomplete="off"></label>
      <div id="oDuLieu"></div>
    </div>
    <div id="phamViSp"></div>
    <ul class="ds-chon" id="dsGoc" aria-label="Danh sách sản phẩm"><li><span class="skeleton"></span></li></ul>
  </section>

  <!-- PHẢI — một sản phẩm · hoặc bản sao theo page · hoặc thêm sản phẩm -->
  <section class="chia-hai-phai" id="phai" aria-live="polite">
    <div class="empty-state"><span class="skeleton"></span></div>
  </section>
</main>

<script>
const { esc, icon, statusBadge, button, alert: canhBao, emptyState, metricRow, formatNumber: so } = window.UI;
const $ = (s) => document.querySelector(s);

let DL = null;       // danh sách bản sao lưu trữ
let CHUYEN = null;   // /api/san-pham/chuyen — quyết định chuyển của người
let LOI_CHUYEN = '';
let LOC_CHUYEN = '';
const CHON_CHUYEN = {}; // lựa chọn + bước đã thành công, giữ khi bước gắn thất bại
let DOISOAT = null;     // GSP3 · khung đối soát một đơn vị gốc × shop: { gocId, shopId, du, cap, chon, tb, loi, dangGui }
let GOC = null;      // /api/san-pham/goc — danh mục sản phẩm của team
let CHON = null;     // id sản phẩm đang mở
let TAB = 'chung';
let CT = null;       // chi tiết sản phẩm đang mở
let TT = null;       // shopId thị trường đang xem ở tab «Theo thị trường»
let THEM = null;     // khung «Thêm thị trường»: { shop, mon }

async function goi(d) {
  const r = await fetch(d, { credentials: 'same-origin', headers: { Accept: 'application/json' } });
  if (r.status === 401) { location.href = '/dang-nhap?tiep=' + encodeURIComponent(location.pathname); return null; }
  const j = await r.json().catch(() => null);
  if (!r.ok || !j || j.ok === false) throw new Error((j && j.thongDiep) || 'Máy chủ trả ' + r.status + '.');
  return j;
}
async function goiGhi(duong, tuyChon) {
  const r = await fetch(duong, {
    credentials: 'same-origin',
    headers: { Accept: 'application/json', 'Content-Type': 'application/json' },
    ...tuyChon,
  });
  const j = await r.json().catch(() => null);
  if (!r.ok || !j || j.ok === false) throw new Error((j && j.thongDiep) || 'Máy chủ trả ' + r.status + '.');
  return j;
}
const tenGoc = (g) => g.ten || g.maGoc;
const giu = (id, tab, xem) => {   // F5 / chia sẻ đường không mất chỗ đang đứng
  const u = new URL(location.href);
  if (id) u.searchParams.set('sp', id); else u.searchParams.delete('sp');
  if (tab && tab !== 'chung') u.searchParams.set('tab', tab); else u.searchParams.delete('tab');
  if (xem) u.searchParams.set('xem', xem); else u.searchParams.delete('xem');
  history.replaceState(null, '', u);
};

/* ── TRÁI ─────────────────────────────────────────────────────────────────────────── */
function veTrai() {
  if (!GOC) return;
  $('#choNutThem').innerHTML = GOC.suaDuoc ? button('+ Thêm', { size: 'sm', id: 'nutThem' }) : '';
  if ($('#nutThem')) $('#nutThem').onclick = () => veGop();   // GSP1: sản phẩm gốc chỉ sinh từ gộp món POS theo SKU
  const q = $('#tim').value.trim().toLowerCase();
  const ds = GOC.goc.filter((g) => !q || [g.ten, g.maGoc, g.soHieu].some((x) => String(x || '').toLowerCase().includes(q)));
  $('#dsGoc').innerHTML = ds.length
    ? ds.map((g) => `<li><button type="button" data-goc="${esc(g.id)}"${g.id === CHON ? ' aria-current="true"' : ''}>
        <span class="ten">${g.ten ? esc(g.ten) : `<span class="text-muted">${esc(g.maGoc)} · chưa đặt tên</span>`}</span>
        <span class="tom">${so(g.soThiTruong ?? 0)} thị trường · ${so(g.soPage ?? 0)} page · ${so(g.soBienThe)} món POS</span>
      </button></li>`).join('')
    : `<li class="o-trong">${GOC.goc.length ? 'Không sản phẩm nào khớp.' : GOC.phamVi && GOC.phamVi.chiCuaToi
      ? 'Bạn chưa phụ trách sản phẩm nào.' : 'Team chưa có sản phẩm gốc nào.'}</li>`;
  // LL15d: marketer chỉ thấy sản phẩm mình phụ trách — nói phần còn lại ở đâu, không để danh sách ngắn trông như «team ít hàng».
  const pv = GOC.phamVi || {};
  $('#phamViSp').innerHTML = !pv.chiCuaToi ? '' : !pv.coMaNv
    ? `<p class="field-hint" data-pham-vi>Tài khoản của bạn chưa gắn hồ sơ HRM (không có mã nhân viên) nên chưa phụ trách sản phẩm nào — nhờ quản trị kiểm ở Người và team.</p>`
    : `<p class="field-hint" data-pham-vi>Chỉ hiện ${so(pv.soCuaToi)}/${so(pv.soTeam)} sản phẩm bạn phụ trách · ${so(pv.soChuaGan)} sản phẩm của team chưa gán marketer — quản trị gán ở tab Chung.</p>`;
  $('#dsGoc').querySelectorAll('[data-goc]').forEach((b) => { b.onclick = () => moSanPham(b.dataset.goc); });

  const con = CHUYEN && CHUYEN.dem.chuaXong;
  $('#oDuLieu').innerHTML = !GOC.suaDuoc ? '' : LOI_CHUYEN
    ? `<div class="o-luu-y">Chưa đọc được việc chuyển: ${esc(LOI_CHUYEN)} <button type="button" class="nut-dam" id="moBanSao">Thử lại →</button></div>`
    : con ? `<div class="o-luu-y"><b>${so(con)} page chưa chuyển xong</b> sang sản phẩm.
      <br><button type="button" class="nut-dam" id="moBanSao">Chuyển page sang sản phẩm →</button>
      <button type="button" class="nut-dam" id="moGop">Gộp món POS thành sản phẩm →</button></div>` : '';
  if ($('#moBanSao')) $('#moBanSao').onclick = () => veBanSao();
  if ($('#moGop')) $('#moGop').onclick = () => veGop();
}

/* ── PHẢI · MỘT SẢN PHẨM ──────────────────────────────────────────────────────────── */
async function moSanPham(id, tab) {
  CHON = id; TAB = tab || 'chung'; TT = null; THEM = null; CT = null;
  veTrai(); giu(id, TAB);
  $('#phai').innerHTML = '<div class="empty-state"><span class="skeleton"></span></div>';
  try { CT = await goi('/api/san-pham/goc/' + encodeURIComponent(id) + '/chi-tiet'); }
  catch (e) { $('#phai').innerHTML = canhBao({ level: 'warning', title: 'Không đọc được sản phẩm', body: e.message }); return; }
  if (!CT) return;
  veSanPham();
}

const TABS = [['chung', 'Chung'], ['thi-truong', 'Theo thị trường'], ['page', 'Page đang bán'], ['lich-su', 'Lịch sử']];

function veSanPham() {
  const g = CT.goc;
  $('#phai').innerHTML = `
    <div class="chi-tiet-dau">
      <div><h2 class="tieu-de-lon">${g.ten ? esc(g.ten) : `<span class="text-muted">chưa đặt tên</span>`}</h2>
        <div class="dong-phu">Mã gốc <code>${esc(g.maGoc)}</code>${g.sku ? ` · SKU ${esc(g.sku)}` : (g.soHieu ? ` · số hiệu ${esc(g.soHieu)}` : '')}`
          + `${g.marketer ? ` · marketer ${esc(g.marketer)}` : ' · <span class="text-muted">chưa gán marketer</span>'} · ${so(g.thiTruong.length)} thị trường · ${so(g.page.length)} page</div></div>
      <div class="hanh-dong" id="hanhDong"></div>
    </div>
    <div class="thu-tu-doc" aria-label="Bot ghép lời từ bốn tầng">
      <div><span class="buoc">① Luật chung</span><b>cả team</b></div>
      <div data-dang><span class="buoc">② Sản phẩm · chung</span><b>kiến thức · cách tư vấn</b></div>
      <div data-dang><span class="buoc">③ Sản phẩm · theo shop POS</span><b>1 shop = 1 thị trường · món · tồn</b></div>
      <div><span class="buoc">④ Page</span><b>kịch bản · giá · ảnh của page</b></div>
    </div>
    <div class="tabs" role="tablist" aria-label="Sản phẩm">${TABS.map(([k, t]) =>
      `<button type="button" class="tab" role="tab" id="tab-${k}" aria-controls="thanTab" aria-selected="${k === TAB}" data-tab="${k}">${t}</button>`).join('')}</div>
    <div id="thanTab" role="tabpanel"></div>
    <div id="tbSp" aria-live="polite"></div>`;
  $('#phai').querySelectorAll('[data-tab]').forEach((b) => { b.onclick = () => { TAB = b.dataset.tab; giu(CHON, TAB); veSanPham(); }; });
  $('#thanTab').setAttribute('aria-labelledby', 'tab-' + TAB);
  const hd = [];
  if (TAB === 'chung' && CT.suaKienThuc) hd.push(button(CT.botDocKienThuc === true ? 'Lưu — mọi page dùng ngay' : 'Lưu', { variant: 'primary', size: 'sm', id: 'nutLuuKt' }));
  if (CT.suaDuoc) hd.push(button('Bỏ sản phẩm', { variant: 'danger', size: 'sm', id: 'nutBo',
    title: g.thiTruong.length ? 'Còn món POS đang trỏ tới — sẽ bị từ chối' : 'Bỏ sản phẩm gốc này' }));
  $('#hanhDong').innerHTML = hd.join('');
  if ($('#nutLuuKt')) $('#nutLuuKt').onclick = luuKienThuc;
  if ($('#nutBo')) $('#nutBo').onclick = () => boGoc(CHON, $('#nutBo'));
  ({ chung: veChung, 'thi-truong': veThiTruong, page: vePage, 'lich-su': veLichSu }[TAB] || veChung)();
}

/* ② CHUNG — kiến thức bot đọc (LL11). Mọi thị trường và page bán sản phẩm này thừa hưởng. */
const KT = [['cong_dung', 'Công dụng'], ['thanh_phan', 'Thành phần'], ['cach_dung', 'Cách dùng'], ['hop_voi', 'Hợp với'],
  ['hoi_size', 'Hỏi size trước khi chốt'], ['canh_bao', 'Lưu ý / cảnh báo'], ['them', 'Khách hay hỏi · thông tin thêm']];
function veChung() {
  const kt = CT.goc.kienThuc || {};
  const o = (k, nhan) => `<div class="field"><label class="field-label" for="kt-${k}">${nhan}</label>`
    + `<textarea id="kt-${k}" data-kt="${k}" rows="${k === 'cong_dung' || k === 'them' ? 3 : 2}" maxlength="2000" ${CT.suaKienThuc ? '' : 'disabled'}`
    + `${k === 'hoi_size' ? ' placeholder="Ví dụ: trước khi chốt PHẢI hỏi số đo rồi gợi ý size. Hỏi đúng một lần, gộp vào câu tư vấn."' : ''}>`
    + `${esc(kt[k] || '')}</textarea></div>`;
  $('#thanTab').innerHTML = `${veMarketerSp()}${veBotDocKt()}<section class="chia-phu">
      <div class="form-stack">
        ${KT.filter(([k]) => k !== 'hoi_size').slice(0, 4).map(([k, n]) => o(k, n)).join('')}
        <div class="khoi-nhan" data-tone="warning">${o('hoi_size', 'Hỏi size trước khi chốt')}
          <span class="field-hint">Chuyển từ màn Kỹ năng (LL11). Để trống thì bot không hỏi.</span></div>
        ${KT.filter(([k]) => ['canh_bao', 'them'].includes(k)).map(([k, n]) => o(k, n)).join('')}
        <p class="field-hint">Ô để trống thì bot không nói. ${CT.suaKienThuc ? '' : 'Vai của bạn chỉ xem — quản trị hoặc marketer sửa.'}</p>
      </div>
      <aside class="form-stack">
        <b>Ảnh chung</b>
        <div class="o-trong">Ảnh đang đặt theo TỪNG page (tab «Sản phẩm &amp; giá» của page). Ảnh chung của sản phẩm chưa có chỗ lưu — bản vẽ để ở đây.</div>
      </aside>
    </section>`;
  if ($('#nutLuuMk')) $('#nutLuuMk').onclick = () => luuMarketer();
  if ($('#nutGoiYMk')) $('#nutGoiYMk').onclick = () => luuMarketer(CT.goiYMarketer.goiY.maNv);
}
/* VE8b · marketer phụ trách — MỘT cho mọi thị trường (người quyết 30/09); đổi ở đây thì mọi page đang bán sản phẩm đổi theo.
   LL15d · 02/10: CHỌN từ hồ sơ HRM (tài khoản marketer có mã NV của team — CR-28-09c), không gõ tay; máy GỢI Ý từ đơn POS 60 ngày,
   người bấm mới gán. Marketer chỉ thấy sản phẩm gán đúng mã NV của mình (01 §9). */
const pct = (x) => Math.round(x * 100);
function veGoiYMk() {
  const gy = CT.goiYMarketer;
  if (!gy) return '';
  if (!gy.noi) return `<span class="field-hint" data-goi-y-mk>Gợi ý từ đơn POS: chưa có — ${esc(gy.viSao || '')}.</span>`;
  const g = gy.goiY;
  if (!g) return `<span class="field-hint" data-goi-y-mk>Gợi ý từ đơn POS ${so(gy.soNgay)} ngày: chưa có đơn nào của các món trong sản phẩm này.</span>`;
  if (!g.chonDuoc) {
    return `<span class="field-hint" data-goi-y-mk>Đơn ${so(gy.soNgay)} ngày: nhiều nhất là ${g.maNv ? `mã NV ${esc(g.maNv)}` : 'marketer chưa ghép hồ sơ HRM'} `
      + `(${pct(g.tiLe)}% · ${so(g.soDon)}/${so(g.tong)} đơn) — người này không phải marketer của team trên hệ, không gợi ý được.</span>`;
  }
  return `<span class="field-hint" data-goi-y-mk>Gợi ý từ đơn POS ${so(gy.soNgay)} ngày: <b>${esc(g.ten)}</b> — ${pct(g.tiLe)}% đơn (${so(g.soDon)}/${so(g.tong)}).</span>`
    + (CT.suaDuoc && CT.goc.marketerMaNv !== g.maNv ? ' ' + button('Dùng gợi ý', { size: 'sm', id: 'nutGoiYMk' }) : '');
}
function veMarketerSp() {
  const g = CT.goc;
  const ds = CT.marketerChon || [];
  const coTrongDs = ds.some((m) => m.maNv === g.marketerMaNv);
  const tuyChon = [`<option value="">— chưa gán —</option>`]
    .concat(!g.marketerMaNv && g.marketer ? [`<option value="" selected>${esc(g.marketer)} (gõ tay, chưa nối HRM — chọn lại)</option>`] : [])
    .concat(g.marketerMaNv && !coTrongDs ? [`<option value="${esc(g.marketerMaNv)}" selected>${esc(g.marketer || g.marketerMaNv)} (không còn là marketer của team)</option>`] : [])
    .concat(ds.map((m) => `<option value="${esc(m.maNv)}"${m.maNv === g.marketerMaNv ? ' selected' : ''}>${esc(m.ten)} · ${esc(m.maNv)}</option>`));
  return `<div class="hang duoi-4">
    <div class="field"><label class="field-label" for="spMk">Marketer phụ trách</label>
      ${CT.suaDuoc ? `<select id="spMk">${tuyChon.join('')}</select>`
        : `<div id="spMk">${g.marketer ? esc(g.marketer) : '<span class="text-muted">chưa gán</span>'}</div>`}</div>
    ${CT.suaDuoc ? button('Lưu marketer', { size: 'sm', id: 'nutLuuMk' }) : ''}
    ${veGoiYMk()}
    <span class="field-hint" id="tbMk" aria-live="polite">Chọn từ hồ sơ HRM — một marketer cho mọi thị trường; mọi page đang bán sản phẩm đổi theo.
      Marketer chỉ thấy sản phẩm gán cho mình.${CT.suaDuoc && !ds.length ? ' Team chưa có tài khoản marketer nào gắn hồ sơ HRM (Người và team › Lấy người từ HRM).' : ''}</span>
  </div>`;
}
async function luuMarketer(maNv) {
  const nut = $('#nutLuuMk'); nut.disabled = true;
  const mk = typeof maNv === 'string' ? maNv : $('#spMk').value;
  try {
    const kq = await goiGhi('/api/san-pham/goc/' + encodeURIComponent(CHON), { method: 'POST', body: JSON.stringify({ marketerMaNv: mk }) });
    CT.goc.marketer = (kq.goc && kq.goc.marketer) || ''; CT.goc.marketerMaNv = (kq.goc && kq.goc.marketerMaNv) || null;
    const tb = `Đã lưu marketer «${CT.goc.marketer || 'trống'}» · ${so((kq.goc && kq.goc.soPageTheoMarketer) || 0)} page đổi theo.`;
    veSanPham();
    $('#tbMk').textContent = tb;
  } catch (e) { $('#tbMk').textContent = e.message; nut.disabled = false; }
}

/* VE1b · 29/09: kiến thức ở đây chỉ tới bot khi máy chủ ghép lời từ dữ liệu v3. Nói đúng trạng thái đo được — không hứa. */
function veBotDocKt() {
  if (CT.botDocKienThuc === true) return '';
  return `<div class="duoi-4">${canhBao(CT.botDocKienThuc === false
    ? { level: 'warning', title: 'Bot CHƯA đọc phần kiến thức này',
      body: 'Máy chủ chưa bật cách ghép lời mới, nên bot đang trả lời khách vẫn lấy lời về sản phẩm từ bảng «Bản sao theo page» (giá · mô tả · ảnh của từng page). Lưu ở đây vẫn giữ lại, và sẽ được dùng khi bật cách ghép lời mới.' }
    : { level: 'warning', title: 'Chưa biết bot có đọc phần này không',
      body: 'Máy chủ chưa nối phép đo cách ghép lời. Đừng coi lưu ở đây là bot đã nói theo.' })}</div>`;
}
async function luuKienThuc() {
  const nut = $('#nutLuuKt'); nut.disabled = true;
  const kienThuc = Object.fromEntries([...document.querySelectorAll('[data-kt]')].map((o) => [o.dataset.kt, o.value]));
  try {
    await goiGhi('/api/san-pham/goc/' + encodeURIComponent(CHON) + '/kien-thuc', { method: 'POST', body: JSON.stringify({ kienThuc }) });
    CT.goc.kienThuc = kienThuc;
    $('#tbSp').innerHTML = canhBao(CT.botDocKienThuc === true
      ? { level: 'success', title: 'Đã lưu', body: 'Lượt chat kế tiếp của mọi page bán sản phẩm này đọc bản mới.' }
      : { level: 'info', title: 'Đã lưu vào dữ liệu', body: 'Bot CHƯA đọc phần này — lời bot về sản phẩm hôm nay vẫn theo «Bản sao theo page».' });
  } catch (e) { $('#tbSp').innerHTML = canhBao({ level: 'error', title: 'Chưa lưu được', body: e.message }); }
  finally { nut.disabled = false; }
}

/* ③ THEO THỊ TRƯỜNG — 1 shop POS = 1 thị trường; món · tồn · giá (từ bản sao page) · page bán ở đây. */
const tenTT = (t) => t.thiTruong || 'Shop ' + t.shopId;
function veThiTruong() {
  const g = CT.goc;
  if (!TT && g.thiTruong.length) TT = g.thiTruong[0].shopId;
  const t = g.thiTruong.find((x) => x.shopId === TT);
  const tienTe = (x) => [...new Set(x.gia.map((b) => b.tienTe))].join('/');
  $('#thanTab').innerHTML = `
    <div class="hang-vien">${g.thiTruong.map((x) => `<button type="button" class="vien" data-tt="${esc(x.shopId)}" aria-pressed="${x.shopId === TT && !THEM}">`

        <span class="nhan">Món POS</span><span>${t.mon.map((m) => `<div><code>${esc(m.posMa)}</code> ${m.ten ? esc(m.ten) : '<span class="text-muted">chưa có tên</span>'}`

function veKhungThem() {
  const nhom = new Map();
  for (const m of CT.monChuaGan) {
    if (!nhom.has(m.shopId)) nhom.set(m.shopId, { shopId: m.shopId, thiTruong: m.thiTruong, mon: [] });
    nhom.get(m.shopId).mon.push(m);
  }
  const shops = [...nhom.values()];
  if (!THEM.shop && shops.length) THEM.shop = shops[0].shopId;
  const s = nhom.get(THEM.shop);
  const q = (THEM.tim || '').toLowerCase();
  const mon = s ? s.mon.filter((m) => !q || [m.ten, m.posMa].some((x) => String(x || '').toLowerCase().includes(q))) : [];
  $('#khungThem').innerHTML = `<section class="khung-them" aria-label="Thêm thị trường">
    <div><span class="buoc-ten">① Shop POS = thị trường</span>

    </div>
    <div><span class="buoc-ten">② Món trên POS${s ? ` của ${esc(s.thiTruong || 'shop ' + s.shopId)}` : ''}</span>
      <label class="field"><span class="sr-only">Tìm món POS</span><input type="search" id="timMon" placeholder="Tìm theo tên hoặc mã món…" value="${esc(THEM.tim || '')}" autocomplete="off"></label>
      ${s ? `<ul class="ds-mon">${mon.map((m) => `<li><button type="button" data-mon="${esc(m.posMa)}" aria-pressed="${m.posMa === THEM.mon}">`
          + `<code>${esc(m.posMa)}</code><span class="ten">${m.ten ? esc(m.ten) : '<span class="text-muted">chưa có tên</span>'}</span>`
          + `<span class="field-hint">${m.tonKho == null ? '' : 'tồn ' + so(m.tonKho)}</span></button></li>`).join('') || '<li class="o-trong">Không món nào khớp.</li>'}</ul>` : ''}

    <div><span class="buoc-ten">③ Marketer phụ trách</span>
      <div class="o-trong">Chưa có nguồn — marketer lấy từ hồ sơ HRM (phiếu LL15). Thêm thị trường không cần bước này.</div>
      <div class="form-actions">${button('Thêm thị trường', { variant: 'primary', size: 'sm', id: 'nutGan', disabled: !THEM.mon })}${button('Huỷ', { size: 'sm', id: 'nutHuy' })}</div>
      <div class="field-hint" id="tbGan"></div>

  $('#khungThem').querySelectorAll('[data-shop]').forEach((b) => { b.onclick = () => { THEM = { shop: b.dataset.shop, mon: null }; veKhungThem(); }; });
  $('#khungThem').querySelectorAll('[data-mon]').forEach((b) => { b.onclick = () => { THEM.mon = b.dataset.mon; veKhungThem(); }; });
  const tim = $('#timMon');
  if (tim) tim.oninput = () => { THEM.tim = tim.value; const vt = tim.selectionStart; veKhungThem(); const t2 = $('#timMon'); t2.focus(); t2.setSelectionRange(vt, vt); };
  $('#nutHuy').onclick = () => { THEM = null; veThiTruong(); };
  if ($('#nutGan')) $('#nutGan').onclick = ganMon;
}
async function ganMon() {
  const nut = $('#nutGan'); nut.disabled = true;
  try {
    await goiGhi('/api/san-pham/goc/' + encodeURIComponent(CHON) + '/mon', { method: 'POST', body: JSON.stringify({ posMa: THEM.mon }) });
    const shop = THEM.shop;
    await taiGoc(); await moSanPham(CHON, 'thi-truong'); TT = shop; veThiTruong();
  } catch (e) { $('#tbGan').textContent = e.message; nut.disabled = false; }
}
async function goMon(posMa, nut) {
  nut.disabled = true;
  try {
    await goiGhi('/api/san-pham/goc/' + encodeURIComponent(CHON) + '/mon/go', { method: 'POST', body: JSON.stringify({ posMa }) });

  } catch (e) { nut.disabled = false; $('#tbSp').innerHTML = canhBao({ level: 'error', title: 'Chưa gỡ được', body: e.message }); }

          ${CT.suaDuoc ? `<td class="actions">${goDuoc(p) ? button('Gỡ', { size: 'sm', variant: 'ghost', data: { goPage: p.id }, title: 'Gỡ page khỏi sản phẩm (page chết / thôi bán) — giữ thị trường và marketer của page' }) : ''}</td>` : ''}</tr>`).join('')}</tbody></table></div>
       <p class="field-hint">Một page bán MỘT sản phẩm ở MỘT thị trường. Sửa kiến thức ở tab Chung là mọi page trên đọc bản mới.</p>`
    : emptyState({ icon: 'inbox', title: 'Chưa page nào bán sản phẩm này',
        body: CT.suaDuoc ? 'Bấm «+ Gắn page»: chọn page và thị trường — page nhận giá của sản phẩm ở thị trường đó và marketer của sản phẩm.'
          : 'Quản trị gắn page vào sản phẩm ở đây.' }));
  if ($('#moGan')) $('#moGan').onclick = () => {

/* ── VE8b · GIÁ Ở MỘT THỊ TRƯỜNG — sửa ngay tại đây (người quyết 30/09) ─────────────────────────────────────────
 * Bậc giá của CHÍNH món POS shop này: bot báo giá và cửa tiền đọc CÙNG bảng này cho mọi page gắn vào sản phẩm ở thị
 * trường này. Lưu = chỉ giá (tên + hết hàng vẫn theo POS), đẩy bản chép sang bot trong cùng lượt. Bảng soạn đọc lại từ ô
 * nhập mỗi lần thêm/bỏ bậc — không giữ bản sao thứ hai của giá trong bộ nhớ.
 */
const chuoi = (v) => (v == null ? '' : String(v));
function dongBac(g, sua) {
  const dis = sua ? '' : ' disabled';
  const o = (k, v, kieu, nhan, lop) => `<td${lop ? ` class="${lop}"` : ''}><input class="cell-input" data-k="${k}" type="${kieu}"`
    + ` value="${esc(chuoi(v))}"${kieu === 'number' ? ' step="any" min="0"' : ''}${dis} aria-label="${nhan}"></td>`;
  const ms = chuoi(g.mienShip === true ? '1' : g.mienShip === false ? '0' : g.mienShip);
  return `<tr data-dong-bac>
    ${o('nhan', g.nhan, 'text', 'Tên bậc')}${o('soLuong', g.soLuong, 'number', 'Số lượng', 'num')}${o('gia', g.gia, 'number', 'Giá', 'num')}
    ${o('tienTe', g.tienTe, 'text', 'Tiền tệ')}${o('giaGoc', g.giaGoc, 'number', 'Giá gốc', 'num')}${o('khuyenMai', g.khuyenMai, 'text', 'Khuyến mãi')}
    ${o('phiShip', g.phiShip, 'number', 'Phí ship', 'num')}
    <td><select data-k="mienShip" aria-label="Miễn ship"${dis}><option value=""${ms === '' ? ' selected' : ''}>chưa khai</option>`
    + `<option value="1"${ms === '1' ? ' selected' : ''}>miễn</option><option value="0"${ms === '0' ? ' selected' : ''}>không miễn</option></select></td>
    <td><input type="checkbox" data-k="bat" aria-label="Bật"${g.bat !== false ? ' checked' : ''}${dis}></td>
    ${sua ? `<td class="actions">${button('Bỏ', { size: 'sm', variant: 'ghost', data: { boBac: '1' } })}</td>` : ''}
  </tr>`;
}
function docBac(khung) {
  return [...khung.querySelectorAll('[data-dong-bac]')].map((tr) => {
    const v = (k) => tr.querySelector(`[data-k="${k}"]`);
    return { nhan: v('nhan').value, soLuong: v('soLuong').value, gia: v('gia').value, tienTe: v('tienTe').value, giaGoc: v('giaGoc').value,
      khuyenMai: v('khuyenMai').value, phiShip: v('phiShip').value, mienShip: v('mienShip').value, bat: v('bat').checked };
  });
}
function veBangGia(khung, ds) {
  khung.querySelector('[data-bac]').innerHTML = ds.map((g) => dongBac(g, CT.suaDuoc)).join('');
  const trong = khung.querySelector('[data-chua-gia]');
  if (trong) trong.hidden = ds.length > 0;
}
function giaMonHtml(t) {
  return t.mon.map((m) => `<div class="duoi-4" data-gia-mon="${esc(m.posMa)}">
    ${t.mon.length > 1 ? `<div class="manh duoi-2">${m.ten ? esc(m.ten) : `<code>${esc(m.posMa)}</code>`}</div>` : ''}
    <div class="table-wrap"><table class="data-table"><thead><tr>
      <th scope="col">Tên bậc</th><th scope="col" class="num">Số lượng</th><th scope="col" class="num">Giá</th><th scope="col">Tiền tệ</th>
      <th scope="col" class="num">Giá gốc</th><th scope="col">Khuyến mãi</th><th scope="col" class="num">Phí ship</th><th scope="col">Miễn ship</th>
      <th scope="col">Bật</th>${CT.suaDuoc ? '<th scope="col" class="actions"><span class="sr-only">Bỏ bậc</span></th>' : ''}
    </tr></thead><tbody data-bac>${m.goiGia.map((g) => dongBac(g, CT.suaDuoc)).join('')}</tbody></table></div>
    <div class="o-trong" data-chua-gia${m.goiGia.length ? ' hidden' : ''}>Chưa có bậc giá — page gắn vào sản phẩm ở thị trường này chưa báo giá được.</div>
    ${CT.suaDuoc ? `<div class="form-actions">${button('+ Thêm bậc', { size: 'sm', data: { themBac: m.posMa } })}`
      + `${button('Lưu giá', { variant: 'primary', size: 'sm', data: { luuGia: m.posMa } })}<span class="field-hint" data-tb-gia aria-live="polite"></span></div>` : ''}
  </div>`).join('');
}
const khungGia = (posMa) => [...$('#thanTab').querySelectorAll('[data-gia-mon]')].find((x) => x.dataset.giaMon === posMa);
function themBac(posMa) {
  const khung = khungGia(posMa);
  const ds = docBac(khung);
  const cuoi = ds[ds.length - 1];
  // Bậc mới chỉ mang tiền tệ + số lượng kế tiếp; ship/ưu đãi để «chưa khai» — chép từ bậc trước là đoán hộ người vận hành.
  ds.push({ nhan: '', soLuong: cuoi ? Number(cuoi.soLuong || 0) + 1 : 1, gia: '', tienTe: cuoi ? cuoi.tienTe : '', giaGoc: '', khuyenMai: '',
    phiShip: '', mienShip: '', bat: true });
  veBangGia(khung, ds);
}
function boBac(nut) {
  const khung = nut.closest('[data-gia-mon]');
  const tr = nut.closest('[data-dong-bac]');
  const dong = [...khung.querySelectorAll('[data-dong-bac]')];
  const ds = docBac(khung).filter((_, i) => dong[i] !== tr);
  veBangGia(khung, ds);
}
async function luuGia(posMa, nut) {
  const khung = khungGia(posMa);
  const t = CT.goc.thiTruong.find((x) => x.mon.some((m) => m.posMa === posMa));
  const m = t.mon.find((x) => x.posMa === posMa);
  const so = (v) => (String(v).trim() === '' ? null : Number(v));
  const offers = docBac(khung).map((g) => ({
    so_luong: Number(g.soLuong), price: Number(g.gia), tien_te: String(g.tienTe || '').trim().toUpperCase(),
    gia_goc: so(g.giaGoc), khuyen_mai: g.khuyenMai, phi_ship: so(g.phiShip),
    mien_ship: g.mienShip === '' ? null : g.mienShip === '1', bat: !!g.bat, nhan: g.nhan,
  }));
  nut.disabled = true;
  try {
    const kq = await goiGhi('/api/san-pham/goc/' + encodeURIComponent(CHON) + '/gia', { method: 'POST',
      body: JSON.stringify({ posMa, version: m.version, offers }) });
    const soPage = kq && kq.dongBo && Array.isArray(kq.dongBo.page) ? kq.dongBo.page.length : 0;
    const shop = t.shopId;
    await moSanPham(CHON, 'thi-truong'); TT = shop; veThiTruong();
    const k2 = khungGia(posMa);
    if (k2) k2.querySelector('[data-tb-gia]').textContent = `Đã lưu ${offers.length} bậc giá · đẩy bản chép sang ${soPage} page.`;

      body: 'Món của shop chưa kéo chưa có ở đây. Gộp bây giờ vẫn được: lượt kéo sau tự nối món cùng SKU của shop mới vào đúng sản phẩm. Bật và kéo ở Cài đặt › Kết nối.' })}</div>` : ''}
    ${d.monChuaSku ? `<div class="duoi-4">${canhBao({ level: 'warning', title: `${so(d.monChuaSku)} món chưa có SKU`,

    ${GOP.suaDuoc ? '' : `<div class="duoi-4">${canhBao({ level: 'info', title: 'Chỉ quản trị gộp', body: 'Đặt tên sản phẩm là đổi thứ bot gọi trước mặt khách — vai của bạn xem được gợi ý.' })}</div>`}

    <label class="field duoi-4"><span class="sr-only">Lọc gợi ý</span><input type="search" id="timGop" placeholder="Lọc theo tên, SKU, mã món…" autocomplete="off"></label>
    <div id="dsGop"></div>`;
  $('#demGop').innerHTML = metricRow([
    { label: 'Shop POS = thị trường', value: so(d.shopTong), statusHtml: statusBadge(d.shopBat ? 'feature_on' : 'feature_off', { label: `${so(d.shopBat)} đang bật` }) },
    { label: 'Shop đã kéo danh mục', value: `${so(d.shopDaKeo)}/${so(d.shopTong)}`, statusHtml: `<span class="meta">${so(d.monPos)} món</span>` },
    { label: 'Món chưa thuộc sản phẩm', value: so(d.monChuaGan) },

  ]);
  $('#timGop').oninput = veDsGop;
  $('#dsGop').onclick = (ev) => {
    const b = ev.target.closest('button');
    if (!b) return;

    : emptyState({ icon: 'inbox', title: GOP.nhom.length ? 'Không nhóm nào khớp' : 'Không còn món POS nào chưa thuộc sản phẩm',
        body: GOP.nhom.length ? '' : 'Mọi món đã kéo về đều thuộc một sản phẩm. Kéo danh mục shop khác ở Cài đặt › Kết nối.' });
}
function veNhom(n, i) {
  const xong = GOP_XONG[n.khoa];

      <tr>${sua ? `<td><input type="checkbox" data-chon="${esc(m.posMa)}" checked aria-label="Chọn món ${esc(m.posMa)}"></td>` : ''}

        <td class="num">${m.tonKho == null ? '<span class="text-muted">—</span>' : so(m.tonKho)}</td></tr>`).join('')}</tbody></table></div>
    ${!sua ? '' : n.loai === 'noi'

      : `<div class="hang tren-3">
          <div class="field"><label class="field-label" for="${id}-ten">Tên sản phẩm</label>
            <input id="${id}-ten" data-ten value="${esc(n.ten || '')}" autocomplete="off"></div>
          <div class="field"><label class="field-label" for="${id}-ma">Mã gốc</label>
            <input id="${id}-ma" data-ma value="${esc(n.maGocDeXuat || '')}" autocomplete="off" spellcheck="false"></div>
          <div class="field"><label class="field-label" for="${id}-mk">Marketer</label>
            <select id="${id}-mk" data-mk><option value="">— gán sau —</option>${(GOP.marketerChon || []).map((m) =>
              `<option value="${esc(m.maNv)}">${esc(m.ten)} · ${esc(m.maNv)}</option>`).join('')}</select></div>
          ${button('Gộp thành 1 sản phẩm', { variant: 'primary', size: 'sm', data: { gop: n.khoa } })}
        </div>
        <div class="field-hint">${n.sku ? `SKU ${esc(n.skuHien || n.sku)} đi theo sản phẩm — shop mới kéo về mang SKU này tự nối vào.` : 'Không có SKU — shop khác phải gắn tay ở tab «Theo thị trường».'} Mã gốc là khoá của kịch bản: đặt rồi không sửa được.</div>`}

}
const theNhom = (khoa) => $('#dsGop').querySelector(`[data-nhom="${khoa}"]`);
const monChon = (the) => [...the.querySelectorAll('[data-chon]')].filter((c) => c.checked).map((c) => c.dataset.chon);
async function gopNhom(khoa, nut) {
  const n = GOP.nhom.find((x) => x.khoa === khoa);
  const the = theNhom(khoa);
  const posMa = monChon(the);
  if (!posMa.length) { the.querySelector('[data-tb]').textContent = 'Chọn ít nhất một món.'; return; }
  nut.disabled = true;
  try {
    const kq = await goiGhi('/api/san-pham/gop', { method: 'POST', body: JSON.stringify({
      maGoc: the.querySelector('[data-ma]').value.trim(), ten: the.querySelector('[data-ten]').value.trim(), sku: n.sku,
      marketerMaNv: the.querySelector('[data-mk]').value, posMa }) });
    GOP_XONG[khoa] = { id: String(kq.goc.id), ten: kq.goc.ten || kq.goc.maGoc };
    await taiGoc(); veDsGop();
  } catch (e) { nut.disabled = false; the.querySelector('[data-tb]').textContent = e.message; }
}
async function noiNhom(khoa, nut) {
  const n = GOP.nhom.find((x) => x.khoa === khoa);
  const the = theNhom(khoa);
  const posMa = monChon(the);
  if (!posMa.length) { the.querySelector('[data-tb]').textContent = 'Chọn ít nhất một món.'; return; }
  nut.disabled = true;
  try {
    for (const m of posMa) {
      await goiGhi('/api/san-pham/goc/' + encodeURIComponent(n.gocId) + '/mon', { method: 'POST', body: JSON.stringify({ posMa: m }) });
    }
    GOP_XONG[khoa] = { id: n.gocId, ten: n.ten || n.maGoc };
    await taiGoc(); veDsGop();
  } catch (e) { nut.disabled = false; the.querySelector('[data-tb]').textContent = e.message; }
}

/* ── PHẢI · CHUYỂN PAGE SANG SẢN PHẨM (tạm, GSP2) ─────────────────────────────── */
async function taiChuyen() {
  if (!GOC || !GOC.suaDuoc) { CHUYEN = null; return; }
  try { CHUYEN = await goi('/api/san-pham/chuyen'); LOI_CHUYEN = ''; }
  catch (e) { CHUYEN = null; LOI_CHUYEN = e.message; }
}
async function veBanSao() {
  CHON = null; giu(null);
  const u = new URL(location.href); u.searchParams.set('xem', 'chuyen');
  history.replaceState(null, '', u.pathname + u.search);
  await taiChuyen(); veTrai(); veChuyen();
}
const tenTrangThaiChuyen = { chua_gan: 'Chưa gắn', cho_doi_soat: 'Chờ đối soát', bo_qua: 'Không chuyển' };
function luaChonChuyen(v) {
  if (!CHON_CHUYEN[v.pageId]) {
    const n = v.goiY[0];
    CHON_CHUYEN[v.pageId] = { shopId: v.shop && v.shop.id || '', goiY: n ? n.posMa : '', gocId: '' };
  }
  return CHON_CHUYEN[v.pageId];
}
function gocChuyen(v, c) {
  if (c.daTao) return c.daTao;
  if (c.gocId) return CHUYEN.gocCuaTeam.find((g) => g.id === c.gocId);
  const n = v.goiY.find((g) => g.posMa === c.goiY);
  return n && (n.goc || n.gocTheoSku);
}
function veChuyen() {
  if (!CHUYEN) {
    $('#phai').innerHTML = emptyState({ icon: 'circle-alert', title: 'Chưa đọc được việc chuyển page',
      body: LOI_CHUYEN || 'Chỉ quản trị chuyển page sang sản phẩm.', actionsHtml: button('Thử lại', { id: 'thuChuyen' }) });
    $('#thuChuyen').onclick = () => veBanSao(); return;
  }
  const d = CHUYEN.dem;
  const ds = CHUYEN.viec.filter((v) => !LOC_CHUYEN || v.trangThai === LOC_CHUYEN);
  $('#phai').innerHTML = `<h2 class="tieu-de-lon">Chuyển page sang sản phẩm</h2>
    <p class="field-hint">Gắn page trước, sau đó đối soát giá và ảnh. Gắn vào món đã có giá vẫn cần đối soát bản sao của page.</p>
    ${metricRow([{ label: 'Chưa gắn', value: so(d.chuaGan) }, { label: 'Chờ đối soát', value: so(d.choDoiSoat) },
      { label: 'Không chuyển', value: so(d.boQua) }, { label: 'Tổng chưa xong', value: so(d.chuaXong) }])}
    <label class="field"><span>Trạng thái</span><select id="locChuyen" name="trangThai">
      <option value="">Tất cả</option>${Object.entries(tenTrangThaiChuyen).map(([k, ten]) =>
        `<option value="${k}"${LOC_CHUYEN === k ? ' selected' : ''}>${ten}</option>`).join('')}</select></label>
    <div id="dsChuyen">${ds.length ? ds.map(theChuyen).join('') : emptyState({ icon: 'check', title: 'Không còn page trong danh sách này' })}</div>`;
  $('#locChuyen').onchange = () => {
    LOC_CHUYEN = $('#locChuyen').value;
    const u = new URL(location.href); if (LOC_CHUYEN) u.searchParams.set('trangThai', LOC_CHUYEN); else u.searchParams.delete('trangThai');
    history.replaceState(null, '', u.pathname + u.search); veChuyen();
  };
  $('#dsChuyen').querySelectorAll('[data-chuyen]').forEach((the) => {
    const id = the.dataset.chuyen;
    const v = CHUYEN.viec.find((x) => x.pageId === id); const c = luaChonChuyen(v);
    if (c.dangGui) the.querySelectorAll('input, select, button').forEach((x) => { x.disabled = true; });
    const shop = the.querySelector('[data-shop]');
    if (shop) shop.onchange = () => { c.shopId = shop.value; };
    const goiY = the.querySelector('[data-goiy]');
    if (goiY) goiY.onchange = () => { c.goiY = goiY.value; c.gocId = ''; veChuyen(); };
    const goc = the.querySelector('[data-goc-tay]');
    if (goc) goc.onchange = () => { c.gocId = goc.value; c.goiY = ''; veChuyen(); };
    const gan = the.querySelector('[data-gan]'); if (gan) gan.onclick = () => ganChuyen(v, the, gan);
    const bo = the.querySelector('[data-boqua]'); if (bo) bo.onclick = () => quyetChuyen(v, the, bo, false);
    const huy = the.querySelector('[data-huy]'); if (huy) huy.onclick = () => quyetChuyen(v, the, huy, true);
    const gop = the.querySelector('[data-gop]'); if (gop) gop.onclick = () => veGop();
    const ds = the.querySelector('[data-doisoat]'); if (ds) ds.onclick = () => moDoiSoat(v);
  });
}
function theChuyen(v) {
  const c = luaChonChuyen(v); const g = gocChuyen(v, c);
  const n = v.goiY.find((x) => x.posMa === c.goiY);
  const moi = !g && n && n.loai === 'moi';

async function ganChuyen(v, the, nut) {

  let g = gocChuyen(v, c);
  const n = v.goiY.find((x) => x.posMa === c.goiY);
  try {
    if (!c.shopId) throw new Error('Chọn shop POS của page trước khi gắn.');
    if (!c.daTao && !c.gocId && n && n.loai === 'noi') {
      await goiGhi('/api/san-pham/goc/' + encodeURIComponent(g.id) + '/mon', { method: 'POST', body: JSON.stringify({ posMa: n.posMa }) });
      c.daTao = g; c.tb = 'Món đã nối vào sản phẩm, chưa gắn page.';
    } else if (!c.daTao && !c.gocId && n && n.loai === 'moi') {
      const ds = await goi('/api/san-pham/gop');
      const nhom = ds.nhom.find((x) => x.mon.some((m) => m.posMa === n.posMa));
      if (!nhom) throw new Error('Gợi ý đã thay đổi; mở Gộp món POS để kiểm tra lại.');
      const kq = await goiGhi('/api/san-pham/gop', { method: 'POST', body: JSON.stringify({
        ten: the.querySelector('[data-ten]').value.trim(), maGoc: the.querySelector('[data-ma]').value.trim(),
        sku: nhom.sku, posMa: nhom.mon.map((m) => m.posMa) }) });
      c.daTao = kq.goc; g = c.daTao; c.tb = 'Sản phẩm đã tạo, chưa gắn page.';
    }
    if (!g) throw new Error('Chọn sản phẩm hoặc một gợi ý phù hợp.');
    await goiGhi('/api/san-pham/goc/' + encodeURIComponent(g.id) + '/page', { method: 'POST',
      body: JSON.stringify({ pageId: v.pageId, shopId: c.shopId }) });

}
async function quyetChuyen(v, the, nut, huy) {

  c.dangGui = true; nut.disabled = true;

      : kc.includes('chua_chon') ? `Page sẽ đổi giá nếu chọn bảng khác giá món (${so(du.pageDonVi.length)})`
      : `Không page nào đổi giá — giá món giữ nguyên (${so(du.pageDonVi.length)} page dùng giá này)`}</h3>
    <ul id="pageDoiGiaDoiSoat">${du.pageDonVi.map((p) => `<li>${esc(p.ten)}${p.marketer ? ' · ' + esc(p.marketer) : ''} · ${p.trangThai === 'xong' ? 'đã xong' : 'chờ đối soát'}</li>`).join('')}</ul>
    <button type="button" class="nut" data-luu-doisoat${d.dangGui || !du.co032 || kc.includes('sai_te') ? ' disabled' : ''}>Đối soát «${esc(g)}» · «${esc(tt)}»</button>
    <p data-tb-doisoat role="status" aria-live="polite">${esc(d.tb)}</p>`;
  $('[data-ve-chuyen]').onclick = () => { DOISOAT = null; veBanSao(); };
  document.querySelectorAll('[data-cap]').forEach((s) => { s.onchange = () => { d.cap[s.dataset.cap] = s.value; d.loi = null; veDoiSoat(); }; });
  document.querySelectorAll('[data-chon]').forEach((s) => { s.onchange = () => { d.chon[s.dataset.chon] = s.value; d.loi = null; veDoiSoat(); }; });
  $('[data-luu-doisoat]').onclick = () => luuDoiSoat();
}
async function luuDoiSoat() {
  const d = DOISOAT; if (!d || d.dangGui || !d.du) return;
  const du = d.du;
  // `dauDonVi`: dấu của ĐÚNG đơn vị đang vẽ — máy chủ so lại, đơn vị đã đổi ⇒ 409 `don_vi_da_doi` kèm đơn vị mới.
  const than = { gocId: d.gocId, shopId: d.shopId, dauDonVi: du.dauDonVi };
  if (du.mon.length > 1) than.cap = du.banSao.filter((b) => !b.daQuyet && d.cap[b.id]).map((b) => ({ banSaoId: b.id, posMa: d.cap[b.id] }));
  const chon = {};
  for (const [posMa, v] of Object.entries(d.chon)) if (v) chon[posMa] = v === 'giu_gia_mon' ? 'giu_gia_mon' : { banSaoId: v.slice(3) };
  if (Object.keys(chon).length) than.chon = chon;
  d.dangGui = true; d.loi = null; d.tb = 'Đang đối soát…'; veDoiSoat();
  // Không dùng `goiGhi`: 409 mang dữ liệu cho người chọn (bảng từng page, page sẽ đổi giá) — phải đọc được thân lỗi.
  const r = await fetch('/api/san-pham/chuyen/doi-soat', { method: 'POST', credentials: 'same-origin',
    headers: { Accept: 'application/json', 'Content-Type': 'application/json' }, body: JSON.stringify(than) }).catch((e) => ({ ok: false, loiMang: e }));
  const j = r.loiMang ? null : await r.json().catch(() => null);
  d.dangGui = false;
  if (!r.ok || !j || j.ok === false) {
    d.loi = { ma: j && j.ma || '', thongDiep: (j && j.thongDiep) || (r.loiMang ? 'Mất kết nối máy chủ.' : 'Máy chủ trả ' + r.status + '.') };
    d.tb = '';
    const doi = d.loi.ma === 'don_vi_da_doi' || d.loi.ma === 'thieu_dau_don_vi';
    if (doi && j.duLieu && j.duLieu.donVi) d.du = j.duLieu.donVi; else await taiDoiSoat();
    // Đơn vị vẽ lại KHÁC đơn vị lúc bấm (máy chủ báo, hoặc tải lại sau một lỗi khác — 502 đẩy hỏng, 409 version… — thấy dấu mới) ⇒ lựa
    // chọn cũ làm trên đơn vị người chưa thấy hết: XOÁ và báo «đơn vị đã đổi». Giữ nó là để lượt bấm sau mang dấu MỚI + chọn CŨ lọt chốt.
    if (doi || (d.du && d.du.dauDonVi !== du.dauDonVi)) {
      d.chon = {};
      if (!doi) d.loi = { ma: 'don_vi_da_doi', thongDiep: d.loi.thongDiep + ' — đơn vị cũng đã đổi trong lúc đó: xem lại các bảng rồi chọn lại.' };
    }
    veDoiSoat(); return;
  }
  const xong = j.daXong ? 'Đơn vị này đã đối soát xong từ trước.'
    : `Đã đối soát «${j.tenGoc || j.maGoc}»: ${(j.pageSangXong || []).length} page sang xong`
      + `${(j.pageDoiGia || []).length ? ' · ' + j.pageDoiGia.length + ' page đổi giá' : ' · không đổi giá'}`
      + ` · ${(j.mon || []).reduce((n, m) => n + (m.anhThem || 0), 0)} ảnh thêm.`;
  DOISOAT = null;
  await taiChuyen(); await taiGoc(); veChuyen();
  $('#phai').insertAdjacentHTML('afterbegin', canhBao({ level: 'success', title: 'Đã đối soát', body: xong }));
}

async function boGoc(id, nut) {
  nut.disabled = true;
  try { await goiGhi('/api/san-pham/goc/' + encodeURIComponent(id), { method: 'DELETE' }); CHON = null; await taiGoc(); moDau(); }
  catch (e) { $('#tbSp').innerHTML = canhBao({ level: 'error', title: 'Chưa bỏ được', body: e.message }); nut.disabled = false; }
}

/* ── NẠP ─────────────────────────────────────────────────────────────────────────────── */
async function taiGoc() {
  try { GOC = await goi('/api/san-pham/goc'); await taiChuyen(); veTrai(); }
  catch (e) { $('#dsGoc').innerHTML = `<li class="o-trong">Không đọc được danh mục sản phẩm gốc: ${esc(e.message)}</li>`; }
}
function moDau() {
  const u = new URL(location.href);
  if (u.searchParams.get('xem') === 'gop') return veGop();
  if (u.searchParams.get('xem') === 'chuyen') { LOC_CHUYEN = u.searchParams.get('trangThai') || ''; return veBanSao(); }
  const sp = u.searchParams.get('sp');
  if (GOC && sp && GOC.goc.some((g) => g.id === sp)) return moSanPham(sp, u.searchParams.get('tab') || 'chung');
  if (GOC && GOC.goc.length) return moSanPham(GOC.goc[0].id);
  if (GOC && GOC.suaDuoc && CHUYEN && CHUYEN.viec.length) return veBanSao();
  $('#phai').innerHTML = emptyState({ icon: 'inbox', title: 'Chưa có sản phẩm gốc nào', body: 'Bấm «+ Thêm» ở cột trái để gộp món POS thành sản phẩm.' });
}
(async () => {
  const [a, b] = await Promise.allSettled([goi('/api/san-pham'), goi('/api/san-pham/goc')]);
  DL = a.status === 'fulfilled' ? a.value : null;
  GOC = b.status === 'fulfilled' ? b.value : null;
  if (!GOC) $('#dsGoc').innerHTML = `<li class="o-trong">Không đọc được danh mục sản phẩm gốc: ${esc(b.reason && b.reason.message || '')}</li>`;
  await taiChuyen();
  veTrai();
  moDau();
})();
$('#tim').addEventListener('input', veTrai);
</script>
<script src="/chung/dieu-huong.js"></script>
</body>
