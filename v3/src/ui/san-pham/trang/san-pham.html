<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sản phẩm &amp; kho — AI Closer</title>
<!-- Dựng trên hệ kiểu. KHÔNG CSS riêng — trước lượt này là 56 dòng. Lưới sản phẩm dùng
     `.thumb-grid` của hệ. Hai luật của màn giữ nguyên: tồn kho ĐỂ TRỐNG chứ không hiện 0
     (chưa có nguồn), và sản phẩm thiếu tên KHÔNG được bịa tên thay. -->
<link rel="stylesheet" href="/chung/kieu.css" data-ds="v3">
<!-- Hàm dựng thành phần (window.UI). ĐỒNG BỘ, KHÔNG `defer`: khung ứng dụng ở cuối trang
     lấy biểu tượng từ đây — `defer` chạy SAU script cuối trang, khung sẽ mất biểu tượng. -->
<script src="/chung/ui.js"></script>
</head>
<body>
<header>
  <h1>Sản phẩm &amp; kho</h1>
  <span class="sub">Thứ bot đang chào bán. Sửa ở tab «Sản phẩm & giá» của từng page — lưu là bot nhận ngay.</span>
</header>

<main>
  <div id="bang-tin" aria-live="polite"></div>
  <div class="page-note" id="ghi-chu-ton"></div>

  <section class="section" aria-label="Tình hình sản phẩm">
    <div id="dem"></div>
  </section>

  <!-- LL13 · 29/09 (CR-28-09c, 01 §6 mới): SẢN PHẨM LÀ LÕI — khối này lên ĐẦU màn. Mỗi sản phẩm: thị trường
       (= shop POS của món đã gắn) · page đang bán · «Thêm thị trường» (gắn một món POS chưa thuộc sản phẩm nào).
       SẢN PHẨM GỐC (bảng 014): danh mục do NGƯỜI định nghĩa, không mang shop, không gắn
       page. Đây là khoá mà biến thể POS của MỌI thị trường nối vào theo SỐ HIỆU — đặt tên
       một lần, shop mở sau tự khớp. -->
  <section class="section table-wrap" aria-labelledby="tieuGoc">
    <div class="table-toolbar"><h2 id="tieuGoc">Sản phẩm</h2>
      <span class="table-count" id="demGoc"></span></div>
    <div id="giaGoc"></div>
    <div id="choGoc"></div>
    <div id="bangGoc"><div class="empty-state"><span class="skeleton"></span></div></div>
    <div class="form-stack" id="khungTaoGoc" hidden>
      <div class="hang">
        <div class="field"><label class="field-label" for="gSo">Số hiệu</label>
          <input id="gSo" inputmode="numeric" autocomplete="off" placeholder="125" size="6"></div>
        <div class="field"><label class="field-label" for="gMa">Mã gốc</label>
          <input id="gMa" autocomplete="off" spellcheck="false" placeholder="fitgum-acai-berry"></div>
        <div class="field"><label class="field-label" for="gTen">Tên</label>
          <input id="gTen" autocomplete="off" placeholder="Fitgum Acai Berry"></div>
        <button type="button" class="btn" data-variant="primary" data-size="sm" id="nutTaoGoc"><span>Tạo</span></button>
      </div>
      <div class="field-hint" id="goiYGoc">Mã gốc là khoá của kịch bản — đặt rồi thì KHÔNG sửa được, chỉ tên và số hiệu sửa được.</div>
    </div>
  </section>

  <section class="section table-wrap" aria-labelledby="tieuDe">
    <div class="table-toolbar"><h2 id="tieuDe">Page có sản phẩm</h2>
      <span class="table-count" id="hSo"></span>
      <span id="nutVe"></span></div>
    <div id="bang"><div class="empty-state"><span class="skeleton"></span></div></div>
  </section>

</main>

<script>
const { esc, icon, statusBadge, button, alert: canhBao, emptyState, metricRow, formatNumber: so } = window.UI;
const $ = (s) => document.querySelector(s);

let DL = null;

async function goi(d) {
  const r = await fetch(d, { credentials: 'same-origin', headers: { Accept: 'application/json' } });
  if (r.status === 401) { location.href = '/dang-nhap?tiep=' + encodeURIComponent(location.pathname); return null; }
  const j = await r.json().catch(() => null);
  if (!r.ok || !j || j.ok === false) throw new Error((j && j.thongDiep) || 'Máy chủ trả ' + r.status + '.');
  return j;
}

function veDem(k) {
  $('#dem').innerHTML = metricRow([
    { label: 'Sản phẩm bot đang bán', value: so(k.tongSanPham) },
    { label: 'Page có sản phẩm', value: `${so(k.coSanPham)}/${so(k.tongPage)}` },
    { label: 'Page không có sản phẩm', value: so(k.khongCoSanPham),
      statusHtml: k.khongCoSanPham ? statusBadge('blocked', { label: 'Bot không chào bán được gì' }) : '' },
    // Tồn kho ĐỂ TRỐNG, không hiện 0 — 0 ở đây đọc ra là «hết hàng», một kết luận sai.
    { label: 'Tồn kho', value: '—', statusHtml: statusBadge('unknown', { label: 'Chưa có nguồn' }) },
  ]);
}

function veBangTin(d) {
  const kh = [];
  $('#bang-tin').innerHTML = kh.length ? `<div class="duoi-5">${kh.join('')}</div>` : '';
  // «Cột tồn kho để trống» không đòi ai làm gì — nó giải thích một ô trống, nên đứng cạnh bảng
  // dưới dạng chú thích chứ không chiếm một hộp cảnh báo (luật 4 · GD4).
  $('#ghi-chu-ton').innerHTML = (d.tonKho && !d.tonKho.co)
    ? `<div>Cột tồn kho để trống chứ không hiện 0. ${esc(d.tonKho.noi)}</div>` : '';
  if (d.nguon) {
    $('#hSo').textContent = `Nguồn: ${d.nguon.ten}`;
  }
}

function veBang(d) {
  $('#nutVe').innerHTML = '';
  $('#tieuDe').textContent = 'Page có sản phẩm';
  const ds = d.page.filter((p) => p.soSanPham > 0);
  $('#hSo').textContent = `${so(ds.length)}/${so(d.dem.tongPage)} page · bấm một dòng để xem sản phẩm`;
  if (!ds.length) {
    $('#bang').innerHTML = emptyState({ icon: 'inbox', title: d.trong ? d.trong.noi : 'Chưa page nào có sản phẩm',
      body: d.trong && d.trong.diTiep ? d.trong.diTiep : '',
      actionsHtml: button('Xem Page còn thiếu gì', { href: '/san-sang', size: 'sm' }) });
    return;
  }
  $('#bang').innerHTML = `<table class="data-table"><thead><tr>
      <th scope="col">Page</th><th scope="col" class="num">Sản phẩm</th><th scope="col">Tồn kho</th>
      <th scope="col">Bot</th><th scope="col">Thị trường</th><th scope="col">Marketer</th>
    </tr></thead><tbody>${ds.map((p) => `
    <tr data-clickable data-id="${esc(p.pageId)}">
      <td><div class="page-identity-name">${esc(p.ten)}</div><div class="page-identity-sub">${esc(p.pageId)}</div></td>
      <td class="num manh">${so(p.soSanPham)}</td>
      <td>${statusBadge('unknown', { label: 'Chưa có nguồn' })}</td>
      <td>${statusBadge(p.botBat ? 'bot_on' : 'bot_off')}</td>
      <td class="meta">${esc(p.thiTruong) || '—'}</td>
      <td>${p.marketer ? esc(p.marketer) : '<span class="text-muted">Chưa gán</span>'}</td>
    </tr>`).join('')}</tbody></table>`;
  $('#bang').querySelectorAll('[data-id]').forEach((n) => { n.onclick = () => moPage(n.dataset.id); });
}

async function moPage(id) {
  $('#bang').innerHTML = '<div class="empty-state"><span class="skeleton"></span></div>';
  try {
    const d = await goi('/api/san-pham/' + encodeURIComponent(id));
    if (!d) return;
    $('#tieuDe').textContent = d.tenPage;
    $('#hSo').textContent = `${so(d.dem.tong)} sản phẩm · ${so(d.dem.tongAnh)} ảnh${d.dem.tienTe.length ? ' · ' + d.dem.tienTe.join(', ') : ''}`;
    $('#nutVe').innerHTML = button('Về danh sách page', { size: 'sm', id: 've' });
    $('#ve').onclick = () => { veBangTin(DL); veBang(DL); };

    if (!d.sanPham.length) {
      $('#bang').innerHTML = emptyState({ icon: 'inbox', title: d.trong.noi, body: d.trong.diTiep });
      return;
    }
    // Sản phẩm THIẾU TÊN: nói ra, và KHÔNG bịa tên thay — bịa một cái tên là làm lỗ này biến
    // mất khỏi màn trong khi khách vẫn thấy nguyên.
    const canh = d.dem.thieuTen
      ? `<div class="duoi-4">${canhBao({ level: 'warning',
          title: `${so(d.dem.thieuTen)}/${so(d.dem.tong)} sản phẩm không có tên`,
          body: 'Bot chào bán được ảnh và giá, nhưng không gọi được tên món hàng. Tên phải lấy từ POS — màn này không bịa tên thay.' })}</div>`
      : '';
    $('#bang').innerHTML = `<div class="an-toan tren-4">${canh}<div class="thumb-grid">${d.sanPham.map((s) => `
      <figure class="thumb">
        ${s.anh.length ? `<img src="${esc(s.anh[0].duong)}" alt="${esc(s.goiLa)}" loading="lazy">`
          : `<div class="thumb-empty" role="img" aria-label="Chưa có ảnh">${icon('inbox')}</div>`}
        <figcaption class="thumb-meta">
          <div class="thumb-name">${s.thieuTen ? `<span class="text-muted">${esc(s.goiLa)}</span>` : esc(s.goiLa)}</div>
          <div class="thumb-sub">mã ${esc(s.ma)}${s.bienThe ? ' · ' + esc(s.bienThe) : ''} · ${so(s.soAnh)} ảnh</div>
          <div class="thumb-sub">${s.bacGia.map((g) => `${esc(g.nhan)}: ${so(g.gia)} ${esc(s.tienTe)}`).join(' · ') || 'Chưa có bậc giá'}</div>
        </figcaption>
      </figure>`).join('')}</div></div>`;
  } catch (e) {
    $('#bang').innerHTML = emptyState({ icon: 'circle-alert', title: 'Không đọc được sản phẩm của page này', body: e.message });
  }
}

/* ── SẢN PHẨM GỐC ────────────────────────────────────────────────────────────────────
 * Hai bảng, một việc: bảng dưới là thứ ĐÃ đặt tên, dãy chip phía trên là số hiệu POS đang
 * CHỜ người đặt tên — con số mà mỗi lượt «Kéo danh mục» in ra rồi bỏ đó. Bấm một chip là
 * điền sẵn số hiệu và tên POS vào ô tạo, để việc còn lại chỉ là đặt mã gốc.
 */
let GOC = null;

async function goiGhi(duong, tuyChon) {
  const r = await fetch(duong, {
    credentials: 'same-origin',
    headers: { Accept: 'application/json', 'Content-Type': 'application/json' },
    ...tuyChon,
  });
  const j = await r.json().catch(() => null);
  if (!r.ok || !j || j.ok === false) throw new Error((j && j.thongDiep) || 'Máy chủ trả ' + r.status + '.');
  return j;
}

function veGoc(d) {
  GOC = d;
  $('#khungTaoGoc').hidden = !d.suaDuoc;
  $('#demGoc').textContent = `${so(d.goc.length)} sản phẩm gốc · ${so(d.cho.length)} số hiệu chờ đặt tên`;

  /* GIÁ: nói thẳng còn bao nhiêu món chưa có bậc giá, và chỉ đúng chỗ nhập.
   * KHÔNG dựng ô nhập giá ở màn này: cửa ghi giá đã có ở màn Vận hành V3 (`saveProduct`),
   * kèm khoá chống đụng lượt đồng bộ POS, kiểm phiên bản, và cờ `cau_hinh_tay` để lượt kéo
   * sau không đè. Dựng cửa thứ hai là đẻ hai bản luật cho một con số — đúng án lệ «cửa RA
   * đúng một cái» mà dự án này đã trả giá. */
  const g = d.gia || { tong: 0, coGia: 0, chuaCoGia: 0, nhapTay: 0 };
  $('#giaGoc').innerHTML = g.tong
    ? `<div class="duoi-4">${canhBao({
        level: g.chuaCoGia ? 'warning' : 'info',
        title: g.chuaCoGia
          ? `${so(g.chuaCoGia)}/${so(g.tong)} sản phẩm chưa có bậc giá nào`
          : `Cả ${so(g.tong)} sản phẩm đều đã có bậc giá`,
        body: g.chuaCoGia
          ? 'Kho hàng gửi về tên và tồn, không gửi giá — giá thật nằm trong từng đơn. Nhập giá '
            + 'tay ở màn Vận hành; lượt kéo danh mục sau không ghi đè giá đã nhập tay.'
          : `${so(g.nhapTay)} sản phẩm đang ở chế độ nhập tay, không bị lượt kéo danh mục ghi đè.`,
        detail: [],
      })}<p><a href="/van-hanh-v3">Mở màn Vận hành V3 để nhập giá và sửa tên sản phẩm →</a></p></div>`
    : '';

  $('#choGoc').innerHTML = d.cho.length
    ? `<div class="duoi-4"><div class="section-header"><div>
         <h3>${so(d.cho.length)} số hiệu chưa có sản phẩm gốc</h3>
         <div class="section-desc">Bấm một số để điền sẵn rồi đặt mã gốc.${d.khongCoSoHieu ? ` ${so(d.khongCoSoHieu)} biến thể không có số hiệu ở đầu tên — phải gõ số vào tên bên kho hàng.` : ''}</div>
       </div></div>
       <div class="chip-list" role="list" aria-label="Số hiệu chờ đặt tên">${d.cho.map((c) => `
         <button type="button" role="listitem" class="btn" data-size="sm" data-cho="${esc(c.soHieu)}"
           title="${esc((c.ten || []).join(' · ') || 'chưa có tên')}">
           ${esc(c.soHieu)} — ${esc((c.ten || [])[0] || 'chưa có tên')}${c.soBienThe > 1 ? ` (${so(c.soBienThe)} biến thể)` : ''}
         </button>`).join('')}</div></div>`
    : '';

  // LL13: sản phẩm là LÕI — mỗi dòng nói bán ở mấy thị trường (shop POS) và mấy page; «Xem» mở thị trường ·
  // món POS · page đang bán, kèm «Thêm thị trường».
  $('#bangGoc').innerHTML = d.goc.length
    ? `<table class="data-table"><thead><tr>
        <th scope="col">Sản phẩm</th><th scope="col" class="num">Số hiệu</th>
        <th scope="col" class="num">Thị trường</th><th scope="col" class="num">Page đang bán</th>
        <th scope="col" class="num">Món POS</th>
        <th scope="col" class="actions"><span class="sr-only">Thao tác</span></th>
      </tr></thead><tbody>${d.goc.map((g) => `
      <tr>
        <td>${g.ten ? esc(g.ten) : '<span class="meta">chưa đặt tên</span>'} <span class="meta tabular">${esc(g.maGoc)}</span></td>
        <td class="num">${g.soHieu ? esc(g.soHieu) : '<span class="meta">chưa gán</span>'}</td>
        <td class="num">${so(g.soThiTruong ?? 0)}</td>
        <td class="num">${so(g.soPage ?? 0)}</td>
        <td class="num">${so(g.soBienThe)}</td>
        <td class="actions">${button('Xem', { size: 'sm', data: { moGoc: g.id } })}${d.suaDuoc
          ? button('Bỏ', { size: 'sm', variant: 'danger', data: { boGoc: g.id },
              title: g.soBienThe ? 'Còn biến thể đang trỏ tới — sẽ bị từ chối' : 'Bỏ sản phẩm gốc này' })
          : ''}</td>
      </tr>
      <tr data-chi-tiet="${esc(g.id)}" hidden><td colspan="6"><div data-ct="${esc(g.id)}"></div></td></tr>`).join('')}</tbody></table>`
    : emptyState({ icon: 'inbox', title: 'Chưa có sản phẩm gốc nào',
        body: 'Biến thể POS chưa nối được vào kịch bản nào cho tới khi có danh mục này.' });

  document.querySelectorAll('[data-cho]').forEach((b) => b.addEventListener('click', () => {
    const c = d.cho.find((x) => x.soHieu === b.dataset.cho) || {};
    $('#gSo').value = c.soHieu || '';
    $('#gTen').value = (c.ten || [])[0] || '';
    $('#gMa').value = ((c.ten || [])[0] || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    $('#gMa').focus();
  }));
  document.querySelectorAll('[data-bo-goc]').forEach((b) => b.addEventListener('click', () => boGoc(b.dataset.boGoc, b)));
  document.querySelectorAll('[data-mo-goc]').forEach((b) => b.addEventListener('click', () => {
    const hang = document.querySelector(`[data-chi-tiet="${CSS.escape(b.dataset.moGoc)}"]`);
    hang.hidden = !hang.hidden;
    if (!hang.hidden) moGoc(b.dataset.moGoc);
  }));
}

/* LL13 · MỘT SẢN PHẨM: thị trường (shop POS) · món · page đang bán · «Thêm thị trường». */
async function moGoc(id) {
  const noi = document.querySelector(`[data-ct="${CSS.escape(id)}"]`);
  noi.innerHTML = '<p class="text-muted">Đang đọc…</p>';
  let d;
  try { d = await goi('/api/san-pham/goc/' + encodeURIComponent(id) + '/chi-tiet'); }
  catch (e) { noi.innerHTML = canhBao({ level: 'warning', title: 'Không đọc được sản phẩm', body: e.message }); return; }
  const g = d.goc;
  const tenPage = new Map(g.page.map((p) => [p.id, p]));
  const thiTruong = g.thiTruong.length
    ? `<ul class="item-list">${g.thiTruong.map((t) => `<li class="item"><div>
        <span class="item-title">${esc(t.thiTruong || 'Shop ' + t.shopId)} <span class="meta">shop ${esc(t.shopId)}</span></span>
        <div class="item-desc">${t.mon.map((m) => `${esc(m.ten || m.posMa)}${m.tonKho == null ? '' : ' · tồn ' + so(m.tonKho)}${m.hetHang ? ' · hết hàng' : ''}`
          + (d.suaDuoc ? ` ${button('Gỡ', { size: 'sm', variant: 'ghost', data: { goMon: m.posMa } })}` : '')).join('<br>')}</div>
        <div class="item-desc">${t.page.length ? 'Page bán: ' + t.page.map((pid) => esc((tenPage.get(pid) || {}).ten || pid)).join(' · ') : 'Chưa page nào bán món này'}</div>
      </div></li>`).join('')}</ul>`
    : emptyState({ icon: 'inbox', title: 'Chưa gắn thị trường nào', body: 'Gắn một món POS của shop nước đó — mỗi shop là một thị trường.' });
  const page = g.page.length
    ? `<ul class="item-list" data-bam>${g.page.map((p) => `<li class="item"><div><a class="lien-ke" href="/page/${esc(p.id)}">${esc(p.ten || p.pageId)}</a>
        <div class="item-desc">${esc(p.qua.includes('mon_pos') ? 'qua món POS đã nối' : '')}${p.qua.includes('ca_page') ? (p.qua.includes('mon_pos') ? ' · ' : '') + 'gán cả page vào sản phẩm' : ''}</div></div></li>`).join('')}</ul>`
    : '<p class="text-muted">Chưa page nào bán sản phẩm này.</p>';
  const nhom = new Map();
  for (const m of d.monChuaGan) {
    const k = m.thiTruong || 'Shop ' + m.shopId;
    if (!nhom.has(k)) nhom.set(k, []);
    nhom.get(k).push(m);
  }
  const them = d.suaDuoc
    ? (d.monChuaGan.length
      ? `<div class="hang"><div class="field"><label class="field-label" for="ttMon-${esc(id)}">Thêm thị trường — món POS chưa thuộc sản phẩm nào</label>
          <select id="ttMon-${esc(id)}">${[...nhom].map(([k, ds]) => `<optgroup label="${esc(k)}">${ds.map((m) =>
            `<option value="${esc(m.posMa)}">${esc(m.ten || m.posMa)}${m.tonKho == null ? '' : ' · tồn ' + so(m.tonKho)}</option>`).join('')}</optgroup>`).join('')}</select></div>
          ${button('Gắn', { size: 'sm', variant: 'primary', data: { ganMon: id } })}</div>
         <div class="field-hint" data-tb-gan></div>`
      : '<p class="field-hint">Mọi món POS đã kéo về đều thuộc một sản phẩm. Kéo danh mục shop khác ở Cài đặt › Kết nối để có thêm thị trường.</p>')
    : '';
  noi.innerHTML = `<div class="section-header"><div><h3>Thị trường · ${so(g.thiTruong.length)}</h3>
      <div class="section-desc">Mỗi shop POS là một thị trường. Giá theo tiền tệ, tồn kho và món đi theo shop.</div></div></div>
    ${thiTruong}${them}
    <div class="section-header"><div><h3>Page đang bán · ${so(g.page.length)}</h3></div></div>${page}`;
  const tb = noi.querySelector('[data-tb-gan]');
  noi.querySelectorAll('[data-gan-mon]').forEach((b) => b.addEventListener('click', async () => {
    b.disabled = true;
    try {
      await goiGhi('/api/san-pham/goc/' + encodeURIComponent(id) + '/mon', { method: 'POST',
        body: JSON.stringify({ posMa: noi.querySelector('select').value }) });
      await taiGoc(); moLai(id);
    } catch (e) { if (tb) tb.textContent = e.message; b.disabled = false; }
  }));
  noi.querySelectorAll('[data-go-mon]').forEach((b) => b.addEventListener('click', async () => {
    b.disabled = true;
    try {
      await goiGhi('/api/san-pham/goc/' + encodeURIComponent(id) + '/mon/go', { method: 'POST',
        body: JSON.stringify({ posMa: b.dataset.goMon }) });
      await taiGoc(); moLai(id);
    } catch (e) { b.disabled = false; noi.insertAdjacentHTML('afterbegin', canhBao({ level: 'danger', title: 'Chưa gỡ được', body: e.message })); }
  }));
}
/* Sau khi ghi, bảng vẽ lại (đóng mọi chi tiết) — mở lại đúng sản phẩm vừa sửa. */
function moLai(id) {
  const hang = document.querySelector(`[data-chi-tiet="${CSS.escape(id)}"]`);
  if (hang) { hang.hidden = false; moGoc(id); }
}

async function taiGoc() {
  try { veGoc(await goi('/api/san-pham/goc')); }
  catch (e) {
    $('#bangGoc').innerHTML = emptyState({ icon: 'circle-alert', title: 'Không đọc được danh mục sản phẩm gốc', body: e.message });
  }
}

async function taoGoc() {
  const nut = $('#nutTaoGoc');
  nut.disabled = true;
  try {
    await goiGhi('/api/san-pham/goc', { method: 'POST', body: JSON.stringify({
      soHieu: $('#gSo').value.trim(), maGoc: $('#gMa').value.trim(), ten: $('#gTen').value.trim(),
    }) });
    for (const o of ['#gSo', '#gMa', '#gTen']) $(o).value = '';
    $('#goiYGoc').textContent = 'Đã tạo. Lượt «Kéo danh mục» kế tiếp sẽ tự nối các biến thể mang số hiệu này.';
    await taiGoc();
  } catch (e) { $('#goiYGoc').textContent = e.message; }
  finally { nut.disabled = false; }
}

async function boGoc(id, nut) {
  nut.disabled = true;
  try { await goiGhi('/api/san-pham/goc/' + encodeURIComponent(id), { method: 'DELETE' }); await taiGoc(); }
  catch (e) { $('#goiYGoc').textContent = e.message; nut.disabled = false; }
}

async function tai() {
  try {
    DL = await goi('/api/san-pham');
    if (!DL) return;
    veBangTin(DL); veDem(DL.dem); veBang(DL);
  } catch (e) {
    $('#dem').innerHTML = '';
    $('#bang-tin').innerHTML = `<div class="duoi-5">${canhBao({ level: 'error', title: 'Không đọc được kho sản phẩm', body: e.message })}</div>`;
    $('#bang').innerHTML = emptyState({ icon: 'circle-alert', title: 'Không tải được', body: 'Tải lại trang; vẫn lỗi thì báo người quản trị hệ thống.' });
  }
}

tai();
taiGoc();
$('#nutTaoGoc').addEventListener('click', taoGoc);
</script>
