<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rủi ro hoàn hàng — AI Closer</title>
<!-- Dựng trên hệ kiểu. KHÔNG CSS riêng — trước lượt này là 43 dòng, gồm bốn mức đậm nhạt tự
     đặt cho ma trận (`z n1 n2 n3 n4`). Màn này ĐỌC cột đã chấm và KHÔNG áp chính sách nào —
     điều đó nay nói bằng một cảnh báo có tiêu đề ở đầu trang, không phải chữ nhỏ cuối bảng. -->
<link rel="stylesheet" href="/chung/kieu.css" data-ds="v3">
<!-- Hàm dựng thành phần (window.UI). ĐỒNG BỘ, KHÔNG `defer`: khung ứng dụng ở cuối trang
     lấy biểu tượng từ đây — `defer` chạy SAU script cuối trang, khung sẽ mất biểu tượng. -->
<script src="/chung/ui.js"></script>
</head>
<body>
<header>
  <h1>Rủi ro hoàn hàng</h1>
  <span class="sub">Phân bố bốn tầng theo lằn ranh đề xuất — chưa phải chính sách, và chưa chặn ai.</span>
</header>

<main>
  <div id="bang-tin" aria-live="polite"></div>

  <section class="section table-wrap" aria-labelledby="tieu-tang">
    <div class="table-toolbar"><h2 id="tieu-tang">Tỉ lệ hoàn theo tầng</h2>
      <span class="table-count" id="demTang"></span></div>
    <div id="bangTang"><div class="empty-state"><span class="skeleton"></span></div></div>
  </section>

  <section class="section table-wrap" aria-labelledby="tieu-mt">
    <div class="table-toolbar"><h2 id="tieu-mt">Cùng tỉ lệ, khác số đơn</h2>
      <span class="table-count">Cột trái là chỗ tỉ lệ chưa có nghĩa</span></div>
    <div id="matTran"></div>
  </section>

  <section class="section" aria-labelledby="tieu-ss">
    <div class="section-header"><h2 id="tieu-ss">Tài liệu nói và đọc được</h2></div>
    <div id="soSanh"></div>
  </section>

  <div class="page-note" id="nguon"></div>
</main>

<script>
const { esc, text, statusBadge, alert: canhBao, emptyState, metricRow, nguonSo, formatNumber } = window.UI;
const $ = (s) => document.querySelector(s);
const d0 = (n) => (n == null ? '—' : formatNumber(n));

async function goi(u) {
  const r = await fetch(u, { credentials: 'same-origin', headers: { Accept: 'application/json' } });
  if (r.status === 401) { location.href = '/dang-nhap?tiep=' + encodeURIComponent(location.pathname); return null; }
  const j = await r.json().catch(() => null);
  if (!r.ok || !j || j.ok === false) throw new Error((j && j.thongDiep) || 'Máy chủ trả ' + r.status + '.');
  return j;
}

function veBangTin(d) {
  const kh = [];
  // Chính sách chưa chốt — nói TRƯỚC khi người ta kịp coi bảng dưới là luật.
  if (d.chinhSach && !d.chinhSach.daChot) {
    kh.push(canhBao({ level: 'info', title: 'Chưa có chính sách nào được áp',
      body: d.chinhSach.noi, detail: [d.chinhSach.chan] }));
  }
  // Cảnh báo trung tâm: tỉ lệ trên một đơn là nhiễu.
  const c = d.canhBaoChuaDuDon;
  if (c) {
    kh.push(canhBao({ level: 'warning', title: 'Tỉ lệ hoàn tính trên một đơn không nói lên điều gì',
      body: c.noi, detail: [c.viSao, c.chuaChamNoi] }));
  }
  if (d.chamTran && d.chamTran.co) kh.push(canhBao({ level: 'warning', title: 'Đã đọc tới trần', body: d.chamTran.noi }));
  $('#bang-tin').innerHTML = kh.length ? `<div class="duoi-5">${kh.join('')}</div>` : '';

  // Lời khai nguồn (luật 8) xuống ô gập ở chân màn: người vận hành đọc bảng, người đi kiểm mở ô.
  if (d.nguon) {
    $('#nguon').innerHTML = nguonSo({
      dong: [
        { ten: 'Tỉ lệ hoàn của khách', tu: `cột ${d.nguon.cot} — do ${d.nguon.job} chấm sẵn, màn không tự tính lại` },
        { ten: 'Đơn nào tính là hoàn', tu: d.nguon.luat.maHoan },
        { ten: 'Mẫu số', tu: d.nguon.luat.mauSo },
        { ten: 'Sàn để được xếp tầng', tu: d.nguon.luat.san },
        { ten: 'Ngưỡng bốn tầng', tu: d.nguon.luat.nguong },
      ],
      chuY: 'Hai màn cùng tự tính là hai con số cho một khách, nên màn này chỉ ĐỌC con số đã chấm.',
    });
  }
  if (d.dem) {
    $('#demTang').textContent = `${d0(d.dem.soDaCham)}/${d0(d.dem.soKhachDoc)} khách đã chấm · ${d0(d.dem.soChuaCham)} chưa chấm`;
  }
}

function veTang(ds) {
  $('#bangTang').innerHTML = `<table class="data-table"><thead><tr>
      <th scope="col">Tầng</th><th scope="col" class="num">Khách</th><th scope="col" class="num">Đơn đã kết</th>
      <th scope="col" class="num">Đơn hoàn</th><th scope="col">Xếp tầng được?</th>
    </tr></thead><tbody>${ds.map((r) => `
    <tr>
      <td class="manh">${esc(r.ten)}</td>
      <td class="num manh">${d0(r.soKhach)}</td>
      <td class="num">${d0(r.soDonKet)}</td>
      <td class="num">${d0(r.soDonHoan)}</td>
      <td>${r.xepTang ? statusBadge('ready', { label: 'Có' }) : statusBadge('unknown', { label: 'Chưa đủ đơn' })}</td>
    </tr>`).join('')}</tbody></table>
    <div class="table-note">Hàng đầu KHÔNG phải một tầng: đó là nhãn vắng mặt cho người chưa đủ đơn đã kết để một tỉ lệ nói lên điều gì.</div>`;
}

function veMatTran(ds) {
  // Khối rỗng KHÔNG để trắng: một tiêu đề không có gì dưới nó đọc như màn đang hỏng.
  if (!ds || !ds.length) {
    $('#matTran').innerHTML = emptyState({ icon: 'inbox', title: 'Chưa có khách nào để xếp',
      body: 'Bảng này chỉ có nghĩa khi job chấm tỉ lệ hoàn đã chạy.' });
    return;
  }
  const cot = ds[0].o;
  $('#matTran').innerHTML = `<table class="data-table"><thead><tr>
      <th scope="col">Tầng</th>${cot.map((c) => `<th scope="col" class="num">${esc(c.ten)}</th>`).join('')}
    </tr></thead><tbody>${ds.map((r) => `
    <tr><td class="manh">${esc(r.ten.split('—')[0].trim())}</td>
      ${r.o.map((o) => `<td class="num"${o.ma === 'd0' ? ' title="Tỉ lệ trên 0–1 đơn là nhiễu, không phải tín hiệu"' : ''}>${
        o.so === 0 ? '<span class="text-muted">0</span>' : `<span class="manh">${d0(o.so)}</span>`}</td>`).join('')}
    </tr>`).join('')}</tbody></table>
    <div class="table-note">Cột «0–1 đơn kết» là chỗ tỉ lệ chưa có nghĩa — luật giữ khách ở nhãn «chưa đủ đơn» thay vì xếp tầng.</div>`;
}

function veSoSanh(s) {
  $('#soSanh').innerHTML = metricRow([
    { label: 'Tài liệu nói (đo 23/08)', value: d0(s.taiLieuNoi), hint: 'Ước trên 4,2% dân số' },
    { label: 'Đọc từ cột đã chấm', value: d0(s.doDuoc), hint: 'Toàn bộ khách của team' },
  ]) + `<div class="page-note">${text(s.viSaoKhac)}</div>`;
}

async function tai() {
  try {
    const d = await goi('/api/rui-ro-hoan');
    if (!d) return;
    veBangTin(d);
    if (!d.theoTang || !d.dem.soDaCham) {
      $('#bangTang').innerHTML = emptyState({ icon: 'triangle-alert',
        title: d.trong ? d.trong.noi.replace(/`/g, '') : 'Chưa có khách nào được chấm',
        body: d.trong ? d.trong.diTiep.replace(/`/g, '') : '' });
      veMatTran(null);
      if (d.soLieu) veSoSanh(d.soLieu);
      return;
    }
    veTang(d.theoTang);
    veMatTran(d.theoSoDon);
    veSoSanh(d.soLieu);
  } catch (e) {
    $('#bang-tin').innerHTML = `<div class="duoi-5">${canhBao({ level: 'error', title: 'Không đọc được rủi ro hoàn', body: e.message })}</div>`;
    $('#bangTang').innerHTML = emptyState({ icon: 'circle-alert', title: 'Không tải được', body: 'Kiểm kết nối rồi tải lại trang.' });
  }
}

tai();
</script>
<script src="/chung/dieu-huong.js"></script>
</body>
</html>
