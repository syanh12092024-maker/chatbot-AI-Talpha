<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#ffffff">
<title>Trang của một page — AI Closer</title>
<!-- KHÔNG một dòng CSS riêng: trọn hệ kiểu `chung/kieu.css` + `chung/ui.js`. -->
<link rel="stylesheet" href="/chung/kieu.css" data-ds="v3">
<script src="/chung/ui.js"></script>
</head>
<body>
<header>
  <h1 id="tieu">Đang mở…</h1>
  <span class="sub" id="phu"></span>
</header>

<main>
  <div id="bang-tin" aria-live="polite"></div>

  <!-- CÀI ĐẶT MỘT PAGE NẰM TRONG MỘT MÀN. Trước lượt này mỗi việc là một màn khác: đổi thị
       trường ở bảng danh sách, xem sản phẩm ở màn Sản phẩm & kho, xem kịch bản ở màn Kịch
       bản — bốn lần rời trang cho một lần cài một page. -->
  <div class="tabs" role="tablist" aria-label="Phần của page" id="thanhTab"></div>

  <div id="tab-tinh-trang" role="tabpanel">
    <section aria-labelledby="t-bot">
      <h2 id="t-bot">Bot có đang trả lời page này không</h2>
      <div id="khoi-bot"></div>
    </section>

    <section aria-labelledby="t-thieu">
      <h2 id="t-thieu">Còn thiếu gì để lên chạy</h2>
      <div id="khoi-thieu"></div>
    </section>

    <section aria-labelledby="t-tiep">
      <h2 id="t-tiep">Hai công cụ riêng cho page này</h2>
      <div id="khoi-tiep" role="list"></div>
    </section>
  </div>

  <div id="tab-thiet-lap" role="tabpanel" hidden></div>
  <div id="tab-san-pham" role="tabpanel" hidden></div>
  <div id="tab-kich-ban" role="tabpanel" hidden></div>

  <div id="nguon-so"></div>
  <p><a href="/page-bot">← Về danh sách page</a></p>
</main>

<script>
const { esc, statusBadge, button, alert: canhBao, emptyState, toast, confirmDialog, nguonSo } = window.UI;
const $ = (s) => document.querySelector(s);

// Id của page lấy từ chính đường dẫn — trang này luôn mở bằng /page/<id>.
const ID = decodeURIComponent((location.pathname.split('/').filter(Boolean)[1] || ''));

let D = null;

async function goi(duong, tuyChon) {
  const r = await fetch(duong, { credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' }, ...tuyChon });
  let d = null;
  try { d = await r.json(); } catch { /* null */ }
  if (!r.ok || !d || d.ok === false) throw new Error((d && d.thongDiep) || ('Máy chủ trả ' + r.status + '.'));
  return d;
}

function baoLoi(tieuDe, than) {
  $('#bang-tin').innerHTML = `<div class="duoi-4">${canhBao({ level: 'error', title: tieuDe, body: than })}</div>`;
}

/* ── KHỐI «BOT CÓ TRẢ LỜI KHÔNG» ────────────────────────────────────────────────────
   Ba câu, theo đúng thứ tự người ta hỏi: page thuộc con bot nào · con bot ấy đang bật hay
   tắt · nếu hai nguồn nói khác nhau thì nói ra chứ đừng chọn một cái. */
function veBot() {
  const { chuBot, bot, page } = D;
  const laMoi = chuBot.la === 'moi';
  const o = $('#khoi-bot');

  const doiChu = (chuBot.cauDao.mo && D.suaDuoc)
    ? button(laMoi ? 'Trả về bot cũ' : 'Giao sang bot mới',
        { size: 'sm', variant: 'outline', data: { giao: laMoi ? 'cu' : 'moi' } })
    : '';

  // Đèn công tắc đọc NGUỒN THẬT (tiến trình bot). Chưa đọc được thì nói chưa đọc được —
  // một ô trống trông y hệt «đang tắt», mà hai câu ấy khác hẳn nhau.
  const dangBat = bot.theoBot === null ? null : bot.theoBot;
  const huy = dangBat === null
    ? statusBadge('unknown', { label: 'Chưa đọc được' })
    : dangBat ? statusBadge('ready', { label: 'Đang trả lời khách' })
              : statusBadge('blocked', { label: 'Đang tắt' });

  const nutBat = D.suaDuoc && dangBat !== null
    ? button(dangBat ? 'Tắt bot cho page này' : 'Bật bot cho page này',
        { size: 'sm', variant: dangBat ? 'outline' : 'primary', data: { bat: dangBat ? '0' : '1' } })
    : '';

  const lech = bot.lech
    ? `<p class="meta">Hai nguồn đang nói khác nhau: tiến trình bot bảo
       <b>${bot.theoBot ? 'đang bật' : 'đang tắt'}</b>, còn bản sao trong cơ sở dữ liệu ghi
       <b>${bot.theoCsdl ? 'đang bật' : 'đang tắt'}</b>. Con số đúng là con số của tiến trình bot.</p>`
    : '';

  o.innerHTML = `
    <div class="panel">
      <div class="setting-row">
        <div><b>Bot phụ trách</b></div>
        <div>${laMoi ? 'bot mới' : 'bot cũ'} ${doiChu}</div>
      </div>
      <div class="setting-row">
        <div><b>Công tắc</b></div>
        <div>${huy} ${nutBat}</div>
      </div>
      ${lech}
      ${!D.cuaBot.mo ? `<p class="meta">Cửa ghi sang tiến trình bot đang đóng, nên các nút trên
        không bấm được: ${esc((D.cuaBot.thieu || []).join(' · '))}.</p>` : ''}
    </div>
`;

  const nb = o.querySelector('[data-bat]');
  if (nb) nb.addEventListener('click', () => gatBot(nb.dataset.bat === '1'));
  const ng = o.querySelector('[data-giao]');
  if (ng) ng.addEventListener('click', () => doiChuBot(ng.dataset.giao === 'moi'));
}

/* ── KHỐI «CÒN THIẾU GÌ» ───────────────────────────────────────────────────────────── */
function veThieu() {
  const t = D.tinhTrang;
  const o = $('#khoi-thieu');

  if (t.chuaDoDuoc) {
    o.innerHTML = '<div class="panel">' + canhBao({
      level: 'warning',
      title: 'Chưa đọc được tình trạng của page này',
      body: (t.viSaoKhongDoc || '') + ' — chưa đọc được KHÔNG có nghĩa là page không thiếu gì.',
    }) + '</div>';
    return;
  }
  if (t.san) {
    o.innerHTML = '<div class="panel">' + emptyState({
      icon: 'circle-check',
      title: 'Đủ điều kiện để bật bot',
      body: t.nhac.length ? `${t.nhac.length} việc nên làm thêm, xem bên dưới.` : 'Không còn việc nào chặn.',
    }) + '</div>';
  }

  const mot = (d) => `
    <li class="panel">
      <div><b>${esc(d.nhan)}</b> ${d.chan ? statusBadge('blocked', { label: 'Đang chặn' })
        : statusBadge('needs_attention', { label: 'Nên làm' })}
        ${d.la ? statusBadge('unknown', { label: 'Chưa có trong bảng từ' }) : ''}</div>
      <div>${esc(d.ten)}${d.chiTiet ? ' — ' + esc(d.chiTiet) : ''}</div>
      ${d.lam ? `<div class="meta">${esc(d.lam)}</div>` : ''}
      ${d.di ? `<div class="duoi-2">${button(d.nutDi || 'Đi sửa', { size: 'sm', href: d.di })}</div>` : ''}
    </li>`;

  const ds = [...t.chan, ...t.nhac];
  if (ds.length) {
    o.innerHTML += `<ul role="list" class="danh-sach-moc">${ds.map(mot).join('')}</ul>`;
  }
}

function veTiep() {
  $('#khoi-tiep').innerHTML = `<div class="panel">${D.diTiep
    .map((x) => `<span role="listitem">${button(x.chu, { size: 'sm', href: x.duong })}</span>`)
    .join(' ')}</div>`;
}

/* ── GHI · hai nút, và cả hai dùng đúng cửa đã có của màn danh sách ─────────────────── */
async function gatBot(bat) {
  const dongY = await confirmDialog({
    title: `${bat ? 'Bật' : 'Tắt'} bot cho «${D.page.ten}»?`,
    body: bat ? 'Bot sẽ bắt đầu tự trả lời khách thật của page này.'
              : 'Bot sẽ ngừng trả lời. Khách của page này phải có người trực.',
    confirmLabel: bat ? 'Bật bot' : 'Tắt bot',
    danger: !bat,
  });
  if (!dongY) return;
  try {
    const kq = await goi(`/api/page-bot/${encodeURIComponent(ID)}/bot`,
      { method: 'POST', body: JSON.stringify({ bat }) });
    toast(`Đã ${kq.botAiBat ? 'bật' : 'tắt'} bot cho «${D.page.ten}».`);
    await nap();
  } catch (e) { baoLoi('Không đổi được trạng thái bot', e.message); }
}

async function doiChuBot(sangMoi) {
  const dongY = await confirmDialog({
    title: sangMoi ? `Giao «${D.page.ten}» sang bot mới?` : `Trả «${D.page.ten}» về bot cũ?`,
    body: sangMoi
      ? 'Bot cũ sẽ được TẮT cho page này trước, và chỉ khi nó xác nhận đã tắt thì page mới '
        + 'đổi chủ. Sau đó chưa con bot nào trả lời page này cho tới khi bạn bấm Bật.'
      : 'Bot mới buông page này. Bot cũ vẫn đang TẮT — bấm Bật nếu muốn nó trả lời lại.',
    confirmLabel: sangMoi ? 'Giao sang bot mới' : 'Trả về bot cũ',
    danger: true,
  });
  if (!dongY) return;
  try {
    const kq = await goi(`/api/page-bot/${encodeURIComponent(ID)}/giao`,
      { method: 'POST', body: JSON.stringify({ giao: sangMoi }) });
    toast(kq.buocTiep || 'Đã đổi chủ page.');
    await nap();
  } catch (e) { baoLoi('Không đổi chủ được page này', e.message); }
}

/* ── TAB ─────────────────────────────────────────────────────────────────────────────
   Tab nằm trong ĐƯỜNG DẪN (`?tab=`) — chia sẻ được, F5 không mất chỗ đang xem. */
const TAB = [
  ['tinh-trang', 'Tình trạng'],
  ['thiet-lap', 'Thiết lập'],
  ['san-pham', 'Sản phẩm & giá'],
  ['kich-ban', 'Kịch bản'],
];
let dangO = new URLSearchParams(location.search).get('tab') || 'tinh-trang';
if (!TAB.some(([m]) => m === dangO)) dangO = 'tinh-trang';
let daDocNoiDung = null;

function veTab() {
  $('#thanhTab').innerHTML = TAB.map(([ma, chu]) =>
    `<button type="button" class="tab" role="tab" data-tab="${ma}" aria-selected="${ma === dangO}">${esc(chu)}</button>`).join('');
  for (const [ma] of TAB) $(`#tab-${ma}`).hidden = ma !== dangO;
  document.querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', () => {
    dangO = b.dataset.tab;
    const u = new URL(location.href);
    u.searchParams.set('tab', dangO);
    history.replaceState(null, '', u);
    veTab();
    if (dangO === 'san-pham' || dangO === 'kich-ban') veNoiDung();
  }));
}

/* ── TAB «THIẾT LẬP» — sửa ngay tại chỗ, qua đúng những cửa ghi đã có ──────────────── */
function veThietLap() {
  const t = D.thietLap;
  const khoa = D.suaDuoc ? '' : 'disabled';
  const chonGoc = !t.danhMucGoc.co
    ? '<span class="meta">Chưa áp bản cập nhật cơ sở dữ liệu cho danh mục sản phẩm gốc.</span>'
    : `<select id="oGoc" ${khoa}>
         <option value="">— chưa gán —</option>
         ${t.danhMucGoc.ds.map((g) => `<option value="${esc(g.maGoc)}" ${g.maGoc === t.sanPhamGocMa ? 'selected' : ''}>${esc(g.ten)}</option>`).join('')}
       </select>`;

  $('#tab-thiet-lap').innerHTML = `
    <div class="panel">
      <div class="setting-row">
        <div><label for="oTt"><b>Thị trường</b></label><div class="meta">Tầng «nước» của cây kịch bản ba tầng.</div></div>
        <div><input id="oTt" type="text" value="${esc(t.thiTruong)}" placeholder="Chưa có" ${khoa}></div>
      </div>
      <div class="setting-row">
        <div><label for="oNh"><b>Ngành hàng</b></label></div>
        <div><input id="oNh" type="text" value="${esc(t.nganhHang)}" placeholder="Chưa có" ${khoa}></div>
      </div>
      <div class="setting-row">
        <div><label for="oGoc"><b>Sản phẩm gốc</b></label><div class="meta">Page này bán món nào — khoá của tầng kịch bản.</div></div>
        <div>${chonGoc}</div>
      </div>
      <div class="setting-row">
        <div><label for="oTd"><b>Page trọng điểm</b></label></div>
        <div><label class="switch"><input id="oTd" type="checkbox" role="switch" ${t.trongDiem ? 'checked' : ''} ${khoa}><span>${t.trongDiem ? 'Có' : 'Không'}</span></label></div>
      </div>
      <div class="setting-row">
        <div><label for="oBc"><b>Đã tắt Botcake</b></label><div class="meta">LỜI KHAI, không phải công tắc: đánh dấu ở đây KHÔNG tắt Botcake.</div></div>
        <div><label class="switch"><input id="oBc" type="checkbox" role="switch" ${t.botcakeTat ? 'checked' : ''} ${khoa}><span>${t.botcakeTat ? 'Đã tắt' : 'Chưa'}</span></label></div>
      </div>
      ${D.suaDuoc ? '' : '<p class="meta">Cần vai Quản trị để sửa.</p>'}
    </div>`;

  if (!D.suaDuoc) return;
  const luu = async (duong, than, ten) => {
    try {
      await goi(`/api/page-bot/${encodeURIComponent(ID)}/${duong}`, { method: 'POST', body: JSON.stringify(than) });
      toast(`Đã lưu ${ten}.`);
      await nap();
    } catch (e) { baoLoi(`Không lưu được ${ten}`, e.message); }
  };
  const oTt = $('#oTt'); const oNh = $('#oNh');
  oTt.addEventListener('blur', () => { if (oTt.value !== D.thietLap.thiTruong) luu('thi-truong', { thiTruong: oTt.value }, 'thị trường'); });
  oNh.addEventListener('blur', () => { if (oNh.value !== D.thietLap.nganhHang) luu('nganh-hang', { nganhHang: oNh.value }, 'ngành hàng'); });
  for (const o of [oTt, oNh]) o.addEventListener('keydown', (e) => { if (e.key === 'Enter') o.blur(); });
  const oGoc = $('#oGoc');
  if (oGoc) oGoc.addEventListener('change', () => luu('san-pham-goc', { maGoc: oGoc.value || null }, 'sản phẩm gốc'));
  $('#oTd').addEventListener('change', (e) => luu('trong-diem', { bat: e.target.checked }, 'cờ trọng điểm'));
  $('#oBc').addEventListener('change', (e) => luu('botcake', { bat: e.target.checked }, 'lời khai Botcake'));
}

/* ── TAB «SẢN PHẨM & GIÁ» và «KỊCH BẢN» — CHỈ ĐỌC, cùng bộ đọc với đường ráp prompt ── */
async function veNoiDung() {
  const oSp = $('#tab-san-pham'); const oKb = $('#tab-kich-ban');
  if (!daDocNoiDung) {
    oSp.innerHTML = oKb.innerHTML = '<div class="panel"><p class="meta">Đang đọc…</p></div>';
    try { daDocNoiDung = await goi(`/api/page/${encodeURIComponent(ID)}/noi-dung`); }
    catch (e) {
      oSp.innerHTML = oKb.innerHTML = `<div class="panel">${canhBao({ level: 'error',
        title: 'Không đọc được nội dung của page', body: e.message })}</div>`;
      return;
    }
  }
  const d = daDocNoiDung;
  if (d.chuaNoi) {
    const c = `<div class="panel">${canhBao({ level: 'warning',
      title: 'Máy chủ chưa nối bộ đọc', body: d.viSao })}</div>`;
    oSp.innerHTML = oKb.innerHTML = c;
    return;
  }

  const sp = Array.isArray(d.sanPham) ? d.sanPham : [];
  oSp.innerHTML = `<div class="panel">
    ${sp.length ? `<table class="data-table"><thead><tr><th scope="col">Sản phẩm</th><th scope="col">Bậc giá</th></tr></thead>
      <tbody>${sp.map((x) => `<tr><td>${esc(x.ten || x.ma || x.so_hieu || '(chưa có tên)')}</td>
        <td class="meta">${esc((x.goiGia || x.goi_gia || []).map((g) => `${g.so_luong ?? g.soLuong ?? '?'} → ${g.gia ?? '?'} ${g.tien_te ?? g.tienTe ?? ''}`).join(' · ') || 'chưa có giá')}</td></tr>`).join('')}</tbody></table>`
      : emptyState({ icon: 'inbox', title: 'Page này chưa có sản phẩm nào kèm giá',
          body: 'Bot không chào bán được món nào cho tới khi có. Sửa ở màn «Sản phẩm & kho».' })}
    <p class="duoi-4">${button('Mở màn Sản phẩm & kho để sửa', { size: 'sm', href: '/san-pham' })}</p>
  </div>`;

  const kb = d.kichBan;
  const chu = typeof kb === 'string' ? kb : (kb?.noi_dung || kb?.noiDung || '');
  oKb.innerHTML = `<div class="panel">
    ${chu ? `<pre class="khoi-chu">${esc(chu)}</pre>`
      : emptyState({ icon: 'inbox', title: 'Page này chưa có kịch bản đang chạy',
          body: 'Bot nói chuyện với khách mà không có hướng dẫn nào về giọng điệu hay cách bán.' })}
    <p class="duoi-4">${button('Mở màn Kịch bản để sửa', { size: 'sm', href: '/kich-ban' })}</p>
  </div>`;
}

async function nap() {
  try {
    D = await goi(`/api/page/${encodeURIComponent(ID)}`);
  } catch (e) {
    $('#tieu').textContent = 'Không mở được page này';
    baoLoi('Không mở được page này', e.message);
    return;
  }
  $('#bang-tin').innerHTML = '';
  $('#tieu').textContent = D.page.ten;
  $('#phu').textContent = [D.page.pageId, D.page.thiTruong, D.page.nganhHang,
    D.page.marketer ? `phụ trách: ${D.page.marketer}` : ''].filter(Boolean).join(' · ');
  document.title = `${D.page.ten} — AI Closer`;
  veTab();
  veBot();
  veThieu();
  veTiep();
  veThietLap();
  if (dangO === 'san-pham' || dangO === 'kich-ban') veNoiDung();
  $('#nguon-so').innerHTML = nguonSo({ dong: [
    { ten: 'Công tắc bot', tu: 'RAM tiến trình bot (cửa kiểm `/readiness`) — nguồn thật' },
    { ten: 'Bản sao đối chiếu', tu: 'cột `page.bot_ai_bat` trong cơ sở dữ liệu v3' },
    { ten: 'Bot phụ trách', tu: 'cột `page.giao_bot_moi` khi cầu dao mở, ngược lại là danh sách trong cấu hình máy chủ' },
  ] });
}

nap();
</script>
<script src="/chung/dieu-huong.js"></script>
</body>
</html>
