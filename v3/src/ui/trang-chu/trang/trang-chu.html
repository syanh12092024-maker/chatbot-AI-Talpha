<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Việc của tôi — AI Closer</title>
<!-- Dựng trên hệ kiểu (mục M1 của bản đặc tả: «việc cần để ý trước, số liệu sau»). KHÔNG CSS
     riêng. Trước lượt này màn có 50 dòng CSS dựng mỗi việc thành một thẻ viền trái màu, và
     tô «đã xong» cùng cỡ chữ, cùng chỗ đứng với «5 việc đang cần bạn» — mắt phải đọc từng thẻ
     mới biết thẻ nào cần làm. Nay việc được XẾP NHÓM theo trạng thái: cần xử lý · chưa đọc
     được · đã ổn. Nhóm nói trạng thái, hàng chỉ nói việc. -->
<link rel="stylesheet" href="/chung/kieu.css" data-ds="v3">
<!-- Hàm dựng thành phần (window.UI). ĐỒNG BỘ, KHÔNG `defer`: khung ứng dụng ở cuối trang
     lấy biểu tượng từ đây — `defer` chạy SAU script cuối trang, khung sẽ mất biểu tượng. -->
<script src="/chung/ui.js"></script>
</head>
<body>
<header>
  <h1>Việc của tôi</h1>
  <span class="sub" id="hTeam">Việc theo vai của bạn, việc gấp xếp lên đầu.</span>
</header>

<main>
  <div id="bang-tin" aria-live="polite"></div>
  <div id="ds"><div class="item-list" aria-busy="true">
    <div class="item"><div><span class="skeleton"></span></div></div>
    <div class="item"><div><span class="skeleton"></span></div></div>
    <div class="item"><div><span class="skeleton"></span></div></div>
  </div></div>
  <div class="page-note" id="chan"></div>
</main>

<script>
const { esc, text, statusBadge, button, alert: canhBao, emptyState, formatNumber: so, roleName } = window.UI;
const $ = (s) => document.querySelector(s);

// Ba nhóm, và chúng KHÁC NHAU (xem khối chú thích đầu `kho-trang-chu.js`):
//   gap  — có việc thật, có chỗ bấm sang
//   chua — chưa đọc được / bảng chưa nạp: KHÔNG hiện số 0 (0 ở đây là tin mừng giả)
//   on   — có nguồn, đếm được, và đúng là 0
function nhomCua(v) {
  if (v.gap) return 'gap';
  const chuaBiet = v.so === null || (v.so === 0 && v.viRong !== 'xong');
  return chuaBiet ? 'chua' : 'on';
}

function tieuDe(v) {
  const tong = v.tong != null ? ` <span class="meta">/ ${so(v.tong)} ${esc(v.donVi || 'page')}</span>` : '';
  return `<div class="item-title">${esc(v.ten)}${tong}</div>`;
}

let _chinhDaDung = false;
function veHang(v, nhom) {
  if (nhom === 'gap') {
    // Mục H1: tối đa MỘT nút chính trên vùng nhìn — việc gấp nhất.
    const bien = _chinhDaDung ? 'outline' : 'primary';
    _chinhDaDung = true;
    const duoi = v.di
      ? button('Xem và xử lý', { href: v.di, size: 'sm', variant: bien })
      : `<span>${esc(v.chuaCoMan || 'Chưa có màn để xử lý')}</span>`;
    return `<li class="item">
      <div class="item-lead">${so(v.so)}</div>
      <div>${tieuDe(v)}<div class="item-desc">${esc(v.lam)}</div></div>
      <div class="item-trail">${duoi}</div>
    </li>`;
  }
  if (nhom === 'chua') {
    return `<li class="item">
      <div class="item-lead" data-muted><span aria-hidden="true">—</span><span class="sr-only">chưa biết</span></div>
      <div>${tieuDe(v)}<div class="item-desc">${esc(v.lam)}</div>
        ${v.noiRong ? `<div class="item-detail">${text(v.noiRong)}</div>` : ''}
        ${v.diTiepRong ? `<div class="item-detail"><b>Cách xử lý:</b> ${text(v.diTiepRong)}</div>` : ''}
      </div>
      <div class="item-trail">${statusBadge(v.viRong === 'chua-co-bang' ? 'feature_unavailable' : 'unknown',
        { label: v.viRong === 'chua-co-bang' ? 'Chưa có bảng' : 'Chưa có dữ liệu' })}</div>
    </li>`;
  }
  return `<li class="item">
    <div class="item-lead" data-muted>${so(v.so)}</div>
    <div>${tieuDe(v)}<div class="item-desc">${text(v.noiRong || v.lam)}</div></div>
    <div class="item-trail">${v.di ? button('Mở', { href: v.di, size: 'sm', variant: 'ghost' }) : ''}</div>
  </li>`;
}

function veNhom(tieu, moTa, huyHieu, ds, nhom) {
  if (!ds.length) return '';
  return `<section class="section" aria-label="${esc(tieu)}">
    <div class="section-header"><div><h2>${esc(tieu)}</h2>${moTa ? `<div class="section-desc">${esc(moTa)}</div>` : ''}</div>${huyHieu}</div>
    <ul class="item-list">${ds.map((v) => veHang(v, nhom)).join('')}</ul>
  </section>`;
}

async function tai() {
  try {
    const r = await fetch('/api/trang-chu', { credentials: 'same-origin', headers: { Accept: 'application/json' } });
    if (r.status === 401) { location.href = '/dang-nhap?tiep=' + encodeURIComponent(location.pathname); return; }
    const d = await r.json();
    if (!r.ok || d.ok === false) throw new Error(d.thongDiep || 'Máy chủ trả ' + r.status + '.');

    const vai = (d.vai || []).map(roleName).join(', ') || 'chưa có vai';
    $('#hTeam').textContent = d.soGap
      ? `${so(d.soGap)} việc đang cần bạn · theo vai ${vai}`
      : `Không có việc nào gấp · theo vai ${vai}`;

    if (!d.viec.length) {
      $('#ds').innerHTML = emptyState({
        icon: 'inbox',
        title: d.trong ? d.trong.noi : 'Không có việc nào',
        body: d.trong ? d.trong.diTiep : '',
      });
    } else {
      const nhom = { gap: [], chua: [], on: [] };
      for (const v of d.viec) nhom[nhomCua(v)].push(v);
      _chinhDaDung = false;
      $('#ds').innerHTML =
        (nhom.gap.length ? '' : `<div class="duoi-5">${canhBao({ level: 'success', title: 'Không có việc nào gấp',
          body: 'Mọi việc theo vai của bạn đều đã ổn hoặc chưa có dữ liệu để đếm.' })}</div>`)
        + veNhom('Cần xử lý', 'Việc có người phải làm, xếp theo độ gấp.',
            statusBadge('blocked', { label: `${so(nhom.gap.length)} việc` }), nhom.gap, 'gap')
        + veNhom('Chưa đọc được số', 'Hiện «—» thay vì 0: số 0 ở đây sẽ là tin mừng giả.',
            statusBadge('unknown', { label: `${so(nhom.chua.length)} mục` }), nhom.chua, 'chua')
        + veNhom('Đã ổn', null,
            statusBadge('ready', { label: `${so(nhom.on.length)} mục` }), nhom.on, 'on');
    }

    const ghi = [];
    if (d.soAnVaiKhac) {
      ghi.push(`<p>Còn ${so(d.soAnVaiKhac)} việc thuộc vai khác không hiện ở đây. Màn này chỉ hiện việc theo vai của bạn, không phải toàn bộ hệ thống.</p>`);
    }
    ghi.push('<p>Màn này là danh sách việc. Số đơn và tỉ lệ chốt nằm ở màn <a href="/bao-cao">Đơn và tỉ lệ chốt</a>.</p>');
    $('#chan').innerHTML = ghi.join('');
  } catch (e) {
    $('#bang-tin').innerHTML = canhBao({ level: 'error', title: 'Không tải được danh sách việc', body: e.message });
    $('#ds').innerHTML = emptyState({ icon: 'circle-alert', title: 'Không tải được', body: 'Kiểm kết nối rồi tải lại trang.' });
  }
}

tai();
</script>
<script src="/chung/dieu-huong.js"></script>
</body>
</html>
