<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ai đã sửa gì — AI Closer</title>
<!-- Dựng trên hệ kiểu (mục M11: nhật ký đọc như lịch sử hoạt động — ai · làm gì · lên cái gì ·
     lúc nào). KHÔNG CSS riêng — trước lượt này là 96 dòng, nhiều nhất trong 25 màn. Dòng nhật
     ký là một BẢNG có cột, không phải một chuỗi chữ tràn dòng; trạng thái trước/sau (có sẵn
     trong dữ liệu nhưng chưa từng hiện) mở trong ngăn kéo phải. -->
<link rel="stylesheet" href="/chung/kieu.css" data-ds="v3">
<!-- Hàm dựng thành phần (window.UI). ĐỒNG BỘ, KHÔNG `defer`: khung ứng dụng ở cuối trang
     lấy biểu tượng từ đây — `defer` chạy SAU script cuối trang, khung sẽ mất biểu tượng. -->
<script src="/chung/ui.js"></script>
</head>
<body>
<header>
  <h1>Ai đã sửa gì</h1>
  <span class="sub">Mọi thao tác của người và máy trên team này. Nhật ký chỉ thêm — không sửa được, không xoá được.</span>
</header>

<main>
  <div id="bang-tin" aria-live="polite"></div>

  <section class="table-wrap" aria-labelledby="tieu-nk">
    <h2 id="tieu-nk" class="sr-only">Dòng nhật ký</h2>
    <div class="tabs" role="tablist" aria-label="Làn nhật ký" id="thanhLan"></div>
    <div class="table-toolbar">
      <label for="chonMa" class="sr-only">Lọc theo hành động</label>
      <select id="chonMa"><option value="">Mọi hành động</option></select>
      <span class="table-count" id="tomTat" aria-live="polite"></span>
    </div>
    <div id="ds"><div class="empty-state"><span class="skeleton"></span></div></div>
    <div id="phanTrang"></div>
  </section>

  <p class="page-note">Tầng cơ sở dữ liệu chặn sửa và xoá bảng nhật ký, kể cả với chủ cơ sở dữ liệu.</p>
</main>

<dialog class="drawer" id="ngan" aria-labelledby="ngan-tieu">
  <div class="drawer-header">
    <div class="gian"><h2 id="ngan-tieu">Chi tiết</h2><div class="text-muted text-sm" id="ngan-phu"></div></div>
    <button type="button" class="icon-btn" id="ngan-dong" aria-label="Đóng"></button>
  </div>
  <div class="drawer-body" id="ngan-than"></div>
</dialog>

<script>
const { esc, text, icon, statusBadge, button, alert: canhBao, emptyState, formatNumber: so } = window.UI;
const $ = (s) => document.querySelector(s);

// Trạng thái lọc nằm trong URL (mục J) — gửi đường dẫn cho người khác là họ thấy đúng lát cắt.
const qs = new URLSearchParams(location.search);
let D = null, LAN = qs.get('lan') || 'nguoi', MA = qs.get('hanhDong') || '', TRANG = Math.max(0, Number(qs.get('trang')) || 0);

function ghiUrl() {
  const u = new URL(location.href);
  LAN !== 'nguoi' ? u.searchParams.set('lan', LAN) : u.searchParams.delete('lan');
  MA ? u.searchParams.set('hanhDong', MA) : u.searchParams.delete('hanhDong');
  TRANG ? u.searchParams.set('trang', String(TRANG)) : u.searchParams.delete('trang');
  history.replaceState(null, '', u);
}

async function goi(duong, tuyChon) {
  const r = await fetch(duong, { headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' }, ...tuyChon });
  if (r.status === 401) { location.href = '/dang-nhap?tiep=' + encodeURIComponent(location.pathname); return null; }
  let d = null; try { d = await r.json(); } catch { /* null */ }
  if (!r.ok || !d || d.ok === false) throw new Error((d && d.thongDiep) || ('Máy chủ trả ' + r.status + '.'));
  return d;
}

const gio = (t) => (t ? new Date(Number(t) || t).toLocaleString('vi-VN') : '—');

function veBangTin(loi) {
  const kh = [];
  if (loi) kh.push(canhBao({ level: 'error', title: 'Không tải được nhật ký', body: loi }));
  for (const c of (D && D.canhBao) || []) kh.push(canhBao({ level: c.muc === 'vang' ? 'warning' : 'info', body: c.chu }));
  $('#bang-tin').innerHTML = kh.length ? `<div class="duoi-4">${kh.join('')}</div>` : '';
}

function veLan() {
  $('#thanhLan').innerHTML = Object.entries(D.chuLan).map(([ma, chu]) => {
    const n = ma === 'tat_ca' ? (D.dem.nguoi + D.dem.may) : D.dem[ma];
    return `<button type="button" class="tab" role="tab" data-lan="${esc(ma)}" aria-selected="${ma === LAN}">${esc(chu)}<span class="count">${so(n)}</span></button>`;
  }).join('');
  document.querySelectorAll('[data-lan]').forEach((b) => b.addEventListener('click', () => {
    LAN = b.dataset.lan; TRANG = 0; nap();
  }));

  const o = $('#chonMa');
  if (D.nhomMa && !o.dataset.dung) {
    const chu = (m) => (D.chuMa && D.chuMa[m]) || m;
    o.innerHTML = '<option value="">Mọi hành động</option>' + Object.entries(D.nhomMa).map(([nhom, ds]) =>
      `<optgroup label="${esc(nhom.replace(/_/g, ' '))}">${ds.map((m) =>
        `<option value="${esc(m)}" ${m === MA ? 'selected' : ''}>${esc(chu(m))}</option>`).join('')}</optgroup>`).join('');
    o.dataset.dung = '1';
    o.addEventListener('change', () => { MA = o.value; TRANG = 0; nap(); });
  }
}

function veDs() {
  $('#tomTat').textContent = `${so(D.soKhop)} dòng ở làn này · ${so(D.tongCaBang)} cả bảng${D.catBot ? ' · có thể còn nữa' : ''}`;

  if (!D.dong.length) {
    $('#ds').innerHTML = emptyState({ icon: 'inbox',
      title: LAN === 'nguoi' ? 'Chưa có thao tác nào do người làm' : 'Không dòng nào khớp bộ lọc',
      body: LAN === 'nguoi' ? 'Đây là «chưa ai làm gì» trong khoảng đang xem, không phải nhật ký hỏng.' : 'Đổi làn hoặc bỏ lọc hành động để xem thêm.' });
    $('#phanTrang').innerHTML = '';
    return;
  }

  $('#ds').innerHTML = `<table class="data-table"><thead><tr>
      <th scope="col">Lúc</th><th scope="col">Ai</th><th scope="col">Hành động</th>
      <th scope="col">Đối tượng</th><th scope="col">Ghi chú</th>
      <th scope="col" class="actions"><span class="sr-only">Chi tiết</span></th>
    </tr></thead><tbody>${D.dong.map((d, i) => `
    <tr>
      <td class="meta tabular">${esc(gio(d.thoiGian))}</td>
      <td>${d.lan === 'may' ? `<span class="badge">Máy</span> <span class="meta">${esc(String(d.ai || '').replace(/^may:/, ''))}</span>` : esc(d.ai)}</td>
      <td class="manh">${esc(d.chuHanhDong)}</td>
      <td>${d.doiTuong ? `${esc(d.doiTuong)}${d.doiTuongId ? ` <span class="meta">#${esc(d.doiTuongId)}</span>` : ''}` : '<span class="text-muted">—</span>'}</td>
      <td class="meta"><span class="cat-2">${esc(d.ghiChu || '')}</span></td>
      <td class="actions">${(d.truoc || d.sau) ? button('Xem', { size: 'sm', variant: 'ghost', data: { dong: i } }) : ''}</td>
    </tr>`).join('')}</tbody></table>`;
  document.querySelectorAll('[data-dong]').forEach((b) => b.addEventListener('click', () => xem(D.dong[+b.dataset.dong])));

  $('#phanTrang').innerHTML = D.soTrang > 1 ? `<div class="pagination">
      <span>Trang ${D.trang + 1} / ${D.soTrang}</span>
      <span class="hang">${button('Trước', { size: 'sm', id: 'lui', disabled: D.trang === 0 })}
        ${button('Sau', { size: 'sm', id: 'toi', disabled: D.trang >= D.soTrang - 1 })}</span>
    </div>` : '';
  if (D.soTrang > 1) {
    $('#lui').addEventListener('click', () => { TRANG = Math.max(0, TRANG - 1); nap(); });
    $('#toi').addEventListener('click', () => { TRANG += 1; nap(); });
  }
}

// ── NGĂN KÉO — trạng thái TRƯỚC và SAU của thao tác ─────────────────────────────────
function xem(d) {
  const khoi = (nhan, v) => `<div class="field"><span class="field-label">${nhan}</span>
    ${v == null ? '<span class="text-muted text-sm">(không có)</span>' : `<pre class="code-block">${esc(JSON.stringify(v, null, 2))}</pre>`}</div>`;
  $('#ngan-tieu').textContent = d.chuHanhDong;
  $('#ngan-phu').textContent = `${d.lan === 'may' ? 'Máy' : d.ai} · ${gio(d.thoiGian)}`;
  $('#ngan-than').innerHTML = `<div class="form-stack">
    ${d.doiTuong ? `<div class="field"><span class="field-label">Đối tượng</span><span>${esc(d.doiTuong)}${d.doiTuongId ? ' #' + esc(d.doiTuongId) : ''}</span></div>` : ''}
    ${d.ghiChu ? `<div class="field"><span class="field-label">Ghi chú</span><span class="be-chu">${esc(d.ghiChu)}</span></div>` : ''}
    ${khoi('Trước', d.truoc)}${khoi('Sau', d.sau)}
    <div class="field"><span class="field-label">Mã hành động</span><code>${esc(d.hanhDong)}</code></div>
  </div>`;
  $('#ngan').showModal();
}
$('#ngan-dong').innerHTML = icon('x');
$('#ngan-dong').addEventListener('click', () => $('#ngan').close());

async function nap() {
  try {
    const d = await goi(`/api/nhat-ky?lan=${encodeURIComponent(LAN)}&hanhDong=${encodeURIComponent(MA)}&trang=${TRANG}`);
    if (!d) return;
    D = d; TRANG = d.trang; LAN = d.lan || LAN;
    ghiUrl();
    veBangTin(); veLan(); veDs();
  } catch (e) {
    veBangTin(e.message);
    $('#ds').innerHTML = emptyState({ icon: 'circle-alert', title: 'Không tải được', body: 'Kiểm kết nối rồi tải lại trang.' });
  }
}
nap();
</script>
<script src="/chung/dieu-huong.js"></script>
</body>
</html>
