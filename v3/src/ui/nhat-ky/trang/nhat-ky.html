<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nhật ký thao tác — AI Closer v3</title>
<style>
  :root{
    --bg:#f5f7f9; --panel:#fff; --ink:#101828; --muted:#667085; --line:#e4e9ee;
    --pri:#0e7c86; --priDark:#0b646d; --priSoft:#e6f4f5;
    --ok:#16a34a; --okSoft:#e8f7ee; --bad:#dc2626; --badSoft:#fdecec;
    --warn:#b45309; --warnSoft:#fdf3e3;
    --side:#0b2125; --sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06); --r:12px;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:-apple-system,"SF Pro Text",Segoe UI,Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);font-size:13.5px;-webkit-font-smoothing:antialiased}
  header{background:var(--side);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:700}
  header .sub{font-size:11.5px;color:#7fa3a8}
  header .sp{flex:1}
  header a{color:#9fd3d8;text-decoration:none;font-size:12px;font-weight:600}
  main{padding:16px 22px 60px;max-width:1160px;margin:0 auto}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:16px;overflow:hidden}
  .panel h2{font-size:13px;margin:0;padding:11px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .panel h2 .hint{font-weight:400;color:var(--muted);font-size:11.5px}
  .panel h2 .sp{flex:1}
  .than{padding:14px 15px}

  /* dải cảnh báo NGUY — màn này phải trông khác mọi màn khác */
  .nguy{background:#fff4f4;border:1px solid #f0c2c2;border-left:4px solid var(--bad);
        border-radius:var(--r);padding:12px 15px;margin-bottom:14px;line-height:1.6}
  .nguy b{color:#991b1b}
  .nguy .so{font-size:19px;font-weight:700;color:#991b1b;font-variant-numeric:tabular-nums}

  .banner{border-radius:var(--r);padding:11px 14px;margin-bottom:14px;line-height:1.55}
  .banner.o{background:var(--warnSoft);color:#8a4a06;border:1px solid #f0d3a4}
  .banner.i{background:var(--priSoft);color:#0b4a52;border:1px solid #b8dde0}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{padding:8px 9px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);font-weight:700;white-space:nowrap}
  tbody tr:last-child td{border-bottom:none}
  tbody tr.ap{background:var(--priSoft)}
  .num{font-variant-numeric:tabular-nums}
  .ten{font-weight:600;overflow-wrap:anywhere}
  .phu{font-size:11.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}

  .pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;margin:1px 3px 1px 0}
  .pill.g{background:var(--okSoft);color:var(--ok)}
  .pill.o{background:var(--warnSoft);color:var(--warn)}
  .pill.r{background:var(--badSoft);color:var(--bad)}
  .pill.m{background:#f1f1f1;color:#777}
  .pill.p{background:var(--priSoft);color:var(--priDark)}

  /* khối so sánh */
  .diff{border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:400px;background:#fcfdfd}
  .diff pre{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:1.6}
  .diff .d{padding:1px 10px;white-space:pre-wrap;overflow-wrap:anywhere;border-left:3px solid transparent}
  .diff .d.them{background:#e9f8ee;border-left-color:var(--ok)}
  .diff .d.bo{background:#fdecec;border-left-color:var(--bad);text-decoration:line-through;opacity:.8}
  .diff .d.giu{color:var(--muted)}

  textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 11px;font:inherit;
           font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:1.6;
           min-height:260px;resize:vertical}

  button{font:inherit}
  .nut{background:var(--pri);color:#fff;border:none;border-radius:8px;padding:7px 13px;font-weight:700;cursor:pointer}
  .nut:hover{background:var(--priDark)}
  .nut[disabled]{background:#c3cdd0;cursor:not-allowed}
  .nut.nho{padding:4px 10px;font-size:11.5px;font-weight:600}
  .nut.nguy{background:var(--bad)}
  .nut.nguy:hover{background:#b91c1c}
  .nut.phu{background:transparent;color:var(--priDark);border:1px solid var(--line)}
  .nut.phu:hover{background:var(--priSoft)}
  .hang{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

  .trong{padding:20px 15px;text-align:center;line-height:1.6}
  .trong .ic{font-size:20px;display:block;margin-bottom:6px}
  .trong.chua{color:#8a4a06;background:var(--warnSoft)}
  .loi{background:var(--badSoft);color:#991b1b;border:1px solid #f4bcbc;border-radius:8px;
       padding:9px 12px;margin:0 0 12px;display:none;line-height:1.5}
  .loi.hien{display:block}
  .ok{background:var(--okSoft);color:#14532d;border:1px solid #b7e4c7;border-radius:8px;
      padding:9px 12px;margin:0 0 12px;display:none;line-height:1.5}
  .ok.hien{display:block}

  @media (max-width:700px){
    header{padding:12px 14px} main{padding:12px 14px 48px}
    .panel h2{padding:10px 12px} .than{padding:12px}
    table,thead,tbody,th,td,tr{display:block}
    thead{display:none}
    tbody tr{border:1px solid var(--line);border-radius:10px;margin-bottom:9px;padding:10px 11px}
    tbody tr:last-child{margin-bottom:0}
    td{border:none;padding:4px 0}
    td[data-nhan]::before{content:attr(data-nhan);display:block;font-size:10px;text-transform:uppercase;
      letter-spacing:.4px;color:var(--muted);font-weight:700;margin-bottom:2px}
  }

  .luoi{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:11px}
  .d{border:1px solid var(--line);border-radius:10px;padding:12px 13px;background:#fcfdfd;
     border-left:4px solid var(--line);min-width:0}
  .d.xanh{border-left-color:var(--ok);background:#f7fdf9}
  .d.vang{border-left-color:var(--warn);background:#fffbf5}
  .d.do{border-left-color:var(--bad);background:#fff5f5}
  .d.xam{border-left-color:#c3cdd0;background:#fafbfb}
  .d .dau{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:5px}
  .d h3{font-size:13px;margin:0;flex:1;min-width:0}
  .d .vi{font-size:12px;color:var(--muted);line-height:1.55}
  .d .so{font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .d .di{display:inline-block;margin-top:8px;font-size:11.5px;font-weight:700;color:var(--priDark);
         background:#fff;border:1px solid var(--line);border-radius:7px;padding:4px 10px;text-decoration:none}
  .tong{border-radius:var(--r);padding:13px 15px;margin-bottom:14px;line-height:1.55;font-weight:600}
  .tong.xanh{background:var(--okSoft);color:#14532d;border:1px solid #b7e4c7}
  .tong.vang{background:var(--warnSoft);color:#8a4a06;border:1px solid #f0d3a4}
  .tong.do{background:var(--badSoft);color:#991b1b;border:1px solid #f4bcbc}
  .tong.xam{background:#f1f4f5;color:#475467;border:1px solid var(--line)}
  .tong .dem{display:block;font-weight:400;font-size:12px;margin-top:4px}

  .lan{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
  .lan button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;
              font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
  .lan button.chon{background:var(--priSoft);border-color:var(--pri);color:var(--priDark)}
  .dong{border-bottom:1px solid var(--line);padding:9px 0;display:flex;gap:11px;flex-wrap:wrap;align-items:baseline}
  .dong:last-child{border-bottom:none}
  .dong .gio{font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--muted);white-space:nowrap;min-width:118px}
  .dong .hd{font-weight:600;min-width:0}
  .dong .ai{font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
  .dong .gc{flex:1 1 100%;font-size:11.5px;color:var(--muted);line-height:1.5;overflow-wrap:anywhere}
  .dong.may{opacity:.72}
</style>
</head>
<body>
<header>
  <h1>Nhật ký thao tác</h1>
  <span class="sub" id="teamHien">…</span>
  <span class="sp"></span>
  <a href="/suc-khoe">Sức khoẻ hệ thống</a>
  <a href="/dieu-phoi">Bảng điều phối →</a>
</header>

<main>
  <div class="loi" id="loi"></div>
  <div class="ok" id="baoOk"></div>
  <div class="banner i" style="background:var(--priSoft);color:#0b4a52;border:1px solid #b8dde0">
    Bảng <code>nhat_ky</code> <b>chỉ thêm, không sửa không xoá</b> — trigger chặn ở tầng CSDL,
    kể cả với chủ cơ sở dữ liệu.</div>
  <div id="canhBao"></div>

  <section class="panel">
    <h2>Dòng nhật ký <span class="hint" id="tomTat"></span></h2>
    <div class="than">
      <div class="lan" id="thanhLan"></div>
      <select id="chonMa" style="border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:#fff;font:inherit;max-width:100%"></select>
    </div>
    <div class="than" style="padding-top:0" id="ds"><div class="trong"><span class="ic">⋯</span>đang đọc…</div></div>
    <div class="trang" id="phanTrang" style="display:flex;gap:8px;align-items:center;justify-content:center;padding:11px;flex-wrap:wrap;color:var(--muted);font-size:12px"></div>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const so = (n) => Number(n || 0).toLocaleString('vi-VN');
function baoLoi(t){ const o=$('#loi'); o.textContent=t; o.classList.add('hien'); $('#baoOk').classList.remove('hien'); }
function baoOk(t){ const o=$('#baoOk'); o.textContent=t; o.classList.add('hien'); $('#loi').classList.remove('hien'); }
function xoaBao(){ $('#loi').classList.remove('hien'); $('#baoOk').classList.remove('hien'); }
async function goi(duong, tuyChon){
  const r = await fetch(duong, { headers:{'Accept':'application/json','Content-Type':'application/json'}, ...tuyChon });
  if (r.status === 401) { location.href = '/dang-nhap?tiep=' + encodeURIComponent(location.pathname); return null; }
  let d = null; try { d = await r.json(); } catch { /* null */ }
  if (!r.ok || !d || d.ok === false) throw new Error((d && d.thongDiep) || ('Máy chủ trả ' + r.status + '.'));
  return d;
}
function veTrong(t){
  if (!t) return '';
  const di = t.diTiep && t.diTiep.duong ? `<a class="di" href="${esc(t.diTiep.duong)}">${esc(t.diTiep.chu)}</a>` : '';
  return `<div class="trong chua"><span class="ic">⚠️</span><div>${esc(t.noi)}</div>${di}</div>`;
}


let D = null, LAN = 'nguoi', MA = '', TRANG = 0;

function veCanhBao(){
  $('#canhBao').innerHTML = (D.canhBao || []).map((c) =>
    `<div class="banner ${c.muc === 'vang' ? 'o' : 'i'}"
       style="${c.muc==='tin'?'background:var(--priSoft);color:#0b4a52;border:1px solid #b8dde0':''}">${esc(c.chu)}</div>`).join('');
}

function veLan(){
  $('#thanhLan').innerHTML = Object.entries(D.chuLan).map(([ma, chu]) => {
    const n = ma === 'tat_ca' ? (D.dem.nguoi + D.dem.may) : D.dem[ma];
    return `<button data-lan="${esc(ma)}" class="${ma === LAN ? 'chon' : ''}">${esc(chu)}
      <span style="opacity:.7;font-weight:400">${so(n)}</span></button>`;
  }).join('');
  document.querySelectorAll('[data-lan]').forEach((b) => b.addEventListener('click', () => {
    LAN = b.dataset.lan; TRANG = 0; nap();
  }));

  if (D.nhomMa && !$('#chonMa').dataset.dung) {
    const nhom = Object.entries(D.nhomMa).map(([ten, ds]) =>
      `<optgroup label="${esc(ten)}">${ds.map((m) => `<option value="${esc(m)}">${esc(m)}</option>`).join('')}</optgroup>`);
    $('#chonMa').innerHTML = '<option value="">— mọi hành động —</option>' + nhom.join('');
    $('#chonMa').dataset.dung = '1';
    $('#chonMa').addEventListener('change', () => { MA = $('#chonMa').value; TRANG = 0; nap(); });
  }
}

function veDs(){
  $('#teamHien').textContent = `team #${D.teamId}`;
  $('#tomTat').textContent = `${so(D.soKhop)} dòng ở làn này · ${so(D.tongCaBang)} dòng cả bảng`
    + (D.catBot ? ' · có thể còn nữa' : '');

  if (!D.dong.length) {
    $('#ds').innerHTML = veTrong({
      vi: 'khong_khop',
      noi: LAN === 'nguoi'
        ? 'Chưa có thao tác nào do người bấm ở khoảng này. Đây là «chưa ai làm gì», KHÔNG phải «nhật ký hỏng».'
        : 'Không dòng nào khớp bộ lọc đang chọn.',
    });
    $('#phanTrang').innerHTML = '';
    return;
  }

  $('#ds').innerHTML = D.dong.map((d) => `<div class="dong ${esc(d.lan)}">
    <span class="gio">${d.thoiGian ? new Date(Number(d.thoiGian) || d.thoiGian).toLocaleString('vi-VN') : '—'}</span>
    <span class="hd">${esc(d.chuHanhDong)}</span>
    <span class="ai">${esc(d.ai)}</span>
    ${d.doiTuong ? `<span class="pill m">${esc(d.doiTuong)}${d.doiTuongId ? ' #' + esc(d.doiTuongId) : ''}</span>` : ''}
    ${d.ghiChu ? `<span class="gc">${esc(d.ghiChu)}</span>` : ''}
  </div>`).join('');

  $('#phanTrang').innerHTML = D.soTrang > 1 ? `
    <button class="nut nho phu" id="lui" ${D.trang === 0 ? 'disabled' : ''}>← Trước</button>
    <span>Trang ${D.trang + 1} / ${D.soTrang}</span>
    <button class="nut nho phu" id="toi" ${D.trang >= D.soTrang - 1 ? 'disabled' : ''}>Sau →</button>` : '';
  if (D.soTrang > 1) {
    $('#lui').addEventListener('click', () => { TRANG = Math.max(0, TRANG - 1); nap(); });
    $('#toi').addEventListener('click', () => { TRANG += 1; nap(); });
  }
}

async function nap(){
  try {
    const d = await goi(`/api/nhat-ky?lan=${encodeURIComponent(LAN)}&hanhDong=${encodeURIComponent(MA)}&trang=${TRANG}`);
    if (!d) return;
    D = d; TRANG = d.trang;
    veCanhBao(); veLan(); veDs();
  } catch (e) { baoLoi(e.message); }
}
nap();
</script>
<script src="/chung/dieu-huong.js"></script>
</body>
</html>
