<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chọn team — AI Closer</title>
<style>
  /* Cùng hệ thiết kế với `public/ops.html` dòng 10–17 và với `dang-nhap.html`. */
  :root{
    --bg:#f5f7f9; --panel:#fff; --ink:#101828; --muted:#667085; --line:#e4e9ee;
    --pri:#0e7c86; --priDark:#0b646d; --priSoft:#e6f4f5;
    --ok:#16a34a; --okSoft:#e8f7ee; --bad:#dc2626; --badSoft:#fdecec;
    --side:#0b2125; --sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06); --r:12px;
  }
  *{box-sizing:border-box} html,body{margin:0}
  /* min-height:100vh chứ không phải 100%: 100% chỉ ăn theo chiều cao của <html>, mà <html>
     cao theo nội dung → căn giữa dọc không có tác dụng. Ba cái thẻ team ngắn nên phải là vh. */
  body{font-family:-apple-system,"SF Pro Text",Segoe UI,Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);font-size:13.5px;-webkit-font-smoothing:antialiased;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .hop{width:100%;max-width:760px}
  .dau{display:flex;align-items:center;gap:10px;margin-bottom:18px;padding-left:2px}
  .dau .cham{width:30px;height:30px;border-radius:9px;background:var(--side);color:#9fd6db;
             display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .dau h1{font-size:16px;margin:0;font-weight:700}
  .dau .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .dau .sp{flex:1}
  .the-nho{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;
           text-decoration:underline;text-underline-offset:2px;padding:0}

  .luoi{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .the{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
       padding:16px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:block;width:100%}
  .the:hover:not(:disabled){border-color:var(--pri);box-shadow:0 0 0 3px var(--priSoft)}
  .the:disabled{opacity:.6;cursor:default}
  .the .k{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
  .the .v{font-size:17px;font-weight:700;margin-top:6px;line-height:1.25}
  .the .vai{margin-top:10px;display:flex;gap:5px;flex-wrap:wrap}
  .pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:700;
        background:var(--priSoft);color:var(--priDark)}
  .the .dang{margin-top:9px;font-size:11.5px;color:var(--ok);font-weight:600}

  .loi{display:none;background:var(--badSoft);color:#991b1b;border:1px solid #f4bcbc;border-radius:var(--r);
       padding:11px 14px;margin-bottom:14px;font-weight:600;line-height:1.5}
  .loi.hien{display:block}
  .trong{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
         padding:26px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="hop">
  <div class="dau">
    <div class="cham">AI</div>
    <div>
      <h1>Chọn team</h1>
      <div class="sub" id="chao">Mỗi team một kho dữ liệu riêng — chọn team để vào bảng điều phối.</div>
    </div>
    <span class="sp"></span>
    <button class="the-nho" id="ra" type="button">Đăng xuất</button>
  </div>

  <div class="loi" id="loi" role="alert" aria-live="polite"></div>
  <div class="luoi" id="luoi"></div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
// Khoá phải trùng `vai.ma` của lược đồ thật (`db/migrate/001_nen.up.sql`, seed 5 vai):
// GẠCH NGANG. Sai một dấu thì thẻ team hiện mã trần thay vì tên vai.
// Giai đoạn 1 chỉ dùng hai vai; ba vai còn lại (marketer · quan-ly · duyet-kich-ban)
// hiện nguyên mã cho tới khi giai đoạn 2 mở chúng ra.
const TEN_VAI = { 'quan-tri': 'Quản trị', sale: 'Sale' };

function baoLoi(t) { const o = $('#loi'); o.textContent = t; o.classList.add('hien'); }
function xoaLoi() { const o = $('#loi'); o.textContent = ''; o.classList.remove('hien'); }

async function nap() {
  let d;
  try {
    const r = await fetch('/api/toi', { credentials: 'same-origin' });
    if (r.status === 401) { location.replace('/dang-nhap'); return; }
    d = await r.json();
  } catch { baoLoi('Không nối được máy chủ. Tải lại trang.'); return; }

  // `tenDangNhap` giữ nguyên TÊN TRƯỜNG (hợp đồng với người A) nhưng GIÁ TRỊ nay là email.
  if (d.tenDangNhap) {
    $('#chao').textContent = 'Đang đăng nhập là ' + d.tenDangNhap + ' — chọn team để vào bảng điều phối.';
  }
  // `dsTeam` đã bị máy chủ lọc bỏ TEAM KỸ THUẬT (cờ `team.la_ky_thuat`) ở
  // `kho-nguoi-dung.js#teamCuaNguoi`. Trang này CẤM tự đắp lại team đó vào lưới: một người
  // chọn được nó là nhìn thấy khách của cả ba team nghiệp vụ cùng lúc.
  const ds = Array.isArray(d.dsTeam) ? d.dsTeam : [];
  const luoi = $('#luoi');
  if (!ds.length) {
    luoi.innerHTML = '<div class="trong">Tài khoản chưa được xếp vào team nào. Báo quản trị.</div>';
    return;
  }
  luoi.innerHTML = ds.map((t) => `
    <button class="the" type="button" data-team="${esc(t.teamId)}">
      <div class="k">Team</div>
      <div class="v">${esc(t.tenTeam || t.teamId)}</div>
      <div class="vai">${(t.vai || []).map((v) => `<span class="pill">${esc(TEN_VAI[v] || v)}</span>`).join('')}</div>
      ${t.teamId === d.teamId ? '<div class="dang">Đang ở team này</div>' : ''}
    </button>`).join('');

  luoi.querySelectorAll('.the').forEach((el) => el.addEventListener('click', () => chon(el)));
}

async function chon(el) {
  xoaLoi();
  const teamId = el.dataset.team;
  document.querySelectorAll('.the').forEach((x) => { x.disabled = true; });
  try {
    const r = await fetch('/api/chon-team', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ teamId }),
    });
    const d = await r.json().catch(() => ({}));
    if (r.status === 401) { location.replace('/dang-nhap'); return; }
    if (!r.ok || !d.ok) { baoLoi(d.thongDiep || 'Không chọn được team này.'); return; }
    location.assign(d.diTiep || '/dieu-phoi');
  } catch {
    baoLoi('Không nối được máy chủ. Thử lại.');
  } finally {
    document.querySelectorAll('.the').forEach((x) => { x.disabled = false; });
  }
}

$('#ra').addEventListener('click', async () => {
  try { await fetch('/api/dang-xuat', { method: 'POST', credentials: 'same-origin' }); } catch {}
  location.replace('/dang-nhap');
});

nap();
</script>
</body>
</html>
